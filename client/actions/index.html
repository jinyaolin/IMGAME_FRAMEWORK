<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行動編輯器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #f5576c;
      color: white;
    }

    .btn-primary:hover {
      background: #e44a5f;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    .btn-danger {
      background: #f56565;
      color: white;
    }

    .btn-danger:hover {
      background: #e53e3e;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }

    .action-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .action-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .action-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
    }

    .action-description {
      color: #718096;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .action-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-layout {
      background: #e3f2fd;
      color: #1976d2;
    }

    .badge-stage {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .action-buttons-info {
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .action-buttons-info h4 {
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .button-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .button-label {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: #4a5568;
      font-family: monospace;
    }

    .action-actions {
      display: flex;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .empty-state {
      background: white;
      border-radius: 12px;
      padding: 60px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .empty-state-description {
      font-size: 14px;
      color: #718096;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
      padding: 4px;
      line-height: 1;
    }

    .modal-close:hover {
      color: #2d3748;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #4a5568;
    }

    .form-group input[type="text"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #f5576c;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Preview */
    .preview-section {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .preview-section.active {
      display: block;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .preview-container {
      display: flex;
      justify-content: center;
      padding: 20px;
      background: #f7fafc;
      border-radius: 8px;
    }

    .phone-frame {
      width: 280px;
      height: 560px;
      background: #000;
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      position: relative;
    }

    .phone-notch {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 20px;
      background: #000;
      border-radius: 10px;
      z-index: 10;
    }

    .preview-content {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 24px;
      padding: 36px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .action-grid {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .action-grid-4 {
      grid-template-columns: repeat(2, 1fr);
    }

    .action-btn {
      background: white;
      border: none;
      border-radius: 8px;
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .action-pad-2 {
      display: flex;
      gap: 12px;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .action-pad-2 .action-btn {
      flex: 1;
      height: 160px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 行動編輯器</h1>
      <div class="header-actions">
        <a href="/" class="btn btn-secondary">← 返回遊戲</a>
        <button class="btn btn-primary" onclick="openCreateModal()">+ 新增行動配置</button>
      </div>
    </div>

    <div id="actionsList" class="actions-grid">
      <div class="empty-state">
        <div class="empty-state-icon">🎯</div>
        <div class="empty-state-title">還沒有行動配置</div>
        <div class="empty-state-description">
          點擊「新增行動配置」開始創建
        </div>
      </div>
    </div>

    <div id="previewSection" class="preview-section">
      <div class="preview-header">
        <h3>預覽</h3>
        <button class="btn btn-secondary btn-sm" onclick="closePreview()">關閉</button>
      </div>
      <div class="preview-container">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div id="previewContent" class="preview-content">
            <!-- Preview will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="configModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">新增行動配置</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="actionConfigForm">
          <div class="form-group">
            <label for="configId">ID *</label>
            <input type="text" id="configId" name="id" required
                   placeholder="例如: default-vote-actions"
                   pattern="[a-z0-9-]+"
                   title="只能使用小寫字母、數字和連字符">
          </div>

          <div class="form-group">
            <label for="configName">名稱 *</label>
            <input type="text" id="configName" name="name" required
                   placeholder="例如: 預設投票行動">
          </div>

          <div class="form-group">
            <label for="configDescription">描述</label>
            <textarea id="configDescription" name="description"
                      placeholder="描述此行動配置的用途..."></textarea>
          </div>

          <div class="form-group">
            <label for="configLayout">控制器佈局 *</label>
            <select id="configLayout" name="layout" required onchange="updateButtonLabelInputs()">
              <option value="">選擇佈局...</option>
              <option value="pad-8">8按鍵網格 (2×4)</option>
              <option value="pad-4">4按鍵網格 (2×2)</option>
              <option value="pad-2">雙按鍵 (左右)</option>
              <option value="dpad-2btn">方向鍵 + AB鍵</option>
              <option value="dpad-dpad">雙方向鍵</option>
            </select>
          </div>

          <div class="form-group">
            <label>按鍵標籤</label>
            <div id="buttonLabelsContainer">
              <p style="color: #a0aec0; font-size: 14px;">請先選擇控制器佈局</p>
            </div>
          </div>

          <div class="form-group">
            <label for="configStageType">適用階段類型</label>
            <select id="configStageType" name="stageType">
              <option value="">全部階段</option>
              <option value="vote">投票階段</option>
              <option value="card_play">出牌階段</option>
              <option value="identity_draw">身份抽卡階段</option>
              <option value="game">遊戲控制器階段</option>
              <option value="intermission">中場休息</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveConfig()">儲存</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentConfig = null;
    let buttonLabels = {};

    // Load actions on connect
    socket.on('connect', () => {
      loadActions();
    });

    socket.on('actions:list', (configs) => {
      renderActionsList(configs);
    });

    socket.on('actions:created', (config) => {
      loadActions(); // Reload to show in proper order
      closeModal();
    });

    socket.on('actions:updated', (config) => {
      loadActions();
      closeModal();
    });

    socket.on('actions:deleted', (configId) => {
      loadActions();
    });

    socket.on('actions:get', (config) => {
      populateForm(config);
    });

    function loadActions() {
      socket.emit('actions:list');
    }

    function renderActionsList(configs) {
      const container = document.getElementById('actionsList');
      if (!configs || configs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎯</div>
            <div class="empty-state-title">還沒有行動配置</div>
            <div class="empty-state-description">
              點擊「新增行動配置」開始創建
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = configs.map(config => createActionCard(config)).join('');
    }

    function createActionCard(config) {
      const stageLabels = {
        vote: '投票',
        card_play: '出牌',
        identity_draw: '身份抽卡',
        game: '遊戲控制器',
        intermission: '中場休息'
      };

      const stageLabel = config.stageType ? stageLabels[config.stageType] || config.stageType : '全部階段';
      const buttons = Object.entries(config.buttonLabels || {});

      return `
        <div class="action-card">
          <div class="action-header">
            <div class="action-title">${escapeHtml(config.name)}</div>
          </div>
          <div class="action-description">${escapeHtml(config.description || '無描述')}</div>
          <div class="action-meta">
            <span class="badge badge-layout">${config.layout}</span>
            <span class="badge badge-stage">${stageLabel}</span>
          </div>
          ${buttons.length > 0 ? `
            <div class="action-buttons-info">
              <h4>按鍵標籤</h4>
              <div class="button-labels">
                ${buttons.map(([key, label]) => `
                  <span class="button-label">${key}: ${escapeHtml(label)}</span>
                `).join('')}
              </div>
            </div>
          ` : ''}
          <div class="action-actions">
            <button class="btn btn-secondary btn-sm" onclick='previewConfig("${config.id}")'>
              預覽
            </button>
            <button class="btn btn-secondary btn-sm" onclick='editConfig("${config.id}")'>
              編輯
            </button>
            <button class="btn btn-danger btn-sm" onclick='deleteConfig("${config.id}")'>
              刪除
            </button>
          </div>
        </div>
      `;
    }

    function openCreateModal() {
      currentConfig = null;
      resetForm();
      document.getElementById('modalTitle').textContent = '新增行動配置';
      document.getElementById('configModal').classList.add('active');
    }

    function editConfig(configId) {
      socket.emit('actions:get', { id: configId });
    }

    function populateForm(config) {
      currentConfig = config;
      document.getElementById('configId').value = config.id;
      document.getElementById('configId').disabled = true;
      document.getElementById('configName').value = config.name;
      document.getElementById('configDescription').value = config.description || '';
      document.getElementById('configLayout').value = config.layout;
      document.getElementById('configStageType').value = config.stageType || '';

      buttonLabels = config.buttonLabels || {};
      updateButtonLabelInputs();

      document.getElementById('modalTitle').textContent = '編輯行動配置';
      document.getElementById('configModal').classList.add('active');
    }

    function deleteConfig(configId) {
      if (confirm('確定要刪除此行動配置嗎？')) {
        socket.emit('actions:delete', { id: configId });
      }
    }

    function previewConfig(configId) {
      socket.emit('actions:get', { id: configId });
      socket.once('actions:get', (config) => {
        renderPreview(config);
      });
    }

    function renderPreview(config) {
      const previewSection = document.getElementById('previewSection');
      const previewContent = document.getElementById('previewContent');

      previewSection.classList.add('active');

      const layout = config.layout;
      const labels = config.buttonLabels || {};

      let html = '';
      if (layout === 'pad-4') {
        const buttons = ['btn1', 'btn2', 'btn3', 'btn4'];
        html = `
          <div class="action-grid action-grid-4">
            ${buttons.map(btn => `
              <button class="action-btn">${labels[btn] || btn}</button>
            `).join('')}
          </div>
        `;
      } else if (layout === 'pad-2') {
        html = `
          <div class="action-pad-2">
            <button class="action-btn">${labels.btn1 || 'A'}</button>
            <button class="action-btn">${labels.btn2 || 'B'}</button>
          </div>
        `;
      } else {
        html = '<p style="color: white;">預覽功能開發中...</p>';
      }

      previewContent.innerHTML = html;
      previewSection.scrollIntoView({ behavior: 'smooth' });
    }

    function closePreview() {
      document.getElementById('previewSection').classList.remove('active');
    }

    function resetForm() {
      document.getElementById('actionConfigForm').reset();
      document.getElementById('configId').disabled = false;
      buttonLabels = {};
      updateButtonLabelInputs();
    }

    function updateButtonLabelInputs() {
      const layout = document.getElementById('configLayout').value;
      const container = document.getElementById('buttonLabelsContainer');

      const buttons = getButtonsForLayout(layout);
      if (buttons.length === 0) {
        container.innerHTML = '<p style="color: #a0aec0; font-size: 14px;">請先選擇控制器佈局</p>';
        return;
      }

      container.innerHTML = `
        <div class="form-row">
          ${buttons.map(btn => `
            <div class="form-group">
              <label for="label_${btn}">${btn}</label>
              <input type="text" id="label_${btn}" name="label_${btn}"
                     value="${buttonLabels[btn] || ''}"
                     placeholder="輸入標籤...">
            </div>
          `).join('')}
        </div>
      `;
    }

    function getButtonsForLayout(layout) {
      const layouts = {
        'pad-8': ['btn1', 'btn2', 'btn3', 'btn4', 'btn5', 'btn6', 'btn7', 'btn8'],
        'pad-4': ['btn1', 'btn2', 'btn3', 'btn4'],
        'pad-2': ['btn1', 'btn2'],
        'dpad-2btn': ['up', 'down', 'left', 'right', 'btn1', 'btn2'],
        'dpad-dpad': ['up', 'down', 'left', 'right', 'up2', 'down2', 'left2', 'right2']
      };
      return layouts[layout] || [];
    }

    function saveConfig() {
      const form = document.getElementById('actionConfigForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const layout = document.getElementById('configLayout').value;
      const buttons = getButtonsForLayout(layout);

      const newButtonLabels = {};
      buttons.forEach(btn => {
        const input = document.getElementById(`label_${btn}`);
        if (input && input.value.trim()) {
          newButtonLabels[btn] = input.value.trim();
        }
      });

      const config = {
        id: document.getElementById('configId').value,
        name: document.getElementById('configName').value,
        description: document.getElementById('configDescription').value,
        layout: layout,
        buttonLabels: newButtonLabels,
        stageType: document.getElementById('configStageType').value || null
      };

      if (currentConfig) {
        socket.emit('actions:update', { id: currentConfig.id, ...config });
      } else {
        socket.emit('actions:create', config);
      }
    }

    function closeModal() {
      document.getElementById('configModal').classList.remove('active');
      currentConfig = null;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal on outside click
    document.getElementById('configModal').addEventListener('click', (e) => {
      if (e.target.id === 'configModal') {
        closeModal();
      }
    });

    // Load actions on page load
    loadActions();
  </script>
</body>
</html>
