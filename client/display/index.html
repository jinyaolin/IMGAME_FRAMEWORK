<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000010;
      color: #e0e0ff;
      font-family: 'Courier New', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Room / status bar ── */
    #topBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0,0,30,.7);
      border-bottom: 1px solid rgba(100,100,255,.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 10;
      font-size: .8rem;
      color: #6666aa;
    }
    #topBar .roomCode { font-size: 1rem; color: #aaaaff; letter-spacing: .2em; font-weight: 700; }
    #topBar .phase    { color: #ffdd44; text-transform: uppercase; letter-spacing: .1em; }

    /* ── Player strip (bottom) ── */
    #playerStrip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,30,.8);
      border-top: 1px solid rgba(100,100,255,.2);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 32px;
      overflow-x: auto;
      z-index: 10;
    }
    .player-chip {
      background: #14143a;
      border: 1px solid #3a3a7a;
      border-radius: 24px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: border-color .3s;
    }
    .player-chip.connected    { border-color: #5555ff; }
    .player-chip.disconnected { border-color: #333; opacity: .5; }
    .player-chip.eliminated   { opacity: .5; filter: grayscale(0.8); }
    .player-chip.eliminated .pname::after { content: ' ❌'; font-size: .65rem; }
    .player-chip .pnumber     {
      background: #e67e22;
      color: white;
      font-size: .7rem;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .player-chip .pname       { font-size: .85rem; }
    .player-chip .pscore      { font-size: .8rem; color: #ffdd44; }
    .player-chip .pdot        { width: 7px; height: 7px; border-radius: 50%; background: #5555ff; }
    .player-chip.disconnected .pdot { background: #555; }

    /* ── Main content area ── */
    #mainStage {
      position: absolute;
      top: 48px; bottom: 64px; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Lobby view ── */
    #lobbyView {
      text-align: center;
    }
    #lobbyView h1 {
      font-size: 3rem;
      letter-spacing: .2em;
      color: #aaaaff;
      margin-bottom: 16px;
    }
    #qrArea {
      margin: 24px auto;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
    }
    #qrArea img { display: block; width: 180px; height: 180px; }
    #joinUrl { font-size: 1.1rem; color: #8888cc; margin-top: 12px; letter-spacing: .05em; }

    /* ── Game view (module fills this) ── */
    #gameView {
      width: 100%;
      height: 100%;
      display: none;
    }
    #moduleDisplay {
      width: 100%;
      height: 100%;
    }

    /* ── Event feed ── */
    #eventFeed {
      position: absolute;
      top: 64px; right: 24px;
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }
    .event-toast {
      background: rgba(20,20,60,.9);
      border-left: 3px solid #5555ff;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: .78rem;
      color: #aaaaee;
      animation: fadeIn .3s ease, fadeOut .5s ease 2.5s forwards;
    }
    @keyframes fadeIn  { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: none; } }
    @keyframes fadeOut { to   { opacity:0; } }

    /* ── Countdown overlay ── */
    #countdownOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
    }
    #countdownOverlay.visible { display: flex; }
    #countdownNumber {
      font-size: 12rem;
      font-weight: 900;
      color: #ffdd44;
      text-shadow: 0 0 40px rgba(255,221,68,.6);
      animation: countPulse 1s ease-in-out;
    }
    #countdownLabel {
      font-size: 2rem;
      color: #aaaaff;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: .2em;
    }
    @keyframes countPulse {
      0% { transform: scale(1.2); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 1; }
    }

    /* ── Connection overlay ── */
    #connectOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,20,.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
      font-size: 1.1rem;
      color: #6666aa;
    }
    #connectOverlay.hidden { display: none; }

    /* ── QR Code overlay ── */
    #qrOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,20,.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 90;
      gap: 20px;
    }
    #qrOverlay.visible { display: flex; }
    #qrOverlay h1 {
      font-size: 2.5rem;
      letter-spacing: .2em;
      color: #aaaaff;
      margin: 0;
    }
    #qrOverlay .qr-code-wrapper {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(85,85,255,.3);
    }
    #qrOverlay .qr-code-wrapper img {
      display: block;
      width: 280px;
      height: 280px;
    }
    #qrOverlay .join-url {
      font-size: 1.2rem;
      color: #8888cc;
      letter-spacing: .05em;
      margin-top: 10px;
    }
    #qrOverlay .hint {
      font-size: .9rem;
      color: #6666aa;
      margin-top: 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #3333aa;
      border-top-color: #8888ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Vote cards ── */
    .vote-card {
      background: #14143a;
      border: 2px solid #3a3a7a;
      border-radius: 16px;
      padding: 24px;
      transition: all .3s;
    }
    .vote-card:hover {
      border-color: #5555ff;
      box-shadow: 0 0 20px rgba(85,85,255,.3);
    }

    /* ── Input/Controller canvas ── */
    #inputCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Connection overlay -->
  <div id="connectOverlay">
    <div class="spinner"></div>
    <span id="connectMsg">連線中…</span>
  </div>

  <!-- QR Code overlay -->
  <div id="qrOverlay">
    <h1>📱 掃描加入</h1>
    <div class="qr-code-wrapper">
      <img id="qrOverlayImg" src="" alt="QR Code">
    </div>
    <div class="join-url" id="qrOverlayUrl"></div>
    <div class="hint">玩家掃描 QR Code 或輸入房間代碼加入遊戲</div>
  </div>

  <!-- Top bar -->
  <div id="topBar">
    <span class="roomCode" id="barRoom">------</span>
    <span id="barModule">等待遊戲模組</span>
    <span class="phase" id="barPhase">LOBBY</span>
  </div>

  <!-- Main stage -->
  <div id="mainStage">
    <!-- Lobby -->
    <div id="lobbyView">
      <h1>🎮</h1>
      <h1 id="lobbyRoomCode">------</h1>
      <div id="qrArea"><img id="qrImg" src="" alt="QR"></div>
      <div id="joinUrl"></div>
      <div style="margin-top:16px;">
        <a id="mobileLink" href="#" target="_blank"
           style="display:inline-block;color:#aaaaff;text-decoration:none;
                  border:1px solid #3a3a6a;padding:8px 16px;border-radius:8px;
                  background:#14142a;font-size:.9rem;transition:all .3s;"
           onmouseover="this.style.borderColor='#5555ff';this.style.background='#1a1a3a';"
           onmouseout="this.style.borderColor='#3a3a6a';this.style.background='#14142a';">
          📱 打開玩家頁面
        </a>
      </div>
    </div>

    <!-- Game module area -->
    <div id="gameView">
      <div id="moduleDisplay"></div>
    </div>

    <!-- Countdown overlay -->
    <div id="countdownOverlay">
      <div id="countdownNumber">3</div>
      <div id="countdownLabel">秒後下一回合</div>
    </div>
  </div>

  <!-- Player strip -->
  <div id="playerStrip"></div>

  <!-- Event toast feed -->
  <div id="eventFeed"></div>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/socket.js"></script>
  <script src="/shared/config.js"></script>
  <script>
    const roomId = getRoomFromUrl();

    const client = new GameClient();
    client.connect();

    client.on('connect', () => {
      document.getElementById('connectMsg').textContent = '連線成功，加入顯示端…';
      if (roomId) {
        client.joinDisplay(roomId);
      } else {
        document.getElementById('connectMsg').textContent = '缺少 ?room= 參數';
      }
    });

    client.on('disconnect', () => {
      document.getElementById('connectOverlay').classList.remove('hidden');
      document.getElementById('connectMsg').textContent = '連線中斷，重新連線…';
    });

    client.on('room_closed', () => {
      document.getElementById('connectOverlay').classList.remove('hidden');
      document.getElementById('connectMsg').textContent = '房間已關閉';
    });

    client.on('display_joined', (data) => {
      document.getElementById('connectOverlay').classList.add('hidden');
      setRoom(data.roomId);
      setPhase(data.phase);
      setModule(data.moduleName);
      renderPlayers(data.players || []);
      updateShared(data.sharedState || {});

      // Show QR
      const mobileUrl = Config.mobileUrl(data.roomId);
      document.getElementById('joinUrl').textContent = mobileUrl;
      document.getElementById('mobileLink').href = mobileUrl;
      document.getElementById('qrImg').src = Config.qrSrc(data.roomId);

      // Initialize QR overlay
      document.getElementById('qrOverlayImg').src = Config.qrSrc(data.roomId);
      document.getElementById('qrOverlayUrl').textContent = mobileUrl;

      if (data.phase === 'playing') enterGameView();
    });

    client.on('game_started', (data) => {
      setPhase('playing');
      setModule(data.module);
      updateShared(data.sharedState || {});

      // Update players with new data (including player numbers)
      if (data.players) {
        renderPlayers(data.players);
      }

      // Hide countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      enterGameView();
      toast(`遊戲開始：${data.module}`);
    });

    client.on('state_update', (data) => {
      updateShared(data.sharedState || {});
    });

    client.on('player_joined', (data) => {
      if (data.players) renderPlayers(data.players);
      else if (data.player) addOrUpdatePlayer(data.player);
      toast(`${data.player?.name || '玩家'} 加入`);
    });

    client.on('player_left', d => {
      players.delete(d.playerId);
      redrawStrip();
      toast(`玩家離開`);
    });
    client.on('player_disconnected', d => updatePlayerConnection(d.playerId, false));
    client.on('player_reconnected',  d => updatePlayerConnection(d.playerId, true));
    client.on('player_ready',        d => { if (d.players) renderPlayers(d.players); });

    // Listen for score updates
    client.on('scores_updated', (data) => {
      if (data.players) {
        data.players.forEach(p => {
          const player = players.get(p.id);
          if (player) {
            player.score = p.score;
          }
        });
        redrawStrip();
      }
    });

    client.on('card_played', (data) => {
      const playerName = players.get(data.playerId)?.name || data.playerId;
      toast(`${playerName} 已出牌`);
    });

    // ── Stage & Round Events ───────────────────────────────────────
    client.on('stage_started', (data) => {
      console.log('[Display] Stage started:', data.stageId, data.stageName, 'type:', data.stageType);
      toast(`📍 階段：${data.stageName}`);

      // Hide countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      // Stop any running input game loop
      stopInputStage();

      // Handle intermission stage - show pause screen
      if (data.stageType === 'intermission') {
        const el = document.getElementById('moduleDisplay');
        el.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;">
            <div style="font-size:6rem;margin-bottom:30px;">⏸️</div>
            <h1 style="font-size:3rem;color:#aaaaff;margin-bottom:20px;letter-spacing:.2em;">${data.stageName}</h1>
            ${data.stageDescription ? `<div style="font-size:1.5rem;color:#8888cc;margin-bottom:40px;">${data.stageDescription}</div>` : ''}
            <div style="font-size:1.2rem;color:#6666aa;">${t('display.paused')}</div>
          </div>
        `;
      } else if (data.stageType === 'input') {
        startInputStage(data.inputConfig || {}, [...players.values()]);
      } else if (data.stageType === 'card_play') {
        document.getElementById('moduleDisplay').innerHTML = '';
      }
    });

    client.on('round_started', (data) => {
      console.log('[Display] Round started:', data.roundNumber, 'of', data.totalRounds);
      toast(`🔄 第 ${data.roundNumber} 回合`);

      // Clear countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      // Clear revealed cards when starting a new round
      document.getElementById('moduleDisplay').innerHTML = '';
    });

    client.on('cards_revealed', (data) => {
      console.log('[Display] Cards revealed');
      toast('🃏 翻牌！');

      // Update display with revealed cards
      if (data.displayHtml) {
        document.getElementById('moduleDisplay').innerHTML = data.displayHtml;
      }
    });

    client.on('game_ended', (data) => {
      console.log('[Display] Game ended');
      toast('🏁 遊戲結束');

      // Update display with results
      if (data.displayHtml) {
        document.getElementById('moduleDisplay').innerHTML = data.displayHtml;
      }
    });

    client.on('vote_ended', (data) => {
      console.log('[Display] Vote ended:', data);
      console.log('[Display] Results:', JSON.stringify(data.results, null, 2));
      toast('📊 投票結束');

      // Display vote results
      if (data.results && data.results.length > 0) {
        const maxVotes = Math.max(...data.results.map(r => r.count));
        const sortedResults = data.results.sort((a, b) => b.count - a.count);

        let resultsHtml = '<div style="text-align:center;padding:60px;"><h2 style="font-size:3rem;color:#aaaaff;margin-bottom:40px;letter-spacing:.2em;">📊 投票結果</h2>';

        resultsHtml += '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1200px;margin:0 auto;">';

        resultsHtml += sortedResults.map((result, index) => {
          // Use targetName, fallback to targetId if undefined
          const name = result.targetName || result.targetId || '未知';
          const isLeading = result.count === maxVotes && result.count > 0;

          // Show voters for public votes
          let votersHtml = '';
          if (!data.anonymous && result.voters && result.voters.length > 0) {
            votersHtml = `<div style="font-size:1rem;color:#6666aa;margin-top:8px;">🗳️ ${result.voters.join('、')}</div>`;
          } else if (data.anonymous) {
            votersHtml = `<div style="font-size:.9rem;color:#6666aa;margin-top:8px;">🔒 匿名投票</div>`;
          }

          return `
            <div style="background:${isLeading ? 'linear-gradient(135deg,#2a2a1a 0%,#1a1a3a 100%)' : '#14143a'};border:2px solid ${isLeading ? '#ffdd44' : '#3a3a7a'};border-radius:16px;padding:24px;min-width:180px;text-align:center;${isLeading ? 'box-shadow:0 0 30px rgba(255,221,68,.3);' : ''}">
              <div style="font-size:2.5rem;color:#ffdd44;font-weight:700;margin-bottom:8px;">${result.count} 票</div>
              <div style="font-size:1.5rem;color:#aaaaff;margin-bottom:4px;">${name}</div>
              ${votersHtml}
              ${isLeading ? '<div style="font-size:1rem;color:#ffdd44;margin-top:8px;">👑 最高票</div>' : ''}
            </div>
          `;
        }).join('');

        resultsHtml += '</div></div>';
        document.getElementById('moduleDisplay').innerHTML = resultsHtml;
      }
    });

    client.on('show_result', (data) => {
      console.log('[Display] Show result');
      toast('🏁 遊戲結束');
    });

    client.on('all_played', (data) => {
      console.log('[Display] All players played');
      toast('✅ 全員已出牌');
    });

    // ── Vote Events ────────────────────────────────────────────────
    client.on('vote_started', (data) => {
      console.log('[Display] Vote started:', data.voteId);
      toast('🗳️ 投票階段開始');

      // Display voting screen
      const el = document.getElementById('moduleDisplay');
      el.innerHTML = `
        <div style="text-align:center;padding:60px;">
          <h2 style="font-size:3rem;color:#aaaaff;margin-bottom:40px;letter-spacing:.2em;">🗳️ 投票階段</h2>
          <div style="font-size:1.5rem;color:#8888cc;margin-bottom:20px;">
            ${data.voteTitle || '請投票'}
          </div>
          ${data.isAnonymous ? '<div style="font-size:1.2rem;color:#6666aa;margin-bottom:30px;">匿名投票</div>' : ''}
          <div id="voteOptions" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1000px;margin:0 auto;">
            ${data.options.map(opt => `
              <div class="vote-card" id="voteCard-${opt.id}" style="background:#14143a;border:2px solid #3a3a7a;border-radius:16px;padding:24px;transition:all .3s;">
                <div style="font-size:1.8rem;color:#aaaaff;margin-bottom:12px;">${opt.name || opt.label || opt.id}</div>
                <div class="vote-count" style="font-size:2.5rem;color:#ffdd44;font-weight:700;">0</div>
                <div style="font-size:.9rem;color:#6666aa;margin-top:8px;">票數</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    });

    client.on('vote_cast', (data) => {
      console.log('[Display] Vote cast:', data.playerId);
      // Update vote counts visually
      if (data.currentCounts) {
        Object.entries(data.currentCounts).forEach(([optId, count]) => {
          const card = document.getElementById(`voteCard-${optId}`);
          if (card) {
            card.querySelector('.vote-count').textContent = count;
          }
        });
      }
    });

    client.on('vote_countdown', (data) => {
      console.log('[Display] Vote countdown:', data.remaining);
      const overlay = document.getElementById('countdownOverlay');
      const numberEl = document.getElementById('countdownNumber');
      const labelEl = document.getElementById('countdownLabel');

      labelEl.textContent = '秒後投票結束';
      numberEl.textContent = data.remaining;
      overlay.classList.add('visible');

      if (data.remaining === 0) {
        setTimeout(() => {
          overlay.classList.remove('visible');
        }, 500);
      }
    });

    client.on('players_eliminated', (data) => {
      console.log('[Display] Players eliminated:', data);
      toast('⚠️ 玩家被淘汰');

      // Handle both old (playerIds) and new (players) formats
      const eliminatedIds = data.playerIds || (data.players ? data.players.map(p => p.id) : []);

      // Update player isAlive status
      if (eliminatedIds) {
        eliminatedIds.forEach(playerId => {
          const player = players.get(playerId);
          if (player) {
            player.isAlive = false;
          }
        });
        redrawStrip();
      }

      // Display elimination announcement
      const el = document.getElementById('moduleDisplay');
      const eliminatedNames = data.playerNames || (data.players ? data.players.map(p => p.name) : eliminatedIds);

      el.innerHTML = `
        <div style="text-align:center;padding:80px;">
          <h1 style="font-size:4rem;color:#ff4444;margin-bottom:40px;letter-spacing:.2em;">⚠️ 淘汰</h1>
          <div style="font-size:2rem;color:#aaaaff;margin-bottom:20px;">以下玩家被淘汰：</div>
          <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:40px;">
            ${Array.isArray(eliminatedNames) ? eliminatedNames.map(name => `
              <div style="background:#2a1414;border:2px solid #ff4444;border-radius:16px;padding:24px 40px;font-size:1.8rem;color:#ff6666;">
                ${name}
              </div>
            `).join('') : `<div style="background:#2a1414;border:2px solid #ff4444;border-radius:16px;padding:24px 40px;font-size:1.8rem;color:#ff6666;">${eliminatedNames}</div>`}
          </div>
        </div>
      `;
    });

    client.on('player_alive_changed', (data) => {
      console.log('[Display] Player alive changed:', data.playerId, data.isAlive);
      const player = players.get(data.playerId);
      if (player) {
        player.isAlive = data.isAlive;
        redrawStrip();
        toast(data.isAlive ? `♻️ ${player.name} 復活` : `❌ ${player.name} 被淘汰`);
      }
    });

    client.on('player_renamed', (data) => {
      console.log('[Display] Player renamed:', data.oldName, '→', data.newName);
      const player = players.get(data.playerId);
      if (player) {
        player.name = data.newName;
        redrawStrip();
        toast(`✏️ ${data.oldName} 改名為 ${data.newName}`);
      }
    });

    client.on('player_numbers_updated', (data) => {
      console.log('[Display] Player numbers updated:', data.players);
      // Update player numbers for all players
      for (const [playerId, playerNumber] of Object.entries(data.players)) {
        const player = players.get(playerId);
        if (player) {
          player.playerNumber = playerNumber;
        }
      }
      // Redraw player chips to show updated numbers
      redrawStrip();
    });

    client.on('phase_changed', (data) => {
      setPhase(data.phase || '');
      if (data.message) toast(data.message);
    });

    // ── Countdown ─────────────────────────────────────────────────
    let countdownTimer = null;
    client.on('countdown', (data) => {
      console.log('[Display] Countdown:', data.remaining, '/', data.total);
      const overlay = document.getElementById('countdownOverlay');
      const numberEl = document.getElementById('countdownNumber');
      const labelEl = document.getElementById('countdownLabel');

      // Determine label based on total duration
      if (data.total === 5) {
        labelEl.textContent = '秒後重新開始';
      } else if (data.total === 3) {
        labelEl.textContent = '秒後下一回合';
      } else {
        labelEl.textContent = '秒後繼續';
      }

      numberEl.textContent = data.remaining;
      overlay.classList.add('visible');

      // Clear previous timer
      if (countdownTimer) {
        clearTimeout(countdownTimer);
      }

      // Hide overlay after a short delay when countdown reaches 0
      if (data.remaining === 0) {
        countdownTimer = setTimeout(() => {
          overlay.classList.remove('visible');
        }, 500);
      }
    });

    // ── QR Toggle ───────────────────────────────────────────────
    client.on('qr_toggled', (data) => {
      console.log('[Display] QR toggled:', data.visible);
      const overlay = document.getElementById('qrOverlay');

      if (data.visible) {
        // Show QR overlay
        overlay.classList.add('visible');
        toast('📱 顯示加入條碼');
      } else {
        // Hide QR overlay
        overlay.classList.remove('visible');
        toast('❌ 隱藏加入條碼');
      }
    });

    // ── Helpers ────────────────────────────────────────────────
    const players = new Map();
    let displayOrder = []; // host-controlled display order (array of player IDs)

    client.on('player_order_changed', (data) => {
      displayOrder = data.order || [];
      redrawStrip();
    });

    function setRoom(id) {
      document.getElementById('barRoom').textContent = id;
      document.getElementById('lobbyRoomCode').textContent = id;
    }
    function setPhase(p) {
      document.getElementById('barPhase').textContent = (p || '').toUpperCase();
    }
    function setModule(m) {
      document.getElementById('barModule').textContent = m || '等待遊戲模組';
    }

    function renderPlayers(list) {
      players.clear();
      list.forEach(p => players.set(p.id, p));
      redrawStrip();
    }

    function addOrUpdatePlayer(p) {
      players.set(p.id, p);
      redrawStrip();
    }

    function updatePlayerConnection(playerId, connected) {
      const p = players.get(playerId);
      if (p) { p.isConnected = connected; redrawStrip(); }
    }

    function redrawStrip() {
      const ordered = displayOrder.length
        ? displayOrder.map(id => players.get(id)).filter(Boolean)
        : [...players.values()];
      const strip = document.getElementById('playerStrip');
      strip.innerHTML = ordered.map(p => {
        const statusClass = p.isConnected !== false ? 'connected' : 'disconnected';
        // Default isAlive to true if not set (new players)
        const isAlive = p.isAlive !== false;
        const eliminatedClass = !isAlive ? 'eliminated' : '';
        const playerNumber = p.playerNumber || '';
        const numberHtml = playerNumber ? `<span class="pnumber">${playerNumber}</span>` : '';
        const playerName = p.name || 'Unknown Player';
        return `
        <div class="player-chip ${statusClass} ${eliminatedClass}">
          ${numberHtml}
          <div class="pdot"></div>
          <span class="pname">${playerName}</span>
          ${p.score !== undefined && p.score !== null ? `<span class="pscore">${p.score}pt</span>` : ''}
        </div>
      `}).join('');
    }

    function updateShared(state) {
      const el = document.getElementById('moduleDisplay');
      if (state.displayHtml) {
        el.innerHTML = state.displayHtml;
      } else if (typeof state === 'object') {
        el.textContent = JSON.stringify(state, null, 2);
      }
    }

    function enterGameView() {
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').style.display  = 'block';
    }

    function toast(msg) {
      const feed = document.getElementById('eventFeed');
      const el = document.createElement('div');
      el.className = 'event-toast';
      el.textContent = msg;
      feed.prepend(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ── Input / Controller Stage ──────────────────────────────────
    const CTRL_COLORS = ['#ff6644','#44aaff','#44ff88','#ffdd44','#ff44aa','#88aaff','#ffaa44','#44ffdd'];
    const inputPlayers = new Map(); // playerId → { name, color, inputs: Set }
    let inputRAF = null;
    let inputUpdateFn = null;
    let inputHandlers = [];
    let inputCanvas = null, inputCtx = null;

    function startInputStage(cfg, playersList) {
      inputPlayers.clear();
      playersList.forEach((p, i) => {
        inputPlayers.set(p.id, { name: p.name, color: CTRL_COLORS[i % CTRL_COLORS.length], inputs: new Set() });
      });

      const displayEl = document.getElementById('moduleDisplay');
      displayEl.innerHTML = '';
      inputCanvas = document.createElement('canvas');
      inputCanvas.id = 'inputCanvas';
      inputCanvas.width  = window.innerWidth;
      inputCanvas.height = window.innerHeight;
      displayEl.appendChild(inputCanvas);
      inputCtx = inputCanvas.getContext('2d');
      inputCtx.fillStyle = '#000010';
      inputCtx.fillRect(0, 0, inputCanvas.width, inputCanvas.height);

      inputHandlers = [];
      inputUpdateFn = null;

      if (cfg.gameCode) {
        try {
          const GameAPI = {
            canvas: inputCanvas, ctx: inputCtx,
            players: inputPlayers,
            onInput: cb => inputHandlers.push(cb),
            update:  cb => { inputUpdateFn = cb; }
          };
          (new Function('GameAPI', cfg.gameCode))(GameAPI);
        } catch (e) { console.error('[Display] gameCode error:', e); }
      }

      if (inputRAF) cancelAnimationFrame(inputRAF);
      const loop = ts => {
        inputUpdateFn ? inputUpdateFn(ts) : drawInputDefault(ts);
        inputRAF = requestAnimationFrame(loop);
      };
      inputRAF = requestAnimationFrame(loop);
    }

    function stopInputStage() {
      if (inputRAF) { cancelAnimationFrame(inputRAF); inputRAF = null; }
      inputPlayers.clear();
      inputHandlers = [];
      inputUpdateFn = null;
      inputCanvas = null; inputCtx = null;
    }

    function drawInputDefault(ts) {
      if (!inputCtx || !inputCanvas) return;
      const W = inputCanvas.width, H = inputCanvas.height;
      inputCtx.fillStyle = 'rgba(0,0,16,0.18)';
      inputCtx.fillRect(0, 0, W, H);

      const pArr = [...inputPlayers.values()];
      if (!pArr.length) return;
      const cols = Math.ceil(Math.sqrt(pArr.length));
      const rows = Math.ceil(pArr.length / cols);
      const cw = W / cols, ch = H / rows;

      pArr.forEach((p, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const cx = col * cw + cw / 2, cy = row * ch + ch / 2;
        const active = p.inputs.size > 0;

        // Cell glow when active
        if (active) {
          inputCtx.save();
          inputCtx.shadowColor = p.color;
          inputCtx.shadowBlur = 40;
          inputCtx.strokeStyle = p.color + '88';
          inputCtx.lineWidth = 2;
          inputCtx.strokeRect(col * cw + 8, row * ch + 8, cw - 16, ch - 16);
          inputCtx.restore();
        }

        // Player name
        const fs = Math.min(cw * 0.12, 36);
        inputCtx.font = `700 ${fs}px monospace`;
        inputCtx.textAlign = 'center';
        inputCtx.textBaseline = 'middle';
        inputCtx.fillStyle = p.color;
        inputCtx.fillText(p.name, cx, cy - ch * 0.22);

        // Active key badges
        const keys = [...p.inputs];
        const r = Math.min(cw, ch) * 0.09;
        keys.slice(0, 8).forEach((key, ki) => {
          const angle = (ki / Math.max(keys.length, 1)) * Math.PI * 2 - Math.PI / 2;
          const dist = Math.min(cw, ch) * 0.22;
          const bx = cx + Math.cos(angle) * dist;
          const by = cy + Math.sin(angle) * dist + ch * 0.06;

          inputCtx.save();
          inputCtx.shadowColor = p.color;
          inputCtx.shadowBlur = 16;
          inputCtx.beginPath();
          inputCtx.arc(bx, by, r, 0, Math.PI * 2);
          inputCtx.fillStyle = p.color;
          inputCtx.fill();
          inputCtx.restore();

          inputCtx.font = `700 ${r * 0.9}px monospace`;
          inputCtx.fillStyle = '#000';
          inputCtx.fillText(key.length > 3 ? key[0] : key, bx, by);
        });
      });
    }

    client.on('player_input', data => {
      const ps = inputPlayers.get(data.playerId);
      if (!ps) return;
      if (data.state === 'down') ps.inputs.add(data.key);
      else ps.inputs.delete(data.key);
      for (const h of inputHandlers) {
        try { h(data.playerId, data.key, data.state, ps); } catch(e) {}
      }
    });
  </script>
</body>
</html>
