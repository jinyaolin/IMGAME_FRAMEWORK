<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000010;
      color: #e0e0ff;
      font-family: 'Courier New', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Room / status bar ── */
    #topBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0,0,30,.7);
      border-bottom: 1px solid rgba(100,100,255,.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 10;
      font-size: .8rem;
      color: #6666aa;
    }
    #topBar .roomCode { font-size: 1rem; color: #aaaaff; letter-spacing: .2em; font-weight: 700; }
    #topBar .phase    { color: #ffdd44; text-transform: uppercase; letter-spacing: .1em; }

    /* ── Player strip (bottom) ── */
    #playerStrip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,30,.8);
      border-top: 1px solid rgba(100,100,255,.2);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 32px;
      overflow-x: auto;
      z-index: 10;
    }
    .player-chip {
      background: #14143a;
      border: 1px solid #3a3a7a;
      border-radius: 24px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: border-color .3s;
    }
    .player-chip.connected    { border-color: #5555ff; }
    .player-chip.disconnected { border-color: #333; opacity: .5; }
    .player-chip.eliminated   { opacity: .5; filter: grayscale(0.8); }
    .player-chip.eliminated .pname::after { content: ' ❌'; font-size: .65rem; }
    .player-chip .pnumber     {
      background: #e67e22;
      color: white;
      font-size: .7rem;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .player-chip .pname       { font-size: .85rem; }
    .player-chip .pscore      { font-size: .8rem; color: #ffdd44; }
    .player-chip .pdot        { width: 7px; height: 7px; border-radius: 50%; background: #5555ff; }
    .player-chip.disconnected .pdot { background: #555; }

    /* ── Main content area ── */
    #mainStage {
      position: absolute;
      top: 48px; bottom: 64px; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Lobby view ── */
    #lobbyView {
      text-align: center;
    }
    #lobbyView h1 {
      font-size: 3rem;
      letter-spacing: .2em;
      color: #aaaaff;
      margin-bottom: 16px;
    }
    #qrArea {
      margin: 24px auto;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
    }
    #qrArea img { display: block; width: 180px; height: 180px; }
    #joinUrl { font-size: 1.1rem; color: #8888cc; margin-top: 12px; letter-spacing: .05em; }

    /* ── Game view (module fills this) ── */
    #gameView {
      width: 100%;
      height: 100%;
      display: none;
    }
    #moduleDisplay {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ── Game stage：鎖定比例的 letterbox 畫布 ── */
    #gameStageBox {
      position: absolute; inset: 0; margin: auto;
      background: #000; overflow: hidden;
      box-shadow: 0 0 40px #0008;
    }
    #gameStageBox canvas {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important;
      display: block;
    }

    /* ── Event feed ── */
    #eventFeed {
      position: absolute;
      top: 64px; right: 24px;
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }
    .event-toast {
      background: rgba(20,20,60,.9);
      border-left: 3px solid #5555ff;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: .78rem;
      color: #aaaaee;
      animation: fadeIn .3s ease, fadeOut .5s ease 2.5s forwards;
    }
    @keyframes fadeIn  { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: none; } }
    @keyframes fadeOut { to   { opacity:0; } }

    /* ── Countdown overlay ── */
    #countdownOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
    }
    #countdownOverlay.visible { display: flex; }
    #countdownNumber {
      font-size: 12rem;
      font-weight: 900;
      color: #ffdd44;
      text-shadow: 0 0 40px rgba(255,221,68,.6);
      animation: countPulse 1s ease-in-out;
    }
    #countdownLabel {
      font-size: 2rem;
      color: #aaaaff;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: .2em;
    }
    @keyframes countPulse {
      0% { transform: scale(1.2); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 1; }
    }

    /* ── Connection overlay ── */
    #connectOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,20,.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
      font-size: 1.1rem;
      color: #6666aa;
    }
    #connectOverlay.hidden { display: none; }

    /* ── QR Code overlay ── */
    #qrOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,20,.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 90;
      gap: 20px;
    }
    #qrOverlay.visible { display: flex; }
    #qrOverlay h1 {
      font-size: 2.5rem;
      letter-spacing: .2em;
      color: #aaaaff;
      margin: 0;
    }
    #qrOverlay .qr-code-wrapper {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(85,85,255,.3);
    }
    #qrOverlay .qr-code-wrapper img {
      display: block;
      width: 280px;
      height: 280px;
    }
    #qrOverlay .join-url {
      font-size: 1.2rem;
      color: #8888cc;
      letter-spacing: .05em;
      margin-top: 10px;
    }
    #qrOverlay .hint {
      font-size: .9rem;
      color: #6666aa;
      margin-top: 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #3333aa;
      border-top-color: #8888ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Vote cards ── */
    .vote-card {
      background: #14143a;
      border: 2px solid #3a3a7a;
      border-radius: 16px;
      padding: 24px;
      transition: all .3s;
    }
    .vote-card:hover {
      border-color: #5555ff;
      box-shadow: 0 0 20px rgba(85,85,255,.3);
    }

    /* ── Input/Controller canvas ── */
    #inputCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Connection overlay -->
  <div id="connectOverlay">
    <div class="spinner"></div>
    <span id="connectMsg" data-i18n="display.connecting">連線中…</span>
  </div>

  <!-- QR Code overlay -->
  <div id="qrOverlay">
    <h1>📱 掃描加入</h1>
    <div class="qr-code-wrapper">
      <img id="qrOverlayImg" src="" alt="QR Code">
    </div>
    <div class="join-url" id="qrOverlayUrl"></div>
    <div class="hint">玩家掃描 QR Code 或輸入房間代碼加入遊戲</div>
  </div>

  <!-- Top bar -->
  <div id="topBar">
    <span class="roomCode" id="barRoom">------</span>
    <span id="barModule">等待遊戲模組</span>
    <span class="phase" id="barPhase">LOBBY</span>
  </div>

  <!-- Main stage -->
  <div id="mainStage">
    <!-- Lobby -->
    <div id="lobbyView">
      <h1>🎮</h1>
      <h1 id="lobbyRoomCode">------</h1>
      <div id="lobbyModule" style="color:#8899ff;font-size:1.05rem;min-height:1.4em;margin-top:2px;"></div>
      <div id="qrArea"><img id="qrImg" src="" alt="QR"></div>
      <div id="joinUrl"></div>
      <div style="margin-top:16px;">
        <a id="mobileLink" href="#" target="_blank"
           style="display:inline-block;color:#aaaaff;text-decoration:none;
                  border:1px solid #3a3a6a;padding:8px 16px;border-radius:8px;
                  background:#14142a;font-size:.9rem;transition:all .3s;"
           onmouseover="this.style.borderColor='#5555ff';this.style.background='#1a1a3a';"
           onmouseout="this.style.borderColor='#3a3a6a';this.style.background='#14142a';">
          📱 打開玩家頁面
        </a>
      </div>
    </div>

    <!-- Game module area -->
    <div id="gameView">
      <div id="moduleDisplay"></div>
    </div>

    <!-- Countdown overlay -->
    <div id="countdownOverlay">
      <div id="countdownNumber">3</div>
      <div id="countdownLabel">秒後下一回合</div>
    </div>
  </div>

  <!-- Player strip -->
  <div id="playerStrip"></div>

  <!-- Event toast feed -->
  <div id="eventFeed"></div>

  <!-- Socket.io -->
  <script>
    window.IMGAME_BASE = location.pathname.indexOf('/labs/game') === 0 ? '/labs/game' : '';
    document.write('<script src="' + IMGAME_BASE + '/socket.io/socket.io.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/socket.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/config.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/netcore.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/netclient.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/p2p.js"><\/script>');
  </script>
  <script>
    const roomId = getRoomFromUrl();
    const useP2P = new URLSearchParams(location.search).get('p2p') === '1';   // P2P 主持:直連 host 瀏覽器

    const client = new GameClient();
    try { window.__dispClient = client; } catch (e) {}   // 測試掛鉤(與 mobile __mgClient 對稱)
    if (useP2P) {
      client.connectP2P(roomId).catch(e => { document.getElementById('connectMsg').textContent = 'P2P 連線失敗:' + (e && e.message); });
    } else {
      client.connect();
    }

    client.on('connect', () => {
      document.getElementById('connectMsg').textContent = '連線成功，加入顯示端…';
      if (roomId) {
        client.joinDisplay(roomId);
      } else {
        document.getElementById('connectMsg').textContent = '缺少 ?room= 參數';
      }
    });

    client.on('disconnect', () => {
      document.getElementById('connectOverlay').classList.remove('hidden');
      document.getElementById('connectMsg').textContent = t('display.reconnecting');
    });

    client.on('room_closed', () => {
      document.getElementById('connectOverlay').classList.remove('hidden');
      document.getElementById('connectMsg').textContent = '房間已關閉';
    });

    client.on('display_joined', (data) => {
      document.getElementById('connectOverlay').classList.add('hidden');
      setRoom(data.roomId);
      setPhase(data.phase);
      setModule(data.moduleName);
      document.getElementById('lobbyModule').textContent =
        (data.phase === 'lobby' && data.moduleName) ? `已載入:${data.moduleName} — 等待主持人啟動` : '';
      renderPlayers(data.players || []);
      updateShared(data.sharedState || {});

      // Show QR — P2P 模式要帶完整遊戲頁 + &p2p=1(手機才會走 WebRTC 直連 host);rp=1 一起帶下去
      const rpQS = (new URLSearchParams(location.search).get('rp') === '1') ? '&rp=1' : '';
      const mobileUrl = useP2P
        ? (Config.mobileUrl(data.roomId).replace('/mobile?room=', '/mobile/game.html?room=') + '&p2p=1' + rpQS)
        : Config.mobileUrl(data.roomId);
      const qrUrl = useP2P
        ? (IMGAME_BASE + '/api/rooms/' + data.roomId + '/qr?path=' + encodeURIComponent('/mobile/game.html?room=' + data.roomId + '&p2p=1' + rpQS))
        : Config.qrSrc(data.roomId);
      document.getElementById('joinUrl').textContent = mobileUrl;
      document.getElementById('mobileLink').href = mobileUrl;
      document.getElementById('qrImg').src = qrUrl;

      // Initialize QR overlay
      document.getElementById('qrOverlayImg').src = qrUrl;
      document.getElementById('qrOverlayUrl').textContent = mobileUrl;

      if (data.phase === 'playing') {
        enterGameView();
        if (data.currentStage?.stageType === 'game') {
          stopGameStage();
          startGameStage(data.currentStage.gameConfig || {}, [...players.values()]);
        }
      }
    });

    // 主持人在大廳選定模組(尚未啟動)— 頂列與大廳提示即時更新
    client.on('module_selected', (data) => {
      const name = data?.manifest?.name || data?.moduleId || '';
      setModule(name || data?.moduleId);
      document.getElementById('lobbyModule').textContent = name ? `已載入:${name} — 等待主持人啟動` : '';
    });

    client.on('game_started', (data) => {
      setPhase('playing');
      setModule(data.module);
      updateShared(data.sharedState || {});

      // Update players with new data (including player numbers)
      if (data.players) {
        // Sync player numbers from server
        data.players.forEach(p => {
          if (p.playerNumber) {
            playerNumberMap[p.id] = p.playerNumber;
          }
        });
        renderPlayers(data.players);
      }

      // Hide countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      enterGameView();
      toast(`遊戲開始：${data.module}`);
    });

    client.on('state_update', (data) => {
      updateShared(data.sharedState || {});
    });

    client.on('player_joined', (data) => {
      // Assign player number when joining (same logic as host)
      if (data.player && !playerNumberMap[data.player.id]) {
        const nextNumber = Object.keys(playerNumberMap).length + 1;
        playerNumberMap[data.player.id] = nextNumber;
        console.log('[Display] Assigned player number', nextNumber, 'to', data.player.name);
      }

      if (data.players) renderPlayers(data.players);
      else if (data.player) addOrUpdatePlayer(data.player);
      toast(`${data.player?.name || '玩家'} 加入`);
    });

    client.on('player_left', d => {
      players.delete(d.playerId);
      delete playerNumberMap[d.playerId];
      redrawStrip();
      toast(`玩家離開`);
    });
    client.on('player_disconnected', d => updatePlayerConnection(d.playerId, false));
    client.on('player_reconnected',  d => updatePlayerConnection(d.playerId, true));
    client.on('player_ready',        d => { if (d.players) renderPlayers(d.players); });

    // Listen for score updates
    client.on('scores_updated', (data) => {
      if (data.players) {
        data.players.forEach(p => {
          const player = players.get(p.id);
          if (player) {
            player.score = p.score;
          }
        });
        redrawStrip();
      }
    });

    client.on('card_played', (data) => {
      const playerName = players.get(data.playerId)?.name || data.playerId;
      toast(`${playerName} 已出牌`);
    });

    // ── Stage & Round Events ───────────────────────────────────────
    client.on('stage_started', (data) => {
      console.log('[Display] Stage started:', data.stageId, data.stageName, 'type:', data.stageType);
      toast(`📍 階段：${data.stageName}`);

      // Hide countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      // Stop any running input game loop
      stopGameStage();

      // Handle intermission stage - show message screen（不放暫停 icon,訊息本身即重點)
      if (data.stageType === 'intermission') {
        const el = document.getElementById('moduleDisplay');
        el.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;">
            <h1 style="font-size:3rem;color:#aaaaff;margin-bottom:20px;letter-spacing:.2em;">${data.stageName}</h1>
            ${data.stageDescription ? `<div style="font-size:1.5rem;color:#8888cc;margin-bottom:40px;">${data.stageDescription}</div>` : ''}
            <div style="font-size:1.2rem;color:#6666aa;">${t('display.paused')}</div>
          </div>
        `;
      } else if (data.stageType === 'select') {
        selBoardActive = true; renderSelectBoard();
      } else if (data.stageType === 'game') {
        startGameStage(data.gameConfig || {}, [...players.values()]);
      } else if (data.stageType === 'card_play') {
        document.getElementById('moduleDisplay').innerHTML = '';
      }
      if (data.stageType !== 'select') selBoardActive = false;
    });

    // ════════ 選角即時看板:每人目前選的角色 + 是否已確定(靠 player_param_updated 廣播更新)════════
    const SEL_ROLE_META = { knight:{n:'騎士',i:'⚔️'}, witch:{n:'女巫',i:'🧙‍♀️'}, troll:{n:'巨魔',i:'👹'}, frog:{n:'青蛙',i:'🐸'}, princess:{n:'公主',i:'👸'}, wizard:{n:'巫師',i:'🧙'}, dwarf:{n:'矮人',i:'⛏️'}, robin:{n:'羅賓漢',i:'🏹'}, fairy:{n:'仙女',i:'🧚'}, elf:{n:'精靈',i:'🧝'}, hood:{n:'小紅帽',i:'🧥'}, prince:{n:'王子',i:'🤴'} };
    let selBoardActive = false;
    function renderSelectBoard() {
      const el = document.getElementById('moduleDisplay');
      const list = [...players.values()];
      const cards = list.map(p => {
        const a = p.attributes || {};
        const m = SEL_ROLE_META[a.role] || { n: '？', i: '❔' };
        const ready = !!a.ready;
        return `<div style="width:200px;padding:20px 10px;border-radius:16px;background:${ready ? 'rgba(82,199,106,.18)' : 'rgba(255,255,255,.06)'};border:2px solid ${ready ? '#52c76a' : 'rgba(255,255,255,.15)'};text-align:center;transition:all .2s;">
          <div style="font-size:4rem;line-height:1;">${m.i}</div>
          <div style="font-size:1.5rem;color:#fff;margin-top:8px;font-weight:700;">${m.n}</div>
          <div style="font-size:1rem;color:#aab;margin-top:4px;">${p.name || '玩家'}</div>
          <div style="font-size:1.1rem;margin-top:10px;color:${ready ? '#52e05a' : '#8888aa'};">${ready ? '✓ 已確定' : '選擇中…'}</div>
        </div>`;
      }).join('');
      const done = list.filter(p => (p.attributes || {}).ready).length;
      el.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;">
        <h1 style="font-size:2.6rem;color:#c9b6ff;letter-spacing:.15em;margin-bottom:6px;">選擇你的英雄</h1>
        <div style="font-size:1.3rem;color:#8888cc;margin-bottom:30px;">${done} / ${list.length} 已確定 · 手機上左右換角色、🎲換造型</div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:90vw;">${cards || '<div style="color:#889;">等待玩家加入…</div>'}</div>
      </div>`;
    }
    client.on('player_param_updated', d => {
      const p = players.get(d.playerId); if (p) p.attributes = d.attributes || p.attributes;
      if (selBoardActive) renderSelectBoard();
    });

    client.on('round_started', (data) => {
      console.log('[Display] Round started:', data.roundNumber, 'of', data.totalRounds);
      toast(`🔄 第 ${data.roundNumber} 回合`);

      // Clear countdown overlay
      document.getElementById('countdownOverlay').classList.remove('visible');

      // Clear revealed cards when starting a new round
      document.getElementById('moduleDisplay').innerHTML = '';
    });

    client.on('cards_revealed', (data) => {
      console.log('[Display] Cards revealed');
      toast('🃏 翻牌！');

      // Update display with revealed cards
      if (data.displayHtml) {
        document.getElementById('moduleDisplay').innerHTML = data.displayHtml;
      }
    });

    client.on('game_ended', (data) => {
      console.log('[Display] Game ended');
      toast('🏁 遊戲結束');

      // Update display with results
      if (data.displayHtml) {
        document.getElementById('moduleDisplay').innerHTML = data.displayHtml;
      }
    });

    client.on('vote_ended', (data) => {
      console.log('[Display] Vote ended:', data);
      console.log('[Display] Results:', JSON.stringify(data.results, null, 2));

      // 🆕 檢查是否需要等待 Host 推進，如果是則隱藏倒數
      if (data.waitingForHost) {
        console.log('[Display] Vote ended, waiting for host - hiding countdown');
        document.getElementById('countdownOverlay').classList.remove('visible');
        toast('⏳ 投票結束，等待主持人推進');
      } else {
        toast('📊 投票結束');
      }

      // Display vote results
      if (data.results && data.results.length > 0) {
        const maxVotes = Math.max(...data.results.map(r => r.count));
        const sortedResults = data.results.sort((a, b) => b.count - a.count);

        let resultsHtml = '<div style="text-align:center;padding:60px;"><h2 style="font-size:3rem;color:#aaaaff;margin-bottom:40px;letter-spacing:.2em;">📊 投票結果</h2>';

        resultsHtml += '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1200px;margin:0 auto;">';

        resultsHtml += sortedResults.map((result, index) => {
          // Use targetName, fallback to targetId if undefined
          const name = result.targetName || result.targetId || '未知';
          const isLeading = result.count === maxVotes && result.count > 0;

          // Show voters for public votes
          let votersHtml = '';
          if (!data.anonymous && result.voters && result.voters.length > 0) {
            votersHtml = `<div style="font-size:1rem;color:#6666aa;margin-top:8px;">🗳️ ${result.voters.join('、')}</div>`;
          } else if (data.anonymous) {
            votersHtml = `<div style="font-size:.9rem;color:#6666aa;margin-top:8px;">🔒 匿名投票</div>`;

    // ── Helpers ────────────────────────────────────────────────

    function toast(msg) {

    // ── Input / Controller Stage ──────────────────────────────────
    const CTRL_COLORS = ['#ff6644','#44aaff','#44ff88','#ffdd44','#ff44aa','#88aaff','#ffaa44','#44ffdd'];
    const inputPlayers = new Map(); // playerId → { name, color, inputs: Set, lastSeq: Map<key, seq> }
    let inputRAF = null;
    let inputNet = null;   // NetKit:大螢幕的 Net(觀察者;收 net_snapshot 內插)
    let inputUpdateFn = null;
    let inputHandlers = [];
    let inputStateHandlers = [];   // 自訂介面：手機 sendState 的接收端
    let inputCanvas = null, inputCtx = null;
    let inputResizeHandler = null;

    // ── 外部函式庫（gameConfig.library）───────────────────────────
    // three/babylon 需要乾淨的 canvas 拿 WebGL context，所以 2d context 改為惰性取得
    const GAME_LIB_URLS = {
      three:   Config.url('/shared/vendor/three.min.js'),
      babylon: Config.url('/shared/vendor/babylon.js'),
      p5:      Config.url('/shared/vendor/p5.min.js'),
    };

    // ── 遊戲 log 回報（GameAPI.log + 自動錯誤捕捉 → server，給 AI debug）──
    let gameLogBuf = [], gameLogTimer = null;
    function pushGameLog(level, msg) {
      if (gameLogBuf.length >= 100) return;
      gameLogBuf.push({ ts: Date.now(), src: 'display', level, msg: String(msg).slice(0, 500) });
      if (!gameLogTimer) gameLogTimer = setTimeout(flushGameLogs, 1500);
    }
    function flushGameLogs() {
      gameLogTimer = null;
      if (!gameLogBuf.length) return;
      client.socket.emit('game_log', { roomId, entries: gameLogBuf.splice(0) });
    }
    const fmtLogArgs = (args) => args.map(x => {
      if (typeof x === 'object') { try { return JSON.stringify(x); } catch { return String(x); } }
      return String(x);
    }).join(' ');
    const fmtErr = (e) => e.message + (e.stack ? ' @' + (e.stack.split('\n')[1] || '').trim().slice(0, 120) : '');
    const loadedGameLibs = {};
    let inputCleanupFns = [];

    function loadScriptOnce(url, key) {
      if (loadedGameLibs[key]) return Promise.resolve();
      return new Promise(resolve => {
        const s = document.createElement('script');
        s.src = url;
        s.onload  = () => { loadedGameLibs[key] = true; resolve(); };
        s.onerror = () => { console.error('[Display] script load failed:', url); resolve(); };
        document.head.appendChild(s);
      });
    }
    function loadGameLibrary(lib) {
      if (!lib || lib === 'none' || !GAME_LIB_URLS[lib]) return Promise.resolve();
      return loadScriptOnce(GAME_LIB_URLS[lib], lib).then(() =>
        // three 一律附掛 LowPoly（角色）+ FX（特效）+ LowWorld（場景/物件生成庫）
        lib === 'three'
          ? loadScriptOnce(Config.url('/shared/vendor/lowpoly.js'), '_lowpoly')
              .then(() => loadScriptOnce(Config.url('/shared/vendor/fx.js'), '_fx'))
              .then(() => loadScriptOnce(Config.url('/shared/vendor/lowworld.js'), '_lowworld'))
          : null);
    }

    function startGameStage(cfg, playersList) {
      inputPlayers.clear();
      playersList.forEach((p, i) => {
        inputPlayers.set(p.id, {
          name: p.name,
          color: CTRL_COLORS[i % CTRL_COLORS.length],
          inputs: new Set(),
          lastSeq: new Map() // key → last sequence number
        });
      });

      // 鎖定比例：固定內部解析度（gameCode 座標系統穩定），CSS 縮放到視窗內最大可視尺寸
      const GAME_RESOLUTIONS = { '16:9': [1920, 1080], '4:3': [1600, 1200], '1:1': [1080, 1080] };
      const [gameW, gameH] = GAME_RESOLUTIONS[cfg.aspectRatio] || GAME_RESOLUTIONS['16:9'];

      const displayEl = document.getElementById('moduleDisplay');
      displayEl.innerHTML = '';
      const stageBox = document.createElement('div');
      stageBox.id = 'gameStageBox';
      displayEl.appendChild(stageBox);

      inputCanvas = document.createElement('canvas');
      inputCanvas.id = 'inputCanvas';
      inputCanvas.width  = gameW;
      inputCanvas.height = gameH;
      stageBox.appendChild(inputCanvas);

      const fitStageBox = () => {
        const scale = Math.min(window.innerWidth / gameW, window.innerHeight / gameH);
        stageBox.style.width  = Math.floor(gameW * scale) + 'px';
        stageBox.style.height = Math.floor(gameH * scale) + 'px';
      };
      fitStageBox();
      if (inputResizeHandler) window.removeEventListener('resize', inputResizeHandler);
      inputResizeHandler = fitStageBox;
      window.addEventListener('resize', inputResizeHandler);

      // NetKit(host-authoritative):有 target:'sim' 檔 → 大螢幕跑 render + 收 net_snapshot 內插
      const isNK = Array.isArray(cfg.files) && cfg.files.some(f => f && f.target === 'sim');
      const displayCode = isNK ? composeGameCode(cfg, 'render') : composeGameCode(cfg, 'display');
      const lib = (cfg.library && displayCode) ? cfg.library : 'none';
      if (isNK && window.NetClientKit) {
        const useRP = new URLSearchParams(location.search).get('rp') === '1';   // A/B:遠端實體預測
        let predictStep = null;
        if (useRP) { try { const S = {}; (new Function('Sim', composeGameCode(cfg, 'sim')))(S); S.emit = function () {}; predictStep = S.predictStep || null; } catch (e) { console.warn('predict sim build failed', e); } }
        inputNet = new NetClientKit.NetSurface({ surface: 'display', selfId: null, remotePredict: useRP, predictStep });
      } else { inputNet = null; }
      inputCtx = null;
      if (lib === 'none') {
        // 沒用外部函式庫 → 維持舊行為：直接給 2d context
        inputCtx = inputCanvas.getContext('2d');
        inputCtx.fillStyle = '#000010';
        inputCtx.fillRect(0, 0, inputCanvas.width, inputCanvas.height);
      }

      inputHandlers = [];
      inputStateHandlers = [];
      inputUpdateFn = null;
      inputCleanupFns = [];

      if (displayCode) {
        loadGameLibrary(lib).then(() => {
          if (!inputCanvas) return; // 階段已被切走
          try {
            const GameAPI = {
              canvas: inputCanvas,
              width: gameW, height: gameH,   // 固定座標系統（勿用 window.innerWidth）
              get ctx() {           // 惰性：three/babylon 的 gameCode 不碰它就不會鎖死 WebGL
                if (!inputCtx && inputCanvas) inputCtx = inputCanvas.getContext('2d');
                return inputCtx;
              },
              container: stageBox,   // p5 instance mode 掛載點（已是 letterbox 內框）
              library: lib,
              players: inputPlayers,
              onInput: cb => inputHandlers.push(cb),
              onPlayerState: cb => inputStateHandlers.push(cb),   // 手機 sendState → fn(playerId, state, player)
              broadcast: data => client.socket.emit('display_game_broadcast', { roomId, data }),  // → 全體手機 onMessage
              update:  cb => { inputUpdateFn = cb; },
              onEnd:   cb => inputCleanupFns.push(cb),   // 階段結束時的清理（dispose engine 等）
              log:     (...a) => { const s = fmtLogArgs(a); console.log('[Game]', s); pushGameLog('log', s); },
            };
            (new Function('GameAPI', 'Net', displayCode))(GameAPI, inputNet);
          } catch (e) {
            console.error('[Display] gameCode error:', e);
            pushGameLog('error', 'gameCode 執行錯誤: ' + fmtErr(e));
          }
        });
      }

      if (inputRAF) cancelAnimationFrame(inputRAF);
      let loopErrCount = 0;
      const loop = ts => {
        try {
          if (inputNet) inputNet.frame();   // NetKit:每幀先內插取樣
          inputUpdateFn ? inputUpdateFn(ts) : drawInputDefault(ts);
        } catch (e) {
          // update 丟例外不能讓 RAF 停掉（畫面凍結）；錯誤回報但限量
          if (loopErrCount++ < 3) {
            console.error('[Display] update error:', e);
            pushGameLog('error', 'update 錯誤: ' + fmtErr(e));
          }
        }
        inputRAF = requestAnimationFrame(loop);
      };
      inputRAF = requestAnimationFrame(loop);
    }

    function stopGameStage() {
      flushGameLogs();
      if (inputRAF) { cancelAnimationFrame(inputRAF); inputRAF = null; }
      if (inputResizeHandler) { window.removeEventListener('resize', inputResizeHandler); inputResizeHandler = null; }
      for (const fn of inputCleanupFns) { try { fn(); } catch (e) { console.error('[Display] onEnd cleanup error:', e); } }
      inputCleanupFns = [];
      inputPlayers.clear();
      inputHandlers = [];
      inputStateHandlers = [];
      inputUpdateFn = null;
      inputCanvas = null; inputCtx = null;
    }

    function drawInputDefault(ts) {
      if (!inputCtx || !inputCanvas) return;
      const W = inputCanvas.width, H = inputCanvas.height;
      inputCtx.fillStyle = 'rgba(0,0,16,0.18)';
      inputCtx.fillRect(0, 0, W, H);

      const pArr = [...inputPlayers.values()];
      if (!pArr.length) return;
      const cols = Math.ceil(Math.sqrt(pArr.length));
      const rows = Math.ceil(pArr.length / cols);
      const cw = W / cols, ch = H / rows;

      pArr.forEach((p, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const cx = col * cw + cw / 2, cy = row * ch + ch / 2;
        const active = p.inputs.size > 0;

        // Cell glow when active
        if (active) {
          inputCtx.save();
          inputCtx.shadowColor = p.color;
          inputCtx.shadowBlur = 40;
          inputCtx.strokeStyle = p.color + '88';
          inputCtx.lineWidth = 2;
          inputCtx.strokeRect(col * cw + 8, row * ch + 8, cw - 16, ch - 16);
          inputCtx.restore();
        }

        // Player name
        const fs = Math.min(cw * 0.12, 36);
        inputCtx.font = `700 ${fs}px monospace`;
        inputCtx.textAlign = 'center';
        inputCtx.textBaseline = 'middle';
        inputCtx.fillStyle = p.color;
        inputCtx.fillText(p.name, cx, cy - ch * 0.22);

        // Active key badges
        const keys = [...p.inputs];
        const r = Math.min(cw, ch) * 0.09;
        keys.slice(0, 8).forEach((key, ki) => {
          const angle = (ki / Math.max(keys.length, 1)) * Math.PI * 2 - Math.PI / 2;
          const dist = Math.min(cw, ch) * 0.22;
          const bx = cx + Math.cos(angle) * dist;
          const by = cy + Math.sin(angle) * dist + ch * 0.06;

          inputCtx.save();
          inputCtx.shadowColor = p.color;
          inputCtx.shadowBlur = 16;
          inputCtx.beginPath();
          inputCtx.arc(bx, by, r, 0, Math.PI * 2);
          inputCtx.fillStyle = p.color;
          inputCtx.fill();
          inputCtx.restore();

          inputCtx.font = `700 ${r * 0.9}px monospace`;
          inputCtx.fillStyle = '#000';
          inputCtx.fillText(key.length > 3 ? key[0] : key, bx, by);
        });
      });
    }

    client.on('player_input', data => {
      const ps = inputPlayers.get(data.playerId);
      if (!ps) return;

      // Handle sequence number to prevent out-of-order issues
      if (data.seq !== undefined) {
        const lastSeq = ps.lastSeq.get(data.key) || 0;
        if (data.seq <= lastSeq) {
          // This is an old event, ignore it
          return;
        }
        ps.lastSeq.set(data.key, data.seq);
      }

      if (data.state === 'down') ps.inputs.add(data.key);
      else ps.inputs.delete(data.key);
      for (const h of inputHandlers) {
        try { h(data.playerId, data.key, data.state, ps); } catch(e) { pushGameLog('error', 'onInput 錯誤: ' + fmtErr(e)); }
      }
    });

    client.on('net_snapshot', (d) => { if (inputNet) { try { inputNet.pushSnapshot(d); } catch (e) {} } });   // NetKit 權威快照

    // 自訂互動介面：手機端 sendState 的回報（賽車位置等）
    client.on('player_game_state', data => {
      const ps = inputPlayers.get(data.playerId);
      for (const h of inputStateHandlers) {
        try { h(data.playerId, data.state, ps || { name: data.playerName }); } catch (e) { pushGameLog('error', 'onPlayerState 錯誤: ' + fmtErr(e)); }
      }
    });
  </script>
</body>
</html>
