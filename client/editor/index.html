  function addGlobalParam() {
    pushHistory();
    manifest.globalParams = manifest.globalParams || [];
    manifest.globalParams.push({
      id: `param${manifest.globalParams.length + 1}`,
      label: '新參數',
      type: 'number',
      subType: 'integer',
      initialValue: 0,
      description: ''
    });
    renderParamsTab();
    afterChange(true);
  }

  function updateGlobalParam(index, field, value) {
    pushHistory();
    manifest.globalParams[index][field] = value;
    renderParamsTab();
    afterChange(true);
  }

  function deleteGlobalParam(index) {
    if (!confirm('確定要刪除此全域參數？')) return;
    pushHistory();
    manifest.globalParams.splice(index, 1);
    renderParamsTab();
    afterChange(true);
  }

  function addPlayerAttribute() {
    pushHistory();
    manifest.playerAttributes = manifest.playerAttributes || [];
    manifest.playerAttributes.push({
      id: `attr${manifest.playerAttributes.length + 1}`,
      label: '新屬性',
      type: 'number',
      subType: 'integer',
      initialValue: 0,
      description: ''
    });
    renderParamsTab();
    afterChange(true);
  }

  function updatePlayerAttribute(index, field, value) {
    pushHistory();
    manifest.playerAttributes[index][field] = value;
    renderParamsTab();
    afterChange(true);
  }

  function deletePlayerAttribute(index) {
    if (!confirm('確定要刪除此玩家屬性？')) return;
    pushHistory();
    manifest.playerAttributes.splice(index, 1);
    renderParamsTab();
    afterChange(true);
  }

  // ═══════════════════════════════════════════════════════════════
  //  TAB: DECKS
  // ═══════════════════════════════════════════════════════════════
  function renderDecksTab() {
    const decks = manifest.decks || [];
    document.getElementById('cfgDecks').innerHTML = decks.map((d, di) =>
      renderDeckBlock(d, di)
    ).join('') + `<button class="add-card-btn" style="margin-top:8px" onclick="addDeck()">+ 新增牌組</button>`;
    decks.forEach((d, di) => {
      if (openDecks.has(d.id)) {
        document.getElementById(`deck_cards_${di}`)?.classList.add('open');
        const arrow = document.querySelector(`#deck_${di} .deck-toggle`);
        if (arrow) arrow.textContent = '▴';
      }
    });
  }

  function renderDeckBlock(deck, di) {
    const globalDeck = globalDecks.find(d => d.id === deck.ref);
    const typeLbl = DECK_TYPES.find(t => t.value === (globalDeck?.type || deck.type))?.label || deck.type || '—';
    const cardCount = globalDeck?.cards?.length ?? '?';
    const globalDeckOptions = globalDecks
      .map(d => `<option value="${d.id}" ${deck.ref === d.id ? 'selected' : ''}>${escapeH(d.name)} (${d.id})</option>`)
      .join('');

    // 計算已選中的卡牌數量
    const selectedCards = deck.selectedCards || {};
    const selectedCardIds = Object.keys(selectedCards);
    const totalSelectedCards = selectedCardIds.reduce((sum, cardId) => sum + (selectedCards[cardId] || 0), 0);

    return `<div class="deck-block" id="deck_${di}">
      <div class="deck-header" onclick="toggleDeck(${di})">
        <label class="toggle-switch" onclick="event.stopPropagation()">
          <input type="checkbox" ${deck.enabled !== false ? 'checked' : ''}
                 onchange="setDeckProp(${di},'enabled',this.checked)">
          <span class="toggle-slider"></span>
        </label>
        <span class="deck-header-name">${escapeH(deck.name || deck.ref || '未命名')}</span>
        <span class="deck-type-badge">${escapeH(typeLbl)}</span>
        <span style="font-size:.65rem;color:#5566aa;">${deck.ref ? (selectedCardIds.length > 0 ? t('editor.deck_selected', { count: totalSelectedCards }) : cardCount + ' ' + t('editor.deck_count_suffix')) : t('editor.deck_not_selected')}</span>
        <span class="deck-toggle">▾</span>
      </div>
      <div class="deck-cards" id="deck_cards_${di}">
        <div class="deck-meta-row">
          <div class="field-row" style="margin:0">
            <label class="field-label">全局牌組</label>
            <select class="field-input" onchange="setDeckRef(${di}, this.value)">
              <option value="">— 請選擇全局牌組 —</option>
              ${globalDeckOptions}
            </select>
          </div>
        </div>
        ${deck.ref ? `
          <div class="deck-meta-row" style="background:#1a2a3a;padding:6px 8px;border-radius:4px;margin:4px 0;font-size:.75rem;color:#88aaff;">
            📦 ${escapeH(globalDeck?.name || deck.ref)}（${t('editor.deck_card_count', { count: cardCount })}）
          </div>
          <div class="deck-meta-row">
            <div class="field-row" style="margin:0">
              <label class="field-label">牌組 ID（stage 引用用）</label>
              <input class="field-input" value="${escapeH(deck.id||'')}" style="font-family:monospace;font-size:.78rem"
                     oninput="setDeckProp(${di},'id',this.value)">
            </div>
            <div class="field-row" style="margin:0">
              <label class="field-label">顯示名稱</label>
              <input class="field-input" value="${escapeH(deck.name||'')}" oninput="setDeckProp(${di},'name',this.value)">
            </div>
          </div>
          <div class="deck-draw-row">
            <span>預設抽牌數</span>
            <input type="number" min="1" max="20" value="${deck.drawCount || 1}"
                   oninput="setDeckProp(${di},'drawCount',Number(this.value))">
            允許重複
            <label class="toggle-switch" style="margin-left:4px">
              <input type="checkbox" ${deck.allowDuplicate ? 'checked' : ''}
                     onchange="setDeckProp(${di},'allowDuplicate',this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <!-- 卡牌選擇區塊 -->
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid #2a2a4a;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <span style="font-size:.78rem;font-weight:600;color:#aaaacc;">🃏 選擇卡牌</span>
              <div style="display:flex;gap:4px;">
                <button class="btn-ghost btn-sm" onclick="selectAllCards(${di})" title="全選">全選</button>
                <button class="btn-ghost btn-sm" onclick="deselectAllCards(${di})" title="清除選擇">清除</button>
              </div>
            </div>

            ${globalDeck?.cards && globalDeck.cards.length > 0 ? `
              <div style="max-height:280px;overflow-y:auto;border:1px solid #2a2a4a;border-radius:6px;background:#0a0a1a;">
                ${globalDeck.cards.map(card => {
                  const cardId = card.id;
                  const count = selectedCards[cardId] || 0;
                  const isSelected = count > 0;
                  return `
                    <div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #1a1a3a;${isSelected ? 'background:#1a2a3a;' : ''}">
                      <input type="checkbox" ${isSelected ? 'checked' : ''}
                             onchange="toggleCardSelection(${di},'${escapeH(cardId)}',this.checked)"
                             style="flex-shrink:0;cursor:pointer;">
                      <div style="flex:1;min-width:0;">
                        <div style="font-size:.8rem;font-weight:500;color:#ddddee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                          ${escapeH(card.name)}
                        </div>
                        ${card.description ? `<div style="font-size:.68rem;color:#7777aa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeH(card.description)}</div>` : ''}
                        ${card.value !== undefined ? `<div style="font-size:.65rem;color:#6688ff;">${t('editor.deck_value_prefix')} ${card.value}</div>` : ''}
                        ${card.team ? `<div style="font-size:.65rem;color:#8888cc;">${t('editor.deck_team_prefix')} ${card.team}</div>` : ''}
                      </div>
                      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                        <label style="font-size:.7rem;color:#8888bb;">${t('editor.deck_card_count_label')}</label>
                        <input type="number" min="0" max="99" value="${count}"
                               style="width:48px;background:#0a0a1a;border:1px solid #2a2a4a;border-radius:4px;color:#ddddf0;font-size:.75rem;padding:3px 6px;text-align:center;"
                               onchange="setCardCount(${di},'${escapeH(cardId)}',this.value)"
                               ${!isSelected ? 'disabled style="opacity:0.3;"' : ''}>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
              <div style="margin-top:6px;font-size:.72rem;color:#6666aa;text-align:right;">
                ${selectedCardIds.length > 0
                  ? t('editor.deck_selection_summary', { types: selectedCardIds.length, total: totalSelectedCards })
                  : t('editor.deck_no_selection')}
              </div>
            ` : `
              <div style="color:#886644;font-size:.78rem;padding:12px 0;text-align:center;">
                此牌組沒有卡牌
              </div>
            `}
          </div>

          <div class="deck-draw-row" style="margin-top:12px;">
            <button class="ci-del" style="margin-left:auto" onclick="deleteDeck(${di})">刪除牌組</button>
          </div>
        ` : `
          <div style="color:#886644;font-size:.78rem;padding:6px 0;">請從上方選擇一個全局牌組</div>
          <div class="deck-draw-row" style="margin-top:4px;">
            <button class="ci-del" style="margin-left:auto" onclick="deleteDeck(${di})">刪除牌組</button>
          </div>
        `}
      </div>
    </div>`;
  }

  function toggleDeck(di) {
    const deck = manifest.decks[di];
    const el = document.getElementById(`deck_cards_${di}`);
    el.classList.toggle('open');
    if (el.classList.contains('open')) openDecks.add(deck.id);
    else                                openDecks.delete(deck.id);
    const arrow = document.querySelector(`#deck_${di} .deck-toggle`);
    if (arrow) arrow.textContent = el.classList.contains('open') ? '▴' : '▾';
  }

  function setDeckProp(di, key, val) {
    pushHistory();
    const oldId = manifest.decks[di].id;
    manifest.decks[di][key] = val;
    if (key === 'id' && openDecks.has(oldId)) {
      openDecks.delete(oldId); openDecks.add(val);
    }
    afterChange(true);
  }

  function setDeckRef(di, globalDeckId) {
    pushHistory();
    const deck = manifest.decks[di];
    const globalDeck = globalDecks.find(d => d.id === globalDeckId);
    if (globalDeckId && !globalDeck) { alert('找不到指定的全局牌組'); return; }

    delete deck.cards;
    delete deck.selectedCards; // 清空已選擇的卡牌

    if (globalDeckId) {
      deck.ref  = globalDeckId;
      deck.name = deck.name || globalDeck.name;
      deck.type = globalDeck.type;
    } else {
      delete deck.ref;
    }

    renderDecksTab();
    afterChange(true);
  }

  function addDeck() {
    pushHistory();
    manifest.decks = manifest.decks || [];
    const newId = 'deck_' + uid('d');
    manifest.decks.push({
      id: newId, name: '新牌組', type: 'action',
      visibility: 'private', drawCount: 1, allowDuplicate: true, enabled: true, ref: ''
    });
    openDecks.add(newId);
    renderDecksTab();
    afterChange(true);
  }

  function deleteDeck(di) {
    const deck = manifest.decks[di];
    if (!confirm(`確定要刪除「${deck.name}」這個牌組嗎？\n（會同時影響引用此牌組的階段）`)) return;
    pushHistory();
    openDecks.delete(deck.id);
    manifest.decks.splice(di, 1);
    renderDecksTab();
    afterChange(true);
  }

  // ─── 卡牌選擇功能 ───

  /**
   * 切換卡牌選中狀態
   * @param {number} di - deck index
   * @param {string} cardId - 卡牌 ID
   * @param {boolean} checked - 是否選中
   */
  function toggleCardSelection(di, cardId, checked) {
    pushHistory();
    const deck = manifest.decks[di];
    if (!deck.selectedCards) {
      deck.selectedCards = {};
    }

    if (checked) {
      // 如果沒有設定數量，默認為 1 張
      if (!deck.selectedCards[cardId] || deck.selectedCards[cardId] === 0) {
        deck.selectedCards[cardId] = 1;
      }
    } else {
      delete deck.selectedCards[cardId];
      // 如果沒有選中任何卡牌，刪除 selectedCards 對象
      if (Object.keys(deck.selectedCards).length === 0) {
        delete deck.selectedCards;
      }
    }

    renderDecksTab();
    afterChange(true);
  }

  /**
   * 設置卡牌數量
   * @param {number} di - deck index
   * @param {string} cardId - 卡牌 ID
   * @param {number} count - 數量
   */
  function setCardCount(di, cardId, count) {
    pushHistory();
    const deck = manifest.decks[di];
    if (!deck.selectedCards) {
      deck.selectedCards = {};
    }

    const numCount = parseInt(count) || 0;
    if (numCount > 0) {
      deck.selectedCards[cardId] = numCount;
    } else {
      delete deck.selectedCards[cardId];
      // 如果沒有選中任何卡牌，刪除 selectedCards 對象
      if (Object.keys(deck.selectedCards).length === 0) {
        delete deck.selectedCards;
      }
    }

    renderDecksTab();
    afterChange(true);
  }

  /**
   * 全選所有卡牌（默認每張 1 張）
   * @param {number} di - deck index
   */
  function selectAllCards(di) {
    const deck = manifest.decks[di];
    const globalDeck = globalDecks.find(d => d.id === deck.ref);
    if (!globalDeck || !globalDeck.cards || globalDeck.cards.length === 0) {
      toast('此牌組沒有卡牌', 'err');
      return;
    }

    pushHistory();
    deck.selectedCards = {};
    globalDeck.cards.forEach(card => {
      deck.selectedCards[card.id] = 1;
    });

    renderDecksTab();
    afterChange(true);
    toast(`已全選 ${globalDeck.cards.length} 張卡牌`, 'ok');
  }

  /**
   * 清除所有卡牌選擇
   * @param {number} di - deck index
   */
  function deselectAllCards(di) {
    const deck = manifest.decks[di];
    if (!deck.selectedCards || Object.keys(deck.selectedCards).length === 0) {
      toast('尚未選擇任何卡牌', 'err');
      return;
    }

    pushHistory();
    delete deck.selectedCards;

    renderDecksTab();
    afterChange(true);
    toast('已清除所有卡牌選擇', 'ok');
  }

  // ═══════════════════════════════════════════════════════════════
  //  TAB: STAGES
  // ═══════════════════════════════════════════════════════════════
  function renderStagesTab() {
    const stages = manifest.stages || [];
    const decks  = manifest.decks  || [];
    const deckOptsFor = (selId) => decks.map(d =>
      `<option value="${escapeH(d.id)}" ${d.id===selId?'selected':''}>${escapeH(d.name)} (${escapeH(d.id)})</option>`
    ).join('');

    document.getElementById('cfgStages').innerHTML = stages.map((s, si) => `
      <div class="stage-row ${s.enabled ? '' : 'disabled'}" id="stage_row_${si}">
        <div class="sr-head">
          <div class="stage-order-btns">
            <button onclick="moveStage(${si},-1)" ${si===0?'disabled':''}>▲</button>
            <button onclick="moveStage(${si}, 1)" ${si===stages.length-1?'disabled':''}>▼</button>
          </div>
          <input class="field-input" style="flex:1" placeholder="階段名稱"
                 value="${escapeH(s.name||'')}" oninput="setStageProp(${si},'name',this.value)">
          <div class="sr-minimock">${renderPhoneMock(s)}</div>
          <label class="toggle-switch">
            <input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="setStageProp(${si},'enabled',this.checked)">
            <span class="toggle-slider"></span>
          </label>
          <button class="ci-del" onclick="deleteStage(${si})">✕</button>
        </div>
        <div class="stage-grid">
          <div class="field-row" style="margin:0">
            <label class="field-label">階段類型</label>
            <select class="field-input" onchange="setStageProp(${si},'type',this.value)">
              ${getStageTypes().map(st => `<option value="${st.value}" ${s.type===st.value?'selected':''}>${st.label}</option>`).join('')}
            </select>
          </div>
          ${s.type !== 'loop' && s.type !== 'goto' ? `
          <div class="field-row" style="margin:0">
            <label class="field-label">使用牌組 (deckId)</label>
            <select class="field-input" onchange="setStageProp(${si},'deckId',this.value || undefined)">
              <option value="" ${!s.deckId?'selected':''}>— 不使用 —</option>
              ${deckOptsFor(s.deckId)}
            </select>
          </div>
          ` : '<div></div>'}
          <div class="field-row" style="margin:0">
            <label class="field-label">階段 ID</label>
            <input class="field-input" value="${escapeH(s.id||'')}" style="font-family:monospace;font-size:.78rem"
                   oninput="setStageProp(${si},'id',this.value)">
          </div>
          ${s.type === 'intermission' ? `
          <div class="field-row" style="margin:0;grid-column:1/-1;">
            <label class="field-label">暫停說明</label>
            <input class="field-input" placeholder="例如：休息一下、準備下一階段等"
                   value="${escapeH(s.description||'')}"
                   oninput="setStageProp(${si},'description',this.value)">
          </div>
          ` : ''}
        </div>
        ${s.type !== 'loop' && s.type !== 'goto' ? renderAdvanceBlock(si, '階段結束時推進', 'advance', s.advance, '此階段所有事情完成後，如何進入下一個階段') : ''}
        ${s.type !== 'goto' ? renderParamActionsBlock(si, s) : ''}
        ${s.type === 'card_play' ? `
          <div style="margin-top:12px;padding:10px;background:#0d0d1f;border:1px solid #2a2a4a;border-radius:8px;">
            <div style="font-size:.8rem;color:#aaaacc;font-weight:600;margin-bottom:10px;">🎮 回合設定</div>
            ${renderStageRoundField(si, 'maxRounds', '總回合數', s.maxRounds, 5, '這個出牌階段共有幾回合')}
            ${renderStageRoundField(si, 'refillMode', '補牌模式', s.refillMode, 'none', 'players')}
            ${s.refillMode === 'per_round' ? renderStageRoundField(si, 'refillAmount', '每回合補幾張', s.refillAmount, 1, 'players') : ''}
            ${s.refillMode === 'threshold' ? `
              ${renderStageRoundField(si, 'refillThreshold', '補牌門檻（手牌低於此數時觸發）', s.refillThreshold, 2, '張')}
              ${renderStageRoundField(si, 'refillTo', '補到幾張', s.refillTo, 5, '張')}
            ` : ''}
          </div>

          <div style="margin-top:12px;padding:10px;background:#0d0d1f;border:1px solid #2a2a4a;border-radius:8px;">
            <div style="font-size:.8rem;color:#aaaacc;font-weight:600;margin-bottom:10px;">📋 回合間推進設定</div>
            ${renderAdvanceBlock(si, '1. 全員出牌後 → 何時翻牌？', 'revealTrigger', s.revealTrigger,
                '全員出牌後的行為', 'reveal')}
            ${renderAdvanceBlock(si, '2. 翻牌後 → 何時進下一回合？', 'nextRoundTrigger', s.nextRoundTrigger,
                '每回合翻牌後的行為（最後一回合除外）', 'next_round')}
          </div>
        ` : ''}
        ${s.type === 'vote'  ? renderVoteConfigBlock(s, String(si), null) : ''}
        ${s.type === 'game' ? renderGameConfigBlock(si, s) : ''}
        ${s.type === 'loop'  ? renderLoopBlock(si, s) : ''}
        ${s.type === 'goto'  ? renderGotoBlock(si, s, 'top') : ''}
      </div>`).join('') + `<button class="add-card-btn" onclick="openStageWizard()">+ 新增階段</button>`;
  }

  // ═══════════════════════════════════════════════════════════════
  //  PARAMACTIONS EDITOR
  // ═══════════════════════════════════════════════════════════════
  function renderParamActionsBlock(si, stage) {
    const actions = stage.paramActions || [];
    const hasActions = actions.length > 0;
    const actionsHtml = actions.map((action, ai) => renderParamActionRow(si, action, ai)).join('');
    const badge = hasActions ? `<span style="background:#5533aa;color:#ddb0ff;border-radius:10px;padding:1px 7px;font-size:.68rem;margin-left:6px;">${actions.length}</span>` : '';

    return `
      <details style="margin-top:12px;" ${hasActions ? 'open' : ''}>
        <summary style="cursor:pointer;padding:10px 12px;background:#0d0d1f;border:1px solid #3a2060;border-radius:8px;font-size:.8rem;color:#aaaacc;font-weight:600;list-style:none;display:flex;align-items:center;gap:4px;">
          ⚙️ 參數動作 (paramActions)${badge}
          <span style="margin-left:auto;font-size:.65rem;color:#665577;">▼</span>
        </summary>
        <div style="padding:12px;background:#0d0d1f;border:1px solid #3a2060;border-top:none;border-radius:0 0 8px 8px;">
          <div class="help-text" style="margin-bottom:10px;">
            在特定時機執行參數操作，例如：階段開始時設定參數、投票結束時淘汰玩家等。
          </div>
          <div id="paramActions_${si}">
            ${actionsHtml}
          </div>
          <button class="add-card-btn" onclick="addParamAction(${si})">+ 新增動作</button>
        </div>
      </details>
    `;
  }

  function renderParamActionRow(si, action, ai) {
    const triggerOptions = [
      { value: 'onStageStart', label: '階段開始時 (onStageStart)' },
      { value: 'onStageEnd', label: '階段結束時 (onStageEnd)' }
    ];

    const actionOptions = [
      { value: 'setValue', label: '設定參數值' },
      { value: 'addValue', label: '增加參數值' },
      { value: 'subtractValue', label: '減少參數值' },
      { value: 'multiplyValue', label: '乘以參數值' },
      { value: 'resetParam', label: '重置參數' },
      { value: 'storeVoteWinner', label: '存儲投票勝者' },
      { value: 'eliminatePlayer', label: '淘汰玩家' }
    ];

    return `
      <div class="param-action-row" style="background:#0a0a1a;border:1px solid #2a2a4a;border-radius:6px;padding:10px;margin-bottom:8px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
          <select class="field-input" style="flex:1;" onchange="updateParamAction(${si},${ai},'trigger',this.value)">
            ${triggerOptions.map(t => `<option value="${t.value}" ${action.trigger === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
          </select>
          <select class="field-input" style="flex:1;" onchange="updateParamAction(${si},${ai},'action',this.value)">
            ${actionOptions.map(a => `<option value="${a.value}" ${action.action === a.value ? 'selected' : ''}>${a.label}</option>`).join('')}
          </select>
          <button class="btn btn-danger btn-sm" onclick="deleteParamAction(${si},${ai})">✕</button>
        </div>
        <div class="param-action-details" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
          ${renderParamActionFields(si, action, ai)}
        </div>
      </div>
    `;
  }

  function renderParamActionFields(si, action, ai) {
    switch (action.action) {
      case 'setValue':
      case 'addValue':
      case 'subtractValue':
      case 'multiplyValue':
        return `
          <div style="grid-column:1/-1;">
            <label style="font-size:.7rem;color:#8888aa;">目標參數：</label>
            <input type="text" class="field-input" value="${escapeH(action.targetParam || '')}"
                   placeholder="參數 ID"
                   onchange="updateParamAction(${si},${ai},'targetParam',this.value)">
          </div>
          <div style="grid-column:1/-1;">
            <label style="font-size:.7rem;color:#8888aa;">數值：</label>
            <input type="text" class="field-input" value="${escapeH(action.value !== undefined ? String(action.value) : '')}"
                   placeholder="數值或變數（支援 $變數 語法）"
                   onchange="updateParamAction(${si},${ai},'value',this.value)">

      case 'resetParam':
        return `
          <div style="grid-column:1/-1;">
            <label style="font-size:.7rem;color:#8888aa;">目標參數：</label>

  function addParamAction(si) {
    pushHistory();
    const stage = manifest.stages[si];
    stage.paramActions = stage.paramActions || [];
    stage.paramActions.push({
      trigger: 'onStageStart',
      action: 'setValue',
      targetParam: '',
      value: ''
    });
    renderStagesTab();
    afterChange(true);
  }

  function updateParamAction(si, ai, field, value) {
    pushHistory();
    manifest.stages[si].paramActions[ai][field] = value;
    renderStagesTab();
    afterChange(true);
  }

  function deleteParamAction(si, ai) {
    if (!confirm('確定要刪除此動作？')) return;
    pushHistory();
    manifest.stages[si].paramActions.splice(ai, 1);
    renderStagesTab();
    afterChange(true);

  function renderStageRoundField(si, key, label, value, defaultVal, unit = '', configPath = null) {
    const stage = manifest.stages[si];
    const isNumber = typeof defaultVal === 'number';
    let input = '';

    if (key === 'refillMode') {
      input = `<select class="field-input" onchange="setStageProp(${si},'${key}',this.value)">
        <option value="none" ${(!value || value === 'none') ? 'selected' : ''}>不補牌</option>
        <option value="per_round" ${value === 'per_round' ? 'selected' : ''}>每回合補固定張數</option>
        <option value="threshold" ${value === 'threshold' ? 'selected' : ''}>手牌低於門檻時補牌</option>
      </select>`;
    } else {
      const type = isNumber ? 'number' : 'text';
      const oninput = configPath === 'voteConfig'
        ? `oninput="setVoteConfigProp(${si},'${key}',${isNumber ? 'Number(this.value)' : 'this.value'})"`
        : `oninput="setStageProp(${si},'${key}',${isNumber ? 'Number(this.value)' : 'this.value'})"`;

      input = `<input class="field-input" type="${type}" value="${value ?? ''}"
               min="1" max="300"
               placeholder="${defaultVal}"
               ${oninput}>

      </select>`;
    }

    return `<div class="field-row" style="margin:0">
      <label class="field-label">${label}</label>
      ${input}
    </div>`;
  }

      { value: 'pad-8',     label: '8 個按鈕 (2×4)' },
      { value: 'pad-4',     label: '4 個按鈕 (2×2)' },
      { value: 'pad-2',     label: '2 個按鈕 (左右)' },
      { value: 'dpad-2btn', label: '方向鍵 + 2 鍵' },
      { value: 'dpad-dpad', label: '雙方向鍵' },
      { value: 'custom',    label: '🕹 自訂（手機互動介面）' },
    ];

    const btnKeys = {
      'pad-8':     ['btn1','btn2','btn3','btn4','btn5','btn6','btn7','btn8'],
      'pad-4':     ['btn1','btn2','btn3','btn4'],
      'pad-2':     ['btn1','btn2'],
      'dpad-2btn': ['btn1','btn2'],

        <select class="field-input" onchange="setGameConfigProp(${si},'layout',this.value)">
          ${layoutOptions.map(o => `<option value="${o.value}" ${layout===o.value?'selected':''}>${o.label}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <label class="field-label">畫面比例（大螢幕）</label>
        <select class="field-input" onchange="setGameConfigProp(${si},'aspectRatio',this.value==='16:9'?'':this.value)">
          ${[['16:9','16:9（預設，1920×1080）'],['4:3','4:3（1600×1200）'],['1:1','1:1（1080×1080）']]

      ${keysForLayout.length ? `
      <div class="field-row" style="flex-direction:column;align-items:flex-start;gap:6px">

        ${keysForLayout.map(k => `
          <div style="display:flex;align-items:center;gap:8px;width:100%">
            <span style="font-size:.78rem;color:#7777aa;width:40px">${k}</span>
            <input class="field-input" style="flex:1" placeholder="${k}" value="${labels[k]||''}"

      </div>` : ''}
      <div class="field-row">
        <label class="field-label">3D／繪圖函式庫</label>
        <select class="field-input" onchange="setGameConfigProp(${si},'library',this.value==='none'?'':this.value)">
          ${[['none','無（原生 Canvas 2D）'],['three','three.js（3D）'],['babylon','Babylon.js（3D）'],['p5','p5.js（創意繪圖）']]
            .map(([v,l]) => `<option value="${v}" ${(ic.library||'none')===v?'selected':''}>${l}</option>`).join('')}

  // ── 遊戲程式檔案管理（多檔案，預設收合不顯示程式碼）──────────────
  const expandedGameFiles = new Set();   // 'si:fi' 或 'si:gameCode'

  function gfFiles(si) {
    const gc = manifest.stages[si].gameConfig = manifest.stages[si].gameConfig || {};
    gc.files = gc.files || [];
    return gc.files;
  }

  function renderGameFilesBlock(si, ic, layout) {
    const files = Array.isArray(ic.files) ? ic.files : [];
    const chip = t => ({ shared: '共用', display: '大螢幕', mobile: '手機', sim: '權威sim', render: '渲染' }[t] || t);
    const rows = files.map((f, fi) => {
      const key = si + ':' + fi;
      const open = expandedGameFiles.has(key);
      return `
        <div class="gf-row" data-gf="${escapeH((manifest.stages[si]?.id || si) + '|' + (f.name || ''))}">
          <div class="gf-head" onclick="toggleGameFile('${key}')">
            <span class="gf-name">${open ? '📂' : '📄'} ${escapeH(f.name || '未命名')}</span>
            <span class="gf-chip gf-${f.target}">${chip(f.target)}</span>
            <span class="gf-size">${(f.code || '').length} 字</span>
            <span style="flex:1"></span>
            <button class="gf-btn" onclick="event.stopPropagation();moveGameFile(${si},${fi},-1)" ${fi === 0 ? 'disabled' : ''}>▲</button>
            <button class="gf-btn" onclick="event.stopPropagation();moveGameFile(${si},${fi},1)" ${fi === files.length - 1 ? 'disabled' : ''}>▼</button>
            <button class="gf-btn" onclick="event.stopPropagation();renameGameFile(${si},${fi})">✎</button>
            <button class="gf-btn gf-del" onclick="event.stopPropagation();delGameFile(${si},${fi})">🗑</button>
          </div>
          ${open ? `<textarea class="field-input gf-code" rows="14" spellcheck="false"
              oninput="setGameFileCode(${si},${fi},this.value)">${escapeH(f.code || '')}</textarea>` : ''}
        </div>`;
    }).join('');

    const legacy = ['gameCode', 'mobileCode'].filter(k => ic[k]).map(k => {
      const key = si + ':' + k;
      const open = expandedGameFiles.has(key);
      return `
        <div class="gf-row">
          <div class="gf-head" onclick="toggleGameFile('${key}')">
            <span class="gf-name">${open ? '📂' : '📄'} ${k}（舊格式單檔）</span>
            <span class="gf-chip gf-${k === 'mobileCode' ? 'mobile' : 'display'}">${k === 'mobileCode' ? '手機' : '大螢幕'}</span>
            <span class="gf-size">${ic[k].length} 字</span>
          </div>
          ${open ? `<textarea class="field-input gf-code" rows="14" spellcheck="false"
              oninput="setGameConfigProp(${si},'${k}',this.value)">${escapeH(ic[k])}</textarea>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="field-row" style="flex-direction:column;align-items:stretch;gap:6px">
        <label class="field-label">📁 遊戲程式檔案</label>
        <div style="font-size:.72rem;color:#7777aa">
          程式碼建議交給右側的 Kimi 管理（它會自己規劃檔案結構、逐檔撰寫）。點檔名可展開手動編輯。
          執行順序：共用（shared）檔先載入、再接該端專屬檔，同端檔案共享作用域。${layout === 'custom' ? '手機跑 mobile 檔、大螢幕跑 display 檔。' : ''}
        </div>
        <div>${rows}${legacy}${(!rows && !legacy) ? '<div style="color:#55558a;font-size:.76rem;padding:6px 0">（還沒有程式檔案 — 跟右側 Kimi 說你想要的玩法，或手動新增）</div>' : ''}</div>
        <button class="btn btn-ghost btn-sm" style="align-self:flex-start" onclick="addGameFile(${si})">➕ 新增檔案</button>
      </div>`;
  }

  function toggleGameFile(key) {
    expandedGameFiles.has(key) ? expandedGameFiles.delete(key) : expandedGameFiles.add(key);
    renderStagesTab();
  }
  function addGameFile(si) {
    const name = prompt('檔案名稱（建議帶端別前綴，例如 shared/track.js、mobile/car.js、display/map.js）');
    if (!name) return;
    const guess = name.startsWith('mobile') ? 'mobile' : name.startsWith('shared') ? 'shared' : 'display';
    const target = prompt('執行端：shared / display / mobile / sim / render', guess);
    if (!['shared', 'display', 'mobile'].includes(target)) { toast('target 必須是 shared / display / mobile / sim / render', 'err'); return; }
    pushHistory();
    gfFiles(si).push({ name: name.trim(), target, code: '' });
    expandedGameFiles.add(si + ':' + (gfFiles(si).length - 1));
    renderStagesTab();
    afterChange(true);
  }
  function delGameFile(si, fi) {
    const f = gfFiles(si)[fi];
    if (!confirm(`刪除檔案「${f.name}」？`)) return;
    pushHistory();
    gfFiles(si).splice(fi, 1);
    renderStagesTab();
    afterChange(true);
  }
  function moveGameFile(si, fi, dir) {
    const arr = gfFiles(si), ni = fi + dir;
    if (ni < 0 || ni >= arr.length) return;
    pushHistory();
    [arr[fi], arr[ni]] = [arr[ni], arr[fi]];
    renderStagesTab();
    afterChange(true);
  }
  function renameGameFile(si, fi) {
    const f = gfFiles(si)[fi];
    const name = prompt('新檔名', f.name);
    if (!name) return;
    pushHistory();
    f.name = name.trim();
    renderStagesTab();
    afterChange(true);
  }
  function setGameFileCode(si, fi, v) {
    pushHistory();
    gfFiles(si)[fi].code = v;
    afterChange(true);   // 打字中不重繪，避免失焦
  }

  function setGameConfigProp(si, key, val) {
    pushHistory();
    if (!manifest.stages[si].gameConfig) manifest.stages[si].gameConfig = {};
    manifest.stages[si].gameConfig[key] = val || undefined;
    if (!val) delete manifest.stages[si].gameConfig[key];
    // gameCode 在 textarea 逐字輸入，重繪會導致失焦 — 只有換版型/函式庫需要重繪
    if (key !== 'gameCode') renderStagesTab();
    afterChange(true);
  }

  function setGameBtnLabel(si, btnKey, val) {
    pushHistory();
    if (!manifest.stages[si].gameConfig) manifest.stages[si].gameConfig = {};
    if (!manifest.stages[si].gameConfig.buttonLabels) manifest.stages[si].gameConfig.buttonLabels = {};
    if (val) manifest.stages[si].gameConfig.buttonLabels[btnKey] = val;
    else delete manifest.stages[si].gameConfig.buttonLabels[btnKey];
    afterChange(true);
  }

  // ═══════════════════════════════════════════════════════════════
  //  遊戲預覽：本機模擬多人（不經 server，直接執行 gameCode）
  // ═══════════════════════════════════════════════════════════════
  const PV_COLORS = ['#ff6644','#44aaff','#44ff88','#ffdd44','#ff44aa','#88aaff','#ffaa44','#44ffdd'];  // 與 display/mobile 同步
  const PV_RES = { '16:9': [1920, 1080], '4:3': [1600, 1200], '1:1': [1080, 1080] };
  const PV_LIB_URLS = { three: '/shared/vendor/three.min.js', babylon: '/shared/vendor/babylon.js', p5: '/shared/vendor/p5.min.js' };
  const pvLoadedLibs = {};
  let pvState = null;   // { si, raf, updateFn, handlers, cleanups, players, canvas, ctx, resizeFn, updateErrored }

  function pvLoadScript(url, key) {
    if (pvLoadedLibs[key]) return Promise.resolve();
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = Config.url(url);
      s.onload  = () => { pvLoadedLibs[key] = true; resolve(); };
      s.onerror = () => { pvStatus('函式庫載入失敗：' + url); resolve(); };
      document.head.appendChild(s);
    });
  }
  function pvLoadLib(lib) {
    if (!lib || lib === 'none' || !PV_LIB_URLS[lib]) return Promise.resolve();
    return pvLoadScript(PV_LIB_URLS[lib], lib).then(() =>
      // three 一律附掛 LowPoly（角色）+ FX（特效）+ LowWorld（場景/物件生成庫）
      lib === 'three'
        ? pvLoadScript('/shared/vendor/lowpoly.js', '_lowpoly')
            .then(() => pvLoadScript('/shared/vendor/fx.js', '_fx'))
            .then(() => pvLoadScript('/shared/vendor/lowworld.js', '_lowworld'))
        : null);
  }

  function pvStatus(msg) {
    const el = document.getElementById('pvStatus');
    if (el) el.textContent = msg || '';
  }

  // 預覽的 log 也回報 server（掛在目前模組名下）— Kimi debug 不必等真機
  let pvLogBuf = [], pvLogTimer = null, pvLogModuleId = null;
  function pvPushLog(src, level, msg) {
    if (!pvLogModuleId || pvLogBuf.length >= 80) return;
    pvLogBuf.push({ ts: Date.now(), src, level, msg: String(msg).slice(0, 500) });
    if (!pvLogTimer) pvLogTimer = setTimeout(pvFlushLogs, 1500);
  }
  function pvFlushLogs() {
    pvLogTimer = null;
    if (!pvLogBuf.length || !aiSocket) return;
    aiSocket.emit('game_log', { moduleId: pvLogModuleId, entries: pvLogBuf.splice(0) });
  }
  const pvFmtLog = (a) => a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ');

  function pvControllerHTML(pid, idx, cfg) {
    const layout = cfg.layout || 'pad-4';
    const lb = cfg.buttonLabels || {};
    const color = PV_COLORS[idx % PV_COLORS.length];
    const btn = (key, label) => `<div class="pv-btn"
        onpointerdown="pvPress(event,this,'${pid}','${key}','down')"
        onpointerup="pvPress(event,this,'${pid}','${key}','up')"
        onpointerleave="pvPress(event,this,'${pid}','${key}','up')">${escapeH(String(label))}</div>`;
    const dpad = (sfx) => `<div class="pv-dpad">
        <div class="blank"></div>${btn('up' + sfx, '↑')}<div class="blank"></div>
        ${btn('left' + sfx, '←')}<div class="blank"></div>${btn('right' + sfx, '→')}
        <div class="blank"></div>${btn('down' + sfx, '↓')}<div class="blank"></div></div>`;
    let inner = '';
    if (layout === 'pad-8')      inner = `<div class="pv-grid c4">${[1,2,3,4,5,6,7,8].map(n => btn('btn'+n, lb['btn'+n] || n)).join('')}</div>`;
    else if (layout === 'pad-4') inner = `<div class="pv-grid c2">${[1,2,3,4].map(n => btn('btn'+n, lb['btn'+n] || n)).join('')}</div>`;
    else if (layout === 'pad-2') inner = `<div class="pv-grid c2">${btn('btn1', lb.btn1 || '1')}${btn('btn2', lb.btn2 || '2')}</div>`;
    else if (layout === 'dpad-dpad') inner = `<div class="pv-btnrow">${dpad('')}${dpad('2')}</div>`;
    else inner = `<div class="pv-btnrow">${dpad('')}<div class="pv-grid" style="grid-template-columns:1fr">${btn('btn1', lb.btn1 || 'A')}${btn('btn2', lb.btn2 || 'B')}</div></div>`;
    return `<div class="pv-ctrl" style="--c:${color}"><div class="pv-ctrl-name"><i></i>玩家 ${idx + 1}</div>${inner}</div>`;
  }

  function pvPress(ev, el, pid, key, state) {
    ev.preventDefault();
    if (!pvState) return;
    const p = pvState.players.get(pid);
    if (!p) return;
    if (state === 'down') {
      if (p.inputs.has(key)) return;
      p.inputs.add(key);
    } else {
      if (!p.inputs.has(key)) return;
      p.inputs.delete(key);
    }
    el.classList.toggle('on', state === 'down');
    for (const fn of pvState.handlers) {
      try { fn(pid, key, state, p); } catch (e) { pvStatus('onInput 錯誤：' + e.message); }
    }
  }

  function pvTeardownRun() {
    if (!pvState) return;
    if (pvState.raf) { cancelAnimationFrame(pvState.raf); pvState.raf = null; }
    if (pvState.resizeFn) { window.removeEventListener('resize', pvState.resizeFn); pvState.resizeFn = null; }
    for (const fn of pvState.cleanups) { try { fn(); } catch (e) {} }
    for (const ph of (pvState.phones || [])) { for (const fn of ph.cleanups) { try { fn(); } catch (e) {} } }
    pvState.cleanups = []; pvState.handlers = []; pvState.updateFn = null; pvState.ctx = null;
    pvState.stateHandlers = []; pvState.phones = []; pvState.gameStates = {};
  }

  function openGamePreview(si) {
    if (!manifest?.stages?.[si]) return;
    pvState = { si, raf: null, updateFn: null, handlers: [], cleanups: [], players: new Map(),
                canvas: null, ctx: null, resizeFn: null, updateErrored: false,
                stateHandlers: [], phones: [], gameStates: {} };
    document.getElementById('gamePreview').classList.remove('hidden');
    pvBuild();
  }

  // 自訂模式：模擬手機 sendState → display 端 onPlayerState + 全體手機 onPlayers 快照
  function pvDispatchState(pid, state) {
    if (!pvState) return;
    const p = pvState.players.get(pid);
    for (const fn of pvState.stateHandlers) { try { fn(pid, state, p); } catch (e) {} }
    pvState.gameStates[pid] = state;
    const ids = [...pvState.players.keys()];
    const states = {};
    for (const [id, st] of Object.entries(pvState.gameStates)) {
      states[id] = { name: pvState.players.get(id)?.name || id, idx: Math.max(ids.indexOf(id), 0), state: st };
    }
    for (const ph of pvState.phones) {
      for (const fn of (ph.playersHandlers || [])) { try { fn(states); } catch (e) {} }
    }
  }

  // 自訂模式：每位玩家一台「模擬手機」跑 mobileCode
  function pvBuildPhones(cfg, mobileLib, mobileCode) {
    const wrap = document.getElementById('pvCtrls');
    wrap.innerHTML = '';
    if (!mobileCode) { pvStatus('自訂模式但沒有手機端程式 — 手機畫面會是空白'); }
    [...pvState.players.entries()].forEach(([pid, p]) => {
      const card = document.createElement('div');
      card.className = 'pv-ctrl';
      card.style.setProperty('--c', p.color);
      card.innerHTML = `<div class="pv-ctrl-name"><i></i>${escapeH(p.name)}（手機）</div>`;
      const phBox = document.createElement('div');
      phBox.className = 'pv-phonebox';
      card.appendChild(phBox);
      const canvas = document.createElement('canvas');
      canvas.width = 720; canvas.height = 1280;
      phBox.appendChild(canvas);
      wrap.appendChild(card);

      const phone = { pid, canvas, box: phBox, ctx: null, updateFn: null, cleanups: [], msgHandlers: [], playersHandlers: [], errored: false };
      pvState.phones.push(phone);
      if (mobileLib === 'none') {
        phone.ctx = canvas.getContext('2d');
        phone.ctx.fillStyle = '#000010';
        phone.ctx.fillRect(0, 0, 720, 1280);
      }
      if (mobileCode) {
        pvLoadLib(mobileLib).then(() => {
          if (!pvState || !pvState.phones.includes(phone)) return;
          try {
            const GameAPI = {
              canvas, width: 720, height: 1280,
              get ctx() { if (!phone.ctx) phone.ctx = canvas.getContext('2d'); return phone.ctx; },
              container: phBox, library: mobileLib,
              playerId: pid, playerName: p.name,
              sendState: obj => pvDispatchState(pid, obj),
              sendEvent: obj => pvDispatchState(pid, obj),
              onMessage: cb => phone.msgHandlers.push(cb),
              onPlayers: cb => phone.playersHandlers.push(cb),
              palette: PV_COLORS,
              update: cb => { phone.updateFn = cb; },
              onEnd: cb => phone.cleanups.push(cb),
              log: (...a) => { const s = pvFmtLog(a); console.log('[PV]', s); pvPushLog('preview-' + p.name, 'log', s); },
            };
            (new Function('GameAPI', mobileCode))(GameAPI);
          } catch (e) { pvStatus('mobileCode 錯誤：' + e.message); pvPushLog('preview-' + p.name, 'error', 'mobileCode 執行錯誤: ' + e.message); }
        });
      }
    });
  }

  function pvBuild() {
    if (!pvState) return;
    pvTeardownRun();
    pvStatus('');
    pvState.updateErrored = false;
    pvLogModuleId = currentId;
    const stage = manifest.stages[pvState.si];
    const cfg = (stage && stage.gameConfig) || {};
    const count = Number(document.getElementById('pvCount').value) || 4;
    const [W, H] = PV_RES[cfg.aspectRatio] || PV_RES['16:9'];

    pvState.players = new Map();
    for (let i = 0; i < count; i++) {
      pvState.players.set('sim' + (i + 1), { name: '玩家' + (i + 1), color: PV_COLORS[i % PV_COLORS.length], inputs: new Set(), lastSeq: new Map() });
    }

    const area = document.getElementById('pvStageArea');
    area.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'pv-stagebox';
    area.appendChild(box);
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    box.appendChild(canvas);
    const fit = () => {
      const r = area.getBoundingClientRect();
      const s = Math.min(r.width / W, r.height / H);
      box.style.width = Math.floor(W * s) + 'px';
      box.style.height = Math.floor(H * s) + 'px';
    };
    fit();
    pvState.resizeFn = fit;
    window.addEventListener('resize', fit);
    pvState.canvas = canvas;

    const isCustom = cfg.layout === 'custom';
    const pvDisplayCode = composeGameCode(cfg, 'display');   // 多檔案合成
    const pvMobileCode  = composeGameCode(cfg, 'mobile');
    const displayLib = (cfg.library && pvDisplayCode) ? cfg.library : 'none';
    const mobileLib  = (cfg.library && pvMobileCode)  ? cfg.library : 'none';

    if (isCustom) {
      pvBuildPhones(cfg, mobileLib, pvMobileCode);   // 模擬手機（跑手機端程式）
    } else {
      document.getElementById('pvCtrls').innerHTML =
        [...pvState.players.keys()].map((pid, i) => pvControllerHTML(pid, i, cfg)).join('');
    }

    if (displayLib === 'none') {
      pvState.ctx = canvas.getContext('2d');
      pvState.ctx.fillStyle = '#000010';
      pvState.ctx.fillRect(0, 0, W, H);
    }

    if (pvDisplayCode) {
      pvLoadLib(displayLib).then(() => {
        if (!pvState || pvState.canvas !== canvas) return;   // 已被關閉或重建
        try {
          const self = pvState;
          const GameAPI = {
            canvas, width: W, height: H,
            get ctx() { if (!self.ctx) self.ctx = canvas.getContext('2d'); return self.ctx; },
            container: box, library: displayLib,
            players: self.players,
            onInput: cb => self.handlers.push(cb),
            onPlayerState: cb => self.stateHandlers.push(cb),   // 模擬手機 sendState → 這裡
            broadcast: data => self.phones.forEach(ph => ph.msgHandlers.forEach(fn => { try { fn(data); } catch (e) {} })),
            update:  cb => { self.updateFn = cb; },
            onEnd:   cb => self.cleanups.push(cb),
            log:     (...a) => { const s = pvFmtLog(a); console.log('[PV]', s); pvPushLog('preview-display', 'log', s); },
          };
          (new Function('GameAPI', pvDisplayCode))(GameAPI);
        } catch (e) { pvStatus('gameCode 錯誤：' + e.message); pvPushLog('preview-display', 'error', 'gameCode 執行錯誤: ' + e.message); }
      });
    } else if (!isCustom) {
      pvStatus('此階段沒有 gameCode — 顯示預設視覺化（按下按鈕會發光）');
    }

    const loop = ts => {
      if (!pvState || pvState.canvas !== canvas) return;
      if (pvState.updateFn) {
        try { pvState.updateFn(ts); }
        catch (e) {
          if (!pvState.updateErrored) { pvState.updateErrored = true; pvStatus('update 錯誤：' + e.message); pvPushLog('preview-display', 'error', 'update 錯誤: ' + e.message); }
        }
      } else {
        pvDefaultDraw();
      }
      for (const ph of pvState.phones) {
        if (ph.updateFn) {
          try { ph.updateFn(ts); }
          catch (e) { if (!ph.errored) { ph.errored = true; pvStatus('手機端 update 錯誤：' + e.message); pvPushLog('preview-phone', 'error', '手機端 update 錯誤: ' + e.message); } }
        }
      }
      pvState.raf = requestAnimationFrame(loop);
    };
    pvState.raf = requestAnimationFrame(loop);
  }

  function pvDefaultDraw() {
    const ctx = pvState && pvState.ctx;
    if (!ctx) return;
    const W = pvState.canvas.width, H = pvState.canvas.height;
    ctx.fillStyle = 'rgba(0,0,16,0.18)';
    ctx.fillRect(0, 0, W, H);
    const arr = [...pvState.players.values()];
    const cols = Math.ceil(Math.sqrt(arr.length)), rows = Math.ceil(arr.length / cols);
    const cw = W / cols, ch = H / rows;
    arr.forEach((p, i) => {
      const cx = (i % cols) * cw + cw / 2, cy = Math.floor(i / cols) * ch + ch / 2;
      ctx.font = '28px system-ui'; ctx.textAlign = 'center';
      ctx.fillStyle = p.color; ctx.fillText(p.name, cx, cy - 70);
      if (p.inputs.size) {
        ctx.beginPath(); ctx.arc(cx, cy + 10, 46, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = '22px system-ui';
        ctx.fillText([...p.inputs].join(' '), cx, cy + 18);
      } else {
        ctx.beginPath(); ctx.arc(cx, cy + 10, 46, 0, Math.PI * 2);
        ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
      }
    });
  }

  function closeGamePreview() {
    pvFlushLogs();
    pvTeardownRun();
    pvState = null;
    document.getElementById('gamePreview').classList.add('hidden');
    document.getElementById('pvStageArea').innerHTML = '';
    document.getElementById('pvCtrls').innerHTML = '';
    pvStatus('');
  }

  function renderAdvanceBlock(si, label, key, adv, helpText, category = null) {
    adv = adv || {};
    const stageType = manifest.stages[si].type;
    // 根據階段類型和 category 過濾可用的推進選項
    let availableTriggers = ADVANCE_TRIGGERS.filter(t => {
      const typeMatch = t.types.includes('all') || t.types.includes(stageType);
      // 如果指定了 category，只顯示該 category 的選項
      // 如果沒有指定 category，只顯示 'stage_advance' 的選項（向後兼容）
      const categoryMatch = category
        ? t.category === category
        : t.category === 'stage_advance';
      return typeMatch && categoryMatch;
    });

    // 去重：相同的 value 只保留第一個（避免同一個選項出現多次）
    const seenValues = new Set();
    availableTriggers = availableTriggers.filter(t => {
      if (seenValues.has(t.value)) return false;
      seenValues.add(t.value);
      return true;
    });

    const showDuration = adv.trigger?.includes('timer') || adv.trigger === 'timer';

    return `<div style="background:#0a0a18;border:1px solid #1a1a3a;border-radius:6px;padding:10px;margin-top:8px;">
      <div style="font-size:.72rem;color:#8888bb;letter-spacing:.05em;margin-bottom:6px;">${escapeH(label)}</div>
      ${helpText ? `<div class="help-text" style="margin-bottom:8px">${escapeH(helpText)}</div>` : ''}
      <div class="stage-grid-2">
        <div class="field-row" style="margin:0">
          <label class="field-label">${typeof t==='function'?t('advance.label'):'推進條件'}</label>
          <select class="field-input" onchange="setAdvKey(${si},'${key}','trigger',this.value)">
            ${availableTriggers.map(tr => `<option value="${tr.value}" ${(adv.trigger||'host')===tr.value?'selected':''}>${getTriggerLabel(tr.value)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row" style="margin:0;${showDuration?'':'visibility:hidden;'}">
          <label class="field-label">${typeof t==='function'?t('advance.duration'):'秒數'}</label>
          <input class="field-input" type="number" min="0" max="600"
                 value="${adv.duration ?? ''}"
                 oninput="setAdvKey(${si},'${key}','duration',this.value===''?null:Number(this.value))">
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:.78rem;color:#aaaacc;margin-top:6px;">
        <input type="checkbox" ${adv.fallback ? 'checked' : ''}
               onchange="setAdvKey(${si},'${key}','fallback',this.checked ? 'host' : null)">
        ${typeof t==='function'?t('advance.fallback'):'Host 仍可強制推進（fallback）'}
      </label>
    </div>`;
  }

  function setStageProp(si, key, val) {
    pushHistory();
    manifest.stages[si][key] = val;
    if (key === 'enabled') document.getElementById(`stage_row_${si}`)?.classList.toggle('disabled', !val);
    if (key === 'type' && val === 'loop') {
      // Initialize loop-specific defaults
      const s = manifest.stages[si];
      s.loopType = s.loopType || 'fixed';
      s.maxIterations = s.maxIterations || 3;
      s.stages = s.stages || [];
      delete s.deckId;
      delete s.advance;
    }
    // 当阶段类型改为 vote 时，初始化 voteConfig 和 advance
    if (key === 'type' && val === 'vote') {
      const s = manifest.stages[si];
      s.voteConfig = s.voteConfig || {
        countdownSeconds: 30,
        anonymous: false,
        allowSelfVote: true,
        endWhenAllVoted: true
      };
      // 设置默认推进条件：等待 host 手动推进
      s.advance = s.advance || { trigger: 'host' };
    }
    // Re-render to toggle refill mode field visibility or stage-specific fields
    if (key === 'refillMode' || key === 'type') renderStagesTab();
    afterChange(true);
  }

  function setVoteConfigProp(si, key, val) {
    pushHistory();
    const stage = manifest.stages[si];
    stage.voteConfig = stage.voteConfig || {};
    stage.voteConfig[key] = val;
    // Re-render to toggle teamName field visibility when optionSource or voterFilter changes
    if (key === 'optionSource' || key === 'voterFilter') {
      renderStagesTab();
    }
    afterChange(true);
  }
  function setAdvKey(si, advKey, prop, val) {
    pushHistory();
    const stage = manifest.stages[si];
    stage[advKey] = stage[advKey] || {};
    if (val === null || val === '') delete stage[advKey][prop];
    else                            stage[advKey][prop] = val;
    // Re-render to toggle duration visibility
    renderStagesTab();
    afterChange(true);
  }
  function moveStage(si, dir) {
    const arr = manifest.stages;
    const ni  = si + dir;
    if (ni < 0 || ni >= arr.length) return;
    pushHistory();
    [arr[si], arr[ni]] = [arr[ni], arr[si]];
    renderStagesTab();
    afterChange(true);
  }
  // ── 意圖精靈：問「這一關玩家要做什麼」，帶預設值建立階段 ──
  const WIZARD_INTENTS = [
    { key: 'identity', icon: '🎭', title: '發身份卡', desc: '私下發身份給每位玩家，各自確認' },
    { key: 'vote',     icon: '🗳️', title: '投票表決', desc: '倒數投票，可自動淘汰最高票' },
    { key: 'cards',    icon: '🃏', title: '出牌對決', desc: '發手牌、多回合出牌比大小' },
    { key: 'talk',     icon: '⏸️', title: '說明／討論', desc: '只顯示一段文字，等主持人推進' },
    { key: 'game',     icon: '🎮', title: '搖桿同樂', desc: '手機變控制器，大螢幕即時反應' },
    { key: 'loop',     icon: '🔁', title: '循環多輪', desc: '一組關卡重複 N 輪（多輪投票等）' },
    { key: 'goto',     icon: '↪️', title: '條件跳轉', desc: '滿足條件時跳到指定關卡' },
    { key: 'result',   icon: '🏁', title: '結算名次', desc: '計分、公布排名、結束遊戲' },
    { key: 'blank',    icon: '📄', title: '空白階段', desc: '不帶預設值，自己慢慢調（老手用）' },
  ];

  function wizardBuildStage(key) {
    const firstDeck = (manifest.decks || []).find(d => d.enabled !== false)?.id;
    switch (key) {
      case 'identity': return { id: uid('stage'), name: '抽身份', type: 'identity_draw', enabled: true,
        ...(firstDeck ? { deckId: firstDeck } : {}),
        advance: { trigger: 'all_confirmed', fallback: 'host' } };
      case 'vote': return { id: uid('stage'), name: '投票', type: 'vote', enabled: true,
        voteConfig: { voteTitle: '投票', countdownSeconds: 30, anonymous: true, allowSelfVote: false, endWhenAllVoted: true },
        advance: { trigger: 'vote_ended', fallback: 'host' } };
      case 'cards': return { id: uid('stage'), name: '出牌對決', type: 'card_play', enabled: true,
        ...(firstDeck ? { deckId: firstDeck } : {}), maxRounds: 3,
        advance: { trigger: 'host' } };
      case 'talk': return { id: uid('stage'), name: '說明', type: 'intermission', enabled: true,
        description: '（在這裡寫要顯示給玩家的文字）', advance: { trigger: 'host' } };
      case 'game': return { id: uid('stage'), name: '搖桿關卡', type: 'game', enabled: true,
        gameConfig: { layout: 'dpad-2btn' }, advance: { trigger: 'host' } };
      case 'loop': return { id: uid('stage'), name: '循環', type: 'loop', enabled: true,
        maxIterations: 3, children: [] };
      case 'goto': return { id: uid('stage'), name: '跳轉', type: 'goto', enabled: true, target: '' };
      case 'result': return { id: uid('stage'), name: '結算', type: 'result', enabled: true,
        advance: { trigger: 'host' } };
      default: return { id: uid('stage'), name: '新階段', type: 'card_play', enabled: true,
        advance: { trigger: 'host' } };
    }
  }

  function openStageWizard() {
    document.getElementById('wizardGrid').innerHTML = WIZARD_INTENTS.map(w => `
      <div class="wizard-card" onclick="wizardCreate('${w.key}')">
        <div class="wi">${w.icon}</div><div class="wt">${w.title}</div><div class="wd">${w.desc}</div>
      </div>`).join('');
    document.getElementById('stageWizard').classList.remove('hidden');
  }

  function closeStageWizard() {
    document.getElementById('stageWizard').classList.add('hidden');
  }

  function wizardCreate(key) {
    closeStageWizard();
    pushHistory();
    manifest.stages = manifest.stages || [];
    manifest.stages.push(wizardBuildStage(key));
    renderStagesTab();
    afterChange(true);
    const si = manifest.stages.length - 1;
    requestAnimationFrame(() => {
      const row = document.getElementById('stage_row_' + si);
      if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('stage-flash'); }
    });
  }

  function addStage() { wizardCreate('blank'); }
  function deleteStage(si) {
    if (!confirm(`刪除階段「${manifest.stages[si].name}」？`)) return;
    pushHistory();
    manifest.stages.splice(si, 1);
    renderStagesTab();
    afterChange(true);
  }

  // ── Shared helper: render a loop condition block (entry or exit) ──
  // prefix: used to name setter functions, e.g. 'Loop' → setLoopCondProp / 'ChildLoop' → setChildLoopCondProp
  function renderLoopCondBlock(cond, hasCondition, { toggleFn, typeFn, opFn, valFn, teamFn, checkFn }, showCheckAfter) {
    const condType  = cond.type     || 'alivePlayers';
    const condOp    = cond.operator || 'lte';
    const condVal   = cond.value    ?? 1;
    const condCheck = cond.checkAfter || 'each_iteration';

    const COND_TYPES = [
      { value: 'alivePlayers', label: '存活玩家數' },
      { value: 'teamPlayers',  label: '特定陣營玩家數' },
      { value: 'globalParam',  label: '全局參數值' },
      { value: 'iterations',   label: '已執行次數' },
    ];
    const typeOpts = COND_TYPES.map(t =>
      `<option value="${t.value}" ${condType===t.value?'selected':''}>${t.label}</option>`).join('');
    const opOpts = LOOP_OPERATORS.map(o =>
      `<option value="${o.value}" ${condOp===o.value?'selected':''}>${o.label}</option>`).join('');

    return `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <label class="toggle-switch">
          <input type="checkbox" ${hasCondition?'checked':''} onchange="${toggleFn}">
          <span class="toggle-slider"></span>
        </label>
        <span style="font-size:.75rem;color:#9988bb;">啟用條件</span>
        ${!hasCondition ? '<span style="font-size:.7rem;color:#665577;margin-left:4px;">（未啟用）</span>' : ''}
      </div>
      ${hasCondition ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 60px${showCheckAfter?' 1fr':''};gap:6px;margin-top:2px;">
        <div class="field-row" style="margin:0">
          <label class="field-label">條件類型</label>
          <select class="field-input" onchange="${typeFn}">${typeOpts}</select>
        </div>
        <div class="field-row" style="margin:0">
          <label class="field-label">運算子</label>
          <select class="field-input" onchange="${opFn}">${opOpts}</select>
        </div>
        <div class="field-row" style="margin:0">
          <label class="field-label">值</label>
          <input class="field-input" type="number" min="0" value="${condVal}" oninput="${valFn}">
        </div>
        ${showCheckAfter ? `
        <div class="field-row" style="margin:0">
          <label class="field-label">檢查時機</label>
          <select class="field-input" onchange="${checkFn}">
            <option value="each_stage"     ${condCheck==='each_stage'?'selected':''}>每子階段後</option>
            <option value="each_iteration" ${condCheck==='each_iteration'?'selected':''}>每完整循環後</option>
          </select>
        </div>` : ''}
      </div>
      ${condType === 'teamPlayers' ? `
      <div class="field-row" style="margin-top:8px;margin-bottom:0">
        <label class="field-label">陣營名稱</label>
        <input class="field-input" placeholder="例如：wolf" value="${escapeH(cond.team||'')}" oninput="${teamFn}">
      </div>` : ''}
      ${condType === 'globalParam' ? `
      <div class="field-row" style="margin-top:8px;margin-bottom:0">
        <label class="field-label">參數 ID (paramId)</label>
        <input class="field-input" style="font-family:monospace" placeholder="globalParam 的 id"
               value="${escapeH(cond.paramId||'')}" oninput="${teamFn.replace('team', 'paramId')}">
      </div>` : ''}
      ` : ''}`;
  }

  // ── Loop Block ────────────────────────────────────────────────
  function renderLoopBlock(si, stage) {
    const loopType = stage.loopType || 'fixed';
    const ec  = stage.exitCondition  || {};
    const enc = stage.entryCondition || {};
    const hasExit  = !!stage.exitCondition;
    const hasEntry = !!stage.entryCondition;

    return `<div class="loop-block">
      <div class="loop-block-title">🔁 循環設定</div>

      <div class="loop-cfg-grid">
        <div class="field-row" style="margin:0">
          <label class="field-label">循環模式</label>
          <select class="field-input" onchange="setLoopProp(${si},'loopType',this.value)">
            <option value="fixed"    ${loopType==='fixed'?'selected':''}>固定次數</option>
            <option value="infinite" ${loopType==='infinite'?'selected':''}>無限循環</option>
          </select>
        </div>
        ${loopType === 'fixed' ? `
        <div class="field-row" style="margin:0">
          <label class="field-label">最大循環次數</label>
          <input class="field-input" type="number" min="1" max="99"
                 value="${stage.maxIterations ?? 3}"
                 oninput="setLoopProp(${si},'maxIterations',Number(this.value))">
        </div>` : '<div></div>'}
      </div>

      <div class="loop-exit-block" style="margin-top:10px;">
        <div class="loop-exit-title">🔑 進入條件（選填）</div>
        <div class="help-text" style="margin-bottom:8px">不滿足條件時直接跳過整個循環。不設定則永遠進入。</div>
        ${renderLoopCondBlock(enc, hasEntry, {
          toggleFn: `toggleLoopEntryCondition(${si},this.checked)`,
          typeFn:   `setLoopEntryCond(${si},'type',this.value)`,
          opFn:     `setLoopEntryCond(${si},'operator',this.value)`,
          valFn:    `setLoopEntryCond(${si},'value',Number(this.value))`,
          teamFn:   `setLoopEntryCond(${si},'team',this.value)`,
          checkFn:  ''
        }, false)}
      </div>

      <div class="loop-exit-block">
        <div class="loop-exit-title">🚪 逃脫條件（選填）</div>
        <div class="help-text" style="margin-bottom:8px">滿足條件時提前結束循環。不設定則跑完所有次數後自然結束。</div>
        ${renderLoopCondBlock(ec, hasExit, {
          toggleFn: `toggleLoopExitCondition(${si},this.checked)`,
          typeFn:   `setLoopCondProp(${si},'type',this.value)`,
          opFn:     `setLoopCondProp(${si},'operator',this.value)`,
          valFn:    `setLoopCondProp(${si},'value',Number(this.value))`,
          teamFn:   `setLoopCondProp(${si},'team',this.value)`,
          checkFn:  `setLoopCondProp(${si},'checkAfter',this.value)`
        }, true)}
      </div>

      ${renderChildStages(si, stage)}
    </div>`;
  }

  // ── Goto block ────────────────────────────────────────────────
  // context: 'top' (si), 'child' (si,ci), 'gc' (si, parentCi=ci, gi=extraIdx)
  function renderGotoBlock(si, stage, context, ci, extraIdx) {
    const cond = stage.condition || {};
    const hasCond = !!stage.condition;
    const condType = cond.type || 'alivePlayers';
    const condParamId = cond.paramId || '';
    const condOp = cond.operator || 'lte';
    const condVal = cond.value ?? 1;
    const team = cond.team || '';

    let setTargetFn, toggleCondFn, typeHandler, opHandler, valHandler, paramIdHandler, teamHandler;
    if (context === 'top') {
      setTargetFn    = `setStageProp(${si},'target',this.value)`;
      toggleCondFn   = `toggleStageGotoCondition(${si},this.checked)`;
      typeHandler    = `setStageGotoProp(${si},'type',this.value)`;
      opHandler      = `setStageGotoProp(${si},'operator',this.value)`;
      valHandler     = `setStageGotoProp(${si},'value',Number(this.value))`;
      paramIdHandler = `setStageGotoProp(${si},'paramId',this.value)`;
      teamHandler    = `setStageGotoProp(${si},'team',this.value)`;
    } else if (context === 'child') {
      setTargetFn    = `setChildStageProp(${si},${ci},'target',this.value)`;
      toggleCondFn   = `toggleChildGotoCondition(${si},${ci},this.checked)`;
      typeHandler    = `setChildGotoProp(${si},${ci},'type',this.value)`;
      opHandler      = `setChildGotoProp(${si},${ci},'operator',this.value)`;
      valHandler     = `setChildGotoProp(${si},${ci},'value',Number(this.value))`;
      paramIdHandler = `setChildGotoProp(${si},${ci},'paramId',this.value)`;
      teamHandler    = `setChildGotoProp(${si},${ci},'team',this.value)`;
    } else { // 'gc': ci=parentChildIdx, extraIdx=grandChildIdx
      setTargetFn    = `setGrandChildStageProp(${si},${ci},${extraIdx},'target',this.value)`;
      toggleCondFn   = `toggleGcGotoCondition(${si},${ci},${extraIdx},this.checked)`;
      typeHandler    = `setGcGotoProp(${si},${ci},${extraIdx},'type',this.value)`;
      opHandler      = `setGcGotoProp(${si},${ci},${extraIdx},'operator',this.value)`;
      valHandler     = `setGcGotoProp(${si},${ci},${extraIdx},'value',Number(this.value))`;
      paramIdHandler = `setGcGotoProp(${si},${ci},${extraIdx},'paramId',this.value)`;
      teamHandler    = `setGcGotoProp(${si},${ci},${extraIdx},'team',this.value)`;
    }

    return `<div style="margin-top:10px;background:#090818;border:1px solid #2a4060;border-radius:8px;padding:12px 14px;">
      <div style="font-size:.78rem;color:#88aaee;font-weight:700;margin-bottom:10px;">🚀 跳轉設定</div>
      <div class="field-row" style="margin-bottom:10px">
        <label class="field-label">目標階段 ID（必填）</label>
        <input class="field-input" style="font-family:monospace" placeholder="輸入要跳轉的 stage id"
               value="${escapeH(stage.target||'')}" oninput="${setTargetFn}">
        <div class="help-text" style="margin-top:4px">可跳至同一 loop 的子階段、或外層任何階段</div>
      </div>
      <details ${hasCond ? 'open' : ''}>
        <summary style="cursor:pointer;font-size:.74rem;color:#6688bb;padding:4px 0;list-style:none;display:flex;align-items:center;gap:4px;">
          🔀 跳轉條件（選填）
          ${!hasCond ? '<span style="color:#445566;margin-left:4px;">— 不啟用，則無條件跳轉</span>' : ''}
          <span style="margin-left:auto;">▼</span>
        </summary>
        <div style="margin-top:10px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <label class="toggle-switch">
              <input type="checkbox" ${hasCond?'checked':''} onchange="${toggleCondFn}">
              <span class="toggle-slider"></span>
            </label>
            <span style="font-size:.75rem;color:#9988bb;">啟用條件（不啟用 = 無條件跳轉）</span>
          </div>
          ${hasCond ? `
          <div style="display:grid;grid-template-columns:1fr 1fr 60px;gap:8px;">
            <div class="field-row" style="margin:0">
              <label class="field-label">條件類型</label>
              <select class="field-input" onchange="${typeHandler}">${condTypeOpts}</select>
            </div>
            <div class="field-row" style="margin:0">
              <label class="field-label">運算子</label>
              <select class="field-input" onchange="${opHandler}">${condOpOpts}</select>
            </div>
            <div class="field-row" style="margin:0">
              <label class="field-label">值</label>
              <input class="field-input" type="number" value="${condVal}" oninput="${valHandler}">
            </div>
          </div>
          ${condType === 'globalParam' ? `
          <div class="field-row" style="margin-top:8px;margin-bottom:0">
            <label class="field-label">參數 ID (paramId)</label>
            <input class="field-input" style="font-family:monospace" placeholder="globalParam 的 id"
                   value="${escapeH(condParamId)}" oninput="${paramIdHandler}">
          </div>` : ''}
          ${condType === 'teamPlayers' ? `
          <div class="field-row" style="margin-top:8px;margin-bottom:0">
            <label class="field-label">陣營名稱</label>
            <input class="field-input" placeholder="例如：wolf" value="${escapeH(team)}"
                   oninput="${teamHandler}">
          </div>` : ''}
          ` : ''}
        </div>
      </details>
    </div>`;
  }

  function renderChildStages(si, stage) {
    const children = (stage.children || stage.stages || []);
    const decks = manifest.decks || [];
    const deckOptsFor = (selId) => decks.map(d =>
      `<option value="${escapeH(d.id)}" ${d.id===selId?'selected':''}>${escapeH(d.name)} (${escapeH(d.id)})</option>`
    ).join('');

    const rows = children.map((cs, ci) => `
      <div class="child-stage-row ${cs.enabled ? '' : 'disabled'}" id="child_row_${si}_${ci}">
        <div class="sr-head">
          <div class="stage-order-btns">
            <button onclick="moveChildStage(${si},${ci},-1)" ${ci===0?'disabled':''}>▲</button>
            <button onclick="moveChildStage(${si},${ci}, 1)" ${ci===children.length-1?'disabled':''}>▼</button>
          </div>
          <input class="field-input" style="flex:1" placeholder="子階段名稱"
                 value="${escapeH(cs.name||'')}" oninput="setChildStageProp(${si},${ci},'name',this.value)">
          <label class="toggle-switch">
            <input type="checkbox" ${cs.enabled ? 'checked' : ''}
                   onchange="setChildStageProp(${si},${ci},'enabled',this.checked)">
            <span class="toggle-slider"></span>
          </label>
          <button class="ci-del" onclick="deleteChildStage(${si},${ci})">✕</button>
        </div>
        <div class="child-stage-grid">
          <div class="field-row" style="margin:0">
            <label class="field-label">階段類型</label>
            <select class="field-input" onchange="setChildStageProp(${si},${ci},'type',this.value)">
              ${getStageTypes().map(st =>
                `<option value="${st.value}" ${cs.type===st.value?'selected':''}>${st.label}</option>`).join('')}
            </select>
          </div>
          ${cs.type !== 'loop' && cs.type !== 'goto' ? `
          <div class="field-row" style="margin:0">
            <label class="field-label">使用牌組 (deckId)</label>
            <select class="field-input" onchange="setChildStageProp(${si},${ci},'deckId',this.value||undefined)">
              <option value="" ${!cs.deckId?'selected':''}>— 不使用 —</option>
              ${deckOptsFor(cs.deckId)}
            </select>
          </div>` : '<div></div>'}
          <div class="field-row" style="margin:0">
            <label class="field-label">子階段 ID</label>
            <input class="field-input" value="${escapeH(cs.id||'')}" style="font-family:monospace;font-size:.78rem"
                   oninput="setChildStageProp(${si},${ci},'id',this.value)">
          </div>
          ${cs.type === 'intermission' ? `
          <div class="field-row" style="margin:0;grid-column:1/-1;">
            <label class="field-label">暫停說明</label>
            <input class="field-input" placeholder="例如：休息一下、準備下一階段等"
                   value="${escapeH(cs.description||'')}"
                   oninput="setChildStageProp(${si},${ci},'description',this.value)">
          </div>
          ` : ''}
        </div>
        ${cs.type === 'vote' ? renderVoteConfigBlock(cs, `${si},${ci}`, null) : ''}
        ${cs.type !== 'loop' && cs.type !== 'goto' ? renderChildAdvanceBlock(si, ci, cs) : ''}
        ${cs.type === 'goto' ? renderGotoBlock(si, cs, 'child', ci) : ''}
        ${cs.type === 'loop' ? renderChildLoopBlock(si, ci, cs) : ''}
      </div>`).join('');

    return `<div class="child-stages-wrap">
      <div class="child-stages-title">📋 子階段（每次循環依序執行）</div>
      ${rows || '<div style="color:#665577;font-size:.78rem;margin-bottom:6px;">尚無子階段</div>'}
      <button class="add-card-btn" style="margin-left:12px" onclick="addChildStage(${si})">+ 新增子階段</button>
    </div>`;
  }

  function renderChildAdvanceBlock(si, ci, cs) {
    const adv = cs.advance || {};
    const showDuration = adv.trigger?.includes('timer') || adv.trigger === 'timer';
    const stageType = cs.type || 'card_play';
    let triggers = ADVANCE_TRIGGERS.filter(t => {
      const typeMatch = t.types.includes('all') || t.types.includes(stageType);
      return typeMatch && t.category === 'stage_advance';
    });
    const seen = new Set();
    triggers = triggers.filter(t => { if (seen.has(t.value)) return false; seen.add(t.value); return true; });

    return `<div style="background:#0a0a18;border:1px solid #1a1a3a;border-radius:6px;padding:8px 10px;margin-top:8px;">
      <div style="font-size:.72rem;color:#8888bb;margin-bottom:6px;">${typeof t==='function'?t('advance.label'):'階段結束時推進'}</div>
      <div class="stage-grid-2">
        <div class="field-row" style="margin:0">
          <label class="field-label">${typeof t==='function'?t('advance.label'):'推進條件'}</label>
          <select class="field-input" onchange="setChildAdvKey(${si},${ci},'trigger',this.value)">
            ${triggers.map(tr => `<option value="${tr.value}" ${(adv.trigger||'host')===tr.value?'selected':''}>${getTriggerLabel(tr.value)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row" style="margin:0;${showDuration?'':'visibility:hidden;'}">
          <label class="field-label">${typeof t==='function'?t('advance.duration'):'秒數'}</label>
          <input class="field-input" type="number" min="0" max="600"
                 value="${adv.duration ?? ''}"
                 oninput="setChildAdvKey(${si},${ci},'duration',this.value===''?null:Number(this.value))">
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:.78rem;color:#aaaacc;margin-top:6px;">
        <input type="checkbox" ${adv.fallback === 'host' ? 'checked' : ''}
               onchange="setChildAdvKey(${si},${ci},'fallback',this.checked ? 'host' : null)">
        ${typeof t==='function'?t('advance.fallback'):'Host 仍可強制推進（fallback）'}
      </label>
    </div>`;
  }

  // Helper: get mutable children array, migrating from legacy 'stages' key if needed.
  function _childArr(stage) {
    if (!stage.children && stage.stages) {
      stage.children = stage.stages;
      delete stage.stages;
    }
    if (!stage.children) stage.children = [];
    return stage.children;
  }

  function setChildVoteConfigProp(si, ci, key, val) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    cs.voteConfig = cs.voteConfig || {};
    cs.voteConfig[key] = val;
    // Re-render to toggle teamName field visibility when optionSource or voterFilter changes
    if (key === 'optionSource' || key === 'voterFilter') {
      renderStagesTab();
    }
    afterChange(true);
  }

  function setLoopProp(si, key, val) {
    pushHistory();
    manifest.stages[si][key] = val;
    renderStagesTab();
    afterChange(true);
  }

  function setLoopEntryCond(si, key, val) {
    pushHistory();
    const stage = manifest.stages[si];
    stage.entryCondition = stage.entryCondition || { type: 'alivePlayers', operator: 'gt', value: 0 };
    stage.entryCondition[key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function toggleLoopEntryCondition(si, enabled) {
    pushHistory();
    const stage = manifest.stages[si];
    if (enabled) { stage.entryCondition = { type: 'alivePlayers', operator: 'gt', value: 0 }; }
    else { delete stage.entryCondition; }
    renderStagesTab();
    afterChange(true);
  }

  function setLoopCondProp(si, key, val) {
    pushHistory();
    const stage = manifest.stages[si];
    stage.exitCondition = stage.exitCondition || { type: 'alivePlayers', operator: 'lte', value: 1, checkAfter: 'each_iteration' };
    stage.exitCondition[key] = val;
    if (key === 'type') renderStagesTab();
    renderStagesTab();
    afterChange(true);
  }

  function toggleLoopExitCondition(si, enabled) {
    pushHistory();
    const stage = manifest.stages[si];
    if (enabled) {
      stage.exitCondition = { type: 'alivePlayers', operator: 'lte', value: 1, checkAfter: 'each_iteration' };
    } else {
      delete stage.exitCondition;
    }
    renderStagesTab();
    afterChange(true);
  }

  function setChildStageProp(si, ci, key, val) {
    pushHistory();
    const arr = _childArr(manifest.stages[si]);
    if (key === 'enabled') {
      document.getElementById(`child_row_${si}_${ci}`)?.classList.toggle('disabled', !val);
    }
    arr[ci][key] = val;
    // 當子階段類型改為 vote 時，初始化 voteConfig 和 advance
    if (key === 'type' && val === 'vote') {
      const cs = arr[ci];
      cs.voteConfig = cs.voteConfig || {
        countdownSeconds: 30, anonymous: false,
        allowSelfVote: true, endWhenAllVoted: true
      };
      cs.advance = cs.advance || { trigger: 'host' };
    }
    // 當子階段類型改為 goto 時，清除 advance
    if (key === 'type' && val === 'goto') {
      delete arr[ci].advance;
    }
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function setChildAdvKey(si, ci, prop, val) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    cs.advance = cs.advance || {};
    if (val === null || val === '') delete cs.advance[prop];
    else                            cs.advance[prop] = val;
    renderStagesTab();
    afterChange(true);
  }

  // ── Goto setters (top-level stage) ───────────────────────────
  function setStageGotoProp(si, key, val) {
    pushHistory();
    const stage = manifest.stages[si];
    stage.condition = stage.condition || { type: 'alivePlayers', operator: 'lte', value: 1 };
    stage.condition[key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function toggleStageGotoCondition(si, enabled) {
    pushHistory();
    if (enabled) {
      manifest.stages[si].condition = { type: 'alivePlayers', operator: 'lte', value: 1 };
    } else {
      delete manifest.stages[si].condition;
    }
    renderStagesTab();
    afterChange(true);
  }

  // ── Goto setters (child stage) ────────────────────────────────
  function setChildGotoProp(si, ci, key, val) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    cs.condition = cs.condition || { type: 'alivePlayers', operator: 'lte', value: 1 };
    cs.condition[key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function toggleChildGotoCondition(si, ci, enabled) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    if (enabled) {
      cs.condition = { type: 'alivePlayers', operator: 'lte', value: 1 };
    } else {
      delete cs.condition;
    }
    renderStagesTab();
    afterChange(true);
  }

  function addChildStage(si) {
    pushHistory();
    const arr = _childArr(manifest.stages[si]);
    arr.push({ id: uid('cs'), name: '新子階段', type: 'card_play', enabled: true, advance: { trigger: 'host' } });
    renderStagesTab();
    afterChange(true);
  }

  function deleteChildStage(si, ci) {
    const arr = _childArr(manifest.stages[si]);
    if (!confirm(`刪除子階段「${arr[ci].name}」？`)) return;
    pushHistory();
    arr.splice(ci, 1);
    renderStagesTab();
    afterChange(true);
  }

  function moveChildStage(si, ci, dir) {
    const arr = _childArr(manifest.stages[si]);
    const ni = ci + dir;
    if (ni < 0 || ni >= arr.length) return;
    pushHistory();
    [arr[ci], arr[ni]] = [arr[ni], arr[ci]];
    renderStagesTab();
    afterChange(true);
  }

  // Render a nested loop block for child stages (simplified — no further nesting UI)
  function renderChildLoopBlock(si, ci, cs) {
    const loopType = cs.loopType || 'fixed';
    const ec  = cs.exitCondition  || {};
    const enc = cs.entryCondition || {};
    const hasExit  = !!cs.exitCondition;
    const hasEntry = !!cs.entryCondition;

    const grandchildren = (cs.children || cs.stages || []);
    const gcRows = grandchildren.map((gc, gi) => `
      <div class="child-stage-row ${gc.enabled?'':'disabled'}" style="margin-left:24px;border-left-color:#4433aa;" id="gc_row_${si}_${ci}_${gi}">
        <div class="sr-head">
          <div class="stage-order-btns">
            <button onclick="moveGrandChildStage(${si},${ci},${gi},-1)" ${gi===0?'disabled':''}>▲</button>
            <button onclick="moveGrandChildStage(${si},${ci},${gi}, 1)" ${gi===grandchildren.length-1?'disabled':''}>▼</button>
          </div>
          <input class="field-input" style="flex:1" placeholder="子子階段名稱"
                 value="${escapeH(gc.name||'')}" oninput="setGrandChildStageProp(${si},${ci},${gi},'name',this.value)">
          <label class="toggle-switch">
            <input type="checkbox" ${gc.enabled?'checked':''}
                   onchange="setGrandChildStageProp(${si},${ci},${gi},'enabled',this.checked)">
            <span class="toggle-slider"></span>
          </label>
          <button class="ci-del" onclick="deleteGrandChildStage(${si},${ci},${gi})">✕</button>
        </div>
        <div class="child-stage-grid">
          <div class="field-row" style="margin:0">
            <label class="field-label">類型</label>
            <select class="field-input" onchange="setGrandChildStageProp(${si},${ci},${gi},'type',this.value)">
              ${getStageTypes().filter(st=>st.value!=='loop').map(st=>
                `<option value="${st.value}" ${gc.type===st.value?'selected':''}>${st.label}</option>`).join('')}
            </select>
          </div>
          <div></div>
          <div class="field-row" style="margin:0">
            <label class="field-label">ID</label>
            <input class="field-input" value="${escapeH(gc.id||'')}" style="font-family:monospace;font-size:.78rem"
                   oninput="setGrandChildStageProp(${si},${ci},${gi},'id',this.value)">
          </div>
        </div>
        ${gc.type !== 'goto' ? renderGcAdvanceBlock(si, ci, gi, gc) : ''}
        ${gc.type === 'goto' ? renderGotoBlock(si, gc, 'gc', ci, gi) : ''}
      </div>`).join('');

    return `<div class="loop-block">
