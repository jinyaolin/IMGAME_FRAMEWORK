      <div class="loop-block-title">🔁 嵌套循環設定</div>
      <div class="loop-cfg-grid">
        <div class="field-row" style="margin:0">
          <label class="field-label">循環模式</label>
          <select class="field-input" onchange="setChildLoopProp(${si},${ci},'loopType',this.value)">
            <option value="fixed"    ${loopType==='fixed'?'selected':''}>固定次數</option>
            <option value="infinite" ${loopType==='infinite'?'selected':''}>無限循環</option>
          </select>
        </div>
        ${loopType === 'fixed' ? `
        <div class="field-row" style="margin:0">
          <label class="field-label">最大循環次數</label>
          <input class="field-input" type="number" min="1" max="99"
                 value="${cs.maxIterations ?? 3}"
                 oninput="setChildLoopProp(${si},${ci},'maxIterations',Number(this.value))">
        </div>` : '<div></div>'}
      </div>
      <div class="loop-exit-block" style="margin-top:10px;">
        <div class="loop-exit-title">🔑 進入條件（選填）</div>
        <div class="help-text" style="margin-bottom:8px">不滿足條件時直接跳過整個循環。</div>
        ${renderLoopCondBlock(enc, hasEntry, {
          toggleFn: `toggleChildLoopEntryCondition(${si},${ci},this.checked)`,
          typeFn:   `setChildLoopEntryCond(${si},${ci},'type',this.value)`,
          opFn:     `setChildLoopEntryCond(${si},${ci},'operator',this.value)`,
          valFn:    `setChildLoopEntryCond(${si},${ci},'value',Number(this.value))`,
          teamFn:   `setChildLoopEntryCond(${si},${ci},'team',this.value)`,
          checkFn:  ''
        }, false)}
      </div>
      <div class="loop-exit-block">
        <div class="loop-exit-title">🚪 逃脫條件（選填）</div>
        <div class="help-text" style="margin-bottom:8px">滿足條件時提前結束循環。</div>
        ${renderLoopCondBlock(ec, hasExit, {
          toggleFn: `toggleChildLoopExitCondition(${si},${ci},this.checked)`,
          typeFn:   `setChildLoopCondProp(${si},${ci},'type',this.value)`,
          opFn:     `setChildLoopCondProp(${si},${ci},'operator',this.value)`,
          valFn:    `setChildLoopCondProp(${si},${ci},'value',Number(this.value))`,
          teamFn:   `setChildLoopCondProp(${si},${ci},'team',this.value)`,
          checkFn:  `setChildLoopCondProp(${si},${ci},'checkAfter',this.value)`
        }, true)}
      </div>
      <div class="child-stages-wrap" style="margin-top:10px;">
        <div class="child-stages-title">📋 孫子階段</div>
        ${gcRows || '<div style="color:#665577;font-size:.78rem;margin-bottom:6px;">尚無孫子階段</div>'}
        <button class="add-card-btn" style="margin-left:24px" onclick="addGrandChildStage(${si},${ci})">+ 新增孫子階段</button>
      </div>
    </div>`;
  }

  // Grandchild advance block (simplified)
  function renderGcAdvanceBlock(si, ci, gi, gc) {
    const adv = gc.advance || {};
    const stageType = gc.type || 'card_play';
    let triggers = ADVANCE_TRIGGERS.filter(t => {
      const typeMatch = t.types.includes('all') || t.types.includes(stageType);
      return typeMatch && t.category === 'stage_advance';
    });
    const seen = new Set();
    triggers = triggers.filter(t => { if(seen.has(t.value)) return false; seen.add(t.value); return true; });
    const triggerOpts = triggers.map(t =>
      `<option value="${t.value}" ${adv.trigger===t.value?'selected':''}>${getTriggerLabel(t.value)}</option>`).join('');
    return `<div style="background:#0a0a18;border:1px solid #1a1a3a;border-radius:6px;padding:8px 10px;margin-top:8px;">
      <div style="font-size:.72rem;color:#8888bb;margin-bottom:6px;">推進條件</div>
      <select class="field-input" onchange="setGcAdvKey(${si},${ci},${gi},'trigger',this.value)">${triggerOpts}</select>
    </div>`;
  }

  // Grandchild setters
  function setChildLoopProp(si, ci, key, val) {
    pushHistory();
    _childArr(manifest.stages[si])[ci][key] = val;
    renderStagesTab();
    afterChange(true);
  }

  function setChildLoopEntryCond(si, ci, key, val) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    cs.entryCondition = cs.entryCondition || { type: 'alivePlayers', operator: 'gt', value: 0 };
    cs.entryCondition[key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function toggleChildLoopEntryCondition(si, ci, enabled) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    if (enabled) { cs.entryCondition = { type: 'alivePlayers', operator: 'gt', value: 0 }; }
    else { delete cs.entryCondition; }
    renderStagesTab();
    afterChange(true);
  }

  function setChildLoopCondProp(si, ci, key, val) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    cs.exitCondition = cs.exitCondition || { type: 'alivePlayers', operator: 'lte', value: 1, checkAfter: 'each_iteration' };
    cs.exitCondition[key] = val;
    if (key === 'type') renderStagesTab();
    renderStagesTab();
    afterChange(true);
  }

  function toggleChildLoopExitCondition(si, ci, enabled) {
    pushHistory();
    const cs = _childArr(manifest.stages[si])[ci];
    if (enabled) {
      cs.exitCondition = { type: 'alivePlayers', operator: 'lte', value: 1, checkAfter: 'each_iteration' };
    } else {
      delete cs.exitCondition;
    }
    renderStagesTab();
    afterChange(true);
  }

  function _gcArr(si, ci) {
    const cs = _childArr(manifest.stages[si])[ci];
    if (!cs.children && cs.stages) { cs.children = cs.stages; delete cs.stages; }
    if (!cs.children) cs.children = [];
    return cs.children;
  }

  function setGrandChildStageProp(si, ci, gi, key, val) {
    pushHistory();
    _gcArr(si, ci)[gi][key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function setGcAdvKey(si, ci, gi, prop, val) {
    pushHistory();
    const gc = _gcArr(si, ci)[gi];
    gc.advance = gc.advance || {};
    if (val === null || val === '') delete gc.advance[prop];
    else gc.advance[prop] = val;
    afterChange(true);
  }

  function addGrandChildStage(si, ci) {
    pushHistory();
    _gcArr(si, ci).push({ id: uid('gc'), name: '新孫子階段', type: 'card_play', enabled: true, advance: { trigger: 'host' } });
    renderStagesTab();
    afterChange(true);
  }

  function deleteGrandChildStage(si, ci, gi) {
    const arr = _gcArr(si, ci);
    if (!confirm(`刪除「${arr[gi].name}」？`)) return;
    pushHistory();
    arr.splice(gi, 1);
    renderStagesTab();
    afterChange(true);
  }

  function moveGrandChildStage(si, ci, gi, dir) {
    const arr = _gcArr(si, ci);
    const ni = gi + dir;
    if (ni < 0 || ni >= arr.length) return;
    pushHistory();
    [arr[gi], arr[ni]] = [arr[ni], arr[gi]];
    renderStagesTab();
    afterChange(true);
  }

  // ── Gc goto setters ───────────────────────────────────────────
  function setGcGotoProp(si, ci, gi, key, val) {
    pushHistory();
    const gc = _gcArr(si, ci)[gi];
    gc.condition = gc.condition || { type: 'alivePlayers', operator: 'lte', value: 1 };
    gc.condition[key] = val;
    if (key === 'type') renderStagesTab();
    afterChange(true);
  }

  function toggleGcGotoCondition(si, ci, gi, enabled) {
    pushHistory();
    const gc = _gcArr(si, ci)[gi];
    if (enabled) { gc.condition = { type: 'alivePlayers', operator: 'lte', value: 1 }; }
    else { delete gc.condition; }
    renderStagesTab();
    afterChange(true);
  }

  // ═══════════════════════════════════════════════════════════════
  //  TAB: ADVANCED — fieldConfig schema editor + raw JSON + server.js
  // ═══════════════════════════════════════════════════════════════
  function renderAdvancedTab() {
    const el = document.getElementById('cfgAdvanced');
    if (rawMode) {
      el.innerHTML = `
        <div class="raw-bar">
          <button class="btn btn-ghost btn-sm" onclick="rawMode=false;renderAdvancedTab();">← 退出 Raw 模式</button>
          <button class="btn btn-primary btn-sm" onclick="applyRawJson()">套用變更</button>
          <span class="help-text" style="margin-left:auto">直接編輯 JSON。按「套用」會解析並合併。</span>
        </div>
        <textarea class="field-input" id="rawJson"
          spellcheck="false">${escapeH(JSON.stringify(manifest, null, 2))}</textarea>
      `;
      return;
    }

    const fc = manifest.fieldConfig || {};
    el.innerHTML = `
      <div class="section-title">FIELDCONFIG SCHEMA（可調參數定義）</div>
      <div class="help-text" style="margin-bottom:10px">
        每個條目對應「基本參數」分頁裡的一個欄位。改了這裡就能新增遊戲可調參數。<br>
        <code style="background:#0a0a1a;padding:1px 4px;border-radius:3px;">key</code> 是程式內部使用的識別字（英數＋底線），<code style="background:#0a0a1a;padding:1px 4px;border-radius:3px;">label</code> 是顯示名稱。
      </div>
      ${Object.entries(fc).map(([key, def]) => renderFcRow(key, def)).join('')}
      <button class="add-card-btn" onclick="addFcField()">+ 新增可調參數</button>

      <div class="section-title">RAW JSON</div>
      <div class="help-text" style="margin-bottom:8px">直接編輯整個 manifest.json — 萬一 GUI 不夠用時的退路。</div>
      <button class="btn btn-ghost btn-sm" onclick="rawMode=true;renderAdvancedTab();">📝 進入 Raw JSON 編輯模式…</button>

      <div class="section-title" style="margin-top:20px;">SERVER.JS（自訂遊戲邏輯）</div>
      <div class="help-text" style="margin-bottom:8px">
        在此編輯模組的 server.js，繼承 BaseModule 來實現自訂遊戲邏輯。<br>
        若模組不需要自訂邏輯，可留空使用 BaseModule 預設行為。
      </div>
      <button class="btn btn-ghost btn-sm" onclick="toggleServerEdit()" id="serverEditBtn">
        ${serverCode ? '📝 編輯 server.js（已存在）' : '➕ 新增 server.js'}
      </button>
      <div id="serverEditArea" style="display:none;margin-top:12px;">
        <div class="raw-bar">
          <button class="btn btn-primary btn-sm" onclick="saveServerCode()">💾 儲存 server.js</button>
          <button class="btn-danger btn-sm" onclick="deleteServerCode()" ${serverCode ? '' : 'style="display:none;"'}>🗑️ 刪除 server.js</button>
          <span id="serverValidationMsg" class="help-text" style="margin-left:auto;"></span>
        </div>
        <textarea class="field-input" id="serverCode"
          spellcheck="false"
          style="font-family:Monaco,Menlo,'Ubuntu Mono',Consolas,monospace;font-size:13px;line-height:1.4;min-height:400px;"
          onchange="onServerCodeChange()"
          placeholder="// 範例：繼承 BaseModule 並實現自訂回調

const BaseModule = require('../../core/BaseModule');

class MyModule extends BaseModule {
  constructor(manifest, session, config) {
    super(manifest, session, config);
  }

  // 當玩家出牌時的回調
  async onCardPlayed(session, playerId, card) {
    console.log('Player played:', card);
  }

  // 當投票結束時的回調
  async onVoteEnded(session, results, voteConfig) {
    console.log('Vote ended:', results);
  }
}

module.exports = MyModule;">${escapeH(serverCode)}</textarea>
        <div class="help-text" style="margin-top:6px;font-size:.7rem;">
          💡 <strong>提示：</strong>
          <ul style="margin:4px 0 0 20px;padding-left:16px;">
            <li>必須繼承 <code>BaseModule</code></li>
            <li>可選擇實現回調方法（如 <code>onCardPlayed</code>、<code>onVoteEnded</code>）</li>
            <li>儲存時會自動檢查語法和繼承關係</li>
          </ul>
        </div>
      </div>
    `;
  }

  function renderFcRow(key, def) {
    const isSelect = def.type === 'select';
    return `<div class="fc-row" id="fc_${escapeH(key)}">
      <div class="fc-head">
        <input class="fc-key" placeholder="key" value="${escapeH(key)}"
               onchange="renameFcKey('${escapeH(key)}',this.value)">
        <input placeholder="label（顯示名稱）" value="${escapeH(def.label||'')}"
               oninput="setFcProp('${escapeH(key)}','label',this.value)">
        <button class="ci-del" onclick="deleteFcField('${escapeH(key)}')">✕</button>
      </div>
      <div class="fc-grid">
        <select onchange="setFcProp('${escapeH(key)}','type',this.value);renderAdvancedTab();">
          <option value="number" ${def.type==='number'?'selected':''}>數字</option>
          <option value="select" ${def.type==='select'?'selected':''}>選單</option>
        </select>
        <input placeholder="default" value="${escapeH(def.default ?? '')}"
               oninput="setFcDefault('${escapeH(key)}',this.value)">
        ${def.type === 'number' ? `
          <input placeholder="min" type="number" value="${def.min ?? ''}"
                 oninput="setFcProp('${escapeH(key)}','min',this.value===''?null:Number(this.value))">
          <input placeholder="max" type="number" value="${def.max ?? ''}"
                 oninput="setFcProp('${escapeH(key)}','max',this.value===''?null:Number(this.value))">
        ` : `<div></div><div></div>`}
      </div>
      ${isSelect ? `
        <div class="fc-options">
          <div style="margin-bottom:4px">選項：</div>
          ${(def.options||[]).map((o, oi) => `
            <div class="opt-row">
              <input placeholder="value" value="${escapeH(o.value||'')}" oninput="setFcOpt('${escapeH(key)}',${oi},'value',this.value)">
              <input placeholder="label" value="${escapeH(o.label||'')}" oninput="setFcOpt('${escapeH(key)}',${oi},'label',this.value)">
              <button class="ci-del" onclick="deleteFcOpt('${escapeH(key)}',${oi})">✕</button>
            </div>
          `).join('')}
          <button class="add-card-btn" onclick="addFcOpt('${escapeH(key)}')">+ 新增選項</button>
        </div>
      ` : ''}
    </div>`;
  }

  function setFcDefault(key, raw) {
    pushHistory();
    const def = manifest.fieldConfig[key];
    if (!def) return;
    def.default = def.type === 'select' ? raw : (raw === '' ? null : Number(raw));
    renderBasicTab();
    afterChange(true);
  }

  function setFcProp(key, prop, val) {
    pushHistory();
    if (!manifest.fieldConfig[key]) return;
    if (val === null) delete manifest.fieldConfig[key][prop];
    else              manifest.fieldConfig[key][prop] = val;
    // Re-render basic tab so the change is visible
    renderBasicTab();
    afterChange(true);
  }
  function renameFcKey(oldKey, newKey) {
    if (!newKey || newKey === oldKey) return;
    if (manifest.fieldConfig[newKey]) { toast('該 key 已存在', 'err'); renderAdvancedTab(); return; }
    pushHistory();
    const def = manifest.fieldConfig[oldKey];
    delete manifest.fieldConfig[oldKey];
    manifest.fieldConfig[newKey] = def;
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function deleteFcField(key) {
    if (!confirm(`刪除可調參數「${key}」？`)) return;
    pushHistory();
    delete manifest.fieldConfig[key];
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function addFcField() {
    pushHistory();
    manifest.fieldConfig = manifest.fieldConfig || {};
    let i = 1; while (manifest.fieldConfig['newField' + i]) i++;
    const key = 'newField' + i;
    manifest.fieldConfig[key] = { label: '新欄位', type: 'number', default: 1, min: 1, max: 10 };
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function setFcOpt(key, oi, prop, val) {
    pushHistory();
    manifest.fieldConfig[key].options[oi][prop] = val;
    afterChange(true);
  }

  // ─── Server.js 編輯功能 ───

  /**
   * 切換 server.js 編輯區域顯示
   */
  function toggleServerEdit() {
    const area = document.getElementById('serverEditArea');
    const btn = document.getElementById('serverEditBtn');
    if (area.style.display === 'none') {
      area.style.display = 'block';
      btn.innerHTML = '▲ 收起';
    } else {
      area.style.display = 'none';
      btn.innerHTML = serverCode ? '📝 編輯 server.js（已存在）' : '➕ 新增 server.js';
    }
  }

  /**
   * 儲存 server.js
   */
  async function saveServerCode() {
    const code = document.getElementById('serverCode').value;
    const validation = validateServerCode(code);
    const msgEl = document.getElementById('serverValidationMsg');

    if (!validation.valid) {
      msgEl.innerHTML = `<span style="color:#ff7777;">❌ ${validation.error}</span>`;
      return;
    }

    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/server`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: code
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err || '儲存失敗');
      }

      serverCode = code;
      originalServerCode = code;
      msgEl.innerHTML = `<span style="color:#66dd99;">✅ 已儲存</span>`;
      toast('✅ server.js 已儲存', 'ok');

      // 更新按鈕文字
      document.getElementById('serverEditBtn').innerHTML = '📝 編輯 server.js（已存在）';
      document.querySelector('#serverEditArea .btn-danger').style.display = '';

      // 3秒後清除訊息
      setTimeout(() => { msgEl.innerHTML = ''; }, 3000);
    } catch (err) {
      msgEl.innerHTML = `<span style="color:#ff7777;">❌ 儲存失敗：${err.message}</span>`;
      console.error('[Editor] Failed to save server.js:', err);
    }
  }

  /**
   * 刪除 server.js
   */
  async function deleteServerCode() {
    if (!confirm('確定要刪除 server.js 嗎？此操作無法復原。')) return;

    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/server`, {
        method: 'DELETE'
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err || '刪除失敗');
      }

      serverCode = '';
      originalServerCode = '';
      document.getElementById('serverCode').value = '';
      document.getElementById('serverEditBtn').innerHTML = '➕ 新增 server.js';
      document.querySelector('#serverEditArea .btn-danger').style.display = 'none';
      toast('✅ server.js 已刪除', 'ok');
    } catch (err) {
      toast('❌ 刪除失敗：' + err.message, 'err');
      console.error('[Editor] Failed to delete server.js:', err);
    }
  }

  /**
   * 驗證 server.js 代碼
   * @returns {Object} { valid: boolean, error: string }
   */
  function validateServerCode(code) {
    const errors = [];

    // 基本語法檢查（嘗試解析為 JavaScript）
    try {
      new Function(code);
    } catch (e) {
      errors.push(`JavaScript 語法錯誤：${e.message}`);
    }

    // 檢查是否繼承 BaseModule
    if (code.trim() && !code.includes('BaseModule')) {
      errors.push('server.js 必須繼承 BaseModule（使用 require("../../core/BaseModule")）');
    }

    // 檢查是否有 module.exports
    if (code.trim() && !code.includes('module.exports')) {
      errors.push('server.js 必須導出模組類（使用 module.exports YourClass）');
    }

    // 檢查類別命名（建議使用 XxxxModule 結尾）
    const classMatch = code.match(/class\s+(\w+)\s+extends/);
    if (classMatch && !classMatch[1].endsWith('Module')) {
      // 這只是警告，不算錯誤
      console.warn('[Editor] Class name should end with "Module":', classMatch[1]);
    }

    if (errors.length > 0) {
      return { valid: false, error: errors.join('; ') };
    }

    return { valid: true };
  }

  /**
   * 當 server.js 編輯區域內容變化時進行驗證
   */
  function onServerCodeChange() {
    const code = document.getElementById('serverCode').value;
    const validation = validateServerCode(code);
    const msgEl = document.getElementById('serverValidationMsg');

    if (code.trim() === '') {
      msgEl.innerHTML = '';
      return;
    }

    if (!validation.valid) {
      msgEl.innerHTML = `<span style="color:#ff7777;">⚠️ ${validation.error}</span>`;
    } else {
      msgEl.innerHTML = `<span style="color:#88ff88;">✓ 格式正確</span>`;
    }
  }
  function addFcOpt(key) {
    pushHistory();
    const def = manifest.fieldConfig[key];
    def.options = def.options || [];
    def.options.push({ value: 'opt' + (def.options.length+1), label: '新選項' });
    renderAdvancedTab();
    afterChange(true);
  }
  function deleteFcOpt(key, oi) {
    pushHistory();
    manifest.fieldConfig[key].options.splice(oi, 1);
    renderAdvancedTab();
    afterChange(true);
  }

  function applyRawJson() {
    const txt = document.getElementById('rawJson').value;
    try {
      const parsed = JSON.parse(txt);
      pushHistory();
      manifest = parsed;
      manifest.id = currentId;     // can't change id via raw edit
      rawMode = false;
      rerenderAll();
      afterChange(true);
      toast('已套用 raw JSON', 'ok');
    } catch (e) { toast('JSON 解析失敗：' + e.message, 'err'); }
  }

  // ═══════════════════════════════════════════════════════════════
  //  VALIDATION (client-side mirror of server validation)
  // ═══════════════════════════════════════════════════════════════
  let currentValidationErrors = [];

  function runValidation() {
    currentValidationErrors = validateManifest(manifest);
    const banner = document.getElementById('valBanner');
    if (!currentValidationErrors.length) { banner.classList.add('hidden'); return; }
    banner.classList.remove('hidden');
    document.getElementById('valList').innerHTML = currentValidationErrors.map(e =>
      `<li><code>${escapeH(e.path||'(top)')}</code>　${escapeH(e.msg)}</li>`
    ).join('');
  }

  function validateManifest(m) {
    const errs = [];
    const push = (path, msg) => errs.push({ path, msg });
    if (!m) return errs;
    if (!m.name || !String(m.name).trim()) push('name', '顯示名稱不可空白');
    const minP = Number(m.minPlayers), maxP = Number(m.maxPlayers);
    if (!Number.isFinite(minP) || minP < 1 || minP > 50) push('minPlayers', '最少人數需在 1–50');
    if (!Number.isFinite(maxP) || maxP < 1 || maxP > 50) push('maxPlayers', '最多人數需在 1–50');
    if (Number.isFinite(minP) && Number.isFinite(maxP) && minP > maxP) push('maxPlayers', '最多人數不可小於最少人數');

    if (m.fieldConfig) {
      Object.entries(m.fieldConfig).forEach(([k, def]) => {
        if (!def.label) push(`fieldConfig.${k}`, '欄位需要 label');
        if (!['number','select'].includes(def.type)) push(`fieldConfig.${k}`, 'type 只能是 number 或 select');
        if (def.type === 'select' && (!def.options || !def.options.length))
          push(`fieldConfig.${k}`, 'select 類型需至少一個選項');
      });
    }

    const deckIds = new Set();
    (m.decks || []).forEach((d, di) => {
      if (!d.id)                push(`decks[${di}]`,  '牌組需要 id');
      else if (deckIds.has(d.id)) push(`decks[${di}]`, `牌組 id 重複：${d.id}`);
      else deckIds.add(d.id);

      // For global deck references, name is auto-populated from global deck
      // Skip validation if it's a reference (the name will come from global deck)
      if (!d.name && !d.ref) push(`decks[${di}]`, '牌組需要名稱');

      // Skip cards validation for global deck references
      if (!d.ref && d.enabled !== false && (!d.cards || d.cards.length === 0))
        push(`decks[${di}]`, `啟用中的牌組「${d.name||d.id}」不可為空`);
      const cardIds = new Set();
      if (!d.ref) { // Only validate local cards
        (d.cards||[]).forEach((c, ci) => {
          if (!c.name || !String(c.name).trim()) push(`decks[${di}].cards[${ci}]`, '卡牌名稱不可空白');
          if (c.id && cardIds.has(c.id)) push(`decks[${di}].cards[${ci}]`, `卡牌 id 重複：${c.id}`);
          else if (c.id) cardIds.add(c.id);
        });
      }
    });

    const stages = m.stages || [];
    if (stages.filter(s => s.enabled).length === 0) push('stages', '至少需有一個啟用的階段');
    const enabledDeckIds = new Set((m.decks||[]).filter(d => d.enabled !== false).map(d => d.id));
    const validTriggers = ['host','all_played','all_confirmed','all_voted','all_submitted','all_ready',
                          'auto','timer','identity_timer','play_timer','generic_timer',
                          'auto_restart','restart_timer',
                          'host_reveal','auto_next','round_timer','vote_ended'];

    const validateStage = (s, si, pathPrefix) => {
      if (!s.id)   push(`${pathPrefix}[${si}]`, '階段需要 id');
      if (!s.name) push(`${pathPrefix}[${si}]`, '階段需要名稱');
      if (!s.type) push(`${pathPrefix}[${si}]`, '階段需要 type');

      // gameConfig：library 白名單 + gameCode 語法檢查（只編譯不執行）
      if (s.gameConfig) {
        const gc = s.gameConfig;
        if (gc.library && !['three','babylon','p5'].includes(gc.library))
          push(`${pathPrefix}[${si}]`, 'gameConfig.library 必須是 three、babylon 或 p5');
        if (gc.aspectRatio && !['16:9','4:3','1:1'].includes(gc.aspectRatio))
          push(`${pathPrefix}[${si}]`, 'gameConfig.aspectRatio 必須是 16:9、4:3 或 1:1');
        if (gc.gameCode) {
          try { new Function('GameAPI', gc.gameCode); }
          catch (e) { push(`${pathPrefix}[${si}]`, `gameCode 語法錯誤：${e.message}`); }
        }
        if (gc.mobileCode) {
          try { new Function('GameAPI', gc.mobileCode); }
          catch (e) { push(`${pathPrefix}[${si}]`, `mobileCode 語法錯誤：${e.message}`); }
        }
        if (Array.isArray(gc.files)) {
          const fnames = new Set();
          gc.files.forEach((f, fi) => {
            if (!f.name || !String(f.name).trim()) push(`${pathPrefix}[${si}]`, `程式檔 #${fi + 1} 需要名稱`);
            else if (fnames.has(f.name)) push(`${pathPrefix}[${si}]`, `程式檔名重複：${f.name}`);
            else fnames.add(f.name);
            if (!['shared', 'display', 'mobile', 'sim', 'render'].includes(f.target))
              push(`${pathPrefix}[${si}]`, `程式檔「${f.name}」的 target 必須是 shared / display / mobile / sim / render`);
            if (f.code) {
              try { new Function('GameAPI', f.code); }
              catch (e) { push(`${pathPrefix}[${si}]`, `程式檔「${f.name}」語法錯誤：${e.message}`); }
            }
          });
        }
      }

      if (s.type === 'loop') {
        if (s.loopType === 'fixed' && (!s.maxIterations || s.maxIterations < 1))
          push(`${pathPrefix}[${si}]`, '固定次數循環需要 maxIterations ≥ 1');
        const loopChildren = s.children || s.stages || [];
        if (loopChildren.length === 0)
          push(`${pathPrefix}[${si}]`, `循環「${s.name}」至少需有一個子階段`);
        loopChildren.forEach((cs, ci) => validateStage(cs, ci, `${pathPrefix}[${si}].children`));
        return;
      }

      if (s.type === 'goto') {
        if (!s.target) push(`${pathPrefix}[${si}]`, `跳轉階段「${s.name}」需要 target id`);
        return;
      }

      if (s.deckId && !deckIds.has(s.deckId))
        push(`${pathPrefix}[${si}]`, `引用的牌組「${s.deckId}」不存在`);
      else if (s.enabled && s.deckId && !enabledDeckIds.has(s.deckId))
        push(`${pathPrefix}[${si}]`, `階段「${s.name}」引用了已停用的牌組「${s.deckId}」`);

      const checkAdv = (adv, label) => {
        if (!adv || !adv.trigger) return;
        if (!validTriggers.includes(adv.trigger))
          push(`${pathPrefix}[${si}].${label}`, `不支援的 trigger：${adv.trigger}`);
        const timerTriggers = ['auto','timer','identity_timer','play_timer','generic_timer','restart_timer','round_timer'];
        if (timerTriggers.includes(adv.trigger) &&
            (!Number.isFinite(Number(adv.duration)) || Number(adv.duration) < 0))
          push(`${pathPrefix}[${si}].${label}`, `${label} 使用 ${adv.trigger} 時需提供 duration（秒數）`);
      };
      checkAdv(s.advance, 'advance');
      checkAdv(s.revealTrigger, 'revealTrigger');
      checkAdv(s.nextRoundTrigger, 'nextRoundTrigger');
    };

    stages.forEach((s, si) => validateStage(s, si, 'stages'));
    return errs;
  }

  // ═══════════════════════════════════════════════════════════════
  //  SAVE / SAVE-AS / DELETE
  // ═══════════════════════════════════════════════════════════════
  async function saveCurrent() {
    if (!currentId || !isDirty()) return;
    if (currentValidationErrors.length) { toast('修正驗證錯誤後才能儲存', 'err'); return; }
    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/manifest`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ manifest }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) {
        const detail = (data.errors||[]).map(e => `\n  • ${e.path}: ${e.msg}`).join('');
        throw new Error((data.error || '儲存失敗') + detail);
      }
      modules = data.modules || modules;
      originalSnapshot = JSON.stringify(manifest);
      history = [];
      document.getElementById('undoBtn').disabled = true;
      renderModuleList();
      updateButtons();
      toast('✓ 已儲存到原檔', 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  function promptCreateModule() {
    const newId = (prompt('新模組 ID（英數、底線、連字號）：', 'my-new-module') || '').trim();
    if (!newId) return;
    if (!/^[a-zA-Z0-9_-]+$/.test(newId)) {
      toast('✕ 模組 ID 只能包含英數、底線和連字號', 'err');
      return;
    }
    if (modules.find(m => m.id === newId)) {
      toast('✕ 此 ID 已存在', 'err');
      return;
    }
    const newName = (prompt('新模組顯示名稱：', '我的新模組') || '').trim();
    if (!newName) return;

    createNewModule(newId, newName);
  }

  async function createNewModule(id, name) {
    const newManifest = {
      id: id,
      name: name,
      version: "1.0.0",
      minPlayers: 2,
      maxPlayers: 8,
      description: "",
      fieldConfig: {
        handSize: {
          label: "實際抽牌數",
          type: "number",
          default: 5,
          min: 1,
          max: 10
        }
      },
      decks: [],
      stages: [
        {
          id: "main_stage",
          name: "主要階段",
          type: "result",
          enabled: true,
          advance: { "trigger": "host" }
        }
      ]
    };

    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(id)}/manifest`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ manifest: newManifest }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '建立失敗');

      // Refresh modules list
      await loadModuleList();

      // Select the new module
      selectModule(id);
      toast('✓ 新模組已建立', 'ok');
    } catch (e) {
      toast('✕ ' + e.message, 'err');
    }
  }

  async function saveAsNew() {
    if (!currentId) return;
    const newId = (prompt('新模組 ID（英數、底線、連字號）：', currentId + '-copy') || '').trim();
    if (!newId) return;
    const newName = (prompt('新模組顯示名稱：', (manifest.name || currentId) + ' (副本)') || '').trim();
    if (!newName) return;
    try {
      // Bake current edits into fieldConfig defaults via the existing /clone endpoint
      const fieldValues = {};
      Object.entries(manifest.fieldConfig||{}).forEach(([k, def]) => { fieldValues[k] = def.default; });
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/clone`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          newId, newName,
          description: manifest.description,
          fieldValues,
          decks:  manifest.decks,
          stages: manifest.stages,
        }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) {
        const detail = (data.errors||[]).map(e => `\n  • ${e.path}: ${e.msg}`).join('');
        throw new Error((data.error || '儲存失敗') + detail);
      }
      modules = data.modules || modules;
      originalSnapshot = JSON.stringify(manifest); // mark current clean (changes already exist in source)
      currentId = null;
      selectModule(data.id);
      toast(`✓ 已建立模組「${data.name}」`, 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  async function deleteCurrent() {
    if (!currentId) return;
    if (modules.length <= 1) { toast('至少需保留一個模組', 'err'); return; }
    if (!confirm(`確定要刪除模組「${manifest.name || currentId}」嗎？\n會刪除整個資料夾，無法復原。`)) return;
    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}`, { method: 'DELETE' });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '刪除失敗');

      modules = data.modules || modules;
      currentId = null;
      manifest  = null;
      originalSnapshot = null;
      history = [];
      document.getElementById('emptyState').classList.remove('hidden');
      document.getElementById('editorContent').classList.add('hidden');
      renderModuleList();
      toast('✓ 已刪除', 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  // ═══════════════════════════════════════════════════════════════
  //  KEYBOARD SHORTCUTS
  // ═══════════════════════════════════════════════════════════════
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (!document.getElementById('saveBtn').disabled) saveCurrent();
    } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      const el = document.activeElement;
      // Don't intercept undo inside text inputs (let browser handle native undo)
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) return;
      e.preventDefault();
      undo();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  // ═══════════════════════════════════════════════════════════════
  //  BOOTSTRAP
  // ═══════════════════════════════════════════════════════════════
  async function loadGlobalDecks() {
    try {
      const res = await fetch('/api/decks');
      const data = await res.json();
      if (data.success) {
        globalDecks = data.decks;
        console.log('[Editor] Loaded', globalDecks.length, 'global decks');
      }
    } catch (err) {
      console.error('[Editor] Failed to load global decks:', err);
    }
  }

  /**
   * 載入模組的 server.js 代碼
   */
  async function loadServerCode(moduleId) {
    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(moduleId)}/server`);
      if (res.status === 404) {
        // server.js 不存在，這是正常的
        serverCode = '';
        originalServerCode = '';
        return;
      }
      if (!res.ok) {
        throw new Error(`載入 server.js 失敗：${res.status}`);
      }
      const code = await res.text();
      serverCode = code;
      originalServerCode = code;
      console.log('[Editor] Loaded server.js');
    } catch (err) {
      console.error('[Editor] Failed to load server.js:', err);
      serverCode = '';
      originalServerCode = '';
    }
  }

  (async function init() {
    await loadModuleList();
    await loadGlobalDecks();
    const wantId = new URLSearchParams(location.search).get('id');
    if (wantId && modules.find(m => m.id === wantId)) selectModule(wantId);
    else if (modules.length) selectModule(modules[0].id);
  })();

  function onLangChange() { renderModuleEditor(); }
</script>

</script>

  Config.initUI();
