  function renderFcRow(key, def) {
    const isSelect = def.type === 'select';
    return `<div class="fc-row" id="fc_${escapeH(key)}">
      <div class="fc-head">
        <input class="fc-key" placeholder="key" value="${escapeH(key)}"
               onchange="renameFcKey('${escapeH(key)}',this.value)">
        <input placeholder="label（顯示名稱）" value="${escapeH(def.label||'')}"
               oninput="setFcProp('${escapeH(key)}','label',this.value)">
        <button class="ci-del" onclick="deleteFcField('${escapeH(key)}')">✕</button>
      </div>
      <div class="fc-grid">
        <select onchange="setFcProp('${escapeH(key)}','type',this.value);renderAdvancedTab();">
          <option value="number" ${def.type==='number'?'selected':''}>數字</option>
          <option value="select" ${def.type==='select'?'selected':''}>選單</option>
        </select>
        <input placeholder="default" value="${escapeH(def.default ?? '')}"
               oninput="setFcDefault('${escapeH(key)}',this.value)">
        ${def.type === 'number' ? `
          <input placeholder="min" type="number" value="${def.min ?? ''}"
                 oninput="setFcProp('${escapeH(key)}','min',this.value===''?null:Number(this.value))">
          <input placeholder="max" type="number" value="${def.max ?? ''}"
                 oninput="setFcProp('${escapeH(key)}','max',this.value===''?null:Number(this.value))">
        ` : `<div></div><div></div>`}
      </div>
      ${isSelect ? `
        <div class="fc-options">
          <div style="margin-bottom:4px">選項：</div>
          ${(def.options||[]).map((o, oi) => `
            <div class="opt-row">
              <input placeholder="value" value="${escapeH(o.value||'')}" oninput="setFcOpt('${escapeH(key)}',${oi},'value',this.value)">
              <input placeholder="label" value="${escapeH(o.label||'')}" oninput="setFcOpt('${escapeH(key)}',${oi},'label',this.value)">
              <button class="ci-del" onclick="deleteFcOpt('${escapeH(key)}',${oi})">✕</button>
            </div>
          `).join('')}
          <button class="add-card-btn" onclick="addFcOpt('${escapeH(key)}')">+ 新增選項</button>
        </div>
      ` : ''}
    </div>`;
  }

  function setFcDefault(key, raw) {
    pushHistory();
    const def = manifest.fieldConfig[key];
    if (!def) return;
    def.default = def.type === 'select' ? raw : (raw === '' ? null : Number(raw));
    renderBasicTab();
    afterChange(true);
  }

  function setFcProp(key, prop, val) {
    pushHistory();
    if (!manifest.fieldConfig[key]) return;
    if (val === null) delete manifest.fieldConfig[key][prop];
    else              manifest.fieldConfig[key][prop] = val;
    // Re-render basic tab so the change is visible
    renderBasicTab();
    afterChange(true);
  }
  function renameFcKey(oldKey, newKey) {
    if (!newKey || newKey === oldKey) return;
    if (manifest.fieldConfig[newKey]) { toast('該 key 已存在', 'err'); renderAdvancedTab(); return; }
    pushHistory();
    const def = manifest.fieldConfig[oldKey];
    delete manifest.fieldConfig[oldKey];
    manifest.fieldConfig[newKey] = def;
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function deleteFcField(key) {
    if (!confirm(`刪除可調參數「${key}」？`)) return;
    pushHistory();
    delete manifest.fieldConfig[key];
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function addFcField() {
    pushHistory();
    manifest.fieldConfig = manifest.fieldConfig || {};
    let i = 1; while (manifest.fieldConfig['newField' + i]) i++;
    const key = 'newField' + i;
    manifest.fieldConfig[key] = { label: '新欄位', type: 'number', default: 1, min: 1, max: 10 };
    renderAdvancedTab(); renderBasicTab();
    afterChange(true);
  }
  function setFcOpt(key, oi, prop, val) {
    pushHistory();
    manifest.fieldConfig[key].options[oi][prop] = val;
    afterChange(true);
  }
  function addFcOpt(key) {
    pushHistory();
    const def = manifest.fieldConfig[key];
    def.options = def.options || [];
    def.options.push({ value: 'opt' + (def.options.length+1), label: '新選項' });
    renderAdvancedTab();
    afterChange(true);
  }
  function deleteFcOpt(key, oi) {
    pushHistory();
    manifest.fieldConfig[key].options.splice(oi, 1);
    renderAdvancedTab();
    afterChange(true);
  }

  function applyRawJson() {
    const txt = document.getElementById('rawJson').value;
    try {
      const parsed = JSON.parse(txt);
      pushHistory();
      manifest = parsed;
      manifest.id = currentId;     // can't change id via raw edit
      rawMode = false;
      rerenderAll();
      afterChange(true);
      toast('已套用 raw JSON', 'ok');
    } catch (e) { toast('JSON 解析失敗：' + e.message, 'err'); }
  }

  // ═══════════════════════════════════════════════════════════════
  //  VALIDATION (client-side mirror of server validation)
  // ═══════════════════════════════════════════════════════════════
  let currentValidationErrors = [];

  function runValidation() {
    currentValidationErrors = validateManifest(manifest);
    const banner = document.getElementById('valBanner');
    if (!currentValidationErrors.length) { banner.classList.add('hidden'); return; }
    banner.classList.remove('hidden');
    document.getElementById('valList').innerHTML = currentValidationErrors.map(e =>
      `<li><code>${escapeH(e.path||'(top)')}</code>　${escapeH(e.msg)}</li>`
    ).join('');
  }

  function validateManifest(m) {
    const errs = [];
    const push = (path, msg) => errs.push({ path, msg });
    if (!m) return errs;
    if (!m.name || !String(m.name).trim()) push('name', '顯示名稱不可空白');
    const minP = Number(m.minPlayers), maxP = Number(m.maxPlayers);
    if (!Number.isFinite(minP) || minP < 1 || minP > 50) push('minPlayers', '最少人數需在 1–50');
    if (!Number.isFinite(maxP) || maxP < 1 || maxP > 50) push('maxPlayers', '最多人數需在 1–50');
    if (Number.isFinite(minP) && Number.isFinite(maxP) && minP > maxP) push('maxPlayers', '最多人數不可小於最少人數');

    if (m.fieldConfig) {
      Object.entries(m.fieldConfig).forEach(([k, def]) => {
        if (!def.label) push(`fieldConfig.${k}`, '欄位需要 label');
        if (!['number','select'].includes(def.type)) push(`fieldConfig.${k}`, 'type 只能是 number 或 select');
        if (def.type === 'select' && (!def.options || !def.options.length))
          push(`fieldConfig.${k}`, 'select 類型需至少一個選項');
      });
    }

    const deckIds = new Set();
    (m.decks || []).forEach((d, di) => {
      if (!d.id)                push(`decks[${di}]`,  '牌組需要 id');
      else if (deckIds.has(d.id)) push(`decks[${di}]`, `牌組 id 重複：${d.id}`);
      else deckIds.add(d.id);

      // For global deck references, name is auto-populated from global deck
      // Skip validation if it's a reference (the name will come from global deck)
      if (!d.name && !d.ref) push(`decks[${di}]`, '牌組需要名稱');

      // Skip cards validation for global deck references
      if (!d.ref && d.enabled !== false && (!d.cards || d.cards.length === 0))
        push(`decks[${di}]`, `啟用中的牌組「${d.name||d.id}」不可為空`);
      const cardIds = new Set();
      if (!d.ref) { // Only validate local cards
        (d.cards||[]).forEach((c, ci) => {
          if (!c.name || !String(c.name).trim()) push(`decks[${di}].cards[${ci}]`, '卡牌名稱不可空白');
          if (c.id && cardIds.has(c.id)) push(`decks[${di}].cards[${ci}]`, `卡牌 id 重複：${c.id}`);
          else if (c.id) cardIds.add(c.id);
        });
      }
    });

    const stages = m.stages || [];
    if (stages.filter(s => s.enabled).length === 0) push('stages', '至少需有一個啟用的階段');
    const enabledDeckIds = new Set((m.decks||[]).filter(d => d.enabled !== false).map(d => d.id));
    const validTriggers = ['host','all_played','all_confirmed','all_voted','all_submitted','all_ready',
                          'auto','timer','identity_timer','play_timer','generic_timer',
                          'auto_restart','restart_timer',
                          'host_reveal','auto_next','round_timer'];

    const validateStage = (s, si, pathPrefix) => {
      if (!s.id)   push(`${pathPrefix}[${si}]`, '階段需要 id');
      if (!s.name) push(`${pathPrefix}[${si}]`, '階段需要名稱');
      if (!s.type) push(`${pathPrefix}[${si}]`, '階段需要 type');

      if (s.type === 'loop') {
        if (s.loopType === 'fixed' && (!s.maxIterations || s.maxIterations < 1))
          push(`${pathPrefix}[${si}]`, '固定次數循環需要 maxIterations ≥ 1');
        if (!s.stages || s.stages.length === 0)
          push(`${pathPrefix}[${si}]`, `循環「${s.name}」至少需有一個子階段`);
        (s.stages || []).forEach((cs, ci) => validateStage(cs, ci, `${pathPrefix}[${si}].stages`));
        return;
      }

      if (s.deckId && !deckIds.has(s.deckId))
        push(`${pathPrefix}[${si}]`, `引用的牌組「${s.deckId}」不存在`);
      else if (s.enabled && s.deckId && !enabledDeckIds.has(s.deckId))
        push(`${pathPrefix}[${si}]`, `階段「${s.name}」引用了已停用的牌組「${s.deckId}」`);

      const checkAdv = (adv, label) => {
        if (!adv || !adv.trigger) return;
        if (!validTriggers.includes(adv.trigger))
          push(`${pathPrefix}[${si}].${label}`, `不支援的 trigger：${adv.trigger}`);
        const timerTriggers = ['auto','timer','identity_timer','play_timer','generic_timer','restart_timer','round_timer'];
        if (timerTriggers.includes(adv.trigger) &&
            (!Number.isFinite(Number(adv.duration)) || Number(adv.duration) < 0))
          push(`${pathPrefix}[${si}].${label}`, `${label} 使用 ${adv.trigger} 時需提供 duration（秒數）`);
      };
      checkAdv(s.advance, 'advance');
      checkAdv(s.revealTrigger, 'revealTrigger');
      checkAdv(s.nextRoundTrigger, 'nextRoundTrigger');
    };

    stages.forEach((s, si) => validateStage(s, si, 'stages'));
    return errs;
  }

  // ═══════════════════════════════════════════════════════════════
  //  SAVE / SAVE-AS / DELETE
  // ═══════════════════════════════════════════════════════════════
  async function saveCurrent() {
    if (!currentId || !isDirty()) return;
    if (currentValidationErrors.length) { toast('修正驗證錯誤後才能儲存', 'err'); return; }
    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/manifest`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ manifest }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) {
        const detail = (data.errors||[]).map(e => `\n  • ${e.path}: ${e.msg}`).join('');
        throw new Error((data.error || '儲存失敗') + detail);
      }
      modules = data.modules || modules;
      originalSnapshot = JSON.stringify(manifest);
      history = [];
      document.getElementById('undoBtn').disabled = true;
      renderModuleList();
      updateButtons();
      toast('✓ 已儲存到原檔', 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  function promptCreateModule() {
    const newId = (prompt('新模組 ID（英數、底線、連字號）：', 'my-new-module') || '').trim();
    if (!newId) return;
    if (!/^[a-zA-Z0-9_-]+$/.test(newId)) {
      toast('✕ 模組 ID 只能包含英數、底線和連字號', 'err');
      return;
    }
    if (modules.find(m => m.id === newId)) {
      toast('✕ 此 ID 已存在', 'err');
      return;
    }
    const newName = (prompt('新模組顯示名稱：', '我的新模組') || '').trim();
    if (!newName) return;

    createNewModule(newId, newName);
  }

  async function createNewModule(id, name) {
    const newManifest = {
      id: id,
      name: name,
      version: "1.0.0",
      minPlayers: 2,
      maxPlayers: 8,
      description: "",
      fieldConfig: {
        handSize: {
          label: "實際抽牌數",
          type: "number",
          default: 5,
          min: 1,
          max: 10
        }
      },
      decks: [],
      stages: [
        {
          id: "main_stage",
          name: "主要階段",
          type: "result",
          enabled: true,
          advance: { "trigger": "host" }
        }
      ]
    };

    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(id)}/manifest`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ manifest: newManifest }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '建立失敗');

      // Refresh modules list
      await loadModuleList();

      // Select the new module
      selectModule(id);
      toast('✓ 新模組已建立', 'ok');
    } catch (e) {
      toast('✕ ' + e.message, 'err');
    }
  }

  async function saveAsNew() {
    if (!currentId) return;
    const newId = (prompt('新模組 ID（英數、底線、連字號）：', currentId + '-copy') || '').trim();
    if (!newId) return;
    const newName = (prompt('新模組顯示名稱：', (manifest.name || currentId) + ' (副本)') || '').trim();
    if (!newName) return;
    try {
      // Bake current edits into fieldConfig defaults via the existing /clone endpoint
      const fieldValues = {};
      Object.entries(manifest.fieldConfig||{}).forEach(([k, def]) => { fieldValues[k] = def.default; });
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}/clone`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          newId, newName,
          description: manifest.description,
          fieldValues,
          decks:  manifest.decks,
          stages: manifest.stages,
        }),
      });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) {
        const detail = (data.errors||[]).map(e => `\n  • ${e.path}: ${e.msg}`).join('');
        throw new Error((data.error || '儲存失敗') + detail);
      }
      modules = data.modules || modules;
      originalSnapshot = JSON.stringify(manifest); // mark current clean (changes already exist in source)
      currentId = null;
      selectModule(data.id);
      toast(`✓ 已建立模組「${data.name}」`, 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  async function deleteCurrent() {
    if (!currentId) return;
    if (modules.length <= 1) { toast('至少需保留一個模組', 'err'); return; }
    if (!confirm(`確定要刪除模組「${manifest.name || currentId}」嗎？\n會刪除整個資料夾，無法復原。`)) return;
    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(currentId)}`, { method: 'DELETE' });
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '刪除失敗');

      modules = data.modules || modules;
      currentId = null;
      manifest  = null;
      originalSnapshot = null;
      history = [];
      document.getElementById('emptyState').classList.remove('hidden');
      document.getElementById('editorContent').classList.add('hidden');
      renderModuleList();
      toast('✓ 已刪除', 'ok');
    } catch (e) { toast('✕ ' + e.message, 'err'); }
  }

  // ═══════════════════════════════════════════════════════════════
  //  KEYBOARD SHORTCUTS
  // ═══════════════════════════════════════════════════════════════
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (!document.getElementById('saveBtn').disabled) saveCurrent();
    } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      const el = document.activeElement;
      // Don't intercept undo inside text inputs (let browser handle native undo)
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) return;
      e.preventDefault();
      undo();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  // ═══════════════════════════════════════════════════════════════
  //  BOOTSTRAP
  // ═══════════════════════════════════════════════════════════════
  async function loadGlobalDecks() {
    try {
      const res = await fetch('/api/decks');
      const data = await res.json();
      if (data.success) {
        globalDecks = data.decks;
        console.log('[Editor] Loaded', globalDecks.length, 'global decks');
      }
    } catch (err) {
      console.error('[Editor] Failed to load global decks:', err);
    }
  }

  (async function init() {
    await loadModuleList();
    await loadGlobalDecks();
    const wantId = new URLSearchParams(location.search).get('id');
    if (wantId && modules.find(m => m.id === wantId)) selectModule(wantId);
    else if (modules.length) selectModule(modules[0].id);
  })();
</script>
</body>
</html>
