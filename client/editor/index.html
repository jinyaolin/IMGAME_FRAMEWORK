<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模組編輯器</title>
  <script>
    // 子路徑部署前綴(頁面內嵌腳本在 config.js 載入前就會跑,這段必須最先執行)
    window.IMGAME_BASE = location.pathname.indexOf('/labs/game') === 0 ? '/labs/game' : '';
    if (window.IMGAME_BASE) {
      const _fetch = window.fetch;
      window.fetch = (u, o) => _fetch(
        (typeof u === 'string' && /^\/(?!\/)/.test(u) && !u.startsWith(window.IMGAME_BASE + '/'))
          ? window.IMGAME_BASE + u : u, o);
      window.__imgameFetchWrapped = true;
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a1a; color: #ddddf0;
      font-family: system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { color: #6688ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    header {
      background: #14142a; border-bottom: 1px solid #2a2a5a;
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.05rem; letter-spacing: .04em; }
    header .links { display:flex; gap: 12px; align-items:center; font-size: .82rem; }
    header .undo-btn {
      background: #14142a; border: 1px solid #3a3a6a; color: #aaaaff;
      border-radius: 6px; padding: 5px 12px; font-size: .8rem; cursor: pointer;
    }
    header .undo-btn:disabled { opacity: .3; cursor: not-allowed; }
    header kbd { font-family: monospace; font-size: .68rem; background: #0a0a1a; padding: 1px 5px; border-radius: 3px; border: 1px solid #2a2a4a; color:#7777aa; margin-left:4px;}

    /* Layout */
    .editor-shell { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 280px; flex-shrink: 0; border-right: 1px solid #2a2a5a;
      background: #0d0d22; display: flex; flex-direction: column;
    }
    .side-head { padding: 12px 14px; border-bottom: 1px solid #1a1a3a; display: flex; flex-direction: column; gap: 8px; }
    .side-head input {
      width: 100%; background: #0a0a1a; border: 1px solid #2a2a5a;
      border-radius: 6px; color: #ddddf0; padding: 6px 10px; font-size: .82rem; outline: none;
    }
    .side-head input:focus { border-color: #5555ff; }
    .btn-add-mod {
      width: 100%; background: #1a3a1a; border: 1px solid #2a5a2a; color: #aaddaa;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-add-mod:hover { background: #2a5a2a; border-color: #3a6a3a; }
    .side-list { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .main {
      flex: 1; padding: 18px 24px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* Sidebar: module list */
    .mod-item {
      background: #14142a; border: 1.5px solid #2a2a5a; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; transition: border-color .15s;
      position: relative;
    }
    .mod-item:hover { border-color: #5555ff; }
    .mod-item.selected { border-color: #5555ff; background: #1a1a40; }
    .mod-item.dirty .mi-name::after {
      content: ' ●'; color: #ffaa44;
    }
    .mod-item .mi-name { font-size: .9rem; font-weight: 700; }
    .mod-item .mi-id   { font-size: .68rem; color: #6666aa; font-family: monospace; }
    .mod-item .mi-desc { font-size: .72rem; color: #7777aa; line-height: 1.3; margin-top: 2px; }
    .mod-item .mi-meta { font-size: .68rem; color: #5566aa; margin-top: 3px; }

    /* Buttons */
    .btn { border: none; border-radius: 8px; padding: 9px 18px; font-size: .85rem; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary { background: #5555ff; color: #fff; }
    .btn-success { background: #33bb66; color: #fff; }
    .btn-danger  { background: #cc3333; color: #fff; }
    .btn-neutral { background: #2a2a5a; color: #aaaaff; border: 1px solid #4444aa; }
    .btn-ghost   { background: transparent; color: #8888bb; border: 1px solid #3a3a6a; }
    .btn-ghost:hover { background: #14142a; }
    .btn-sm      { padding: 6px 12px; font-size: .76rem; }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #555577; font-size: .9rem; gap: 8px;
    }
    .empty-state .icon { font-size: 3rem; opacity: .3; }

    /* Editor header */
    .ed-head {
      background: #14142a; border: 1px solid #2a2a5a; border-radius: 10px;
      padding: 14px 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .ed-head .row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ed-head h2 { font-size: 1.1rem; flex: 1; min-width: 200px; }
    .ed-head .id-tag { font-family: monospace; font-size: .72rem; color: #6666aa; background: #0a0a1a; padding: 3px 9px; border-radius: 4px; }
    .ed-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ed-meta-grid { display: grid; grid-template-columns: 2fr 3fr; gap: 10px; }
    .ed-meta-grid .field-row { margin: 0; }
    .ed-meta-row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .ed-meta-row2 .field-row { margin: 0; }

    /* Validation */
    .val-banner {
      background: #2a1a1a; border: 1px solid #cc3333; border-radius: 8px;
      padding: 10px 14px; font-size: .8rem; color: #ffaaaa;
    }
    .val-banner h4 { font-size: .85rem; margin-bottom: 6px; color: #ff7777; }
    .val-banner ul { padding-left: 18px; line-height: 1.6; }
    .val-banner code { font-family: monospace; font-size: .72rem; background: #1a0a0a; padding: 1px 4px; border-radius: 3px; color: #ff9999; }

    /* Toast */
    .toast {
      position: fixed; right: 20px; bottom: 20px;
      background: #14142a; border: 1px solid #2a2a5a; border-radius: 8px;
      padding: 10px 16px; font-size: .85rem; opacity: 0;
      transition: opacity .25s; pointer-events: none; max-width: 320px;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }
    .toast.ok  { border-color: #33bb66; color: #66dd99; }
    .toast.err { border-color: #cc3333; color: #ff7777; }

    .hidden { display: none !important; }

    /* Tabs */
    #configEditor { border: 1px solid #2a2a5a; border-radius: 10px; overflow: hidden; }
    .cfg-tabs { display: flex; background: #0e0e24; border-bottom: 1px solid #2a2a5a; }
    .cfg-tab {
      flex: 1; padding: 10px 4px; font-size: .78rem; font-weight: 700;
      background: none; border: none; color: #6666aa; cursor: pointer;
      letter-spacing: .04em;
    }
    .cfg-tab.active { color: #aaaaff; background: #14142a; border-bottom: 2px solid #5555ff; }
    .cfg-tab-content { padding: 16px; display: none; }
    .cfg-tab-content.active { display: block; }

    /* Field rows */
    .field-row { margin-bottom: 12px; }
    .field-label { font-size: .74rem; color: #8888bb; margin-bottom: 4px; display: block; }
    .field-input {
      width: 100%; background: #0a0a1a; border: 1px solid #3a3a6a;
      border-radius: 6px; color: #ddddf0; font-size: .9rem; padding: 7px 10px; outline: none;
    }
    .field-input:focus { border-color: #5555ff; }
    select.field-input { cursor: pointer; }
    textarea.field-input { resize: vertical; font-family: monospace; font-size: .8rem; min-height: 280px; }

    /* Decks */
    .deck-block { background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .deck-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; }
    .deck-type-badge { font-size: .65rem; background: #1a1a4a; color: #8888cc; border-radius: 4px; padding: 2px 6px; }
    .deck-header-name { flex: 1; font-size: .88rem; font-weight: 700; }
    .deck-toggle { font-size: .7rem; color: #6666aa; }
    .deck-cards { padding: 0 12px 12px; display: none; }
    .deck-cards.open { display: block; }
    .deck-meta-row { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 8px; margin-bottom: 10px; }
    .deck-draw-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .74rem; color: #8888aa; }
    .deck-draw-row input[type=number] { width: 50px; background: #0a0a1a; border: 1px solid #3a3a6a; border-radius: 4px; color: #ddddf0; padding: 3px 6px; font-size: .78rem; text-align: center; }

    .card-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .card-row input {
      background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 4px;
      color: #ddddf0; font-size: .78rem; padding: 5px 7px; outline: none;
    }
    .card-row input:focus { border-color: #5555ff; }
    .card-row .ci-name { flex: 2; }
    .card-row .ci-val  { width: 64px; text-align: center; }
    .card-row .ci-desc { flex: 3; }
    .card-row .ci-del  { background: none; border: 1px solid #4a1a1a; border-radius: 4px; color: #aa4444; font-size: .7rem; padding: 4px 8px; cursor: pointer; flex-shrink: 0; }
    .card-row .ci-del:hover { background: #2a0a0a; }
    .card-row-header { display: flex; gap: 6px; margin-bottom: 4px; padding-right: 32px; }
    .card-row-header span { font-size: .65rem; color: #555577; }
    .card-row-header .ci-name { flex: 2; }
    .card-row-header .ci-val  { width: 64px; text-align: center; }
    .card-row-header .ci-desc { flex: 3; }
    .add-card-btn { font-size: .76rem; color: #5555ff; background: none; border: 1px dashed #3a3a7a; border-radius: 4px; padding: 6px 10px; cursor: pointer; width: 100%; margin-top: 6px; }
    .add-card-btn:hover { background: #14142a; }

    /* Stages */
    .stage-row { background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
    .stage-row.disabled { opacity: .55; }
    .stage-row .sr-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .stage-order-btns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .stage-order-btns button { background: none; border: 1px solid #3a3a6a; border-radius: 3px; color: #8888cc; font-size: .65rem; padding: 1px 5px; cursor: pointer; line-height: 1.4; }
    .stage-order-btns button:hover:not(:disabled) { background: #1a1a3a; }
    .stage-order-btns button:disabled { opacity: .3; cursor: not-allowed; }
    .stage-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .stage-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stage-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    @media (max-width: 768px) {
      .stage-grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .stage-grid-3 { grid-template-columns: 1fr; }
    }

    /* Toggle switch */
    .toggle-switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #2a2a4a; border-radius: 19px; cursor: pointer; transition: .2s; }
    .toggle-slider:before { content:''; position: absolute; width: 13px; height: 13px; left: 3px; bottom: 3px; background: #666; border-radius: 50%; transition: .2s; }
    input:checked + .toggle-slider { background: #5555ff; }
    input:checked + .toggle-slider:before { transform: translateX(15px); background: #fff; }

    /* Parameters tab — globalParams + playerAttributes editor */
    .param-row {
      background: #0e0e22;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .param-row .param-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .param-row .param-id-input {
      width: 140px;
      background: #0a0a1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ddddf0;
      font-size: .82rem;
      padding: 4px 8px;
      font-family: monospace;
    }
    .param-row .param-type-select {
      background: #0a0a1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ddddf0;
      font-size: .82rem;
      padding: 4px 8px;
    }
    .param-row .param-label-input {
      flex: 1;
      background: #0a0a1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ddddf0;
      font-size: .82rem;
      padding: 4px 8px;
    }
    .param-row .param-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .param-row .param-detail {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .param-row .param-detail label {
      font-size: .7rem;
      color: #8888aa;
    }
    .param-row .param-detail input {
      background: #0a0a1a;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      color: #ddddf0;
      font-size: .8rem;
      padding: 4px 6px;
    }
    .param-row .param-detail input:focus {
      outline: none;
      border-color: #5555ff;
    }

    /* Advanced tab — fieldConfig schema editor */
    .fc-row {
      background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .fc-row .fc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .fc-row .fc-head input { flex: 1; background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 4px; color: #ddddf0; font-size: .82rem; padding: 4px 8px; }
    .fc-row .fc-key { font-family: monospace; width: 140px; }
    .fc-row .fc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .fc-row .fc-grid input, .fc-row .fc-grid select {
      background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 4px;
      color: #ddddf0; font-size: .76rem; padding: 4px 7px; width: 100%;
    }
    .fc-options { font-size: .72rem; color: #8888aa; }
    .fc-options .opt-row { display: flex; gap: 5px; margin-bottom: 4px; }
    .fc-options .opt-row input { flex: 1; }
    .fc-options .opt-row .ci-del { background: none; border: 1px solid #4a1a1a; border-radius: 4px; color: #aa4444; font-size: .7rem; padding: 2px 6px; cursor: pointer; }

    .section-title { font-size: .72rem; color: #6666aa; letter-spacing: .08em; margin: 16px 0 8px; }
    .section-title:first-child { margin-top: 0; }

    .raw-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .help-text { font-size: .72rem; color: #6666aa; line-height: 1.5; margin-top: 4px; }

    /* Loop stage */
    .loop-block { background: #090818; border: 1px solid #3a2060; border-radius: 8px; margin-top: 10px; padding: 12px 14px; }
    .loop-block-title { font-size: .78rem; color: #aa88ee; font-weight: 700; letter-spacing: .04em; margin-bottom: 10px; }
    .loop-cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .loop-exit-block { background: #0d0d20; border: 1px solid #2a1a50; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
    .loop-exit-title { font-size: .72rem; color: #8866cc; margin-bottom: 8px; font-weight: 600; }
    .loop-exit-grid { display: grid; grid-template-columns: 1fr 1fr 60px 1fr; gap: 6px; align-items: end; }
    .child-stages-wrap { margin-top: 10px; }
    .child-stages-title { font-size: .72rem; color: #8866cc; margin-bottom: 6px; font-weight: 600; }
    .child-stage-row { background: #10102a; border: 1px solid #2a2a55; border-left: 3px solid #6633bb; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; margin-left: 12px; }
    .child-stage-row.disabled { opacity: .55; }
    .child-stage-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-top: 8px; }

    /* ── AI 聊天側欄 ─────────────────────────────── */
    .ai-sidebar { width: 380px; flex-shrink: 0; border-left: 1px solid #2a2a5a; background: #0d0d20;
                  display: flex; flex-direction: column; height: calc(100vh - 57px); }
    .ai-head { padding: 12px 14px; border-bottom: 1px solid #2a2a5a; display: flex; align-items: center; gap: 8px; }
    .ai-head h3 { font-size: .9rem; color: #ddddf0; margin: 0; flex: 1; }
    .ai-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .ai-dot.on { background: #33bb66; box-shadow: 0 0 6px #33bb66; }
    .ai-model { font-size: .68rem; color: #8888bb; }
    .ai-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .ai-msg { border-radius: 10px; padding: 9px 12px; font-size: .82rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .ai-msg.user { background: #23234d; color: #ddddf0; align-self: flex-end; max-width: 90%; }
    .ai-msg.bot  { background: #14142a; border: 1px solid #2a2a5a; color: #ccccee; align-self: flex-start; max-width: 95%; }
    .ai-msg.err  { background: #2a1420; border: 1px solid #663; color: #ff9999; }
    .ai-tool { font-size: .72rem; color: #8888bb; padding: 2px 12px; font-family: ui-monospace, monospace; }
    .ai-tool .ok { color: #33bb66; } .ai-tool .fail { color: #ff6666; }
    .ai-typing { font-size: .75rem; color: #6666aa; padding: 0 12px; }
    .ai-attach { display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; }
    .ai-attach .thumb { position: relative; width: 52px; height: 52px; border-radius: 8px; overflow: hidden;
                        border: 1px solid #2a2a5a; }
    .ai-attach .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ai-attach .thumb .rm { position: absolute; top: 0; right: 0; background: #000a; color: #ff9999;
                            border: none; cursor: pointer; font-size: .7rem; padding: 0 4px; border-radius: 0 0 0 6px; }
    .ai-attach .asset-chip { display: flex; align-items: center; gap: 5px; background: #1a1a3a; border: 1px solid #2a2a5a;
                             border-radius: 14px; padding: 3px 9px; font-size: .7rem; color: #aaccee; max-width: 220px; }
    .ai-attach .asset-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-attach .asset-chip button { background: none; border: none; color: #ff9999; cursor: pointer; font-size: .7rem; padding: 0; }
    .ai-msg .att img { max-width: 140px; border-radius: 8px; margin: 4px 4px 0 0; border: 1px solid #3a3a6a; cursor: pointer; }
    .ai-inputrow { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2a5a; }
    .ai-inputrow textarea { flex: 1; background: #14142a; border: 1px solid #2a2a5a; border-radius: 8px;
                            color: #ddddf0; padding: 9px 11px; font-size: .82rem; resize: none; height: 60px; font-family: inherit; }
    .ai-inputrow textarea:focus { outline: none; border-color: #5555ff; }
    .ai-hint { font-size: .68rem; color: #55558a; padding: 0 14px 10px; }

    /* ── 總覽 tab ─────────────────────────────────── */
    .ov-section { background: #14142a; border: 1px solid #2a2a5a; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .ov-title { font-size: .78rem; color: #aaaaff; font-weight: 700; letter-spacing: .05em; margin-bottom: 10px; }
    .ov-stage { display: flex; gap: 10px; padding: 8px 10px; border-left: 3px solid #3a3a6a; background: #0e0e22;
                border-radius: 6px; margin-bottom: 6px; font-size: .82rem; }
    .ov-stage.child { margin-left: 26px; border-left-color: #6633bb; }
    .ov-stage.off { opacity: .45; }
    .ov-stage .num { color: #6666aa; font-weight: 700; min-width: 20px; }
    .ov-stage .body { flex: 1; }
    .ov-stage .sname { color: #ddddf0; font-weight: 600; }
    .ov-stage .stype { color: #8888bb; font-size: .72rem; margin-left: 6px; }
    .ov-stage .sdesc { color: #9999cc; font-size: .76rem; margin-top: 3px; line-height: 1.5; }
    .ov-adv { color: #77aaff; font-size: .74rem; margin-top: 3px; }
    .ov-pa  { color: #cc99ff; font-size: .72rem; margin-top: 2px; }
    .ov-meta { color: #ccccee; font-size: .82rem; line-height: 1.7; }
    .ov-deck { font-size: .8rem; color: #ccccee; padding: 6px 0; border-bottom: 1px dashed #2a2a4a; }
    .ov-deck:last-child { border-bottom: none; }
    .ov-empty { color: #6666aa; font-size: .8rem; }
    .ov-notes { white-space: pre-wrap; font-size: .78rem; color: #ccccee; line-height: 1.6;
                max-height: 260px; overflow-y: auto; font-family: ui-monospace, monospace; }

    /* ── 故事板:手機縮圖（.pm-*）── */
    .ov-stage { cursor: pointer; align-items: stretch; }
    .ov-stage:hover { background: #12122c; border-left-color: #5555ff; }
    .pm-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; }
    .pm-frame { width: 150px; background: #0a0a1a; border: 2px solid #2a2a5a; border-radius: 16px;
                padding: 6px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 10px #0006; }
    .pm-topbar { display: flex; justify-content: space-between; align-items: center; font-size: .6rem;
                 color: #8888bb; background: #14142a; border-radius: 8px; padding: 3px 6px; }
    .pm-status { font-size: .58rem; color: #aaaadd; text-align: center; background: #1a1a3a; border-radius: 6px; padding: 2px 4px; }
    .pm-body { min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0; }
    .pm-action { font-size: .62rem; text-align: center; border-radius: 8px; padding: 5px; background: #20204a; color: #7777aa; }
    .pm-action-on { background: #5555ff; color: #fff; }
    .pm-caption { font-size: .56rem; color: #6666aa; }
    .pm-vote-opt { width: 88%; font-size: .6rem; color: #ccccee; text-align: center; background: #14142a;
                   border: 1px solid #2a2a5a; border-radius: 8px; padding: 4px; }
    .pm-hand { display: flex; gap: 4px; }
    .pm-hand i { width: 22px; height: 32px; border-radius: 4px; background: linear-gradient(160deg,#2a2a6a,#3a2a7a); border: 1px solid #4a4a8a; }
    .pm-idcard, .pm-mid, .pm-result { text-align: center; font-size: .62rem; color: #ddddf0; }
    .pm-idcard .big, .pm-mid .big, .pm-result .big { font-size: 1.4rem; }
    .pm-idcard b, .pm-result b { display: block; color: #ffdd44; margin: 2px 0; }
    .pm-sub { color: #8888bb; }
    .pm-loop { border: 1px dashed #6633bb; border-radius: 8px; padding: 6px 8px; font-size: .62rem; color: #cc99ff; text-align: center; }
    .pm-goto { font-size: .66rem; color: #77aaff; text-align: center; }
    .pm-pad { display: grid; gap: 3px; width: 80%; }
    .pm-pad.c4 { grid-template-columns: repeat(4,1fr); }
    .pm-pad.c2 { grid-template-columns: repeat(2,1fr); }
    .pm-pad b { height: 16px; background: #20204a; border: 1px solid #3a3a6a; border-radius: 4px; }
    .pm-ctrl { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .pm-stick { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #3a3a6a; background: radial-gradient(circle at 50% 40%,#2a2a5a,#161636); }
    .pm-abcol { display: flex; flex-direction: column; gap: 4px; }
    .pm-abcol b { width: 22px; height: 22px; border-radius: 50%; background: #20204a; border: 1px solid #3a3a6a;
                  display: flex; align-items: center; justify-content: center; font-size: .6rem; color: #aaa; }
    .pm-cross { width: 36px; height: 36px; position: relative; }
    .pm-cross b { position: absolute; width: 12px; height: 12px; background: #20204a; border: 1px solid #3a3a6a; }
    .pm-cross b.u{top:0;left:12px}.pm-cross b.d{bottom:0;left:12px}.pm-cross b.l{top:12px;left:0}.pm-cross b.r{top:12px;right:0}

    /* 故事板卡片之間的連接線 */
    .ov-connector { width: 3px; height: 14px; margin: -4px 0 2px 26px;
                    background: repeating-linear-gradient(to bottom, #3a3a6a 0 3px, transparent 3px 6px); }

    /* 階段表單列裡的迷你縮圖 */
    .sr-minimock { zoom: .38; -moz-transform: scale(.38); pointer-events: none; flex-shrink: 0; }

    /* 跳轉高亮 */
    @keyframes stageFlash { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 0 3px #5555ff; } }
    .stage-flash { animation: stageFlash 1.6s ease 2; }

    /* AI 剛更新過的元素：反白亮起 → 淡出 */
    @keyframes aiFlash {
      0%   { background-color: rgba(85, 85, 255, .38); box-shadow: 0 0 0 2px #7788ff, 0 0 18px #5555ff88; }
      100% { background-color: transparent; box-shadow: none; }
    }
    .ai-flash { animation: aiFlash 2.4s ease-out; }

    /* ── 意圖精靈 modal ── */
    .wizard-overlay { position: fixed; inset: 0; background: #000a; z-index: 200; display: flex;
                      align-items: center; justify-content: center; }
    .wizard-panel { background: #14142a; border: 1px solid #3a3a6a; border-radius: 14px; padding: 22px 24px;
                    width: min(620px, 92vw); max-height: 85vh; overflow-y: auto; }
    .wizard-title { font-size: 1rem; color: #ddddf0; font-weight: 700; margin-bottom: 4px; }
    .wizard-sub { font-size: .78rem; color: #8888bb; margin-bottom: 16px; }
    .wizard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .wizard-card { background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 10px; padding: 14px 12px;
                   cursor: pointer; text-align: center; transition: all .12s; }
    .wizard-card:hover { border-color: #5555ff; background: #16163a; transform: translateY(-2px); }
    .wizard-card .wi { font-size: 1.6rem; }
    .wizard-card .wt { font-size: .82rem; color: #ddddf0; font-weight: 600; margin-top: 6px; }
    .wizard-card .wd { font-size: .68rem; color: #8888bb; margin-top: 4px; line-height: 1.5; }

    /* ── 遊戲預覽（本機模擬多人）── */
    .pv-overlay { position: fixed; inset: 0; background: #05050f; z-index: 300; display: flex; flex-direction: column; }
    .pv-topbar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #2a2a5a; flex-shrink: 0; }
    .pv-title { color: #aaaaff; font-weight: 700; font-size: .9rem; }
    .pv-status { color: #ff8866; font-size: .75rem; flex: 1; }
    .pv-stagearea { height: 46vh; position: relative; background: #000; flex-shrink: 0; }
    .pv-stagebox { position: absolute; inset: 0; margin: auto; overflow: hidden; background: #000010; box-shadow: 0 0 30px #0009; }
    .pv-stagebox canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
    .pv-ctrls { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 14px; padding: 16px;
                justify-content: center; align-content: flex-start; background: #0a0a1a; }
    .pv-ctrl { background: #10102a; border: 2px solid var(--c, #5555ff); border-radius: 12px; padding: 10px 12px; }
    .pv-ctrl-name { font-size: .78rem; font-weight: 700; margin-bottom: 8px; color: #ddddf0; display: flex; align-items: center; gap: 6px; }
    .pv-ctrl-name i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
    .pv-btnrow { display: flex; gap: 12px; align-items: center; justify-content: center; }
    .pv-grid { display: grid; gap: 6px; }
    .pv-grid.c4 { grid-template-columns: repeat(4, 1fr); }
    .pv-grid.c2 { grid-template-columns: repeat(2, 1fr); }
    .pv-btn { background: #20204a; border: 1px solid #3a3a6a; border-radius: 8px; color: #ccccee; font-size: .8rem;
              padding: 10px 8px; text-align: center; user-select: none; -webkit-user-select: none; cursor: pointer;
              min-width: 42px; touch-action: none; }
    .pv-btn.on { background: var(--c, #5555ff); color: #fff; border-color: var(--c, #5555ff); }
    .pv-dpad { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 4px; }
    .pv-dpad .pv-btn { padding: 0; line-height: 36px; min-width: 0; }
    .pv-dpad .blank { visibility: hidden; }
    .pv-phonebox { position: relative; width: 162px; height: 288px; background: #000010;
                   border: 2px solid #2a2a5a; border-radius: 12px; overflow: hidden; touch-action: none; }
    .pv-phonebox canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; }

    /* ── 遊戲程式檔案列表 ── */
    .gf-row { background: #0d0d20; border: 1px solid #26264a; border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
    .gf-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; user-select: none; }
    .gf-head:hover { background: #12122c; }
    .gf-name { font-size: .8rem; color: #ccccee; font-family: ui-monospace, monospace; }
    .gf-chip { font-size: .64rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
    .gf-chip.gf-shared  { background: #2a2050; color: #cc99ff; }
    .gf-chip.gf-display { background: #1a2a50; color: #77aaff; }
    .gf-chip.gf-mobile  { background: #1a3a2a; color: #55dd88; }
    .gf-size { font-size: .68rem; color: #6666aa; }
    .gf-btn { background: none; border: none; color: #8888bb; cursor: pointer; font-size: .72rem; padding: 2px 4px; }
    .gf-btn:hover { color: #ddddf0; } .gf-btn:disabled { opacity: .3; cursor: default; }
    .gf-btn.gf-del:hover { color: #ff6666; }
    .gf-code { font-family: ui-monospace, monospace; font-size: .76rem; border-radius: 0;
               border-left: none; border-right: none; border-bottom: none; width: 100%; }
  </style>
</head>
<body>

<header>
  <h1>📝 模組編輯器</h1>
  <div class="links">
    <button class="undo-btn" id="undoBtn" onclick="undo()" disabled>↶ Undo<kbd>⌘Z</kbd></button>
    <a href="../host" target="_blank">→ Host 控制台</a>
  </div>
</header>

<div class="editor-shell">
  <aside class="sidebar">
    <div class="side-head">
      <input id="filterInput" placeholder="🔍 搜尋模組…" data-i18n-ph="editor.search_placeholder" oninput="renderModuleList()">
      <button class="btn-add-mod" onclick="promptCreateModule()" title="建立新模組" data-i18n="btn.new_module">➕ 新增模組</button>
    </div>
    <div class="side-list" id="modList"><div style="color:#555;font-size:.8rem;" data-i18n="host.loading">載入中…</div></div>
  </aside>

  <main class="main">
    <div id="emptyState" class="empty-state">
      <div class="icon">📝</div>
      <div>從左側選擇一個模組開始編輯</div>
    </div>

    <div id="editorContent" class="hidden" style="display:flex;flex-direction:column;gap:14px;">
      <!-- Header -->
      <div class="ed-head">
        <div class="row1">
          <h2 id="edTitle">—</h2>
          <span class="id-tag" id="edIdTag">—</span>
        </div>
        <div class="ed-meta-grid">
          <div class="field-row">
            <label class="field-label">顯示名稱</label>
            <input class="field-input" id="metaName" oninput="onMetaChange('name',this.value)">
          </div>
          <div class="field-row">
            <label class="field-label">說明</label>
            <input class="field-input" id="metaDesc" oninput="onMetaChange('description',this.value)">
          </div>
        </div>
        <div class="ed-meta-row2">
          <div class="field-row">
            <label class="field-label">最少人數</label>
            <input class="field-input" type="number" min="1" max="50" id="metaMin"
                   oninput="onMetaChange('minPlayers',Number(this.value))">
          </div>
          <div class="field-row">
            <label class="field-label">最多人數</label>
            <input class="field-input" type="number" min="1" max="50" id="metaMax"
                   oninput="onMetaChange('maxPlayers',Number(this.value))">
          </div>
          <div class="field-row">
            <label class="field-label">版本</label>
            <input class="field-input" id="metaVer" oninput="onMetaChange('version',this.value)">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-success" id="saveBtn"  onclick="saveCurrent()" disabled>💾 儲存（覆寫原檔）<kbd style="margin-left:6px;color:#cce">⌘S</kbd></button>
          <button class="btn btn-primary" id="cloneBtn" onclick="saveAsNew()">📦 另存為新模組…</button>
          <button class="btn btn-ghost"   id="resetBtn" onclick="reloadCurrent()" disabled>↺ 放棄修改</button>
          <button class="btn btn-ghost"   id="pubBtn"   onclick="togglePublish()" style="display:none" title="開放後一般使用者才能在 /labs/game 選到這個模組"></button>
          <button class="btn btn-danger"  id="delBtn"   onclick="deleteCurrent()" style="margin-left:auto">🗑 刪除模組</button>
        </div>
      </div>

      <!-- Validation banner -->
      <div id="valBanner" class="val-banner hidden">
        <h4>⚠ 需修正才能儲存</h4>
        <ul id="valList"></ul>
      </div>

      <!-- Tabs -->
      <div id="configEditor">
        <div class="cfg-tabs">
          <button class="cfg-tab active" onclick="switchCfgTab('overview')">🎬 故事板</button>
          <button class="cfg-tab"        onclick="switchCfgTab('params')"   data-i18n="tab.params">參數</button>
          <button class="cfg-tab"        onclick="switchCfgTab('decks')"    data-i18n="tab.decks">牌組</button>
          <button class="cfg-tab"        onclick="switchCfgTab('stages')"   data-i18n="tab.stages">階段</button>
          <button class="cfg-tab"        onclick="switchCfgTab('advanced')" data-i18n="tab.advanced">進階</button>
        </div>
        <div id="cfgOverview" class="cfg-tab-content active"></div>
        <div id="cfgParams"   class="cfg-tab-content"></div>
        <div id="cfgDecks"    class="cfg-tab-content"></div>
        <div id="cfgStages"   class="cfg-tab-content"></div>
        <div id="cfgAdvanced" class="cfg-tab-content"></div>
      </div>
    </div>
  </main>

  <aside class="ai-sidebar">
    <div class="ai-head">
      <span class="ai-dot" id="aiDot"></span>
      <h3>🤖 Kimi 設計師</h3>
      <span class="ai-model" id="aiModel"></span>
      <button class="btn btn-ghost btn-sm" onclick="resetAiChat()" title="清除對話">🗑</button>
    </div>
    <div class="ai-log" id="aiLog">
      <div class="ai-msg bot">嗨！我是 Kimi 設計核心。直接用中文跟我說你想要的玩法，我會幫你建立或修改遊戲模組、跑模擬測試。例如：「幫我做一個 6 人狼人殺，兩輪投票之間加討論時間」。
💡 對話很長時輸入 /compact 可壓縮記憶；每個模組有我的長期筆記（KIMI.md），重要脈絡不會忘。</div>
    </div>
    <div class="ai-typing hidden" id="aiTyping">思考中…</div>
    <div class="ai-attach hidden" id="aiAttach"></div>
    <div class="ai-inputrow">
      <button class="btn btn-ghost" id="aiAttachBtn" onclick="document.getElementById('aiFileInput').click()"
              title="上傳素材（圖片/音效）給 Kimi 判斷與使用" style="align-self:flex-end">📎</button>
      <input type="file" id="aiFileInput" multiple accept="image/*,audio/*" class="hidden"
             onchange="aiUploadAssets(this.files); this.value='';">
      <textarea id="aiInput" placeholder="描述你想要的玩法或修改…（⌘+Enter 送出；可貼截圖、📎 上傳素材）"></textarea>
      <button class="btn btn-primary" id="aiSendBtn" onclick="sendAiChat()">送出</button>
    </div>
    <div class="ai-hint" id="aiHint"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<!-- 意圖精靈：新增階段 -->
<div id="stageWizard" class="wizard-overlay hidden" onclick="if(event.target===this)closeStageWizard()">
  <div class="wizard-panel">
    <div class="wizard-title">➕ 這一關,玩家要做什麼?</div>
    <div class="wizard-sub">選一種玩法,我會帶好常用預設值;之後都可以在表單微調,或直接跟右側的 Kimi 說。</div>
    <div class="wizard-grid" id="wizardGrid"></div>
  </div>
</div>

<!-- 遊戲預覽：本機模擬多人控制器 -->
<div id="gamePreview" class="pv-overlay hidden">
  <div class="pv-topbar">
    <span class="pv-title">🕹 遊戲預覽</span>
    <span class="pv-status" id="pvStatus"></span>
    <label style="font-size:.75rem;color:#8888bb;display:flex;align-items:center;gap:6px;">玩家數
      <select id="pvCount" class="field-input" style="width:60px;padding:4px 6px;" onchange="pvBuild()">
        <option>2</option><option>3</option><option selected>4</option><option>6</option>
      </select>
    </label>
    <button class="btn btn-ghost" onclick="pvBuild()" title="套用最新的 gameCode 重跑">🔄 重新載入</button>
    <button class="btn btn-neutral" onclick="closeGamePreview()">✕ 關閉</button>
  </div>
  <div class="pv-stagearea" id="pvStageArea"></div>
  <div class="pv-ctrls" id="pvCtrls"></div>
</div>

<script>
  // ═══════════════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════════════
  let modules            = [];      // summary list from /api/modules
  let currentId          = null;    // currently open module id
  let manifest           = null;    // working copy (mutated directly)
  let originalSnapshot   = null;    // JSON string for dirty check
  let history            = [];      // undo stack: array of JSON strings
  let openDecks          = new Set();  // deck IDs that are visually expanded
  let rawMode            = false;   // raw JSON edit mode
  let activeTab          = 'basic';
  let globalDecks        = [];      // global decks from /api/decks
  let serverCode         = '';      // server.js code content
  let originalServerCode = '';      // original server.js code for dirty check

  const HIST_LIMIT = 30;
  const STAGE_TYPE_VALUES = ['identity_draw','card_play','vote','result','game','intermission','loop','goto','select'];
  function getStageTypes() {
    return STAGE_TYPE_VALUES.map(v => ({ value: v, label: (typeof t === 'function' ? t('stage.'+v) : v) }));
  }

  const LOOP_EXIT_TYPES = [
    { value: 'alivePlayers', label: '存活玩家數' },
    { value: 'teamPlayers',  label: '特定陣營玩家數' },
    { value: 'iterations',   label: '已執行次數' },
  ];
  const LOOP_OPERATORS = [
    { value: 'lte', label: '≤' },
    { value: 'lt',  label: '<' },
    { value: 'gte', label: '≥' },
    { value: 'gt',  label: '>' },
    { value: 'eq',  label: '=' },
    { value: 'neq', label: '≠' },
  ];

  // 推進選項根據階段類型和用途過濾，實現兩階段設定
  const ADVANCE_TRIGGERS = [
    // === 階段結束時推進（適用所有階段類型）===
    { value: 'host',              types: ['all'], category: 'stage_advance' },
    { value: 'auto_restart',      types: ['result'], category: 'stage_advance' },
    { value: 'restart_timer',     types: ['result'], category: 'stage_advance' },

    // === 身份抽取階段 ===
    { value: 'all_confirmed',     types: ['identity_draw'], category: 'stage_advance' },
    { value: 'identity_timer',    types: ['identity_draw'], category: 'stage_advance' },

    // === 出牌階段：階段結束時推進（最後一回合結束後）===
    { value: 'host',              types: ['card_play'], category: 'stage_advance' },
    { value: 'auto_next',         types: ['card_play'], category: 'stage_advance' },
    { value: 'round_timer',       types: ['card_play'], category: 'stage_advance' },

    // === 出牌階段：何時翻牌（全員出牌後）===
    { value: 'host_reveal',       types: ['card_play'], category: 'reveal' },
    { value: 'all_played',        types: ['card_play'], category: 'reveal' },
    { value: 'play_timer',        types: ['card_play'], category: 'reveal' },

    // === 出牌階段：翻牌後何時進下一回合 ===
    { value: 'host',              types: ['card_play'], category: 'next_round' },
    { value: 'auto_next',         types: ['card_play'], category: 'next_round' },
    { value: 'round_timer',       types: ['card_play'], category: 'next_round' },

    // === 投票階段 ===
    { value: 'host',              types: ['vote'], category: 'stage_advance' },
    { value: 'auto',              types: ['vote'], category: 'stage_advance' },
    { value: 'timer',             types: ['vote'], category: 'stage_advance' },

    // === 其他階段類型 ===
    { value: 'all_submitted',     types: ['game'], category: 'stage_advance' },
    { value: 'host',              types: ['intermission'], category: 'stage_advance' },
    { value: 'timer',             types: ['intermission'], category: 'stage_advance' },
    { value: 'auto',              types: ['intermission'], category: 'stage_advance' },
  ];
  function getTriggerLabel(value) {
    return (typeof t === 'function') ? t('trigger.' + value) : value;
  }
  const DECK_TYPES = [
    { value: 'role',   label: '身份' },
    { value: 'action', label: '行動' },
    { value: 'event',  label: '事件' },
    { value: 'item',   label: '道具' },
  ];

  // ═══════════════════════════════════════════════════════════════
  //  UTILITIES
  // ═══════════════════════════════════════════════════════════════
  const clone   = (o) => JSON.parse(JSON.stringify(o));
  const escapeH = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid     = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
  const isDirty = () => manifest && JSON.stringify(manifest) !== originalSnapshot;

  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 3500);
  }

  // ═══════════════════════════════════════════════════════════════
  //  HISTORY (UNDO)
  // ═══════════════════════════════════════════════════════════════
  function pushHistory() {
    if (!manifest) return;
    history.push(JSON.stringify(manifest));
    if (history.length > HIST_LIMIT) history.shift();
    document.getElementById('undoBtn').disabled = history.length === 0;
  }

  function undo() {
    if (!history.length) return;
    const prev = history.pop();
    manifest = JSON.parse(prev);
    document.getElementById('undoBtn').disabled = history.length === 0;
    rerenderAll();
    afterChange(/*skipHistory=*/true);
    toast('↶ 已還原一步', 'ok');
  }

  // ═══════════════════════════════════════════════════════════════
  //  CHANGE TRACKING
  // ═══════════════════════════════════════════════════════════════
  // Call after any mutation. snapshotFirst=true pushes prev state to undo.
  function afterChange(skipHistory) {
    if (!skipHistory) pushHistory();
    runValidation();
    updateButtons();
    renderModuleList(); // dirty indicator
  }

  // ═══════════════════════════════════════════════════════════════
  //  MODULE LIST
  // ═══════════════════════════════════════════════════════════════
  async function loadModuleList() {
    try {
      const res = await fetch('/api/modules');
      modules = await res.json();
      renderModuleList();
    } catch (e) { toast('載入模組列表失敗：' + e.message, 'err'); }
  }

  // ── 模組「開放」旗標(published):superuser 才看得到切換與徽章 ──
  let meSuper = false;
  fetch('/api/me').then(r => r.json()).then(d => { meSuper = !!d.superuser; updatePubBtn(); renderModuleList(); }).catch(() => {});
  function updatePubBtn() {
    const b = document.getElementById('pubBtn');
    if (!b) return;
    if (!meSuper || !currentId || !manifest) { b.style.display = 'none'; return; }
    const pub = manifest.published === true;
    b.style.display = '';
    b.textContent = pub ? '● 已開放（點擊收回）' : '🧪 測試中（點擊開放）';
    b.style.color = pub ? '#66dd99' : '#ffb84d';
  }
  async function togglePublish() {
    if (!currentId || !manifest) return;
    const want = manifest.published !== true;
    try {
      const r = await fetch(`/api/modules/${encodeURIComponent(currentId)}/publish`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ published: want }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      // 同步進工作副本與快照(切換不算「未儲存修改」,之後儲存也不會把旗標蓋回去)
      manifest.published = d.published;
      try { const snap = JSON.parse(originalSnapshot); snap.published = d.published; originalSnapshot = JSON.stringify(snap); } catch (e) {}
      const mi = modules.find(m => m.id === currentId); if (mi) mi.published = d.published;
      updatePubBtn(); renderModuleList();
      toast(d.published ? '✓ 已開放 — 一般使用者現在可在 /labs/game 選到' : '已收回 — 僅 superuser 可見', 'ok');
    } catch (e) { toast('切換失敗：' + e.message, 'err'); }
  }

  function renderModuleList() {
    const wrap = document.getElementById('modList');
    const filter = (document.getElementById('filterInput')?.value || '').toLowerCase();
    const list = !filter ? modules : modules.filter(m =>
      m.id.toLowerCase().includes(filter) ||
      (m.name||'').toLowerCase().includes(filter) ||
      (m.description||'').toLowerCase().includes(filter)
    );
    if (!list.length) {
      wrap.innerHTML = `<div style="color:#555;font-size:.8rem;">${filter ? '沒有符合的模組' : '沒有可用模組'}</div>`;
      return;
    }
    wrap.innerHTML = list.map(m => {
      const isSel  = m.id === currentId;
      const isMark = isSel && isDirty();
      return `<div class="mod-item ${isSel ? 'selected' : ''} ${isMark ? 'dirty' : ''}"
                   onclick="selectModule('${escapeH(m.id)}')">
        <div class="mi-name">${escapeH(m.name)}${meSuper ? (m.published === true ? ' <span style="font-size:10px;color:#66dd99">●</span>' : ' <span style="font-size:10px">🧪</span>') : ''}</div>
        <div class="mi-id">${escapeH(m.id)}</div>
        ${m.description ? `<div class="mi-desc">${escapeH(m.description)}</div>` : ''}
        <div class="mi-meta">${m.minPlayers}–${m.maxPlayers} 人 · v${escapeH(m.version || '')}</div>
      </div>`;
    }).join('');
  }

  // ═══════════════════════════════════════════════════════════════
  //  SELECTION / LOADING
  // ═══════════════════════════════════════════════════════════════
  async function selectModule(id) {
    // Same module + clean → no-op (avoids resetting open decks)
    if (currentId === id && !isDirty()) return;
    if (isDirty() && !confirm('有未儲存的修改，確定要捨棄並切換？')) return;

    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('editorContent').classList.remove('hidden');

    try {
      const res = await fetch(`/api/modules/${encodeURIComponent(id)}`);
      const ct  = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error(`Server 回應錯誤（${res.status}）— 請重啟 server`);
      const m = await res.json();
      if (!res.ok) throw new Error(m.error || '載入失敗');

      currentId        = id;
      manifest         = m;
      originalSnapshot = JSON.stringify(manifest);
      history          = [];
      openDecks        = new Set();
      rawMode          = false;
      updatePubBtn();

      // Load server.js if exists
      await loadServerCode(id);

      // Update URL so refresh keeps the selection
      const url = new URL(location.href);
      url.searchParams.set('id', id);
      history.length === 0 && window.history.replaceState({}, '', url);

      rerenderAll();
      runValidation();
      updateButtons();
      renderModuleList();
    } catch (e) { toast(e.message, 'err'); }
  }

  function reloadCurrent() {
    if (!currentId || !isDirty()) return;
    if (!confirm('放棄所有未儲存的修改，重新從伺服器載入？')) return;
    const id = currentId;
    currentId = null;       // bypass the same-id no-op
    selectModule(id);
  }

  function rerenderAll() {
    renderHeader();
    renderOverviewTab();
    renderParamsTab();
    renderDecksTab();
    renderStagesTab();
    renderAdvancedTab();
  }

  // ═══════════════════════════════════════════════════════════════
  //  HEADER
  // ═══════════════════════════════════════════════════════════════
  function renderHeader() {
    document.getElementById('edTitle').textContent = manifest.name || currentId;
    document.getElementById('edIdTag').textContent = currentId;
    document.getElementById('metaName').value      = manifest.name || '';
    document.getElementById('metaDesc').value      = manifest.description || '';
    document.getElementById('metaMin').value       = manifest.minPlayers ?? 2;
    document.getElementById('metaMax').value       = manifest.maxPlayers ?? 8;
    document.getElementById('metaVer').value       = manifest.version || '1.0.0';
  }

  function onMetaChange(key, value) {
    if (!manifest) return;
    pushHistory();
    if (key === 'name') {
      manifest.name = value;
      document.getElementById('edTitle').textContent = value || currentId;
    } else if (key === 'description') manifest.description = value;
    else if (key === 'minPlayers')    manifest.minPlayers  = Number(value);
    else if (key === 'maxPlayers')    manifest.maxPlayers  = Number(value);
    else if (key === 'version')       manifest.version     = value;
    afterChange(true);
  }

  function updateButtons() {
    const errs = currentValidationErrors;
    const dirty = isDirty();
    document.getElementById('saveBtn').disabled  = !currentId || !dirty || errs.length > 0;
    document.getElementById('resetBtn').disabled = !currentId || !dirty;
    document.getElementById('delBtn').disabled   = !currentId || modules.length <= 1;
  }

  // ═══════════════════════════════════════════════════════════════
  //  TABS
  // ═══════════════════════════════════════════════════════════════
  function switchCfgTab(name) {
    activeTab = name;
    document.querySelectorAll('.cfg-tab').forEach((t, i) => {
      t.classList.toggle('active', ['overview','params','decks','stages','advanced'][i] === name);
    });
    document.querySelectorAll('.cfg-tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('cfg' + name[0].toUpperCase() + name.slice(1)).classList.add('active');

    // Render the activated tab content
    if (name === 'overview') renderOverviewTab();
    else if (name === 'params') renderParamsTab();
    else if (name === 'decks') renderDecksTab();
    else if (name === 'stages') renderStagesTab();
    else if (name === 'advanced') renderAdvancedTab();
  }

  // ═══════════════════════════════════════════════════════════════
  //  TAB: OVERVIEW（給主持人看的人話版模組說明）
  // ═══════════════════════════════════════════════════════════════
  const OV_TRIGGER_LABELS = {
    host: '主持人手動推進', all_played: '全員出牌後自動', all_confirmed: '全員確認後自動',
    all_voted: '全員投票後自動', all_submitted: '全員送出後自動', all_ready: '全員準備後自動',
    auto: '固定延遲後自動', timer: '倒數計時後自動', identity_timer: '全員確認後倒數',
    play_timer: '全員出牌後倒數', generic_timer: '倒數計時後自動', auto_restart: '立即重新開始',
    restart_timer: '倒數後重新開始', host_reveal: '主持人手動揭牌', auto_next: '揭示後立即推進',
    round_timer: '揭示後倒數推進', vote_ended: '投票結束後自動',
  };
  const OV_STAGE_ICONS = {
    identity_draw: '🎭', card_play: '🃏', vote: '🗳️', intermission: '⏸️', select: '👤',
    game: '🎮', loop: '🔁', goto: '↪️', result: '🏁',
  };

  function ovAdvText(adv) {
    if (!adv || !adv.trigger) return '';
    let s = OV_TRIGGER_LABELS[adv.trigger] || adv.trigger;
    if (adv.duration != null) s += `（${adv.duration} 秒）`;
    if (adv.fallback === 'host') s += '，主持人可強制';
    return s;
  }

  function ovCondText(c) {
    if (!c) return '';
    const ops = { eq: '=', neq: '≠', lt: '<', lte: '≤', gt: '>', gte: '≥' };
    return `${c.param || c.type || '?'} ${ops[c.operator] || c.operator || '?'} ${c.value}`;
  }

  function ovStageDetails(s) {
    const bits = [];
    if (s.deckId) bits.push(`使用牌組「${s.deckId}」`);
    if (s.type === 'card_play') {
      if (s.maxRounds) bits.push(`共 ${s.maxRounds} 回合`);
      if (s.refillMode && s.refillMode !== 'none') bits.push(`補牌：${s.refillMode === 'per_round' ? `每回合 ${s.refillAmount ?? '?'} 張` : `低於 ${s.refillThreshold} 補到 ${s.refillTo}`}`);
    }
    if (s.type === 'vote' && s.voteConfig) {
      const v = s.voteConfig;
      bits.push(`投票對象：${v.target === 'options' ? '自訂選項' : '玩家'}`);
      if (v.countdownSeconds) bits.push(`倒數 ${v.countdownSeconds} 秒`);
      if (v.anonymous !== false) bits.push('匿名');
      if (v.multiSelect) bits.push(`可複選 ${v.maxSelections || ''}`);
      if (v.allowSelfVote) bits.push('可投自己');
    }
    if (s.type === 'game' && s.gameConfig) {
      bits.push(s.gameConfig.layout === 'custom' ? '🕹 手機互動介面' : `搖桿版型：${s.gameConfig.layout || 'dpad-2btn'}`);
      const nFiles = (s.gameConfig.files || []).length;
      if (nFiles) bits.push(`程式檔 ${nFiles} 個`);
      else if (s.gameConfig.gameCode || s.gameConfig.mobileCode) bits.push('含自訂畫面程式');
    }
    if (s.type === 'loop') {
      bits.push(`最多 ${s.maxIterations || '∞'} 輪`);
      if (s.entryCondition) bits.push(`進入條件：${ovCondText(s.entryCondition)}`);
      if (s.exitCondition) bits.push(`離開條件：${ovCondText(s.exitCondition)}`);
    }
    if (s.type === 'goto') {
      bits.push(`跳到「${s.target || '?'}」`);
      if (s.condition) bits.push(`條件：${ovCondText(s.condition)}`);
    }
    return bits.join('｜');
  }

  // ── 手機縮圖：畫出「這一關玩家手機上會看到什麼」（唯讀）──
  function pmDeckName(id) {
    const d = (manifest?.decks || []).find(d => d.id === id);
    return d ? (d.name || d.id) : (id || '?');
  }

  function pmGameLayout(cfg) {
    const L = (cfg && cfg.layout) || 'pad-4', lb = (cfg && cfg.buttonLabels) || {};
    if (L === 'custom') return '<div class="pm-sub" style="text-align:center">🕹 自訂互動畫面<br>（手機上直接玩）</div>';
    if (L === 'pad-8') return '<div class="pm-pad c4">' + '<b></b>'.repeat(8) + '</div>';
    if (L === 'pad-4') return '<div class="pm-pad c2">' + '<b></b>'.repeat(4) + '</div>';
    if (L === 'pad-2') return '<div class="pm-pad c2"><b></b><b></b></div>';
    if (L === 'dpad-2btn') return '<div class="pm-ctrl"><div class="pm-stick"></div>' +
      '<div class="pm-abcol"><b>' + escapeH(lb.btn1 || 'A') + '</b><b>' + escapeH(lb.btn2 || 'B') + '</b></div></div>';
    if (L === 'dpad-dpad') return '<div class="pm-ctrl">' +
      '<div class="pm-cross"><b class="u"></b><b class="d"></b><b class="l"></b><b class="r"></b></div>' +
      '<div class="pm-cross"><b class="u"></b><b class="d"></b><b class="l"></b><b class="r"></b></div></div>';
    return '';
  }

  function pmFrame(status, body, action) {
    return '<div class="pm-frame">' +
      '<div class="pm-topbar"><span>🎭</span><span>玩家</span><span>⭐0</span></div>' +
      (status ? '<div class="pm-status">' + status + '</div>' : '') +
      '<div class="pm-body">' + body + '</div>' +
      (action || '') + '</div>';
  }

  function renderPhoneMock(s) {
    const on = 'class="pm-action pm-action-on"', off = 'class="pm-action"';
    switch (s.type) {
      case 'identity_draw':
        return pmFrame('你的身份',
          `<div class="pm-idcard"><span class="big">🎭</span><b>身份卡</b><span class="pm-sub">從「${escapeH(pmDeckName(s.deckId))}」抽</span></div>`,
          `<div ${on}>確認身份</div>`);
      case 'card_play':
        return pmFrame(`第 1/${s.maxRounds || 1} 回合`,
          '<div class="pm-hand"><i></i><i></i><i></i></div>',
          `<div ${off}>請選擇一張牌</div>`);
      case 'vote': {
        const v = s.voteConfig || {};
        const sec = v.countdownSeconds ? ` · 00:${String(v.countdownSeconds).padStart(2, '0')}` : '';
        return pmFrame(escapeH(v.voteTitle || s.name || '投票') + sec,
          '<div class="pm-vote-opt">小明</div><div class="pm-vote-opt">小華</div><div class="pm-vote-opt">小美</div>',
          `<div ${on}>送出投票</div>`);
      }
      case 'intermission':
        return pmFrame('',
          `<div class="pm-mid"><span class="big">⏸️</span><div>${escapeH(s.description || '遊戲暫停中')}</div></div>`, '');
      case 'game':
        return pmFrame('操作你的控制器', pmGameLayout(s.gameConfig), '');
      case 'result':
        return pmFrame('',
          '<div class="pm-result"><span class="big">🏆</span><b>遊戲結束</b><div class="pm-sub">1. 小明　2. 小華</div></div>', '');
      case 'loop':
        return `<div class="pm-loop">🔁 循環 ×${s.maxIterations || '∞'}<br><span class="pm-sub">內含 ${(s.children || s.stages || []).length} 個子關</span></div>`;
      case 'goto':
        return `<div class="pm-goto">↪️<br>跳到「${escapeH(s.target || '?')}」</div>`;
      default:
        return pmFrame('', `<div class="pm-sub">${escapeH(s.type || '?')}</div>`, '');
    }
  }

  // 點故事板卡片 → 跳到「階段」表單對應列
  function jumpToStageForm(si) {
    switchCfgTab('stages');
    requestAnimationFrame(() => {
      const row = document.getElementById('stage_row_' + si);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.remove('stage-flash');
      void row.offsetWidth;
      row.classList.add('stage-flash');
    });
  }

  function ovRenderStage(s, num, isChild, topIdx) {
    const pa = (s.paramActions || []).map(p =>
      `<div class="ov-pa">⚡ ${p.trigger === 'onStageStart' ? '開始時' : '結束時'}：${escapeH(p.action)}${p.targetParam ? ' → ' + escapeH(p.targetParam) : ''}${p.value !== undefined ? '（' + escapeH(JSON.stringify(p.value)) + '）' : ''}</div>`).join('');
    const details = ovStageDetails(s);
    const adv = ovAdvText(s.advance);
    let html = `
      <div class="ov-stage${isChild ? ' child' : ''}${s.enabled ? '' : ' off'}" data-stage-id="${escapeH(s.id || '')}" onclick="jumpToStageForm(${topIdx})" title="點擊跳到對應的階段表單">
        <span class="num">${num}</span>
        <div class="body">
          <span class="sname">${OV_STAGE_ICONS[s.type] || '▫️'} ${escapeH(s.name || s.id)}</span>
          <span class="stype">${escapeH(s.type)}${s.enabled ? '' : '（已停用）'}</span>
          ${s.description ? `<div class="sdesc">${escapeH(s.description)}</div>` : ''}
          ${details ? `<div class="sdesc">${escapeH(details)}</div>` : ''}
          ${adv ? `<div class="ov-adv">→ ${escapeH(adv)}</div>` : ''}
          ${pa}
        </div>
        <div class="pm-wrap">${renderPhoneMock(s)}<div class="pm-caption">${s.type === 'loop' || s.type === 'goto' ? '流程控制' : '玩家手機'}</div></div>
      </div>`;
    const children = s.children || s.stages || [];
    children.forEach((c, i) => { html += ovRenderStage(c, `${num}.${i + 1}`, true, topIdx); });
    return html;
  }

  function renderOverviewTab() {
    const el = document.getElementById('cfgOverview');
    if (!el) return;
    if (!manifest) { el.innerHTML = ''; return; }

    const decksHtml = (manifest.decks || []).map(d => {
      const src = d.ref
        ? `引用全域牌組「${d.ref}」${d.selectedCards ? `，選用 ${Object.keys(d.selectedCards).length} 種卡` : '（整副）'}`
        : `內嵌 ${(d.cards || []).length} 張卡`;
      return `<div class="ov-deck">🎴 <b>${escapeH(d.name || d.id)}</b>（${escapeH(d.id)}）— ${escapeH(src)}｜每人抽 ${d.drawCount ?? '?'} 張${d.allowDuplicate ? '，可重複' : ''}${d.enabled === false ? '｜<span style="color:#ff8866">已停用</span>' : ''}</div>`;
    }).join('') || '<div class="ov-empty">（沒有牌組）</div>';

    const stagesHtml = (manifest.stages || []).map((s, i) => ovRenderStage(s, String(i + 1), false, i)).join('<div class="ov-connector"></div>')
      || '<div class="ov-empty">（沒有階段）</div>';

    const gp = (manifest.globalParams || []).map(p =>
      `<div class="ov-deck">🌐 <b>${escapeH(p.label || p.id)}</b>（${escapeH(p.id)}）— ${escapeH(p.type)}，初始值 ${escapeH(JSON.stringify(p.initialValue ?? null))}</div>`).join('');
    const pa = (manifest.playerAttributes || []).map(p =>
      `<div class="ov-deck">👤 <b>${escapeH(p.label || p.id)}</b>（${escapeH(p.id)}）— ${escapeH(p.type)}</div>`).join('');
    const paramsHtml = (gp + pa) || '<div class="ov-empty">（沒有自訂參數）</div>';

    el.innerHTML = `
      <div class="ov-section">
        <div class="ov-title">📋 基本資料</div>
        <div class="ov-meta">
          <b>${escapeH(manifest.name || currentId)}</b>（${escapeH(currentId || manifest.id || '')}）｜${manifest.minPlayers ?? '?'}–${manifest.maxPlayers ?? '?'} 人｜v${escapeH(manifest.version || '1.0.0')}${manifest.engine ? `｜引擎：${escapeH(manifest.engine)}` : ''}
          ${manifest.description ? `<div style="color:#9999cc;margin-top:4px;">${escapeH(manifest.description)}</div>` : ''}
        </div>
      </div>
      <div class="ov-section">
        <div class="ov-title">🎬 遊戲流程（依序執行）</div>
        ${stagesHtml}
      </div>
      <div class="ov-section">
        <div class="ov-title">🎴 牌組</div>
        ${decksHtml}
      </div>
      <div class="ov-section">
        <div class="ov-title">⚙️ 參數</div>
        ${paramsHtml}
      </div>
      <div class="ov-section">
        <div class="ov-title">🤖 Kimi 筆記（KIMI.md — 它的長期記憶）</div>
        <div id="ovKimiNotes" class="ov-empty">載入中…</div>
      </div>
      <div class="ov-hint ov-empty" style="margin-top:4px;">💡 每張卡右側是玩家手機會看到的畫面。<b>點卡片</b>可跳到對應表單微調；或直接在右側跟 Kimi 說，例如「投票改成 60 秒、可以改票」。</div>`;
    loadOvNotes();
  }

  // Kimi 筆記顯示（快取；AI 有動作時清快取重抓）
  let ovNotesCache = { id: null, text: null };
  function loadOvNotes() {
    const el = document.getElementById('ovKimiNotes');
    if (!el || !currentId) return;
    if (ovNotesCache.id === currentId) {
      el.textContent = ovNotesCache.text || '（尚無筆記 — Kimi 完成重要工作後會自動記在這，作為它跨對話的記憶）';
      el.className = ovNotesCache.text ? 'ov-notes' : 'ov-empty';
      return;
    }
    const forId = currentId;
    fetch(`/api/modules/${encodeURIComponent(forId)}/notes`)
      .then(r => r.ok ? r.text() : null)
      .then(t => {
        ovNotesCache = { id: forId, text: t };
        const el2 = document.getElementById('ovKimiNotes');
        if (el2 && currentId === forId) {
          el2.textContent = t || '（尚無筆記 — Kimi 完成重要工作後會自動記在這，作為它跨對話的記憶）';
          el2.className = t ? 'ov-notes' : 'ov-empty';
        }
      }).catch(() => {});
  }

  // ═══════════════════════════════════════════════════════════════
  //  AI 聊天（Kimi 設計核心）
  // ═══════════════════════════════════════════════════════════════
  let aiSocket = null, aiBusy = false;
  const aiToolEls = [];   // 依序記錄 tool_start 元素，tool_done 依序回填
  // 持久對話 ID：頁面刷新/socket 重連後仍能收到進行中任務的進度
  const aiChatId = sessionStorage.getItem('ai_chat_id') ||
    (() => { const id = 'chat_' + Math.random().toString(36).slice(2, 12); sessionStorage.setItem('ai_chat_id', id); return id; })();

  function initAiChat() {
    fetch('/api/ai/status').then(r => r.json()).then(s => {
      document.getElementById('aiDot').classList.toggle('on', !!s.configured);
      document.getElementById('aiModel').textContent = s.configured ? s.model : '';
      if (!s.configured) {
        document.getElementById('aiHint').textContent = '⚠️ 尚未設定 Kimi API key（server/ai/ai-config.json），聊天無法使用。';
        document.getElementById('aiInput').disabled = true;
        document.getElementById('aiSendBtn').disabled = true;
      }
    }).catch(() => {});
    aiSocket = io({ path: (window.IMGAME_BASE || '') + '/socket.io' });
    aiSocket.on('ai_update', handleAiUpdate);
    aiSocket.on('connect', () => aiSocket.emit('ai_join', { chatId: aiChatId }));  // 含重連
  }

  function aiAppend(cls, text) {
    const log = document.getElementById('aiLog');
    const div = document.createElement('div');
    div.className = cls.startsWith('ai-') ? cls : 'ai-msg ' + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function handleAiUpdate(evt) {
    if (evt.type === 'tool_start') {
      const el = aiAppend('ai-tool', '');
      el.innerHTML = `<b>${escapeH(evt.label || evt.name)}</b>…`;
      aiToolEls.push({ name: evt.name, el, args: evt.args || {} });
      aiProgressText = (evt.label || evt.name) + '…';
      updateAiTypingLine();
    } else if (evt.type === 'tool_done') {
      const rec = aiToolEls.reverse().find(r => r.name === evt.name && !r.done); aiToolEls.reverse();
      if (rec) {
        rec.done = true;
        rec.el.innerHTML = `${evt.ok ? '<span class="ok">✔</span>' : '<span class="fail">✘</span>'} ${escapeH(evt.label || evt.name)} ${escapeH(evt.brief || '')}`;
      }
      aiProgressText = '思考下一步…';
      updateAiTypingLine();
      handleAiSideEffects(evt, rec ? rec.args : null);
    } else if (evt.type === 'progress') {
      aiProgressText = evt.message;
      if (!aiBusy) setAiBusy(true);   // 重連續上進行中任務時也會走到這
      updateAiTypingLine();
    } else if (evt.type === 'screenshots') {
      // Kimi 的視覺測試截圖 — 設計師也看得到它看到的畫面
      const el = aiAppend('bot', '');
      el.innerHTML = '<b>📸 視覺測試截圖</b>' + (evt.images || []).map(src =>
        `<img src="${src}" style="width:100%;border-radius:8px;margin-top:6px;border:1px solid #2a2a5a;cursor:pointer" onclick="window.open(this.src)">`).join('');
    } else if (evt.type === 'plan') {
      // Kimi 的執行計畫：顯示成結構化卡片
      const p = evt.plan || {};
      const el = aiAppend('bot', '');
      el.innerHTML = `<b>📋 ${escapeH(p.goal || '執行計畫')}</b><br>` +
        (p.steps || []).map((s, i) => `${i + 1}. ${escapeH(s)}`).join('<br>') +
        ((p.files && p.files.length) ? `<br><span style="color:#8888bb;font-size:.74rem">📁 ${p.files.map(escapeH).join('、')}</span>` : '');
    } else if (evt.type === 'assistant') {
      aiAppend('bot', evt.text);
    } else if (evt.type === 'status') {
      aiAppend('ai-typing', evt.message);
      setAiBusy(true);   // 重連續上進行中的任務 → 維持忙碌狀態直到 done
    } else if (evt.type === 'error') {
      aiAppend('err', '❌ ' + evt.message);
      setAiBusy(false);
    } else if (evt.type === 'done') {
      setAiBusy(false);
    }
  }

  // ── AI 變更的即時視覺回饋：比對新舊 manifest → 反白剛改過的元素 ──
  function diffManifests(oldM, newM) {
    const keys = new Set();
    if (!oldM || !newM) return keys;
    const j = o => JSON.stringify(o ?? null);
    if (['name', 'description', 'minPlayers', 'maxPlayers', 'version'].some(k => j(oldM[k]) !== j(newM[k]))) keys.add('meta');
    if (j(oldM.globalParams) !== j(newM.globalParams) || j(oldM.playerAttributes) !== j(newM.playerAttributes) ||
        j(oldM.fieldConfig) !== j(newM.fieldConfig)) keys.add('params');
    if (j(oldM.decks) !== j(newM.decks)) keys.add('decks');

    // 階段：遞迴收集舊狀態（含 loop children），逐一比對；細到單一程式檔
    const oldStageMap = new Map();
    const collect = (stages) => (stages || []).forEach(s => { oldStageMap.set(s.id, s); collect(s.children || s.stages); });
    collect(oldM.stages);
    const walk = (stages, topId) => (stages || []).forEach(s => {
      const top = topId || s.id;
      const old = oldStageMap.get(s.id);
      if (!old || j(old) !== j(s)) {
        keys.add('stages');
        keys.add('stage:' + top);
        const oldFiles = new Map(((old && old.gameConfig && old.gameConfig.files) || []).map(f => [f.name, j(f)]));
        for (const f of ((s.gameConfig && s.gameConfig.files) || [])) {
          if (oldFiles.get(f.name) !== j(f)) keys.add('file:' + s.id + '|' + f.name);
        }
      }
      walk(s.children || s.stages, top);
    });
    walk(newM.stages, null);
    if ((oldM.stages || []).length !== (newM.stages || []).length) keys.add('stages');
    return keys;
  }

  function aiFlashEl(el) {
    if (!el) return;
    el.classList.remove('ai-flash');
    void el.offsetWidth;
    el.classList.add('ai-flash');
    setTimeout(() => el.classList.remove('ai-flash'), 2600);
  }

  function cfgTabButton(name) {
    const idx = ['overview', 'params', 'decks', 'stages', 'advanced'].indexOf(name);
    return idx >= 0 ? document.querySelectorAll('.cfg-tab')[idx] : null;
  }

  function flashAiChanges(keys) {
    for (const key of keys) {
      if (key === 'meta') aiFlashEl(document.querySelector('.ed-head'));
      else if (key === 'params') { aiFlashEl(cfgTabButton('params')); aiFlashEl(document.getElementById('cfgParams')); }
      else if (key === 'decks')  { aiFlashEl(cfgTabButton('decks'));  aiFlashEl(document.getElementById('cfgDecks')); }
      else if (key === 'stages') aiFlashEl(cfgTabButton('stages'));
      else if (key.startsWith('stage:')) {
        const id = key.slice(6);
        aiFlashEl(document.querySelector(`.ov-stage[data-stage-id="${CSS.escape(id)}"]`));
        const si = (manifest.stages || []).findIndex(s => s.id === id);
        if (si >= 0) aiFlashEl(document.getElementById('stage_row_' + si));
      } else if (key.startsWith('file:')) {
        aiFlashEl(document.querySelector(`.gf-row[data-gf="${CSS.escape(key.slice(5))}"]`));
      }
    }
  }

  // AI 動了模組檔案 → 同步編輯器畫面 + 反白剛改過的部分
  function handleAiSideEffects(evt, args) {
    if (!evt.ok || !args) return;
    if (evt.name === 'write_module_notes') {   // 筆記更新 → 清快取重畫總覽
      ovNotesCache = { id: null, text: null };
      if (args.moduleId === currentId) renderOverviewTab();
      return;
    }
    if (!['save_module', 'clone_module', 'save_engine_code', 'write_game_file', 'delete_game_file'].includes(evt.name)) return;
    loadModuleList();
    const id = args.id || args.newId || args.moduleId;
    if (!id) return;
    if (id === currentId) {
      // 目前開啟的模組被 AI 更新：押一筆 undo 保留本地狀態後重載
      fetch('/api/modules/' + id).then(r => r.json()).then(m => {
        if (m && !m.error) {
          const oldManifest = manifest;
          if (manifest) pushHistory();
          manifest = m;
          originalSnapshot = JSON.stringify(m);
          runValidation();
          rerenderAll();
          updateButtons();
          flashAiChanges(diffManifests(oldManifest, m));
          toast('🤖 Kimi 已更新此模組');
        }
      });
    } else if (!currentId && evt.name !== 'save_engine_code') {
      selectModule(id);   // 還沒開任何模組 → 直接打開 AI 剛做好的
    }
  }

  let aiProgressText = '思考中…', aiBusyStart = 0, aiTypingTimer = null;

  function updateAiTypingLine() {
    if (!aiBusy) return;
    const s = Math.floor((Date.now() - aiBusyStart) / 1000);
    const mm = s >= 60 ? `${Math.floor(s / 60)}m${s % 60}s` : `${s}s`;
    document.getElementById('aiTyping').textContent = `${aiProgressText}（${mm}）`;
  }

  function setAiBusy(b) {
    aiBusy = b;
    const btn = document.getElementById('aiSendBtn');
    btn.disabled = false;
    btn.textContent = b ? '⏹ 停止' : '送出';
    btn.classList.toggle('btn-danger', b);
    btn.classList.toggle('btn-primary', !b);
    document.getElementById('aiTyping').classList.toggle('hidden', !b);
    if (b) {
      if (!aiBusyStart || !aiTypingTimer) aiBusyStart = Date.now();
      aiProgressText = aiProgressText || '思考中…';
      clearInterval(aiTypingTimer);
      aiTypingTimer = setInterval(updateAiTypingLine, 1000);
      updateAiTypingLine();
    } else {
      clearInterval(aiTypingTimer);
      aiTypingTimer = null;
      aiBusyStart = 0;
      aiProgressText = '思考中…';
    }
  }

  // ── 貼圖：Ctrl+V 貼上或拖放截圖，連同訊息送給 Kimi 視覺分析 ──
  let aiPendingImages = [];   // dataURL（已縮圖壓縮）

  function aiDownscaleImage(file) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        const s = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(null);
      img.src = URL.createObjectURL(file);
    });
  }

  async function aiAddImageFiles(files) {
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      if (aiPendingImages.length >= 3) { toast('最多附 3 張圖', 'err'); break; }
      const url = await aiDownscaleImage(f);
      if (url) aiPendingImages.push(url);
    }
    renderAiAttach();
  }

  let aiPendingAssets = [];   // 已上傳素材 {path, url, type, sizeKB, preview?}

  function renderAiAttach() {
    const el = document.getElementById('aiAttach');
    el.classList.toggle('hidden', !aiPendingImages.length && !aiPendingAssets.length);
    el.innerHTML =
      aiPendingImages.map((u, i) =>
        `<div class="thumb"><img src="${u}"><button class="rm" onclick="aiRemoveImage(${i})">✕</button></div>`).join('') +
      aiPendingAssets.map((a, i) =>
        `<div class="asset-chip" title="${escapeH(a.path)}">📎<span>${escapeH(a.path)}</span><button onclick="aiRemoveAsset(${i})">✕</button></div>`).join('');
  }

  function aiRemoveImage(i) {
    aiPendingImages.splice(i, 1);
    renderAiAttach();
  }

  function aiRemoveAsset(i) {   // 只移出這則訊息，檔案仍留在素材庫
    aiPendingAssets.splice(i, 1);
    renderAiAttach();
  }

  // 📎 上傳素材：存進伺服器素材庫，圖片另附預覽給 Kimi 視覺判斷
  async function aiUploadAssets(files) {
    const list = [...files];
    if (!list.length) return;
    const fd = new FormData();
    list.forEach(f => fd.append('files', f));
    let res;
    try {
      res = await fetch('/api/assets', { method: 'POST', body: fd }).then(r => r.json());
    } catch (e) { toast('素材上傳失敗', 'err'); return; }
    for (const saved of (res.files || [])) {
      aiPendingAssets.push(saved);
      if (saved.type?.startsWith('image/')) {
        const orig = list.find(f => saved.path.includes(f.name.replace(/[^\w\-.]/g, '_').replace(/\.[^.]*$/, ''))) || list[0];
        if (orig && aiPendingImages.length < 3) {
          const preview = await aiDownscaleImage(orig);
          if (preview) aiPendingImages.push(preview);
        }
      }
    }
    renderAiAttach();
    if ((res.files || []).length) toast(`已上傳 ${res.files.length} 個素材`);
  }

  document.getElementById('aiInput').addEventListener('paste', e => {
    const files = [...(e.clipboardData?.items || [])]
      .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
      .map(it => it.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); aiAddImageFiles(files); }
  });
  const aiSidebarEl = document.querySelector('.ai-sidebar');
  aiSidebarEl.addEventListener('dragover', e => e.preventDefault());
  aiSidebarEl.addEventListener('drop', e => {
    e.preventDefault();
    const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
    if (files.length) aiAddImageFiles(files);
  });

  function sendAiChat() {
    if (aiBusy) {   // 忙碌中按鈕 = ⏹ 停止
      aiSocket.emit('ai_stop', { chatId: aiChatId });
      const btn = document.getElementById('aiSendBtn');
      btn.textContent = '停止中…';
      btn.disabled = true;
      return;
    }
    const ta = document.getElementById('aiInput');
    let text = ta.value.trim();
    if ((!text && !aiPendingImages.length && !aiPendingAssets.length) || !aiSocket) return;
    const images = aiPendingImages.splice(0);
    const assets = aiPendingAssets.splice(0);
    if (assets.length) {
      // 素材資訊附進訊息文字：Kimi 拿到正式 URL 可直接在程式引用/整理/加工
      text += (text ? '\n\n' : '') + '[已上傳素材到素材庫]\n' +
        assets.map(a => `- ${a.path}（${a.type || '?'}，${a.sizeKB}KB）→ ${a.url}`).join('\n');
    }
    renderAiAttach();
    const bubble = aiAppend('user', text || '（附圖）');
    if (images.length) {
      const att = document.createElement('div');
      att.className = 'att';
      att.innerHTML = images.map(u => `<img src="${u}" onclick="window.open(this.src)">`).join('');
      bubble.appendChild(att);
    }
    ta.value = '';
    setAiBusy(true);
    aiSocket.emit('ai_chat', { chatId: aiChatId, text, moduleId: currentId, images });
  }

  function resetAiChat() {
    if (aiSocket) aiSocket.emit('ai_reset', { chatId: aiChatId });
    document.getElementById('aiLog').innerHTML = '';
    aiToolEls.length = 0;
    aiAppend('bot', '對話已清除，重新開始吧。');
    setAiBusy(false);
  }

  // ⌘/Ctrl+Enter 才送出 — 中文輸入法選字的 Enter 不會誤觸
  document.getElementById('aiInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); sendAiChat(); }
  });

  function renderParamsTab() {
    const el = document.getElementById('cfgParams');

    const playerAttributes = manifest.playerAttributes || [];

    el.innerHTML = `

    return `
      <div class="param-row">
        <div class="param-head">
          <input type="text" class="param-id-input" value="${escapeH(param.id || '')}"
                 placeholder="參數 ID" onchange="updateGlobalParam(${index}, 'id', this.value)">
          <select class="param-type-select" onchange="updateGlobalParam(${index}, 'type', this.value)">
            ${typeOptions}
          </select>
          <input type="text" class="param-label-input" value="${escapeH(param.label || '')}"
                 placeholder="顯示名稱" onchange="updateGlobalParam(${index}, 'label', this.value)">
          <button class="btn btn-danger btn-sm" onclick="deleteGlobalParam(${index})">刪除</button>
        </div>
        <div class="param-details">
          ${param.type === 'number' ? `
            <div class="param-detail">
              <label>子類型：</label>
              <select onchange="updateGlobalParam(${index}, 'subType', this.value)">
                <option value="">無</option>
                <option value="integer" ${param.subType === 'integer' ? 'selected' : ''}>整數</option>
                <option value="float" ${param.subType === 'float' ? 'selected' : ''}>浮點數</option>
              </select>
            </div>
            <div class="param-detail">
              <label>最小值：</label>
              <input type="number" value="${param.min ?? ''}" placeholder="無限制"
                     onchange="updateGlobalParam(${index}, 'min', this.value === '' ? null : Number(this.value))">
            </div>
            <div class="param-detail">
              <label>最大值：</label>
              <input type="number" value="${param.max ?? ''}" placeholder="無限制"
                     onchange="updateGlobalParam(${index}, 'max', this.value === '' ? null : Number(this.value))">
            </div>
          ` : ''}
          <div class="param-detail">
            <label>初始值：</label>
            <input type="text" value="${param.initialValue !== undefined ? escapeH(JSON.stringify(param.initialValue)) : ''}"
                   placeholder="預設值"
                   onchange="updateGlobalParam(${index}, 'initialValue', this.value === '' ? null : this.value)">
          </div>
          <div class="param-detail" style="grid-column: 1 / -1;">

                <option value="integer" ${attr.subType === 'integer' ? 'selected' : ''}>整數</option>

              <label>最大值：</label>
