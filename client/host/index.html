    document.getElementById('phaseBadgeText').textContent = labels[p] || p.toUpperCase();
  }

  function setQR(rid) {
    const origin = window.location.origin;
    document.getElementById('qrImg').src = `/api/rooms/${rid}/qr`;
    document.getElementById('joinUrlText').textContent = `${origin}/mobile?room=${rid}`;
  }

  function addLog(msg, isErr = false) {
    const list = document.getElementById('logList');
    const now  = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    const el   = document.createElement('div');
    el.className = 'log-entry' + (isErr ? ' err' : '');
    el.innerHTML = `<span class="ts">${now}</span>${msg}`;
    list.prepend(el);
    if (list.children.length > 60) list.lastChild.remove();
  }

  // ── Vote System ───────────────────────────────────────────────
  let voteData = null;

  function showVotePanel(data) {
    voteData = data;
    voteSubmissions.clear(); // Clear submissions when new vote starts
    showPanel('vote');

    document.getElementById('voteModuleName').textContent = data.voteTitle || data.stageName || '投票階段';
    document.getElementById('votePhaseLabel').textContent = data.anonymous ? '匿名投票' : '公開投票';

    console.log('[Host] Showing vote panel with data:', data);

    renderVotePlayers(data);
    renderVoteOptions(data);
    renderVoteActions(data);
  }

  function renderVotePlayers(data) {
    const players = currentPlayers || [];

    // Use voteSubmissions Set to track who has submitted
    const grid = document.getElementById('votePlayerGrid');
    grid.innerHTML = players.map(p => {
      const hasSubmitted = voteSubmissions.has(p.id);
      return `<div class="gp-player-row ${hasSubmitted ? 'played' : 'waiting'}">
        <span class="gp-status-icon">${hasSubmitted ? '✓' : '⏳'}</span>
        <span class="gp-pname">${p.name}</span>
        <span class="gp-pstatus">${hasSubmitted ? '已送出' : '未送出'}</span>
      </div>`;
    }).join('');

    // Update vote count display
    if (data.voteConfig) {
      const config = data.voteConfig;
      const totalPlayers = players.filter(p => p.isAlive !== false).length;
      const submittedCount = voteSubmissions.size;
      document.getElementById('votePlayerGrid').innerHTML =
        `<div style="font-size:.9rem;color:#8888bb;margin-bottom:8px;">送出進度：${submittedCount} / ${totalPlayers}</div>` + grid.innerHTML;
    }
  }

  function renderVoteOptions(data) {
    const resultsContainer = document.getElementById('voteResults');

    if (!data.options || data.options.length === 0) {
      resultsContainer.innerHTML = '<div style="color:#666;font-size:.82rem;text-align:center;padding:20px;">載入投票選項中…</div>';
      return;
    }

    resultsContainer.innerHTML = data.options.map(opt => {
      return `
        <div class="vote-result-item" data-option-id="${opt.id}">
          <div class="vote-result-name">${opt.name}</div>
          <div class="vote-result-count" id="vote-count-${opt.id}">0 票</div>
        </div>
      `;
    }).join('');
  }

  function renderVoteProgress(d) {
    console.log('[Host] Vote progress update:', d);

    if (d.playerId) {
      const players = currentPlayers || [];
      const player = players.find(p => p.id === d.playerId);
      if (player) {
        addLog(`${player.name} 已投票`);
      }

      // Update vote option counts if available
      if (d.currentCounts) {
        Object.entries(d.currentCounts).forEach(([optId, count]) => {
          const countEl = document.getElementById(`vote-count-${optId}`);
          if (countEl) {
            countEl.textContent = `${count} 票`;
          }
        });
      }

      // Update player grid
      if (voteData) {
        renderVotePlayers(voteData);
      }
    }
  }

  function updateVoteTimer(remaining, total) {
    const timerEl = document.getElementById('voteTimer');
    if (timerEl && remaining > 0) {
      timerEl.textContent = `⏱ 剩餘 ${remaining} 秒`;
    } else if (timerEl) {
      timerEl.textContent = '';
    }
  }

  function showVoteResults(results) {
    const resultsContainer = document.getElementById('voteResults');

    if (!results || results.length === 0) {
      resultsContainer.innerHTML = '<div style="color:#666;font-size:.82rem;text-align:center;padding:20px;">無投票結果</div>';
      return;
    }

    // Find max votes
    const maxVotes = Math.max(...results.map(r => r.count));

    resultsContainer.innerHTML = results.map(r => {
      // Use targetName if available, otherwise fallback to targetId
      const name = r.targetName || r.targetId;
      const isLeading = r.count === maxVotes && r.count > 0;

      // Build voters display for non-anonymous votes
      let votersDisplay = '';
      if (r.voters && r.voters.length > 0) {
        const voterNames = r.voters.map(voterId => {
          const voter = currentPlayers.find(p => p.id === voterId);
          return voter ? voter.name : voterId;
        }).join('、');
        votersDisplay = `<div style="font-size:.65rem;color:#6666aa;margin-top:4px;">🗳️ 來自: ${voterNames}</div>`;
      }

      return `
        <div class="vote-result-item ${isLeading ? 'leading' : ''}">
          <div class="vote-result-name">${name}</div>
          <div class="vote-result-count">${r.count} 票</div>
          ${votersDisplay}
          ${isLeading ? '<div style="font-size:.65rem;color:#ffdd44;margin-top:4px;">👑 最高票</div>' : ''}
        </div>
      `;
    }).join('');

    // Update action buttons
    renderVoteResultsActions();
  }

  function renderVoteActions(data) {
    const actionsContainer = document.getElementById('voteActions');
    const actions = [];

    if (data.voteConfig && data.voteConfig.advance && data.voteConfig.advance.trigger !== 'all_voted') {
      actions.push({ action: 'end_vote', label: '▶ 結束投票', cls: 'btn-primary' });
    }

    actionsContainer.innerHTML = actions.map(a => {
      return `<button class="btn ${a.cls} btn-full" onclick="hostAction('${a.action}')">${a.label}</button>`;
    }).join('');
  }

  function renderVoteResultsActions() {
    const actionsContainer = document.getElementById('voteActions');
    actionsContainer.innerHTML = `
      <button class="btn btn-success btn-full" onclick="hostAction('next_stage')">▶ 下一階段</button>
    `;
  }

  function renderIntermissionMessage() {
    const actionsContainer = document.getElementById('gpActions');
    actionsContainer.innerHTML = `
      <div style="text-align:center;padding:16px;background:#1a1a3a;border:1px solid #3a3a6a;border-radius:10px;margin-bottom:12px;">
        <div style="font-size:1.2rem;margin-bottom:8px;">⏸️ 遊戲暫停</div>
        <div style="font-size:.8rem;color:#8888aa;">等待主持人推進到下一階段</div>
      </div>
    `;
  }

  function showIntermissionAdvanceButton() {
    const actionsContainer = document.getElementById('gpActions');
    actionsContainer.innerHTML = `
      <div style="text-align:center;padding:16px;background:#1a1a3a;border:1px solid #3a3a6a;border-radius:10px;margin-bottom:12px;">
        <div style="font-size:1.2rem;margin-bottom:8px;">⏸️ 遊戲暫停</div>
        <div style="font-size:.8rem;color:#8888aa;margin-bottom:12px;">可以推進到下一階段</div>
      </div>
      <button class="btn btn-success btn-full" onclick="hostAction('next_stage')">▶ 下一階段</button>
    `;
  }

  // ── Initialize setup screen on page load ───────────────────────
  refreshRooms();
  loadSetupModules();
</script>
<!-- shared player dropdown — moved via JS positioning -->
<div id="playerDropdown"></div>
<!-- global tooltip — follows cursor, always on top -->
<div id="playerTooltip"></div>
</body>
</html>
