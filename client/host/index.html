<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host 控制台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080818;
      color: #ddddf0;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #10102a;
      border-bottom: 1px solid #2a2a5a;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; letter-spacing: .1em; color: #aaaaff; }
    .badge { background: #1a1a40; border: 1px solid #3a3aaa; border-radius: 6px; padding: 4px 12px; font-size: .8rem; color: #8888cc; }
    .badge span { color: #ffdd44; font-weight: 700; letter-spacing: .1em; }

    .layout { display: grid; grid-template-columns: 280px 1fr 260px; flex: 1; gap: 0; overflow: hidden; }

    /* ── Column shared ── */
    .col { padding: 16px; border-right: 1px solid #1a1a3a; overflow-y: auto; }
    .col:last-child { border-right: none; }
    .col-title { font-size: .7rem; letter-spacing: .1em; color: #6666aa; margin-bottom: 12px; text-transform: uppercase; }

    /* ── Buttons ── */
    .btn { border: none; border-radius: 8px; padding: 10px 20px; font-size: .9rem; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(.97); }
    .btn-primary  { background: #5555ff; color: #fff; }
    .btn-success  { background: #33bb66; color: #fff; }
    .btn-warning  { background: #cc8800; color: #fff; }
    .btn-danger   { background: #cc3333; color: #fff; }
    .btn-neutral  { background: #2a2a5a; color: #aaaaff; border: 1px solid #4444aa; }
    .btn-full     { width: 100%; margin-bottom: 8px; display: block; }

    /* ── Players column header ── */
    .col-title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      font-size: .7rem; letter-spacing: .1em; color: #6666aa; text-transform: uppercase;
    }
    .sort-wrap { position: relative; }
    .sort-btn {
      background: #1a1a3a; border: 1px solid #3a3a6a; border-radius: 6px;
      color: #8888cc; font-size: .68rem; padding: 3px 8px; cursor: pointer;
      white-space: nowrap;
    }
    .sort-btn:hover { background: #22224a; color: #aaaaff; }
    .sort-menu {
      display: none; position: absolute; right: 0; top: calc(100% + 4px);
      background: #181830; border: 1px solid #3a3a6a; border-radius: 8px;
      padding: 4px 0; min-width: 160px; z-index: 910;
      box-shadow: 0 6px 20px rgba(0,0,0,.6);
    }
    .sort-menu.open { display: block; }
    .sort-opt {
      padding: 7px 14px; font-size: .8rem; color: #ccccee;
      cursor: pointer; white-space: nowrap; text-transform: none; letter-spacing: 0;
    }
    .sort-opt:hover { background: #22224a; }
    .sort-opt.active { color: #aaaaff; font-weight: 700; }
    .sort-divider { height: 1px; background: #2a2a4a; margin: 4px 0; }

    /* ── Players column ── */
    .players-container {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: start;
    }
    .number-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .number-item {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      padding: 0 6px;
      border-radius: 5px;
      background: #e67e22;
      color: white;
      font-size: .85rem;
      font-weight: bold;
      line-height: 1;
      flex-shrink: 0;
    }
    .player-row {
      background: #12122a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; position: relative; transition: opacity .15s; height: 40px; margin-bottom: 6px;
    }
    #playerList {
      display: flex;
      flex-direction: column;
    }
    .player-row.dragging   { opacity: .35; }
    .player-row.drag-over  { border-top: 2px solid #6666ff; margin-top: -1px; }
    .player-row.locked {
      opacity: .7;
      cursor: not-allowed;
    }
    .player-row.locked .drag-handle {
      cursor: not-allowed;
      opacity: .5;
    }
    .drag-handle {
      color: #44446a; font-size: .85rem; cursor: grab; flex-shrink: 0;
      padding: 0 2px; line-height: 1; user-select: none;
      display: none;
    }
    .player-row:active .drag-handle { cursor: grabbing; }
    body.sort-manual .drag-handle { display: block; }
    .player-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.on  { background: #44ff88; }
    .dot.off { background: #555; }
    .player-row .info { flex: 1; min-width: 0; }
    .player-row .pname-row { display: flex; align-items: center; gap: 4px; }
    .player-row .pname { font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-number-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 5px;
      background: #e67e22;
      color: white;
      font-size: .75rem;
      font-weight: bold;
      line-height: 1;
      flex-shrink: 0;
    }
    .player-row .pmeta { font-size: .68rem; color: #8888aa; margin-top: 2px; }
    .player-row.eliminated { opacity: .5; }
    .player-row.eliminated .pname::after { content: ' ❌'; font-size: .65rem; }
    /* attribute icon chips on the name row */
    .attr-icon { font-size: .8rem; line-height: 1; flex-shrink: 0; cursor: default; }
    /* ⋮ menu button */
    .pstats {
      display: flex;
      align-items: center;
      margin-left: auto;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .pstat-status {
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .player-row.eliminated .pstats {
      opacity: 0.4;
    }
    .pmenu-btn {
      background: none; border: none; color: #6666aa; font-size: 1.1rem;
      padding: 2px 6px; border-radius: 4px; cursor: pointer; flex-shrink: 0;
      letter-spacing: -.05em; line-height: 1;
    }
    .pmenu-btn:hover { background: #1e1e40; color: #aaaaff; }
    /* floating dropdown */
    #playerDropdown {
      position: fixed; z-index: 900;
      background: #181830; border: 1px solid #3a3a6a; border-radius: 10px;
      padding: 6px 0; min-width: 190px;
      box-shadow: 0 8px 28px rgba(0,0,0,.6);
      display: none;
    }
    #playerDropdown.open { display: block; }
    .pd-section { padding: 6px 14px 2px; font-size: .62rem; color: #6666aa; letter-spacing: .08em; text-transform: uppercase; }
    .pd-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; font-size: .82rem; cursor: pointer;
      white-space: nowrap; color: #ccccee;
    }
    .pd-row:hover { background: #22224a; }
    .pd-row.danger { color: #cc4444; }
    .pd-row.danger:hover { background: #2a1010; }
    .pd-divider { height: 1px; background: #2a2a4a; margin: 4px 0; }
    /* attr option buttons inside dropdown */
    .pd-attr-opts { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 14px 8px; }
    .pd-opt {
      border: 1px solid #3a3a6a; border-radius: 5px;
      background: none; color: #aaaacc; font-size: .75rem;
      padding: 3px 8px; cursor: pointer;
    }
    .pd-opt:hover { background: #22224a; }
    .pd-opt.active { background: #3a3a8a; border-color: #6666ff; color: #eeeeff; }
    /* hover tooltip — global fixed element, follows cursor */
    #playerTooltip {
      display: none; position: fixed; z-index: 9999;
      background: #181830; border: 1px solid #3a3a6a; border-radius: 8px;
      padding: 8px 12px; font-size: .76rem; color: #ccccee;
      min-width: 130px; pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.6);
      white-space: nowrap;
    }
    #playerTooltip .tt-row { margin-bottom: 3px; }
    #playerTooltip .tt-row:last-child { margin-bottom: 0; }

    /* ── Module grid (lobby) ── */
    .section { margin-bottom: 20px; }
    .section-title { font-size: .78rem; color: #8888bb; margin-bottom: 10px; }
    .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .module-card { background: #12122a; border: 2px solid #2a2a5a; border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s; }
    .module-card:hover    { border-color: #5555ff; }
    .module-card.selected { border-color: #5555ff; background: #1a1a40; }
    .module-card .mname   { font-size: .9rem; font-weight: 700; }
    .module-card .mdesc   { font-size: .7rem; color: #7777aa; margin-top: 4px; }
    .module-card .mcount  { font-size: .68rem; color: #5555aa; margin-top: 6px; }

    /* ── Phase badge ── */
    .phase-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1a1a3a; border: 1px solid #4444aa;
      border-radius: 20px; padding: 4px 14px;
      font-size: .78rem; color: #aaaaff;
      letter-spacing: .08em;
    }
    .phase-dot { width: 6px; height: 6px; border-radius: 50%; background: #5555ff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Game panel ── */
    #gamePanel { display: none; }

    .gp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .gp-module-name { font-size: 1rem; font-weight: 700; color: #aaaaff; }

    /* Round progress */
    .gp-round-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .gp-round-label { font-size: .75rem; color: #6666aa; white-space: nowrap; }
    .round-dots { display: flex; gap: 5px; }
    .rdot { width: 10px; height: 10px; border-radius: 50%; background: #2a2a4a; transition: background .3s; }
    .rdot.done    { background: #5555ff; }
    .rdot.current { background: #ffdd44; box-shadow: 0 0 6px #ffdd44; }
    .progress-bar { flex: 1; height: 4px; background: #2a2a4a; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #5555ff; border-radius: 2px; transition: width .5s ease; }

    /* Phase section */
    .gp-phase-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .gp-phase-label { font-size: .8rem; color: #8888bb; }

    /* Player action grid */
    .gp-player-grid { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .gp-player-row {
      display: flex; align-items: center; gap: 10px;
      background: #10102a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 8px 12px;
      transition: border-color .3s;
    }
    .gp-player-row.played  { border-color: #33bb66; }
    .gp-player-row.waiting { border-color: #2a2a4a; }
    .gp-player-row.disconnected { opacity: .45; }
    .gp-status-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .gp-pname  { font-size: .88rem; min-width: 80px; flex-shrink: 0; }
    .gp-pidentity { font-size: .78rem; min-width: 100px; flex-shrink: 0; padding: 2px 8px; border-radius: 4px; text-align: center; }
    .gp-pidentity.empty { background: transparent; }
    .gp-pstatus { font-size: .7rem; color: #6666aa; flex: 1; text-align: right; }
    .gp-pscore { font-size: .78rem; color: #ffdd44; min-width: 80px; text-align: right; flex-shrink: 0; }

    /* Reveal cards (host view) */
    .gp-reveals { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .gp-reveal-card {
      background: #1a1a3a; border: 2px solid #3a3a7a; border-radius: 10px;
      padding: 10px 8px; text-align: center;
    }
    .gp-reveal-card.winner { border-color: #ffdd44; background: #2a2a1a; }
    .gp-rc-name  { font-size: .75rem; font-weight: 700; }
    .gp-rc-value { font-size: 1.4rem; color: #ffdd44; line-height: 1.2; }
    .gp-rc-player{ font-size: .65rem; color: #8888aa; margin-top: 2px; }
    .gp-winner-tag { font-size: .6rem; color: #ffdd44; }

    /* Action buttons zone */
    .gp-actions { display: flex; flex-direction: column; gap: 8px; }

    /* ── Vote panel ── */
    #votePanel { display: none; }

    .vote-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .vote-result-item {
      background: #1a1a3a;
      border: 1px solid #3a3a6a;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .vote-result-item.leading {
      border-color: #ffdd44;
      background: #2a2a1a;
    }
    .vote-result-name {
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .vote-result-count {
      font-size: 1.4rem;
      color: #ffdd44;
      font-weight: 700;
    }

    /* ── Result panel ── */
    #resultPanel { display: none; }

    .rp-title { font-size: 1.1rem; font-weight: 700; color: #ffdd44; margin-bottom: 4px; }
    .rp-sub   { font-size: .78rem; color: #8888aa; margin-bottom: 20px; }

    .rp-leaderboard { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .rp-row { display: flex; align-items: center; gap: 10px; }
    .rp-rank { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
    .rp-name { font-size: .9rem; flex: 1; }
    .rp-score{ font-size: .85rem; color: #ffdd44; flex-shrink: 0; }
    .rp-bar-wrap { width: 80px; flex-shrink: 0; }
    .rp-bar  { height: 6px; background: #2a2a4a; border-radius: 3px; overflow: hidden; }
    .rp-bar-fill { height: 100%; background: #5555ff; border-radius: 3px; transition: width .8s ease; }
    .rp-row.champion .rp-bar-fill { background: #ffdd44; }

    /* ── Log column ── */
    #logList { display: flex; flex-direction: column; gap: 5px; }
    .log-entry { background: #0e0e22; border-left: 2px solid #333388; padding: 5px 10px; border-radius: 0 4px 4px 0; font-size: .7rem; color: #9999cc; }
    .log-entry .ts { color: #555577; margin-right: 6px; }
    .log-entry.err { border-left-color: #883333; color: #cc8888; }

    /* ── QR preview ── */
    #qrPreview { text-align: center; margin-bottom: 16px; }
    #qrPreview img { width: 110px; height: 110px; background: #fff; padding: 6px; border-radius: 8px; }
    #qrPreview p { font-size: .68rem; color: #6666aa; margin-top: 6px; word-break: break-all; }

    /* ── Setup screen ── */
    #setupScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; padding: 40px; }
    #setupScreen h2 { font-size: 1.4rem; color: #aaaaff; }
    #setupScreen p  { color: #6666aa; font-size: .9rem; }

    /* ── Setup module picker ── */
    .setup-module-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; max-height: 220px; overflow-y: auto; }
    .setup-module-item {
      background: #12122a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all .15s;
    }
    .setup-module-item:hover { background: #1a1a3a; border-color: #4444aa; }
    .setup-module-item.selected { border-color: #6666ff; background: #1a1a40; }
    .setup-module-item .smi-name { font-size: .9rem; color: #ccccff; font-weight: 600; }
    .setup-module-item .smi-meta { font-size: .75rem; color: #6666aa; }
    .setup-module-item .smi-check { color: #6666ff; font-size: 1rem; visibility: hidden; }
    .setup-module-item.selected .smi-check { visibility: visible; }
    #mainLayout { display: none; flex: 1; overflow: hidden; }

    /* ── Room list ── */
    .room-item {
      background: #12122a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all .2s;
    }
    .room-item:hover {
      background: #1a1a3a;
      border-color: #4444aa;
      transform: translateX(4px);
    }
    .room-info {
      flex: 1;
    }
    .room-id {
      font-size: 1.1rem;
      font-weight: 700;
      color: #aaaaff;
      letter-spacing: .1em;
    }
    .room-details {
      font-size: .75rem;
      color: #6666aa;
      margin-top: 4px;
    }
    .room-arrow {
      font-size: 1.2rem;
      color: #5555ff;
      opacity: 0;
      transition: opacity .2s;
    }
    .room-item:hover .room-arrow {
      opacity: 1;
    }

    .hidden { display: none !important; }
    .divider { border: none; border-top: 1px solid #1a1a3a; margin: 14px 0; }

    /* ── Module details (read-only summary) ── */
    .md-section { margin-bottom: 10px; }
    .md-label { font-size: .7rem; color: #6666aa; letter-spacing: .08em; margin-bottom: 4px; }
    .md-kv    { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .76rem; }
    .md-kv .k { color: #7777aa; }
    .md-kv .v { color: #ddddee; font-weight: 600; }
    .md-list  { font-size: .76rem; color: #aaaacc; line-height: 1.5; }
    .md-list .row { display:flex; align-items:center; gap: 6px; padding: 2px 0; }
    .md-list .pill { font-size:.6rem; background:#1a1a4a; color:#8888cc; border-radius:4px; padding:1px 6px; }
    .md-list .muted { color:#555577; }

    /* ── Legacy editor tabs (kept for compatibility, no longer used) ── */
    #configEditor { margin-top: 12px; border: 1px solid #2a2a5a; border-radius: 10px; overflow: hidden; }
    .cfg-tabs { display: flex; background: #0e0e24; border-bottom: 1px solid #2a2a5a; }
    .cfg-tab {
      flex: 1; padding: 8px 4px; font-size: .72rem; font-weight: 700;
      background: none; border: none; color: #6666aa; cursor: pointer;
      letter-spacing: .04em; transition: color .15s, background .15s;
    }
    .cfg-tab.active { color: #aaaaff; background: #14142a; border-bottom: 2px solid #5555ff; }
    .cfg-tab-content { padding: 14px; display: none; max-height: 380px; overflow-y: auto; }
    .cfg-tab-content.active { display: block; }

    /* fieldConfig form */
    .field-row { margin-bottom: 12px; }
    .field-label { font-size: .72rem; color: #8888bb; margin-bottom: 4px; display: block; }
    .field-input {
      width: 100%; background: #0a0a1a; border: 1px solid #3a3a6a;
      border-radius: 6px; color: #ddddf0; font-size: .85rem; padding: 6px 10px; outline: none;
    }
    .field-input:focus { border-color: #5555ff; }
    select.field-input { cursor: pointer; }

    /* Deck manager */
    .deck-block { background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .deck-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; }
    .deck-type-badge { font-size: .65rem; background: #1a1a4a; color: #8888cc; border-radius: 4px; padding: 2px 6px; }
    .deck-header-name { flex: 1; font-size: .85rem; font-weight: 700; }
    .deck-toggle { font-size: .7rem; color: #6666aa; }
    .deck-cards { padding: 0 12px 10px; display: none; }
    .deck-cards.open { display: block; }
    .deck-draw-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .72rem; color: #8888aa; }
    .deck-draw-row input { width: 48px; background: #0a0a1a; border: 1px solid #3a3a6a; border-radius: 4px; color: #ddddf0; padding: 3px 6px; font-size: .78rem; text-align: center; }

    .card-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .card-row input {
      background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 4px;
      color: #ddddf0; font-size: .72rem; padding: 4px 6px; outline: none;
    }
    .card-row input:focus { border-color: #5555ff; }
    .card-row .ci-name { flex: 2; }
    .card-row .ci-val  { width: 44px; text-align: center; }
    .card-row .ci-desc { flex: 3; }
    .card-row .ci-team { flex: 1; }
    .card-row .ci-del  { background: none; border: 1px solid #4a1a1a; border-radius: 4px; color: #aa4444; font-size: .65rem; padding: 3px 7px; cursor: pointer; flex-shrink: 0; }
    .card-row .ci-del:hover { background: #2a0a0a; }
    .card-row-header { display: flex; gap: 6px; margin-bottom: 4px; }
    .card-row-header span { font-size: .62rem; color: #555577; }
    .card-row-header .ci-name { flex: 2; }
    .card-row-header .ci-val  { width: 44px; }
    .card-row-header .ci-desc { flex: 3; }
    .card-row-header .ci-team { flex: 1; }
    .add-card-btn { font-size: .72rem; color: #5555ff; background: none; border: 1px dashed #3a3a7a; border-radius: 4px; padding: 4px 10px; cursor: pointer; width: 100%; margin-top: 6px; }
    .add-card-btn:hover { background: #14142a; }

    /* Stage editor */
    .stage-row { display: flex; align-items: flex-start; gap: 10px; background: #0e0e22; border: 1px solid #2a2a4a; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .stage-order { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .stage-order button { background: none; border: 1px solid #3a3a6a; border-radius: 3px; color: #8888cc; font-size: .6rem; padding: 1px 5px; cursor: pointer; line-height: 1.4; }
    .stage-order button:hover { background: #1a1a3a; }
    .stage-main { flex: 1; min-width: 0; }
    .stage-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .stage-name { font-size: .88rem; font-weight: 700; }
    .stage-type-badge { font-size: .62rem; background: #1a1a40; color: #6688ff; border-radius: 4px; padding: 2px 7px; }
    .stage-disabled .stage-name { color: #555; }
    .stage-advance { font-size: .68rem; color: #6666aa; margin-bottom: 4px; }
    .stage-deck-ref { font-size: .68rem; color: #5566aa; }
    .toggle-switch { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #2a2a4a; border-radius: 18px; cursor: pointer; transition: .2s; }
    .toggle-slider:before { content:''; position: absolute; width: 12px; height: 12px; left: 3px; bottom: 3px; background: #666; border-radius: 50%; transition: .2s; }
    input:checked + .toggle-slider { background: #5555ff; }
    input:checked + .toggle-slider:before { transform: translateX(14px); background: #fff; }
  </style>
</head>
<body>

<header>
  <h1>🎮 HOST 控制台</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="/editor" target="_blank"
       style="font-size:.82rem;color:#aaaaff;text-decoration:none;border:1px solid #3a3a6a;
              padding:6px 12px;border-radius:6px;background:#14142a;">
      📝 模組編輯器
    </a>
    <button class="btn btn-neutral"
            id="toggleQrBtn"
            onclick="toggleDisplayQR()"
            style="padding:6px 12px;font-size:.82rem;"
            title="在 Display 顯示/隱藏玩家加入 QR Code">
      📱 使用者加入條碼
    </button>
    <div class="badge"
         style="cursor:pointer;"
         onclick="openDisplayPage()"
         title="點擊打開 Display 頁面">房間 <span id="headerRoom">------</span> 📺</div>
  </div>
</header>

<!-- Setup screen -->
<div id="setupScreen">
  <h2>🎮 遊戲房間</h2>
  <p>選擇現有房間或建立新遊戲房間</p>

  <!-- Room list -->
  <div style="margin-bottom:24px;width:100%;max-width:480px;">
    <div class="section-title" style="margin-bottom:12px;">現有房間</div>
    <div id="roomList" style="min-height:60px;">
      <div style="color:#555;font-size:.8rem;text-align:center;padding:20px;">載入中…</div>
    </div>
  </div>

  <!-- Create new room -->
  <div style="border-top:1px solid #2a2a4a;padding-top:24px;width:100%;max-width:480px;">
    <div class="section-title" style="margin-bottom:12px;">建立新房間 — 選擇遊戲模組</div>
    <div id="setupModuleList" class="setup-module-list">
      <div style="color:#555;font-size:.8rem;text-align:center;padding:16px;">載入中…</div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn btn-primary btn-full" id="createRoomBtn" onclick="createRoom()" style="margin-bottom:8px;" disabled>
        ➕ 建立新房間
      </button>
    </div>
    <button class="btn btn-neutral btn-full" onclick="refreshRooms()" style="font-size:.82rem;">
      🔄 重新整理房間列表
    </button>
  </div>
</div>

<!-- Main layout -->
<div id="mainLayout" class="layout">

  <!-- ── Left: Players ── -->
  <div class="col">
    <div class="col-title-row">
      <span>玩家 (<span id="playerCount">0</span>)</span>
      <div class="sort-wrap">
        <button class="sort-btn" id="sortBtn" onclick="toggleSortMenu(event)">
          <span id="sortLabel">登入順序</span> ▾
        </button>
        <div class="sort-menu" id="sortMenu">
          <div class="sort-opt" data-mode="join"     onclick="setSortMode('join')">登入順序</div>
          <div class="sort-opt" data-mode="name-asc" onclick="setSortMode('name-asc')">名字 A → Z</div>
          <div class="sort-opt" data-mode="name-desc"onclick="setSortMode('name-desc')">名字 Z → A</div>
          <div class="sort-divider"></div>
          <div class="sort-opt" data-mode="manual"   onclick="setSortMode('manual')">手動排列（可拖曳）</div>
        </div>
      </div>
    </div>
    <div class="players-container">
      <div class="number-column" id="numberColumn">
        <!-- Fixed number badges will be rendered here -->
      </div>
      <div id="playerList"><div style="color:#555;font-size:.82rem;text-align:center;margin-top:20px">等待玩家加入…</div></div>
    </div>
  </div>

  <!-- ── Center: Control panels ── -->
  <div class="col">

    <!-- PANEL A: Lobby -->
    <div id="lobbyPanel">
      <div style="margin-bottom:12px">
        <span class="phase-badge"><span class="phase-dot"></span><span id="phaseBadgeText">LOBBY</span></span>
      </div>

      <div class="section" id="moduleSelectSection">
        <div class="section-title" id="moduleSelectTitle">選擇遊戲模組</div>
        <div class="module-grid" id="moduleGrid">
          <div style="color:#555;font-size:.8rem;">載入中…</div>
        </div>
      </div>

      <!-- Read-only module details (shown after module selected) -->
      <div id="moduleDetails" class="hidden"
           style="margin-top:12px;background:#0e0e22;border:1px solid #2a2a4a;border-radius:10px;padding:14px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-size:.95rem;font-weight:700;color:#aaaaff;" id="mdName">—</span>
          <span style="font-family:monospace;font-size:.68rem;color:#6666aa;background:#0a0a1a;padding:2px 7px;border-radius:4px;" id="mdId">—</span>
        </div>
        <div id="mdDesc" style="font-size:.78rem;color:#8888bb;margin-bottom:10px;line-height:1.5;"></div>

        <div class="md-section">
          <div class="md-label">基本參數</div>
          <div id="mdFields" class="md-kv"></div>
        </div>
        <div class="md-section">
          <div class="md-label">牌組</div>
          <div id="mdDecks" class="md-list"></div>
        </div>
        <div class="md-section" style="margin-bottom:0;">
          <div class="md-label">啟用階段</div>
          <div id="mdStages" class="md-list"></div>
        </div>

        <div style="margin-top:12px;text-align:right;">
          <a id="mdEditorLink" href="/editor" target="_blank"
             style="font-size:.74rem;color:#6688ff;text-decoration:none;">→ 在編輯器中開啟</a>
        </div>
      </div>

      <div class="section" style="margin-top:12px;">
        <button class="btn btn-success btn-full" id="startBtn" onclick="startGame()" disabled>啟動遊戲模組</button>
        <div id="startHint" style="font-size:.73rem;color:#cc8800;text-align:center;min-height:1.2em;margin-bottom:4px;"></div>
        <button class="btn btn-danger btn-full" onclick="closeRoom()" style="margin-top:4px;font-size:.82rem;">關閉房間</button>
      </div>
    </div>

    <!-- PANEL B: Game in progress -->
    <div id="gamePanel">

      <div class="gp-header">
        <span class="gp-module-name" id="gpModuleName">—</span>
        <span class="phase-badge"><span class="phase-dot" id="gpPhaseDot"></span><span id="gpPhaseLabel">—</span></span>
      </div>

      <!-- Auto-advance status (visible when an automatic trigger is pending) -->
      <div id="gpAdvanceBadge"
           style="background:#0e0e22;border:1px solid #2a4a6a;border-left-width:4px;
	                  border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.82rem;
	                  min-height:38px;opacity:0;transition:opacity .3s;visibility:hidden;">
        <span id="gpAdvanceText">⏱ 自動推進中…</span>
        <span id="gpAdvanceTimer" style="float:right;font-family:monospace;color:#66bbff;"></span>
      </div>

      <!-- Round progress -->
      <div class="gp-round-row">
        <span class="gp-round-label">回合</span>
        <div class="round-dots" id="gpRoundDots"></div>
        <div class="progress-bar"><div class="progress-fill" id="gpProgressFill" style="width:0%"></div></div>
        <span style="font-size:.72rem;color:#6666aa;" id="gpRoundText">0/0</span>
      </div>

      <hr class="divider">

      <!-- Player action grid -->
      <div class="section-title" style="margin-bottom:8px;" id="gpGridLabel">玩家狀態</div>
      <div class="gp-player-grid" id="gpPlayerGrid"></div>

      <!-- Reveal cards (only in reveal phase) -->
      <div id="gpRevealSection" class="hidden">
        <hr class="divider">
        <div class="section-title" style="margin-bottom:8px;">本回合出牌</div>
        <div class="gp-reveals" id="gpReveals"></div>
        <div id="gpWinnerLine" style="font-size:.82rem;color:#ffdd44;text-align:center;margin-bottom:12px;"></div>
      </div>

      <!-- Context action buttons -->
      <hr class="divider">
      <div class="gp-actions" id="gpActions"></div>
    </div>

    <!-- PANEL C: Result -->
    <div id="resultPanel">
      <div style="font-size:2rem;margin-bottom:8px;">🏆</div>
      <div class="rp-title">遊戲結束</div>
      <div class="rp-sub" id="rpWinners"></div>
      <div class="rp-leaderboard" id="rpLeaderboard"></div>
      <hr class="divider">
      <button class="btn btn-success btn-full" onclick="hostAction('restart')">重新開始（同模組）</button>
      <button class="btn btn-danger btn-full" onclick="closeRoom()">結束房間</button>
    </div>

    <!-- PANEL D: Vote -->
    <div id="votePanel">
      <div class="gp-header">
        <span class="gp-module-name" id="voteModuleName">🗳️ 投票階段</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <span id="voteTimer" style="font-size:.85rem;color:#ffdd44;font-weight:600;"></span>
          <span class="phase-badge"><span class="phase-dot"></span><span id="votePhaseLabel">投票中</span></span>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <span class="section-title">投票進度</span>
        <div class="gp-player-grid" id="votePlayerGrid"></div>
      </div>

      <hr class="divider">

      <div class="section-title">即時票數</div>
      <div class="vote-results" id="voteResults">
        <div style="color:#666;font-size:.82rem;text-align:center;padding:20px;">等待投票…</div>
      </div>

      <hr class="divider">

      <div class="gp-actions" id="voteActions"></div>
    </div>

  </div>

  <!-- ── Right: QR + Log ── -->
  <div class="col">
    <div id="qrPreview">
      <img id="qrImg" src="" alt="">
      <p id="joinUrlText"></p>
    </div>
    <div class="col-title">事件記錄</div>
    <div id="logList"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/socket.js"></script>
<script>
  let roomId          = null;
  let selectedModule  = null;
  let selectedManifest= null;
  let currentPlayers  = [];
  let availableModules= [];
  let currentPhase    = 'lobby';   // lobby | playing | result
  let currentGamePhase = null;     // Current game phase (identity_draw, card_play, vote, etc.)
  let voteSubmissions = new Set(); // Track which players have submitted votes
  let playerNumberMap = {};        // playerId → playerNumber mapping (assigned when player joins, never changes)
  const client = new GameClient();

  // ── Helper: Show/hide advance badge without affecting layout ─────
  function showAdvanceBadge(text, timer = '') {
    console.log('[Host] showAdvanceBadge:', text, timer);
    const badge = document.getElementById('gpAdvanceBadge');
    const textEl = document.getElementById('gpAdvanceText');
    const timerEl = document.getElementById('gpAdvanceTimer');
    if (badge && textEl && timerEl) {
      textEl.textContent = text;
      timerEl.textContent = timer;
      badge.style.opacity = '1';
      badge.style.visibility = 'visible';
    }
  }

  function hideAdvanceBadge() {
    console.log('[Host] hideAdvanceBadge called');
    const badge = document.getElementById('gpAdvanceBadge');
    const timerEl = document.getElementById('gpAdvanceTimer');
    if (badge) {
      badge.style.opacity = '0';
      badge.style.visibility = 'hidden';
    }
    if (timerEl) timerEl.textContent = '';
  }

  // ── Room list ───────────────────────────────────────────────────
  let roomsCache = [];

  async function refreshRooms() {
    try {
      const res = await fetch('/api/rooms');
      const rooms = await res.json();
      roomsCache = rooms;
      renderRoomList(rooms);
    } catch (err) {
      console.error('[Host] Failed to load rooms:', err);
      document.getElementById('roomList').innerHTML =
        '<div style="color:#884444;font-size:.8rem;text-align:center;padding:20px;">載入失敗</div>';
    }
  }

  function renderRoomList(rooms) {
    const container = document.getElementById('roomList');
    if (!rooms || rooms.length === 0) {
      container.innerHTML = '<div style="color:#555;font-size:.8rem;text-align:center;padding:20px;">沒有現有房間</div>';
      return;
    }

    container.innerHTML = rooms.map(room => `
      <div class="room-item" onclick="joinRoom('${room.roomId}')">
        <div class="room-info">
          <div class="room-id">${room.roomId}</div>
          <div class="room-details">
            ${room.moduleName ? room.moduleName : '等待選擇模組'} · ${room.playerCount} 玩家
          </div>
        </div>
        <div class="room-arrow">→</div>
      </div>
    `).join('');
  }

  async function joinRoom(targetRoomId) {
    try {
      // First verify room exists
      const res = await fetch(`/api/rooms/${targetRoomId}`);
      if (!res.ok) {
        alert('房間不存在');
        refreshRooms();
        return;
      }

      roomId = targetRoomId;

      // Clear player number map when joining existing room
      playerNumberMap = {};

      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('mainLayout').style.display  = 'grid';

      // Reset QR button state
      qrVisible = false;
      const qrBtn = document.getElementById('toggleQrBtn');
      qrBtn.style.background = '#2a2a5a';
      qrBtn.style.color = '#aaaaff';
      qrBtn.innerHTML = '📱 使用者加入條碼';

      client.connect();
      client.on('connect', () => client.joinHost(roomId));
      setupEvents();
    } catch (err) {
      console.error('[Host] Failed to join room:', err);
      alert('無法加入房間');
      refreshRooms();
    }
  }

  // ── Setup: module picker ────────────────────────────────────────
  let setupModuleId = null;

  async function loadSetupModules() {
    try {
      const res = await fetch('/api/modules');
      const modules = await res.json();
      const container = document.getElementById('setupModuleList');
      if (!modules.length) {
        container.innerHTML = '<div style="color:#555;font-size:.8rem;text-align:center;padding:16px;">沒有可用模組</div>';
        return;
      }
      container.innerHTML = modules.map(m => `
        <div class="setup-module-item" id="smi-${m.id}" onclick="selectSetupModule('${m.id}')">
          <div>
            <div class="smi-name">${m.name || m.id}</div>
            <div class="smi-meta">${m.minPlayers}–${m.maxPlayers} 人 · ${m.description || ''}</div>
          </div>
          <span class="smi-check">✓</span>
        </div>
      `).join('');
    } catch (err) {
      console.error('[Host] Failed to load setup modules:', err);
    }
  }

  function selectSetupModule(id) {
    setupModuleId = id;
    document.querySelectorAll('.setup-module-item').forEach(el =>
      el.classList.toggle('selected', el.id === `smi-${id}`)
    );
    document.getElementById('createRoomBtn').disabled = false;
  }

  // ── Create room ────────────────────────────────────────────────
  async function createRoom() {
    if (!setupModuleId) return;
    const res  = await fetch('/api/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ moduleId: setupModuleId }),
    });
    const data = await res.json();
    roomId = data.roomId;

    // Clear player number map for new game
    playerNumberMap = {};

    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('mainLayout').style.display  = 'grid';

    // Reset QR button state
    qrVisible = false;
    const qrBtn = document.getElementById('toggleQrBtn');
    qrBtn.style.background = '#2a2a5a';
    qrBtn.style.color = '#aaaaff';
    qrBtn.innerHTML = '📱 使用者加入條碼';

    client.connect();
    client.on('connect', () => client.joinHost(roomId));
    setupEvents();
  }

  // ── Close room ──────────────────────────────────────────────────
  function closeRoom() {
    if (!confirm('確定要關閉房間嗎？所有玩家將被踢出。')) return;
    client.closeRoom();
  }

  // ── Back to setup (create a new room) ──────────────────────────
  function backToSetup() {
    if (client.socket) client.socket.disconnect();
    // Clear accumulated event handlers so the next session starts clean
    client._handlers = {};
    // Reset all game state
    roomId = null; selectedModule = null; selectedManifest = null; setupModuleId = null;
    currentPhase = 'lobby'; currentGamePhase = null;
    currentPlayers = []; voteSubmissions = new Set();
    // Reset panel to lobby so next room opens correctly
    showPanel('lobby');
    document.getElementById('mainLayout').style.display = 'none';
    document.getElementById('setupScreen').style.display = 'flex';
    document.getElementById('moduleSelectSection').style.display = '';
    document.getElementById('createRoomBtn').disabled = true;
    document.querySelectorAll('.setup-module-item').forEach(el => el.classList.remove('selected'));
    refreshRooms();
  }

  // ── Open Display page ───────────────────────────────────────────
  function openDisplayPage() {
    if (!roomId) {
      alert('請先建立房間');
      return;
    }
    const displayUrl = `${window.location.origin}/display?room=${roomId}`;
    window.open(displayUrl, '_blank');
  }

  // ── Toggle QR on Display ────────────────────────────────────────
  let qrVisible = false;
  function toggleDisplayQR() {
    if (!roomId) {
      alert('請先建立房間');
      return;
    }
    qrVisible = !qrVisible;
    client.socket.emit('host_toggle_qr', { roomId, visible: qrVisible });

    // Update button style
    const btn = document.getElementById('toggleQrBtn');
    if (qrVisible) {
      btn.style.background = '#5555ff';
      btn.style.color = '#fff';
      btn.innerHTML = '📱 隱藏加入條碼';
      addLog('顯示 Display 加入條碼');
    } else {
      btn.style.background = '#2a2a5a';
      btn.style.color = '#aaaaff';
      btn.innerHTML = '📱 使用者加入條碼';
      addLog('隱藏 Display 加入條碼');
    }
  }

  // ── Events ────────────────────────────────────────────────────
  function setupEvents() {
    client.on('host_joined', d => {
      setRoom(d.roomId);
      setPhaseBadge(d.phase || 'lobby');
      availableModules = d.availableModules || [];
      renderModules(availableModules);
      // If room was created with a pre-loaded manifest, apply it and hide the picker
      if (d.manifest) {
        selectedManifest = d.manifest;
        selectedModule   = d.manifest.id;
        renderModuleDetails(selectedManifest);
        document.getElementById('moduleSelectSection').style.display = 'none';
        document.getElementById('moduleSelectTitle').textContent = '遊戲模組';
      }
      renderPlayers(d.players || []);
      setQR(d.roomId);
      updateSortButtonState(); // Initialize sort button state
      addLog('Host 已連線');
    });

    client.on('room_closed', () => backToSetup());

    client.on('player_joined',      d => {
      console.log('[Host] player_joined event received:', d);
      // Assign player number when joining (never changes after this)
      if (d.player && !playerNumberMap[d.player.id]) {
        const nextNumber = Object.keys(playerNumberMap).length + 1;
        playerNumberMap[d.player.id] = nextNumber;
        console.log('[Host] Assigned player number', nextNumber, 'to', d.player.name);
      }
      renderPlayers(d.players || []);
      addLog(`${d.player?.name} 加入`);
    });
    client.on('player_left',        d => { renderPlayers(d.players || []); addLog('玩家離開'); });
    client.on('player_ready',       d => { renderPlayers(d.players || []); updateLobbyBtns(); addLog('玩家準備完成'); });
    client.on('player_disconnected',d => addLog('玩家斷線'));
    client.on('player_reconnected', d => addLog('玩家重連'));

    client.on('game_started', d => {
      console.log('[Host] Game started:', d);
      currentPhase = 'playing';
      setPhaseBadge('playing');
      updateSortButtonState(); // Disable sort button during game

      // Update current players from game_started data if available
      if (d.players) {
        currentPlayers = d.players;
        // Sync player numbers from server if not yet assigned
        d.players.forEach(p => {
          if (!playerNumberMap[p.id] && p.playerNumber) {
            playerNumberMap[p.id] = p.playerNumber;
          }
        });
        renderPlayers(currentPlayers);
      } else if (currentPlayers && currentPlayers.length > 0) {
        // Reset existing players
        currentPlayers = currentPlayers.map(p => ({ ...p, score: 0, handCount: 0, status: 'thinking' }));
        renderPlayers(currentPlayers);
      }

      // Don't immediately show game panel - wait for stage/vote events
      // showPanel('game');
      addLog(`遊戲開始：${d.module}`);
    });

    // ── Stage & Round Events ───────────────────────────────────────
    client.on('stage_started', (d) => {
      console.log('[Host] Stage started:', d.stageId, d.stageName, 'type:', d.stageType);
      addLog(`📍 階段開始：${d.stageName}`);

      // Show appropriate panel based on stage type
      if (d.stageType === 'vote') {
        console.log('[Host] Switching to vote panel for vote stage');
        showPanel('vote');
      } else if (d.stageType === 'result') {
        showPanel('result');
      } else if (d.stageType === 'intermission') {
        console.log('[Host] Entering intermission stage');
        showPanel('game');
        // Clear any existing actions and show intermission message
        renderIntermissionMessage();
      } else {
        showPanel('game');
      }

      // Hide countdown badge
      hideAdvanceBadge();
    });

    client.on('round_started', (d) => {
      console.log('[Host] Round started:', d.roundNumber, 'of', d.totalRounds);
      addLog(`🔄 第 ${d.roundNumber} 回合 (共 ${d.totalRounds} 回合)`);
      // Hide countdown badge when round starts (after countdown ends)
      hideAdvanceBadge();
      // Status updated via all_players_status_updated event
    });

    client.on('card_played', (d) => {
      const player = currentPlayers && currentPlayers.find(p => p.id === d.playerId);
      const playerName = player?.name || d.playerId;
      console.log('[Host] Card played:', playerName);
      if (playerName) addLog(`${playerName} 已出牌`);
      // Status updated via player_status_updated event
    });

    client.on('player_status_updated', (d) => {
      if (currentPlayers && d.playerId) {
        const player = currentPlayers.find(p => p.id === d.playerId);
        if (player && d.status) {
          player.status = d.status;
          renderPlayers(currentPlayers);
          refreshCurrentTooltip(); // Refresh tooltip if showing
        }
      }
    });

    client.on('all_players_status_updated', (d) => {
      if (currentPlayers && d.players) {
        d.players.forEach(update => {
          const player = currentPlayers.find(p => p.id === update.playerId);
          if (player && update.status) {
            player.status = update.status;
          }
        });
        renderPlayers(currentPlayers);
        refreshCurrentTooltip(); // Refresh tooltip if showing
      }
    });

    client.on('player_hand_updated', (d) => {
      if (currentPlayers && d.playerId) {
        const player = currentPlayers.find(p => p.id === d.playerId);
        if (player) {
          if (d.handCount !== undefined) {
            player.handCount = d.handCount;
          }
          if (d.status) {
            player.status = d.status;
          }
          renderPlayers(currentPlayers);
          refreshCurrentTooltip(); // Refresh tooltip if showing
        }
      }
    });

    client.on('all_hands_updated', (d) => {
      if (currentPlayers && d.players) {
        d.players.forEach(update => {
          const player = currentPlayers.find(p => p.id === update.playerId);
          if (player) {
            if (update.handCount !== undefined) {
              player.handCount = update.handCount;
            }
            if (update.status) {
              player.status = update.status;
            }
          }
        });
        renderPlayers(currentPlayers);
        refreshCurrentTooltip(); // Refresh tooltip if showing
      }
    });

    client.on('cards_revealed', (d) => {
      console.log('[Host] Cards revealed:', d);
      addLog('🃏 翻牌！');
      // Log winners if winner data is available
      if (d.winners && d.winners.length > 0 && currentPlayers) {
        const winnerNames = d.winners.map(id => {
          const player = currentPlayers.find(p => p.id === id);
          return player ? player.name : id;
        }).filter(Boolean);
        if (winnerNames.length > 0) {
          addLog(`🏆 本回合勝者：${winnerNames.join('、')} (${d.maxValue}點)`);
        }
      }
    });

    client.on('show_result', (d) => {
      console.log('[Host] Show result');
      addLog('🏁 遊戲結束');
    });

    client.on('all_played', (d) => {
      console.log('[Host] All players played');
      addLog('✅ 全員已出牌');
    });

    client.on('host_game_state', d => {
      renderGamePanel(d);
    });

    client.on('game_ended', d => {
      currentPhase = 'result';
      renderResultPanel(d);
      showPanel('result');
      updateSortButtonState(); // Re-enable sort button when game ends
      addLog(`遊戲結束 🏆 ${d.champions?.join(', ')}`);
    });

    client.on('back_to_lobby', () => {
      currentPhase = 'lobby';
      setPhaseBadge('lobby');
      showPanel('lobby');
      // Clear player number map when returning to lobby
      playerNumberMap = {};
      // Re-render module grid so the previously selected card stays highlighted,
      // and refresh the read-only details panel.
      renderModules(availableModules);
      if (selectedManifest) renderModuleDetails(selectedManifest);
      updateLobbyBtns();
      updateSortButtonState(); // Re-enable sort button in lobby
      addLog('回到 Lobby');
    });

    // Listen for score and state updates
    client.on('scores_updated', (data) => {
      if (data.players && currentPlayers) {
        // Update each player's score and handCount
        data.players.forEach(updatedPlayer => {
          const player = currentPlayers.find(p => p.id === updatedPlayer.id);
          if (player) {
            player.score = updatedPlayer.score;
            if (updatedPlayer.handCount !== undefined) {
              player.handCount = updatedPlayer.handCount;
            }
          }
        });
        renderPlayers(currentPlayers);
        refreshCurrentTooltip(); // Refresh tooltip if showing
      }
    });

    client.on('state_update', (data) => {
      // Update player states if provided
      if (data.players && currentPlayers) {
        data.players.forEach(updatedPlayer => {
          const player = currentPlayers.find(p => p.id === updatedPlayer.id);
          if (player) {
            Object.assign(player, updatedPlayer);
          }
        });
        renderPlayers(currentPlayers);
        refreshCurrentTooltip(); // Refresh tooltip if showing
      }
    });

    client.on('error', d => addLog(`ERROR: ${d.message}`, true));

    // ── Vote Events ─────────────────────────────────────────────────
    client.on('vote_started', (d) => {
      console.log('[Host] Vote started:', d);
      showVotePanel(d);
      addLog('🗳️ 投票階段開始');
    });

    client.on('vote_cast', (d) => {
      console.log('[Host] Vote cast');
      // Track submissions
      if (d.playerId) {
        voteSubmissions.add(d.playerId);
      }
      renderVoteProgress(d);
    });

    client.on('vote_countdown', (d) => {
      updateVoteTimer(d.remaining, d.total);
    });

    client.on('vote_ended', (d) => {
      console.log('[Host] Vote ended:', d);
      // Keep vote panel visible and show results
      showVoteResults(d.results);
      addLog('📊 投票結束');
    });

    client.on('vote_can_advance', (d) => {
      console.log('[Host] Vote can advance:', d);
      addLog('✅ 可推進到下一階段');
      // Show the next stage button in vote results actions
      renderVoteResultsActions();
    });

    client.on('intermission_can_advance', (d) => {
      console.log('[Host] Intermission can advance:', d);
      addLog(`✅ ${d.message || '可推進到下一階段'}`);
      // Show the next stage button in intermission panel
      showIntermissionAdvanceButton();
    });

    client.on('players_eliminated', (d) => {
      console.log('[Host] Players eliminated:', d);
      addLog(`❌ 淘汰玩家：${d.players.map(p => p.name).join('、')}`);
      renderPlayers(currentPlayers.map(p => {
        if (d.players.find(dp => dp.id === p.id)) {
          return { ...p, isAlive: false, isReady: false };
        }
        return p;
      }));
    });

    client.on('player_alive_changed', (d) => {
      addLog(d.isAlive ? `♻️ 復活玩家：${d.playerName}` : `❌ 手動淘汰：${d.playerName}`);
      renderPlayers(currentPlayers.map(p =>
        p.id === d.playerId ? { ...p, isAlive: d.isAlive } : p
      ));
      refreshCurrentTooltip(); // Refresh tooltip if showing
    });

    client.on('player_attribute_changed', (d) => {
      renderPlayers(currentPlayers.map(p =>
        p.id === d.playerId ? { ...p, attributes: d.attributes } : p
      ));
      refreshCurrentTooltip(); // Refresh tooltip if showing
    });

    client.on('player_renamed', (d) => {
      renderPlayers(currentPlayers.map(p =>
        p.id === d.playerId ? { ...p, name: d.newName } : p
      ));
      addLog(`✏️ ${d.oldName} 改名為 ${d.newName}`);
      refreshCurrentTooltip(); // Refresh tooltip if showing
    });

    client.on('modules_updated', d => {
      availableModules = d.modules || availableModules;
      renderModules(availableModules);
      addLog('模組清單已更新');
    });

    // Auto-advance countdown broadcast from card-battle (and future modules)
    client.on('countdown', d => {
      if (d.remaining > 0) {
        showAdvanceBadge('⏱ 自動進入下一回合', `${d.remaining}s / ${d.total}s`);
      } else {
        hideAdvanceBadge();
      }
    });
  }

  // ── Panel switching ───────────────────────────────────────────
  function showPanel(name) {
    console.log('[Host] Switching to panel:', name);
    document.getElementById('lobbyPanel') .style.display = name === 'lobby'  ? 'block' : 'none';
    document.getElementById('gamePanel')  .style.display = name === 'game'   ? 'block' : 'none';
    document.getElementById('resultPanel').style.display = name === 'result' ? 'block' : 'none';
    document.getElementById('votePanel')  .style.display = name === 'vote'   ? 'block' : 'none';
    console.log('[Host] Panel display states:', {
      lobby: document.getElementById('lobbyPanel').style.display,
      game: document.getElementById('gamePanel').style.display,
      result: document.getElementById('resultPanel').style.display,
      vote: document.getElementById('votePanel').style.display
    });
  }

  // ── Read-only module details ──────────────────────────────────
  // Editing has moved entirely to /editor — host only previews the selected module.

  function renderModuleDetails(manifest) {
    document.getElementById('moduleDetails').classList.remove('hidden');
    document.getElementById('mdName').textContent = manifest.name || manifest.id;
    document.getElementById('mdId').textContent   = manifest.id;
    document.getElementById('mdDesc').textContent = manifest.description || '';
    document.getElementById('mdEditorLink').href  = `/editor?id=${encodeURIComponent(manifest.id)}`;

    // Fields → key/value list of defaults (skip hidden showWhen rows for clarity)
    const fc = manifest.fieldConfig || {};
    const activeKeys = Object.keys(fc).filter(k => {
      const def = fc[k];
      if (!def.showWhen) return true;
      return fc[def.showWhen.field]?.default === def.showWhen.value;
    });
    document.getElementById('mdFields').innerHTML = activeKeys.length
      ? activeKeys.map(k => {
          const def = fc[k];
          let v = def.default;
          if (def.type === 'select') {
            const opt = (def.options || []).find(o => o.value === v);
            v = opt ? opt.label : v;
          }
          return `<span class="k">${def.label}</span><span class="v">${v}</span>`;
        }).join('')
      : '<span class="muted">（無）</span>';

    // Decks → name + type + card count
    const typeLabels = { role:'身份', action:'行動', event:'事件', item:'道具' };
    const decks = (manifest.decks || []).filter(d => d.enabled !== false);
    document.getElementById('mdDecks').innerHTML = decks.length
      ? decks.map(d => `<div class="row">
          <span style="font-weight:600">${d.name}</span>
          <span class="pill">${typeLabels[d.type] || d.type}</span>
          <span class="muted" style="margin-left:auto">${(d.cards||[]).length} 張</span>
        </div>`).join('')
      : '<span class="muted">（無）</span>';

    // Enabled stages
    const stages = (manifest.stages || []).filter(s => s.enabled);
    const stageTypeLabels = { identity_draw:'身份抽取', card_play:'出牌回合', vote:'投票', reveal:'翻牌', result:'結算' };
    document.getElementById('mdStages').innerHTML = stages.length
      ? stages.map((s, i) => `<div class="row">
          <span class="muted">${i+1}.</span>
          <span style="font-weight:600">${s.name}</span>
          <span class="pill">${stageTypeLabels[s.type] || s.type}</span>
        </div>`).join('')
      : '<span class="muted">（無啟用階段）</span>';
  }

  function hideModuleDetails() {
    document.getElementById('moduleDetails').classList.add('hidden');
  }

  // ── Lobby: module selection ───────────────────────────────────
  function renderModules(modules) {
    const grid = document.getElementById('moduleGrid');
    if (!modules.length) { grid.innerHTML = '<div style="color:#555;font-size:.8rem;">無可用模組</div>'; return; }
    grid.innerHTML = modules.map(m => `
      <div class="module-card ${selectedModule === m.id ? 'selected' : ''}"
           id="mod_${m.id}" onclick="selectModule('${m.id}')">
        <div class="mname">${m.name}</div>
        <div class="mdesc">${m.description || ''}</div>
        <div class="mcount">${m.minPlayers}–${m.maxPlayers} 人</div>
      </div>`).join('');
    updateLobbyBtns();
  }

  function selectModule(id) {
    selectedModule   = id;
    selectedManifest = availableModules.find(m => m.id === id) || null;
    document.querySelectorAll('.module-card').forEach(el => el.classList.remove('selected'));
    const el = document.getElementById(`mod_${id}`);
    if (el) el.classList.add('selected');
    if (selectedManifest) renderModuleDetails(selectedManifest);
    else                  hideModuleDetails();
    updateLobbyBtns();
  }

  function startGame() {
    if (!selectedModule) return;
    // Send no overrides — server uses manifest defaults baked in via /editor.
    client.loadModule(selectedModule, null);
  }

  function updateLobbyBtns() {
    const readyCount   = currentPlayers.filter(p => p.isReady).length;
    const hint         = document.getElementById('startHint');
    let   disabled     = !selectedModule || currentPhase === 'playing';
    let   msg          = '';

    if (!disabled && selectedManifest) {
      const { minPlayers, maxPlayers } = selectedManifest;
      if (readyCount < minPlayers) { disabled = true; msg = `至少需要 ${minPlayers} 人準備（目前 ${readyCount} 人）`; }
      else if (readyCount > maxPlayers) { disabled = true; msg = `最多 ${maxPlayers} 人（目前 ${readyCount} 人）`; }
    }

    document.getElementById('startBtn').disabled = disabled;
    hint.textContent = msg;
  }

  // ── Game panel rendering ──────────────────────────────────────
  const ACTION_DEFS = {
    advance_identity: { label: '▶ 全員確認，開始發牌', cls: 'btn-primary' },
    force_reveal:     { label: '⚡ 強制翻牌',          cls: 'btn-warning' },
    next_round:       { label: '▶ 下一回合',          cls: 'btn-primary' },
    next_stage:       { label: '▶ 下一階段',          cls: 'btn-success' },
    end_game:         { label: '✕ 結束遊戲',          cls: 'btn-danger'  },
    restart:          { label: '↺ 重新開始',          cls: 'btn-success' },
    back_to_lobby:    { label: '← 返回 Lobby',        cls: 'btn-neutral' },
  };
  const PHASE_COLORS = { waiting: '#cc8800', reveal: '#5555ff', result: '#33bb66', deal: '#888', identity_draw: '#aa44ff', card_play: '#33bb66' };
  const TEAM_COLORS  = { red:'#ff6666', blue:'#6688ff', green:'#44cc88', gold:'#ffdd44', purple:'#bb66ff' };

  function renderGamePanel(state) {
    currentGamePhase = state.phase; // Store current game phase for use in renderPlayers
    console.log('[Host] renderGamePanel called with phase:', state.phase, 'playerStates:', state.playerStates?.length);

    // Update currentPlayers with playerStates from game panel
    if (state.playerStates && currentPlayers) {
      state.playerStates.forEach(updatedPlayer => {
        const player = currentPlayers.find(p => p.id === updatedPlayer.id);
        if (player) {
          Object.assign(player, updatedPlayer);
        }
      });
      renderPlayers(currentPlayers); // Re-render to show/hide identity badges
    }

    // header
    document.getElementById('gpModuleName').textContent = state.module || '';
    document.getElementById('gpPhaseLabel').textContent = state.phaseLabel || state.phase;
    const dot = document.getElementById('gpPhaseDot');
    dot.style.background = PHASE_COLORS[state.phase] || '#5555ff';

    // Auto-advance badge
    // Note: Don't hide badge here if countdown is active (managed by countdown events)
    const adv = state.advance;
    if (adv && adv.autoPending) {
      const triggerLabels = {
        all_played: '全員出牌後自動推進',
        all_confirmed: '全員確認後自動推進',
        all_ready: '全員準備後自動推進',
        auto: '固定延遲後自動推進',
        timer: '倒數結束後自動推進',
      };
      const lbl = triggerLabels[adv.trigger] || adv.trigger;
      const fb  = adv.hostCanForce ? '（host 仍可強制）' : '';
      // Only show if not showing countdown timer (countdown events take precedence)
      const timerEl = document.getElementById('gpAdvanceTimer');
      if (!timerEl || !timerEl.textContent) {
        showAdvanceBadge(`⏱ ${lbl}${fb}`, '');
      }
    }
    // Don't hide badge here - let countdown events and stage/round events manage it

    // round progress
    const dots = Array.from({ length: state.maxRounds }, (_, i) => {
      const cls = i < state.round - 1 ? 'done' : i === state.round - 1 ? 'current' : '';
      return `<div class="rdot ${cls}"></div>`;
    }).join('');
    document.getElementById('gpRoundDots').innerHTML = dots;
    const pct = state.maxRounds ? Math.round(((state.round - 1) / state.maxRounds) * 100) : 0;
    document.getElementById('gpProgressFill').style.width = pct + '%';
    document.getElementById('gpRoundText').textContent = `${state.round}/${state.maxRounds}`;

    // grid label
    const players = state.playerStates || [];
    const alivePlayers = players.filter(p => p.isAlive !== false);
    const played  = alivePlayers.filter(p => p.hasPlayed).length;
    const total   = alivePlayers.length;

    if (state.phase === 'identity_draw') {
      const confirmed = state.identityProgress?.confirmed ?? players.filter(p => p.confirmed).length;
      const totalI    = state.identityProgress?.total     ?? total;
      document.getElementById('gpGridLabel').textContent = `身份確認狀態 (${confirmed}/${totalI})`;
    } else {
      document.getElementById('gpGridLabel').textContent =
        state.phase === 'waiting' ? `玩家出牌狀態 (${played}/${total})` : '玩家狀態';
    }

    // player rows — show status, remove identity column
    document.getElementById('gpPlayerGrid').innerHTML = players.map(p => {
      const id = p.identity || {};

      // Status icon and row class based on phase
      let statusIcon, rowCls, statusText, scoreText;

      if (state.phase === 'identity_draw') {
        statusIcon = !p.isConnected ? '✕' : (p.confirmed ? '✓' : '⏳');
        rowCls = !p.isConnected ? 'disconnected' : p.confirmed ? 'played' : 'waiting';
        statusText = !p.isConnected ? '斷線' : p.confirmed ? '已確認' : '查看中';
        scoreText = statusText;
      } else {
        statusIcon = p.hasPlayed ? '✓' : (p.isConnected ? '⏳' : '✕');
        rowCls = !p.isConnected ? 'disconnected' : p.hasPlayed ? 'played' : 'waiting';
        statusText = p.hasPlayed ? '已出牌' : (p.isConnected ? '等待中' : '斷線');
        scoreText = `${p.score}pt · ${p.handCount}張`;
      }

      return `<div class="gp-player-row ${rowCls}">
        <span class="gp-status-icon">${statusIcon}</span>
        <span class="gp-pname">${p.name}</span>
        <span class="gp-pstatus">${statusText}</span>
        <span class="gp-pscore">${scoreText}</span>
      </div>`;
    }).join('');

    // reveal cards
    const revealSec = document.getElementById('gpRevealSection');
    if (state.reveals && state.reveals.length > 0) {
      revealSec.classList.remove('hidden');
      // find max value to mark winner(s)
      const maxVal = Math.max(...state.reveals.map(r => r.card.value));
      document.getElementById('gpReveals').innerHTML = state.reveals.map(r => {
        const isWinner = r.card.value === maxVal;
        return `<div class="gp-reveal-card ${isWinner ? 'winner' : ''}">
          ${isWinner ? '<div class="gp-winner-tag">🏆 勝</div>' : ''}
          <div class="gp-rc-name">${r.card.name}</div>
          <div class="gp-rc-value">${r.card.value}</div>
          <div class="gp-rc-player">${r.playerName}</div>
        </div>`;
      }).join('');

      // Build winner names
      const winners = state.reveals.filter(r => r.card.value === maxVal).map(r => r.playerName);
      document.getElementById('gpWinnerLine').textContent =
        winners.length ? `本回合勝者：${winners.join('、')}` : '';
    } else {
      revealSec.classList.add('hidden');
    }

    // action buttons
    document.getElementById('gpActions').innerHTML = (state.availableActions || []).map(a => {
      const def = ACTION_DEFS[a] || { label: a, cls: 'btn-neutral' };
      return `<button class="btn ${def.cls} btn-full" onclick="hostAction('${a}')">${def.label}</button>`;
    }).join('');
  }

  // ── Result panel rendering ────────────────────────────────────
  function renderResultPanel(data) {
    const ranked   = data.ranked || [];
    const champions= data.champions || [];
    const maxScore = ranked.length ? ranked[0].score : 1;

    document.getElementById('rpWinners').textContent =
      champions.length ? `勝者：${champions.join('、')}` : '';

    const medals = ['🥇', '🥈', '🥉'];
    document.getElementById('rpLeaderboard').innerHTML = ranked.map((p, i) => {
      const isChamp = champions.includes(p.name);
      const barPct  = maxScore ? Math.round((p.score / maxScore) * 100) : 0;
      return `<div class="rp-row ${isChamp ? 'champion' : ''}">
        <span class="rp-rank">${medals[i] || (i + 1)}</span>
        <span class="rp-name">${p.name}</span>
        <div class="rp-bar-wrap"><div class="rp-bar"><div class="rp-bar-fill" style="width:${barPct}%"></div></div></div>
        <span class="rp-score">${p.score} 分</span>
      </div>`;
    }).join('');
  }

  // ── Host actions ──────────────────────────────────────────────
  function hostAction(action) {
    client.nextPhase({ action });
  }

  // ── Player sort & order ───────────────────────────────────────
  let sortMode    = 'join';   // 'join' | 'name-asc' | 'name-desc' | 'manual'
  let playerOrder = [];       // canonical ID order (updated on join/leave/drag)
  let _dragSrcId  = null;

  const SORT_LABELS = {
    'join':      '登入順序',
    'name-asc':  '名字 A→Z',
    'name-desc': '名字 Z→A',
    'manual':    '手動排列',
  };

  function setSortMode(mode) {
    // Prevent changing sort mode during gameplay
    if (currentPhase === 'playing') {
      return;
    }
    sortMode = mode;
    document.getElementById('sortLabel').textContent = SORT_LABELS[mode];
    document.body.classList.toggle('sort-manual', mode === 'manual');
    // mark active option
    document.querySelectorAll('.sort-opt').forEach(el =>
      el.classList.toggle('active', el.dataset.mode === mode));
    closeSortMenu();
    renderPlayers(currentPlayers);
  }

  function toggleSortMenu(e) {
    e.stopPropagation();
    // Disable sorting during gameplay
    if (currentPhase === 'playing') {
      return;
    }
    document.getElementById('sortMenu').classList.toggle('open');
  }

  function updateSortButtonState() {
    const sortBtn = document.getElementById('sortBtn');
    if (currentPhase === 'playing') {
      sortBtn.disabled = true;
      sortBtn.style.opacity = '0.3';
      sortBtn.style.cursor = 'not-allowed';
    } else {
      sortBtn.disabled = false;
      sortBtn.style.opacity = '1';
      sortBtn.style.cursor = 'pointer';
    }
  }

  function closeSortMenu() {
    document.getElementById('sortMenu').classList.remove('open');
  }

  document.addEventListener('click', () => closeSortMenu());

  function getDisplayList(list) {
    // keep playerOrder in sync: remove departed, append new
    const ids = new Set(list.map(p => p.id));
    playerOrder = playerOrder.filter(id => ids.has(id));
    for (const p of list) {
      if (!playerOrder.includes(p.id)) playerOrder.push(p.id);
    }

    if (sortMode === 'name-asc')
      return [...list].sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));
    if (sortMode === 'name-desc')
      return [...list].sort((a, b) => b.name.localeCompare(a.name, 'zh-TW'));
    if (sortMode === 'manual')
      return playerOrder.map(id => list.find(p => p.id === id)).filter(Boolean);
    return list; // 'join' — server order
  }

  // ── Players column ────────────────────────────────────────────
  let _menuPlayerId = null;

  function renderPlayers(list) {
    console.log('[Host] renderPlayers called with', list.length, 'players:', list);
    currentPlayers = list;
    updateLobbyBtns();

    const numberColumnEl = document.getElementById('numberColumn');
    const playerListEl = document.getElementById('playerList');
    console.log('[Host] numberColumnEl:', numberColumnEl, 'playerListEl:', playerListEl);
    document.getElementById('playerCount').textContent = list.length;

    if (!list.length) {
      if (numberColumnEl) numberColumnEl.innerHTML = '';
      if (playerListEl) playerListEl.innerHTML = '<div style="color:#555;font-size:.82rem;text-align:center;margin-top:20px">等待玩家加入…</div>';
      return;
    }

    const attrDefs = selectedManifest?.playerAttributes || [];
    const display  = getDisplayList(list);

    // Sync display order to the display screen
    client.setPlayerOrder(display.map(p => p.id));

    // Assign numbers based on current display order
    let numbersChanged = false;
    display.forEach((p, index) => {
      const newNumber = index + 1;
      if (playerNumberMap[p.id] !== newNumber) {
        playerNumberMap[p.id] = newNumber;
        numbersChanged = true;
        console.log('[Host] Updated player number:', p.name, '→', newNumber);
      }
    });

    // Notify clients of player number updates ONLY if numbers actually changed
    if (numbersChanged && (currentPhase === 'playing' || currentPhase === 'lobby')) {
      const playerNumbers = {};
      display.forEach((p, index) => {
        playerNumbers[p.id] = index + 1;
      });
      client.socket.emit('player_numbers_updated', { roomId, players: playerNumbers });
      console.log('[Host] Broadcasting player numbers:', playerNumbers);
    }

    // Render number column (in display order)
    if (numberColumnEl) {
      numberColumnEl.innerHTML = display.map(p => {
        const num = playerNumberMap[p.id];
        return `<div class="number-item">${num}</div>`;
      }).join('');
    }

    // Render player list (can be reordered by drag/drop)
    if (playerListEl) {
      const playersHtml = display.map(p => {
      const alive = p.isAlive !== false;
      const attrs = p.attributes || {};

      const iconHtml = attrDefs.map(def => {
        const opt = def.options?.find(o => o.value === attrs[def.id]);
        return opt ? `<span class="attr-icon" title="${def.label}：${opt.label}">${opt.icon}</span>` : '';
      }).join('');

      // Build identity badge (always show if available)
      const identityHtml = p.identity
        ? `<span class="identity-badge" style="background:${TEAM_COLORS[p.identity.team] || '#888'};color:#000;font-size:0.65rem;padding:1px 4px;border-radius:3px;margin-left:6px;">${p.identity.name}</span>`
        : '';

      // Build inline status display
      const statusLabels = {
        'waiting': '⏳ 等待準備',
        'ready': '✓ 已準備',
        'viewing': '👁️ 查看中',
        'confirmed': '✓ 已確認',
        'thinking': '🤔 思考中',
        'played': '✓ 已出牌',
        'voting': '🗳️ 投票中',
        'voted': '✓ 已投票',
        'completed': '✓ 已完成',
        'eliminated': '❌ 已淘汰',
        'disconnected': '🔴 已斷線'
      };
      const statusLabel = statusLabels[p.status] || p.status || '未知';
      const statusIcon = statusLabel.split(' ')[0]; // Take emoji only for inline display
      const statsHtml = `
        <div class="pstats">
          ${statusIcon ? `<span class="pstat-status" title="${statusLabel}">${statusIcon}</span>` : ''}
        </div>
      `;

      // Build tooltip with all detailed info
      const aliveRow = `<div class="tt-row">${alive ? '✅ 存活' : '❌ 淘汰'}</div>`;
      const scoreRow = `<div class="tt-row">🏆 分數：${p.score ?? 0}</div>`;
      const handRow = `<div class="tt-row">🃏 手牌：${p.handCount ?? 0} 張</div>`;
      const statusRow = `<div class="tt-row">${statusLabel}</div>`;
      const readyRow = `<div class="tt-row">${p.isReady ? '✓ 已準備' : '⏳ 等待中'}</div>`;
      const attrRows = attrDefs.map(def => {
        const opt = def.options?.find(o => o.value === attrs[def.id]);
        return `<div class="tt-row">${def.label}：${opt ? opt.icon + ' ' + opt.label : '—'}</div>`;
      }).join('');
      const tooltipHtml = (aliveRow + scoreRow + handRow + statusRow + readyRow + attrRows).replace(/"/g, '&quot;');

      const canDrag = currentPhase !== 'playing'; // Disable dragging during game

      return `
      <div class="player-row${alive ? '' : ' eliminated'}${canDrag ? '' : ' locked'}"
           data-pid="${p.id}"
           draggable="${canDrag}"
           onmouseenter="showTooltip(event,this)"
           onmousemove="moveTooltip(event)"
           onmouseleave="hideTooltip()"
           ondragstart="onDragStart(event,'${p.id}')"
           ondragover="onDragOver(event,'${p.id}')"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event,'${p.id}')"
           ondragend="onDragEnd()">
        ${canDrag ? '<span class="drag-handle">⠿</span>' : ''}
        <div class="dot ${p.isConnected !== false ? 'on' : 'off'}"></div>
        <div class="info">
          <div class="pname-row">
            <span class="pname">${p.name}</span>${iconHtml}${identityHtml}
          </div>
        </div>
        ${statsHtml}
        <button class="pmenu-btn" onclick="openPlayerMenu(event,'${p.id}')">⋮</button>
      </div>`;
      }).join('');
      console.log('[Host] Generated HTML for', display.length, 'players, length:', playersHtml.length);
      playerListEl.innerHTML = playersHtml;
      console.log('[Host] Set innerHTML, current playerListEl children:', playerListEl.children.length);
    } else {
      console.error('[Host] playerListEl not found!');
    }
  }

  // ── Drag-and-drop handlers ────────────────────────────────────
  function onDragStart(e, pid) {
    if (sortMode !== 'manual') return e.preventDefault();
    _dragSrcId = pid;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => {
      const el = document.querySelector(`.player-row[data-pid="${pid}"]`);
      if (el) el.classList.add('dragging');
    }, 0);
  }

  function onDragOver(e, pid) {
    if (!_dragSrcId || _dragSrcId === pid) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.player-row.drag-over')
      .forEach(el => el.classList.remove('drag-over'));
    const el = document.querySelector(`.player-row[data-pid="${pid}"]`);
    if (el) el.classList.add('drag-over');
  }

  function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  function onDrop(e, targetPid) {
    if (!_dragSrcId || _dragSrcId === targetPid) return;
    e.preventDefault();
    const from = playerOrder.indexOf(_dragSrcId);
    const to   = playerOrder.indexOf(targetPid);
    if (from === -1 || to === -1) return;
    playerOrder.splice(from, 1);
    playerOrder.splice(to, 0, _dragSrcId);
    renderPlayers(currentPlayers);
  }

  function onDragEnd() {
    _dragSrcId = null;
    document.querySelectorAll('.player-row.dragging, .player-row.drag-over')
      .forEach(el => el.classList.remove('dragging', 'drag-over'));
  }

  function openPlayerMenu(e, pid) {
    e.stopPropagation();
    _menuPlayerId = pid;
    const p = currentPlayers.find(x => x.id === pid);
    if (!p) return;
    const alive = p.isAlive !== false;
    const attrs = p.attributes || {};
    const attrDefs = selectedManifest?.playerAttributes || [];

    let html = '';

    // Rename
    html += `<div class="pd-section">玩家管理</div>`;
    html += `<div class="pd-row" onclick="menuRename()">✏️ 修改名稱</div>`;

    // Alive toggle
    html += `<div class="pd-divider"></div>`;
    html += `<div class="pd-section">存活狀態</div>`;
    if (alive) {
      html += `<div class="pd-row" onclick="menuSetAlive(false)">❌ 淘汰玩家</div>`;
    } else {
      html += `<div class="pd-row" onclick="menuSetAlive(true)">♻️ 復活玩家</div>`;
    }

    // Attribute sections
    attrDefs.forEach(def => {
      html += `<div class="pd-divider"></div>`;
      html += `<div class="pd-section">${def.label}</div>`;
      html += `<div class="pd-attr-opts">`;
      (def.options || []).forEach(opt => {
        const active = attrs[def.id] === opt.value ? ' active' : '';
        html += `<button class="pd-opt${active}" onclick="menuSetAttr('${def.id}','${opt.value}')">${opt.icon} ${opt.label}</button>`;
      });
      html += `</div>`;
    });

    // Kick
    html += `<div class="pd-divider"></div>`;
    html += `<div class="pd-row danger" onclick="menuKick()">🚫 踢除玩家</div>`;

    const dd = document.getElementById('playerDropdown');
    dd.innerHTML = html;

    // Position near button
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    dd.style.top  = rect.bottom + 4 + 'px';
    dd.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';
    dd.classList.add('open');
  }

  function closePlayerMenu() {
    document.getElementById('playerDropdown').classList.remove('open');
    _menuPlayerId = null;
  }

  function menuSetAlive(isAlive) {
    if (!_menuPlayerId) return;
    client.setPlayerAlive(_menuPlayerId, isAlive);
    closePlayerMenu();
  }

  function menuSetAttr(attrId, value) {
    if (!_menuPlayerId) return;
    client.setPlayerAttribute(_menuPlayerId, attrId, value);
    closePlayerMenu();
  }

  function menuRename() {
    if (!_menuPlayerId) return;
    const p = currentPlayers.find(x => x.id === _menuPlayerId);
    if (!p) return;

    const newName = prompt(`修改玩家名稱`, p.name);
    if (newName === null) return; // User cancelled
    if (newName.trim() === '') {
      alert('名稱不能為空');
      return;
    }

    client.renamePlayer(_menuPlayerId, newName);
    closePlayerMenu();
  }

  function menuKick() {
    if (!_menuPlayerId) return;
    const p = currentPlayers.find(x => x.id === _menuPlayerId);
    const name = p ? p.name : _menuPlayerId;
    if (confirm(`確定踢除玩家「${name}」？`)) client.kickPlayer(_menuPlayerId);
    closePlayerMenu();
  }

  // Close dropdown on outside click or Escape
  document.addEventListener('click', () => closePlayerMenu());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayerMenu(); });

  // ── Player tooltip ────────────────────────────────────────────
  const _tt = () => document.getElementById('playerTooltip');
  let _currentTooltipPlayer = null; // Track which player's tooltip is showing

  function showTooltip(e, el) {
    const tt = _tt();
    _currentTooltipPlayer = el.dataset.pid; // Track current player
    updateTooltipContent(el); // Update content
    tt.style.display = 'block';
    positionTooltip(e);
  }

  function updateTooltipContent(el) {
    const tt = _tt();
    const playerId = el.dataset.pid;
    const player = currentPlayers?.find(p => p.id === playerId);
    if (!player) return;

    // Rebuild tooltip content dynamically based on current player state
    const alive = player.isAlive !== false;
    const attrDefs = selectedManifest?.playerAttributes || [];
    const attrs = player.attributes || {};

    const aliveRow = `<div class="tt-row">${alive ? '✅ 存活' : '❌ 淘汰'}</div>`;
    const scoreRow = `<div class="tt-row">🏆 分數：${player.score ?? 0}</div>`;
    const handRow = `<div class="tt-row">🃏 手牌：${player.handCount ?? 0} 張</div>`;

    // Display player status (unified status field)
    const statusLabels = {
      'waiting': '⏳ 等待準備',
      'ready': '✓ 已準備',
      'viewing': '👁️ 查看中',
      'confirmed': '✓ 已確認',
      'thinking': '🤔 思考中',
      'played': '✓ 已出牌',
      'voting': '🗳️ 投票中',
      'voted': '✓ 已投票',
      'completed': '✓ 已完成',
      'eliminated': '❌ 已淘汰',
      'disconnected': '🔴 已斷線'
    };
    const statusLabel = statusLabels[player.status] || player.status || '未知';
    const statusRow = `<div class="tt-row">${statusLabel}</div>`;

    const attrRows = attrDefs.map(def => {
      const opt = def.options?.find(o => o.value === attrs[def.id]);
      return `<div class="tt-row">${def.label}：${opt ? opt.icon + ' ' + opt.label : '—'}</div>`;
    }).join('');

    tt.innerHTML = aliveRow + scoreRow + handRow + statusRow + attrRows;
  }

  function refreshCurrentTooltip() {
    if (!_currentTooltipPlayer) return;
    const el = document.querySelector(`[data-pid="${_currentTooltipPlayer}"]`);
    if (el && _tt().style.display === 'block') {
      updateTooltipContent(el);
    }
  }

  function moveTooltip(e) {
    positionTooltip(e);
  }

  function hideTooltip() {
    _tt().style.display = 'none';
    _currentTooltipPlayer = null;
  }

  function positionTooltip(e) {
    const tt = _tt();
    const offset = 14;
    const tw = tt.offsetWidth;
    const th = tt.offsetHeight;
    let x = e.clientX + offset;
    let y = e.clientY + offset;
    if (x + tw > window.innerWidth  - 8) x = e.clientX - tw - offset;
    if (y + th > window.innerHeight - 8) y = e.clientY - th - offset;
    tt.style.left = x + 'px';
    tt.style.top  = y + 'px';
  }

  // ── Helpers ───────────────────────────────────────────────────
  function setRoom(id) {
    document.getElementById('headerRoom').textContent = id;
  }

  function setPhaseBadge(p) {
    const labels = { lobby: 'LOBBY', playing: 'PLAYING', result: 'RESULT' };
