<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>遊戲中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a1a;
      color: #e0e0ff;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header bar ── */
    #header {
      background: #14142a;
      border-bottom: 1px solid #2a2a5a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #header .room   { font-size: .75rem; color: #8888bb; }
    #header .name   { font-size: .95rem; font-weight: 700; }
    #header .score  { font-size: .85rem; color: #ffdd44; }

    /* ── Status area ── */
    #statusArea {
      padding: 12px 16px;
      font-size: .85rem;
      color: #aaaacc;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Persistent identity badge (visible during card play) ── */
    #identityBadge {
      margin: 10px 12px 0;
      background: #14142a;
      border: 1.5px solid #3a3a6a;
      border-left-width: 4px;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #identityBadge:active { background: #1a1a3a; }
    #identityBadge .ib-icon  { font-size: 1.2rem; }
    #identityBadge .ib-info  { flex: 1; min-width: 0; }
    #identityBadge .ib-label { font-size: .65rem; color: #6666aa; letter-spacing: .08em; }
    #identityBadge .ib-name  { font-size: .92rem; font-weight: 700; }
    #identityBadge .ib-team  { font-size: .68rem; padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }

    /* ── Shared state panel ── */
    #sharedPanel {
      margin: 0 12px;
      background: #14142a;
      border: 1px solid #2a2a5a;
      border-radius: 12px;
      padding: 12px;
      font-size: .82rem;
      color: #9999cc;
      flex-shrink: 0;
      min-height: 60px;
    }

    /* ── Module content area (injected by module) ── */
    #moduleArea {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* ── Hand / card area ── */
    #handArea {
      background: #0d0d24;
      border-top: 1px solid #2a2a5a;
      padding: 12px;
      flex-shrink: 0;
    }
    #handArea h3 { font-size: .75rem; color: #8888bb; margin-bottom: 10px; letter-spacing: .05em; }
    #cardList {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .card-item {
      background: #1a1a3a;
      border: 2px solid #3a3a6a;
      border-radius: 12px;
      padding: 14px 12px;
      min-width: 80px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      flex-shrink: 0;
      user-select: none;
    }
    .card-item:active { transform: scale(.95); }
    .card-item.selected { border-color: #6666ff; background: #22225a; }
    .card-item .card-name { font-size: .8rem; font-weight: 700; }
    .card-item .card-desc { font-size: .68rem; color: #8888bb; margin-top: 4px; }

    #playBtn {
      width: 100%;
      margin-top: 12px;
      background: #5555ff;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px;
      cursor: pointer;
      display: none;
    }
    #playBtn:active { background: #3333cc; }

    /* ── Lobby screen ── */
    #lobbyScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    #lobbyScreen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lobbyScreen p  { color: #8888bb; font-size: .9rem; margin-bottom: 24px; }
    #playerList     { width: 100%; max-width: 300px; }
    .player-entry   {
      background: #14142a;
      border: 1px solid #2a2a5a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .9rem;
    }
    .player-entry .ready { color: #44ff88; font-size: .75rem; }
    .player-entry .waiting { color: #888; font-size: .75rem; }
    #readyBtn {
      width: 100%;
      max-width: 300px;
      margin-top: 16px;
      background: #33bb66;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
    }
    #readyBtn.is-ready { background: #1a6633; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <div>
      <div class="room" id="headerRoom">房間 ------</div>
      <div class="name" id="headerName">載入中…</div>
    </div>
    <div class="score">分數 <span id="headerScore">0</span></div>
  </div>

  <!-- Lobby screen -->
  <div id="lobbyScreen">
    <h2>等待室</h2>
    <p>等待主持人開始遊戲…</p>
    <div id="playerList"></div>
    <button id="readyBtn" onclick="toggleReady()">我準備好了</button>
  </div>

  <!-- Result screen -->
  <div id="resultScreen" class="hidden" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:28px;text-align:center;">
    <div style="font-size:3rem;margin-bottom:8px;">🏆</div>
    <div style="font-size:1.3rem;font-weight:700;color:#ffdd44;margin-bottom:6px;">遊戲結束</div>
    <div id="resultWinners" style="font-size:.85rem;color:#aaaacc;margin-bottom:28px;"></div>
    <div style="background:#14142a;border:1px solid #2a2a5a;border-radius:14px;padding:20px 24px;width:100%;max-width:300px;margin-bottom:24px;">
      <div style="font-size:.72rem;color:#6666aa;margin-bottom:12px;letter-spacing:.08em;">最終排名</div>
      <div id="resultLeaderboard"></div>
    </div>
    <div style="font-size:.82rem;color:#6666aa;margin-bottom:20px;">等待主持人開始下一局…</div>
    <button onclick="leaveRoom()"
      style="background:transparent;border:1px solid #3a3a6a;border-radius:10px;
             color:#6666aa;font-size:.85rem;padding:10px 28px;cursor:pointer;">
      離開房間
    </button>
  </div>

  <!-- Game screen (hidden until game starts) -->
  <div id="gameScreen" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div id="statusArea">等待遊戲…</div>
    <div id="countdownArea" class="hidden"
         style="text-align:center;font-size:.85rem;color:#66bbff;padding:0 16px 6px;font-family:monospace;"></div>

    <!-- Identity stage -->
    <div id="identityScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
      <div style="font-size:3rem;margin-bottom:12px;">🎭</div>
      <div style="font-size:.8rem;color:#8888bb;margin-bottom:20px;letter-spacing:.1em;">你的身份</div>
      <div id="identityCard" style="background:#14142a;border:2px solid #5555ff;border-radius:16px;padding:28px 32px;width:100%;max-width:280px;">
        <div id="identityName"   style="font-size:1.6rem;font-weight:700;margin-bottom:8px;">—</div>
        <div id="identityTeam"   style="font-size:.78rem;margin-bottom:10px;"></div>
        <div id="identityDesc"   style="font-size:.85rem;color:#9999cc;"></div>
      </div>
      <button onclick="confirmIdentity()" id="identityConfirmBtn"
        style="margin-top:24px;background:#5555ff;border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:700;padding:13px 32px;cursor:pointer;">
        確認身份
      </button>
      <div id="identityConfirmedMsg" class="hidden" style="margin-top:12px;font-size:.82rem;color:#44ff88;">✓ 已確認，等待主持人推進</div>
    </div>

    <!-- Card play stage -->
    <div id="cardPlayScreen" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div id="identityBadge" class="hidden" onclick="reopenIdentity()">
        <div class="ib-icon">🎭</div>
        <div class="ib-info">
          <div class="ib-label">你的身份</div>
          <div class="ib-name" id="ibName">—</div>
        </div>
        <div class="ib-team" id="ibTeam"></div>
      </div>
      <div id="sharedPanel">公共資訊載入中…</div>
      <div id="moduleArea"></div>
      <div id="handArea">
        <h3 id="handTitle">我的手牌（行動牌組）</h3>
        <div id="cardList"></div>
        <button id="playBtn" onclick="playSelected()">出牌</button>
      </div>
    </div>
  </div>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/socket.js"></script>
  <script>
    const params     = new URLSearchParams(window.location.search);
    const roomId     = params.get('room') || '';
    const playerName = params.get('name') || '玩家';
    const playerId   = getOrCreatePlayerId();

    let selectedCard = null;
    let myHand       = [];
    let myIdentity   = null;     // persistent identity card (if any)
    let isReady      = false;
    let phase        = 'lobby';
    let isPlayingCard = false;   // tracking card play in progress
    let isRevealed   = false;    // tracks if cards have been revealed this round
    let hasPlayedThisRound = false;  // tracks if player has played a card this round

    // Store players info for display
    const players = new Map();  // playerId -> { name, isReady, score, ... }

    // ── Connect ──────────────────────────────────────────────
    const client = new GameClient();
    client.connect();

    client.on('connect', () => {
      client.joinRoom(roomId, playerId, playerName);
    });

    client.on('room_joined', (data) => {
      phase = data.phase;
      document.getElementById('headerRoom').textContent = `房間 ${data.roomId}`;
      document.getElementById('headerName').textContent = playerName;
      renderPlayers(data.players);
      if (data.playerState) updateMyState(data.playerState);
      if (data.sharedState) updateSharedPanel(data.sharedState);
      if (data.phase === 'playing') enterGameScreen();
    });

    client.on('player_joined',       d => renderPlayers(d.players || []));
    client.on('player_left', d => {
      if (d.playerId === playerId) {
        alert('你已被移出房間');
        window.location.href = '/mobile';
      } else {
        renderPlayers((d.players || []).filter(p => p.id !== d.playerId));
      }
    });
    client.on('player_ready',        d => renderPlayers(d.players || []));
    client.on('player_reconnected',  d => {});

    client.on('game_started', (data) => {
      phase = 'playing';
      updateSharedPanel(data.sharedState || {});
      document.getElementById('headerScore').textContent = '0';
      // Do NOT reset myHand here — cards_drawn owns the hand state.
      // Resetting here would wipe cards that already arrived before game_started.
      selectedCard = null;
      myIdentity   = null;       // fresh game → new identity will arrive (if any)
      isPlayingCard = false;      // Reset playing state
      renderIdentityBadge();
      hideIdentityScreen();
      hideResultScreen();
      enterGameScreen();
      // Clear countdown
      const el = document.getElementById('countdownArea');
      el.classList.add('hidden');
      el.textContent = '';
    });

    client.on('game_ended', (data) => {
      phase = 'result';
      showResultScreen(data);
    });

    client.on('back_to_lobby', () => {
      phase = 'lobby';
      hideResultScreen();
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').style.display = 'flex';
      isReady = false;
      const btn = document.getElementById('readyBtn');
      btn.textContent = '我準備好了';
      btn.classList.remove('is-ready');
    });

    client.on('identity_assigned', (data) => {
      myIdentity = data.card;
      renderIdentityBadge();
      enterGameScreen();
      showIdentityScreen(data.card);
    });

    client.on('phase_changed', (data) => {
      document.getElementById('statusArea').textContent = data.message || '';
      if (data.phase === 'waiting' || data.phase === 'reveal') {
        hideIdentityScreen();
      }
    });

    client.on('identity_progress', (data) => {
      // optional: show progress feedback
    });

    client.on('state_update', (data) => {
      if (data.sharedState) updateSharedPanel(data.sharedState);
    });

    client.on('card_accepted', (data) => {
      // Server confirmed card played — sync hand immediately so round 2+ works
      isPlayingCard = false;
      hasPlayedThisRound = true;  // 標記本回合已出牌
      if (data.hand) {
        myHand = data.hand;
      } else {
        // Filter out the specific card instance that was played
        myHand = myHand.filter(c => c._instanceId !== data.instanceId);
      }
      selectedCard = null;
      renderHand();  // 這會隱藏出牌按鈕（因為 hasPlayedThisRound = true）
    });

    client.on('card_rejected', (data) => {
      console.log('[Mobile] Card rejected:', data.reason, data.message);
      isPlayingCard = false;

      // 如果是因為已經出過牌而被拒絕，確保按鈕保持隱藏
      if (data.reason === 'already_played') {
        hasPlayedThisRound = true;
        renderHand();  // 隱藏按鈕
      }

      // Show error message to player
      if (data.message) {
        const statusArea = document.getElementById('statusArea');
        if (statusArea) {
          statusArea.textContent = data.message;
          statusArea.style.color = '#ff5555';
          setTimeout(() => {
            statusArea.textContent = '等待遊戲…';
            statusArea.style.color = '';
          }, 2000);
        }
      }
    });

    client.on('cards_drawn', (data) => {
      selectedCard = null;   // deselect on any new hand
      isRevealed = false;    // reset revealed flag when new cards are dealt
      hasPlayedThisRound = false;  // reset - new cards mean can play again
      myHand = data.hand || [];
      renderHand();
    });

    client.on('hand_refilled', (data) => {
      selectedCard = null;   // deselect on refill
      isPlayingCard = false; // Reset playing state
      isRevealed = false;    // reset revealed flag when hand is refilled
      hasPlayedThisRound = false;  // reset - refilled means can play again
      myHand = data.hand || [];
      renderHand();
    });

    // ── Stage & Round Events ───────────────────────────────────────
    client.on('stage_started', (data) => {
      console.log('[Mobile] Stage started:', data.stageId, data.stageName, 'type:', data.stageType);
      // Update UI to show current stage
      document.getElementById('statusArea').textContent = `階段：${data.stageName}`;
      // Clear countdown
      const el = document.getElementById('countdownArea');
      el.classList.add('hidden');
      el.textContent = '';

      // Hide identity screen when leaving identity_draw stage
      if (data.stageType !== 'identity_draw') {
        hideIdentityScreen();
      }
    });

    client.on('round_started', (data) => {
      console.log('[Mobile] Round started:', data.roundNumber, 'of', data.totalRounds);
      document.getElementById('statusArea').textContent = `第 ${data.roundNumber} 回合 (共 ${data.totalRounds} 回合)`;
      // Clear played cards display and reset state
      selectedCard = null;
      isPlayingCard = false;
      isRevealed = false;  // Reset revealed flag for new round
      hasPlayedThisRound = false;  // Reset for new round - can play again
      // Clear countdown
      const el = document.getElementById('countdownArea');
      el.classList.add('hidden');
      el.textContent = '';
      // 重新啟用出牌按鈕
      renderHand();
    });

    client.on('card_played', (data) => {
      console.log('[Mobile] Card played by:', data.playerId);
      // Could update UI to show that player has played
    });

    client.on('cards_revealed', (data) => {
      console.log('[Mobile] Cards revealed:', data.cards);
      document.getElementById('statusArea').textContent = '翻牌！';

      // Clear countdown (countdown should end when cards are revealed)
      const el = document.getElementById('countdownArea');
      el.classList.add('hidden');
      el.textContent = '';

      // Show revealed cards
      if (data.cards && data.cards.length > 0) {
        // Display a simple overlay or modal with revealed cards
        showRevealedCardsOverlay(data.cards);
      }
    });

    client.on('show_result', (data) => {
      console.log('[Mobile] Show result:', data);
      document.getElementById('statusArea').textContent = data.message || '遊戲結束';
    });

    // Auto-advance countdown
    client.on('countdown', (d) => {
      const el = document.getElementById('countdownArea');
      if (d.remaining > 0) {
        el.classList.remove('hidden');
        el.textContent = `⏱ ${d.remaining} 秒後自動進行下一步`;

        // 立即禁用出牌按鈕（倒數開始時）
        if (!isRevealed) {
          isRevealed = true;
          renderHand();  // 立即隱藏按鈕
          console.log('[Mobile] Countdown started, disabling card play');
        }
      } else {
        el.classList.add('hidden');
        el.textContent = '';
      }
    });
    client.on('phase_changed', () => {
      // Phase change cancels any visible countdown
      const el = document.getElementById('countdownArea');
      el.classList.add('hidden');
      el.textContent = '';
    });

    client.on('reconnected', (data) => {
      phase = data.phase;
      if (data.playerState) updateMyState(data.playerState);
      if (data.sharedState) updateSharedPanel(data.sharedState);
      if (phase === 'playing') enterGameScreen();
    });

    client.on('score_update', (data) => {
      if (data.playerId === playerId) {
        document.getElementById('headerScore').textContent = data.score;
      }
    });

    client.on('phase_changed', (data) => {
      document.getElementById('statusArea').textContent = data.message || '';
    });

    // ── Helpers ───────────────────────────────────────────────
    function enterGameScreen() {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameScreen').style.display = 'flex';
    }

    const TEAM_COLORS = {
      red:'#ff6666', blue:'#6688ff', green:'#44cc88',
      gold:'#ffdd44', purple:'#bb66ff', default:'#aaaaff'
    };

    function showIdentityScreen(card) {
      document.getElementById('identityScreen').classList.remove('hidden');
      document.getElementById('cardPlayScreen').style.display = 'none';
      document.getElementById('identityName').textContent = card.name || '—';
      document.getElementById('identityDesc').textContent = card.description || '';
      const teamEl = document.getElementById('identityTeam');
      const color = TEAM_COLORS[card.team] || TEAM_COLORS.default;
      teamEl.innerHTML = card.team
        ? `<span style="background:${color}22;color:${color};padding:3px 10px;border-radius:12px;font-size:.75rem">${card.team}</span>`
        : '';
      document.getElementById('identityCard').style.borderColor = color;
      document.getElementById('identityConfirmBtn').style.display = 'block';
      document.getElementById('identityConfirmedMsg').classList.add('hidden');
    }

    function hideIdentityScreen() {
      document.getElementById('identityScreen').classList.add('hidden');
      document.getElementById('cardPlayScreen').style.display = 'flex';
    }

    // Compact persistent badge — visible during card play so the player can
    // always see their identity even after the focus screen is dismissed.
    function renderIdentityBadge() {
      const badge = document.getElementById('identityBadge');
      if (!myIdentity) { badge.classList.add('hidden'); return; }
      const color = TEAM_COLORS[myIdentity.team] || TEAM_COLORS.default;
      badge.classList.remove('hidden');
      badge.style.borderLeftColor = color;
      document.getElementById('ibName').textContent = myIdentity.name || '—';
      const teamEl = document.getElementById('ibTeam');
      if (myIdentity.team) {
        teamEl.textContent = myIdentity.team;
        teamEl.style.background = color + '22';
        teamEl.style.color = color;
        teamEl.style.display = 'inline-block';
      } else {
        teamEl.style.display = 'none';
      }
    }

    // Tap badge → re-open the big focus view so the player can re-read the description.
    // Confirm button is hidden (already confirmed); they tap anywhere/back to dismiss.
    function reopenIdentity() {
      if (!myIdentity) return;
      showIdentityScreen(myIdentity);
      document.getElementById('identityConfirmBtn').style.display = 'none';
      document.getElementById('identityConfirmedMsg').classList.remove('hidden');
      // Add a one-time "tap to close" overlay click
      const screen = document.getElementById('identityScreen');
      const onTap = (e) => {
        if (e.target === screen) {
          hideIdentityScreen();
          screen.removeEventListener('click', onTap);
        }
      };
      setTimeout(() => screen.addEventListener('click', onTap), 50);
    }

    function confirmIdentity() {
      client.playerAction('confirm_identity', {});
      document.getElementById('identityConfirmBtn').style.display = 'none';
      document.getElementById('identityConfirmedMsg').classList.remove('hidden');
    }

    function renderPlayers(players) {
      // Update global players Map
      players.forEach(p => {
        window.players.set(p.id, p);
      });

      const list = document.getElementById('playerList');
      list.innerHTML = players.map(p => `
        <div class="player-entry">
          <span>${p.name}</span>
          <span class="${p.isReady ? 'ready' : 'waiting'}">${p.isReady ? '✓ 準備' : '等待中'}</span>
        </div>
      `).join('');
    }

    function updateMyState(state) {
      if (state.hand) { myHand = state.hand; renderHand(); }
      if (state.score !== undefined) {
        document.getElementById('headerScore').textContent = state.score;
      }
      // Restore identity on reconnect / late-join
      if (state.moduleData && state.moduleData.identity) {
        myIdentity = state.moduleData.identity;
        renderIdentityBadge();
      }
    }

    function updateSharedPanel(state) {
      const el = document.getElementById('sharedPanel');
      if (typeof state === 'object' && state.message) {
        el.textContent = state.message;
      } else {
        el.textContent = JSON.stringify(state, null, 2);
      }
    }

    function renderHand() {
      const list = document.getElementById('cardList');
      list.innerHTML = myHand.map(card => {
        // Check if card has an image
        const hasImage = card.imagePath;
        const cardImage = hasImage ? `<img src="${card.imagePath}" alt="${card.name}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:8px;">` : '';

        return `
        <div class="card-item ${selectedCard === card._instanceId ? 'selected' : ''}"
             onclick="selectCard('${card._instanceId}')">
          ${cardImage}
          <div class="card-name">${card.name}</div>
          <div class="card-desc">${card.description || ''}</div>
        </div>
        `;
      }).join('');

      // Update button state
      const btn = document.getElementById('playBtn');
      if (myHand.length === 0) {
        btn.style.display = 'none';
      } else {
        btn.style.display = 'block';

        // Disabled conditions: no selection, playing, revealed, or already played
        const disabled = !selectedCard || isPlayingCard || isRevealed || hasPlayedThisRound;
        btn.disabled = disabled;

        // Show appropriate text based on state
        if (isPlayingCard) {
          btn.textContent = '出牌中…';
        } else if (isRevealed) {
          btn.textContent = '等待下一回合';
        } else if (hasPlayedThisRound) {
          btn.textContent = '已出牌';
        } else if (!selectedCard) {
          btn.textContent = '請選擇一張牌';
        } else {
          btn.textContent = '出牌';
        }
      }
    }

    function selectCard(instanceId) {
      selectedCard = selectedCard === instanceId ? null : instanceId;
      renderHand();
    }

    function playSelected() {
      if (!selectedCard || isPlayingCard) return;
      isPlayingCard = true;

      // Send instanceId to server, not card.id
      client.playCard(selectedCard, null);

      // Update button state
      const btn = document.getElementById('playBtn');
      btn.disabled = true;
      btn.textContent = '出牌中…';

      // Reset after timeout (in case server doesn't respond)
      setTimeout(() => {
        isPlayingCard = false;
        selectedCard = null;
        renderHand();
      }, 3000);
    }

    function showResultScreen(data) {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('hidden');
      const rs = document.getElementById('resultScreen');
      rs.classList.remove('hidden');
      rs.style.display = 'flex';

      const champions = data.champions || [];
      document.getElementById('resultWinners').textContent =
        champions.length ? `🏆 ${champions.join(', ')}` : '';

      const ranked = data.ranked || [];
      document.getElementById('resultLeaderboard').innerHTML = ranked.map((p, i) => {
        const isMe = p.id === playerId;
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
        return `<div style="display:flex;align-items:center;justify-content:space-between;
          padding:8px 0;border-bottom:1px solid #2a2a5a;
          ${isMe ? 'color:#ffffaa;font-weight:700;' : 'color:#ccccee;'}">
          <span>${medal} ${p.name}${isMe ? ' (我)' : ''}</span>
          <span style="color:#ffdd44">${p.score} 分</span>
        </div>`;
      }).join('');
    }

    function hideResultScreen() {
      const rs = document.getElementById('resultScreen');
      rs.classList.add('hidden');
      rs.style.display = 'none';
    }

    function showRevealedCardsOverlay(cards) {
      const moduleArea = document.getElementById('moduleArea');
      if (!moduleArea) return;

      // Build HTML for revealed cards
      let html = '<div style="padding:20px;text-align:center;">';
      html += '<div style="font-size:1.2rem;color:#ffdd44;margin-bottom:20px;">🃏 翻牌結果</div>';

      for (const item of cards) {
        const player = window.players.get(item.playerId);
        const playerName = player ? player.name : item.playerId;
        const card = item.card;

        html += `
          <div style="background:#1a1a3a;border:2px solid #5555ff;border-radius:12px;padding:16px;margin:12px 0;">
            <div style="font-size:0.9rem;color:#8888bb;margin-bottom:4px;">${playerName}</div>
            <div style="font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:4px;">${card.name || '—'}</div>
            ${card.value !== undefined ? `<div style="font-size:1.2rem;color:#ffdd44;">⭐ ${card.value}</div>` : ''}
            ${card.team ? `<div style="font-size:0.8rem;color:#aaaacc;padding:2px 8px;background:#333355;border-radius:8px;display:inline-block;margin-top:4px;">${card.team}</div>` : ''}
          </div>
        `;
      }

      html += '</div>';

      // Clear previous content and show new content
      moduleArea.innerHTML = html;
    }

    function leaveRoom() {
      client.socket.disconnect();
      const qs = new URLSearchParams({ room: roomId, name: playerName }).toString();
      window.location.href = `/mobile?${qs}`;
    }

    function toggleReady() {
      isReady = !isReady;
      client.setReady(isReady);
      const btn = document.getElementById('readyBtn');
      btn.textContent = isReady ? '✓ 已準備' : '我準備好了';
      btn.classList.toggle('is-ready', isReady);
    }
  </script>
</body>
</html>
