<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>遊戲中</title>
  <style>
    /* ═══════════════════════════════════════════════
       LAYOUT: 5 fixed zones — never reflow
         ┌─────────────────────┐
         │ TOPBAR (54px fixed) │  identity • room/name/score • layout toggle
         ├─────────────────────┤
         │ STATUSBAR (32px)    │  shared message + countdown
         ├─────────────────────┤
         │                     │
         │ CARD ZONE (flex:1)  │  the only area that changes layout
         │                     │
         ├─────────────────────┤
         │ ACTION (60px fixed) │  play button (always visible, even when disabled)
         └─────────────────────┘
       ═══════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0a0a1a;
      --surface:   #14142a;
      --surface-2: #1a1a3a;
      --border:    #2a2a5a;
      --text:      #e0e0ff;
      --text-dim:  #8888bb;
      --text-faint:#6666aa;
      --accent:    #6688ff;
      --accent-2:  #5555ff;
      --gold:      #ffdd44;
      --green:     #44cc88;
      --red:       #ff6666;
      --topbar-h:  54px;
      --status-h:  32px;
      --action-h:  64px;
    }
    html, body { height: 100dvh; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
      overscroll-behavior: contain;
    }

    /* ───── TOPBAR ──────────────────────────────────────── */
    #topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
    }
    /* Left section: player number + identity slot */
    #topbarLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    /* Player number badge (rounded square) */
    #playerNumber {
      display: none; /* Hidden until player number is assigned */
      justify-content: center; align-items: center;
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #e67e22;
      color: white;
      font-size: .75rem;
      font-weight: bold;
      flex-shrink: 0;
      line-height: 1;
    }
    #playerNumber:not(:empty) {
      display: flex;
    }
    /* Identity slot — fixed top-left, small */
    #idSlot {
      display: flex; justify-content: center; align-items: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #0a0a18; border: 2px solid var(--border);
      cursor: pointer; user-select: none;
      transition: border-color .15s, transform .1s;
      flex-shrink: 0;
    }
    #idSlot:active { transform: scale(.94); }
    #idSlot.empty   { color: var(--text-faint); font-size: 1.1rem; }
    #idSlot.has-id  { font-size: .82rem; font-weight: 700; line-height: 1; padding: 4px; text-align: center; }
    #idSlot .id-label {
      position: absolute; transform: translateY(36px);
      font-size: .58rem; color: var(--text-faint); letter-spacing: .05em;
      pointer-events: none; white-space: nowrap;
    }
    /* Center: room + name + score (compact) */
    #topbarCenter {
      flex: 1;
      display: flex; flex-direction: column; min-width: 0; padding: 0 10px;
    }
    #topbarCenter .name { font-size: .92rem; font-weight: 700; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #topbarCenter .meta { font-size: .65rem; color: var(--text-dim); display: flex; gap: 8px; margin-top: 1px; }
    #topbarCenter .meta .score { color: var(--gold); font-weight: 700; }
    /* Layout toggle */
    #layoutToggle {
      display: flex; gap: 0; background: #0a0a18; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .lt-btn {
      width: 32px; height: 32px;
      background: transparent; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); transition: background .15s, color .15s;
    }
    .lt-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .lt-btn:active { background: rgba(85, 85, 255, .15); }
    .lt-btn.active { color: var(--accent); background: rgba(85, 85, 255, .2); }
    .lt-btn svg { width: 18px; height: 18px; display: block; }

    /* ───── STATUSBAR ───────────────────────────────────── */
    #statusbar {
      height: var(--status-h);
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 0 14px;
      font-size: .76rem; color: var(--text-dim);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      transition: background .25s, color .25s;
    }
    #statusbar.has-countdown {
      background: linear-gradient(90deg, rgba(255,221,68,.08), rgba(255,221,68,.18), rgba(255,221,68,.08));
      border-bottom-color: rgba(255,221,68,.4);
    }
    #statusbar .status-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #statusbar .countdown {
      color: var(--gold); font-family: monospace; flex-shrink: 0;
      font-size: .98rem; font-weight: 700; letter-spacing: .04em;
    }

    /* ───── CARD ZONE (the changeable region) ──────────── */
    #cardZone {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0a0a1a 0%, #050511 100%);
    }
    #cardZone .empty-msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: .85rem;
    }

    /* The card containers — exactly one is .active per layout mode */
    .card-area { position: absolute; inset: 0; padding: 12px; }
    .card-area.layout-strip {
      display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
      padding: 16px 12px;
      align-items: center;
    }
    .card-area.layout-fan {
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
      padding-top: 28px;          /* room for selected card to lift */
    }
    .card-area.layout-fan .fan-track {
      position: relative;
      height: 100%;
      display: flex; align-items: center;
    }
    .card-area.layout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      overflow-y: auto;
      padding: 12px;
      align-content: start;
    }

    /* ───── CARD STYLES ─────────────────────────────────── */
    .card {
      position: relative;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer; user-select: none;
      overflow: hidden;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .card:active { transform: scale(.96); }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(102, 136, 255, .35), 0 6px 20px rgba(85, 85, 255, .4);
    }
    .card.eliminated {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(100%);
    }
    .card .card-img {
      width: 100%; height: 70%;
      object-fit: cover;
      display: block;
      background: #0a0a18;
    }
    .card.no-img .card-img-fallback {
      width: 100%; height: 70%;
      background: linear-gradient(135deg, #1a1a3a 0%, #2a2a5a 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 1.5rem; font-weight: 700;
      letter-spacing: .05em;
    }
    .card .card-body {
      padding: 6px 8px;
      height: 30%;
      display: flex; flex-direction: column; justify-content: center;
      background: var(--surface);
    }
    .card .card-name { font-size: .78rem; font-weight: 700; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .card-sub  { font-size: .62rem; color: var(--text-dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .card-value-pill {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,.6); color: var(--gold);
      font-size: .68rem; font-weight: 700;
      border-radius: 10px; padding: 2px 7px;
      backdrop-filter: blur(4px);
    }

    /* Strip-specific sizing */
    .layout-strip .card { width: 110px; height: 158px; }
    /* Fan-specific positioning is set inline (transform) */
    .layout-fan .card { width: 110px; height: 158px; transition: transform .25s, border-color .15s, box-shadow .15s; }
    .layout-fan .card.selected { z-index: 100; }
    /* Grid */
    .layout-grid .card { aspect-ratio: 5 / 7; height: auto; width: 100%; }

    /* ───── ACTION BAR ──────────────────────────────────── */
    #actionbar {
      height: var(--action-h);
      flex-shrink: 0;
      padding: 10px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
    }
    #playBtn {
      flex: 1; height: 44px;
      background: var(--accent-2); color: #fff;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    #playBtn:active:not(:disabled) { background: #3333cc; }
    #playBtn:disabled { background: #2a2a4a; color: var(--text-faint); cursor: not-allowed; }

    /* ───── OVERLAY: identity full view ─────────────────── */
    #identityOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10, 10, 26, .92);
      display: none; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(6px);
    }
    #identityOverlay.show { display: flex; }
    .id-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 28px 30px;
      width: 100%; max-width: 320px;
      text-align: center;
    }
    .id-card .id-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .id-card .id-label { font-size: .72rem; color: var(--text-faint); letter-spacing: .12em; margin-bottom: 14px; }
    .id-card .id-name { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }
    .id-card .id-team { font-size: .8rem; padding: 3px 12px; border-radius: 12px; display: inline-block; margin-bottom: 14px; }
    .id-card .id-desc { font-size: .9rem; color: var(--text-dim); line-height: 1.5; }
    .id-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
    .id-actions button {
      padding: 11px 24px; border: none; border-radius: 10px;
      font-size: .92rem; font-weight: 700; cursor: pointer;
    }
    .id-actions .id-confirm { background: var(--accent-2); color: #fff; }
    .id-actions .id-close   { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .id-confirmed-msg { margin-top: 12px; font-size: .82rem; color: var(--green); }

    /* ───── VOTE OVERLAY ───────────────────────────────────────── */
    #voteOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #voteOverlay.hidden { display: none; }

    /* ───── ELIMINATED SCREEN ─────────────────────────────────── */
    #eliminatedScreen {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0005;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    #eliminatedScreen .elim-icon { font-size: 4rem; margin-bottom: 16px; }
    #eliminatedScreen .elim-title {
      font-size: 1.6rem; font-weight: 800; color: #ff4444;
      margin-bottom: 8px; letter-spacing: .04em;
    }
    #eliminatedScreen .elim-sub {
      font-size: .95rem; color: #888899; margin-bottom: 32px; line-height: 1.5;
    }
    #eliminatedScreen .elim-watch-label {
      font-size: .72rem; color: #555566; letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 24px;
    }
    #eliminatedScreen .vote-results {
      background: #12121f;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px;
      max-width: 320px;
      width: 100%;
    }
    #eliminatedScreen .vote-results-title {
      font-size: .85rem;
      color: #8888bb;
      margin-bottom: 12px;
      text-align: left;
    }
    #eliminatedScreen .vote-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4a;
    }
    #eliminatedScreen .vote-result-item:last-child {
      border-bottom: none;
    }
    #eliminatedScreen .vote-result-target {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #eliminatedScreen .vote-result-number {
      background: #e67e22;
      color: white;
      font-size: .7rem;
      font-weight: bold;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #eliminatedScreen .vote-result-name {
      font-size: .85rem;
      color: #ccccee;
    }
    #eliminatedScreen .vote-result-count {
      font-size: 1rem;
      color: #ffdd44;
      font-weight: bold;
    }
    .vote-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; width: 100%; max-width: 340px;
    }
    .vote-header { margin-bottom: 20px; text-align: center; }
    .vote-title { font-size: 1.3rem; color: #fff; margin-bottom: 6px; }
    .vote-subtitle { font-size: .85rem; color: var(--text-dim); }
    .vote-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 20px;
    }
    .vote-option {
      background: #1a1a2e; border: 2px solid #3a3a5a;
      border-radius: 12px; padding: 16px;
      cursor: pointer; transition: all .2s;
      text-align: center;
    }
    .vote-option:hover:not(.disabled) { border-color: var(--accent); background: #2a2a4a; }
    .vote-option.selected { border-color: var(--accent); background: #1a1a3a; }
    .vote-option.disabled { opacity: .4; cursor: not-allowed; }
    .vote-option-name { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .vote-option-icon { font-size: 2rem; }
    .vote-option-type { font-size: .7rem; color: var(--text-dim); }
    .vote-status { font-size: .9rem; color: var(--green); text-align: center; margin-bottom: 12px; }
    .vote-timer { font-size: .8rem; color: var(--text-dim); text-align: center; margin-bottom: 16px; }
    .vote-submit-btn {
      width: calc(100% - 32px);
      margin: 0 16px 16px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4a9eff 0%, #357abd 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .vote-submit-btn:hover { background: linear-gradient(135deg, #5aadff 0%, #4289d0 100%); }
    .vote-submit-btn:disabled {
      background: #3a3a5a;
      color: #8888aa;
      cursor: not-allowed;
    }
    .vote-submit-btn.submitted {
      background: linear-gradient(135deg, #44cc77 0%, #339955 100%);
      cursor: default;
    }

    /* ───── LOBBY ────────────────────────────────────────── */
    #lobbyScreen {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    #lobbyScreen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lobbyScreen p { color: var(--text-dim); font-size: .9rem; margin-bottom: 24px; }
    #playerList { width: 100%; max-width: 320px; margin-bottom: 16px; }
    .player-entry {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .9rem;
    }
    .player-entry .ready { color: var(--green); font-size: .75rem; }
    .player-entry .waiting { color: var(--text-faint); font-size: .75rem; }
    #readyBtn {
      width: 100%; max-width: 320px;
      background: var(--green); color: #fff; border: none;
      border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer;
    }
    #readyBtn.is-ready { background: #1a6633; }

    /* ───── RESULT SCREEN ─────────────────────────────────── */
    #resultScreen {
      flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px; text-align: center;
    }
    #resultScreen .trophy { font-size: 3rem; margin-bottom: 8px; }
    #resultScreen h2 { font-size: 1.3rem; color: var(--gold); margin-bottom: 6px; }
    #resultWinners { font-size: .85rem; color: var(--text-dim); margin-bottom: 28px; }
    .lb-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 24px; width: 100%; max-width: 320px; margin-bottom: 24px;
    }
    .lb-title { font-size: .72rem; color: var(--text-faint); margin-bottom: 12px; letter-spacing: .08em; }
    #resultLeaderboard .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    #resultLeaderboard .row.me { color: #ffffaa; font-weight: 700; }
    #resultLeaderboard .row .score { color: var(--gold); }
    .leave-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text-faint); font-size: .85rem; padding: 10px 28px; cursor: pointer;
    }

    .hidden { display: none !important; }

    /* ───── CONTROLLER ZONE ───────────────────────────────── */
    #controllerZone {
      flex: 1; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px; overflow: hidden;
      background: var(--bg); touch-action: none;
    }
    #controllerZone.active { display: flex; }
    .ctrl-layout {
      display: flex; justify-content: center; align-items: center;
      width: 100%; max-width: 420px; gap: 20px;
    }
    .pad-grid { display: grid; gap: 10px; width: 100%; }
    .pad-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .pad-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .ctrl-btn {
      aspect-ratio: 1; background: #1a1a40;
      border: 2px solid #3a3a7a; border-radius: 14px;
      color: #aaaaff; font-size: 1.1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      touch-action: none; transition: background .06s, transform .06s;
    }
    .ctrl-btn.pressed {
      background: #3a3a9a; border-color: #8888ff;
      transform: scale(0.91); box-shadow: 0 0 14px rgba(120,120,255,.5);
    }
    .layout-pad-2 .ctrl-btn { aspect-ratio: auto; min-height: 110px; font-size: 2rem; }
    .ctrl-action-col { display: flex; flex-direction: column; gap: 12px; }
    .ctrl-action-col .ctrl-btn { width: 82px; height: 82px; aspect-ratio: auto; }
    .dpad-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
    .dpad-segment {
      position: absolute; background: #1a1a40; border: 2px solid #3a3a7a;
      display: flex; align-items: center; justify-content: center;
      color: #aaaaff; font-size: 1.2rem;
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .dpad-segment.pressed { background: #3a3a9a; border-color: #8888ff; }
    .dpad-up    { top:0;     left:33.3%; width:33.4%; height:33.4%; border-radius:8px 8px 0 0; }
    .dpad-down  { bottom:0;  left:33.3%; width:33.4%; height:33.4%; border-radius:0 0 8px 8px; }
    .dpad-left  { top:33.3%; left:0;     width:33.4%; height:33.4%; border-radius:8px 0 0 8px; }
    .dpad-right { top:33.3%; right:0;    width:33.4%; height:33.4%; border-radius:0 8px 8px 0; }
    .dpad-center { top:33.3%; left:33.3%; width:33.4%; height:33.4%;
      background:#0d0d22; border:2px solid #2a2a50; pointer-events:none; }
  </style>
</head>
<body>

  <!-- ════════ LOBBY ════════ -->
  <div id="lobbyScreen">
    <h2>等待室</h2>
    <p>等待主持人開始遊戲…</p>
    <div id="playerList"></div>
    <button id="readyBtn" onclick="toggleReady()">我準備好了</button>
  </div>

  <!-- ════════ GAME (5 fixed zones) ════════ -->
  <div id="gameScreen" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <!-- Topbar -->
    <div id="topbar">
      <div id="topbarLeft">
        <div id="playerNumber"></div>
        <div id="idSlot" class="empty" onclick="onIdSlotClick()">
          <span id="idSlotIcon">🎭</span>
        </div>
      </div>
      <div id="topbarCenter">
        <div class="name" id="hdrName">玩家</div>
        <div class="meta">
          <span id="hdrRoom">房間 ------</span>
          <span class="score">⭐ <span id="hdrScore">0</span></span>
        </div>
      </div>
      <div id="layoutToggle" role="tablist" aria-label="卡牌排版">
        <button class="lt-btn" data-layout="strip" title="水平捲動">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3"  y="6" width="4.5" height="12" rx="1"/>
            <rect x="9.5" y="6" width="4.5" height="12" rx="1"/>
            <rect x="16" y="6" width="4.5" height="12" rx="1"/>
          </svg>
        </button>
        <button class="lt-btn" data-layout="fan" title="疊牌">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="7" width="6" height="11" rx="1" transform="rotate(-12 5.5 12.5)"/>
            <rect x="9"   y="6" width="6" height="12" rx="1"/>
            <rect x="15.5" y="7" width="6" height="11" rx="1" transform="rotate(12 18.5 12.5)"/>
          </svg>
        </button>
        <button class="lt-btn" data-layout="grid" title="格狀">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3"  y="3"  width="8" height="8" rx="1"/>
            <rect x="13" y="3"  width="8" height="8" rx="1"/>
            <rect x="3"  y="13" width="8" height="8" rx="1"/>
            <rect x="13" y="13" width="8" height="8" rx="1"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Statusbar -->
    <div id="statusbar">
      <span class="status-text" id="statusText">等待遊戲…</span>
      <span class="countdown" id="countdownText"></span>
    </div>

    <!-- Controller zone (input stages) -->
    <div id="controllerZone">
      <div id="controllerLayout" class="ctrl-layout"></div>
    </div>

    <!-- Card zone -->
    <div id="cardZone">
      <div id="cardArea" class="card-area layout-strip"></div>
      <div id="emptyMsg" class="empty-msg">尚未拿到牌</div>
    </div>

    <!-- Action bar -->
    <div id="actionbar">
      <button id="playBtn" onclick="playSelected()" disabled>請選擇一張牌</button>
    </div>
  </div>

  <!-- ════════ IDENTITY OVERLAY ════════ -->
  <div id="identityOverlay" onclick="onOverlayBgClick(event)">
    <div class="id-card" id="idCardBox">
      <div class="id-icon">🎭</div>
      <div class="id-label">你的身份</div>
      <div class="id-name" id="idOName">—</div>
      <div class="id-team" id="idOTeam"></div>
      <div class="id-desc" id="idODesc"></div>
      <div class="id-actions" id="idOActions">
        <button class="id-confirm" id="idOConfirmBtn" onclick="confirmIdentity()">確認身份</button>
        <button class="id-close"   id="idOCloseBtn"   onclick="closeIdentityOverlay()" style="display:none">關閉</button>
      </div>
      <div class="id-confirmed-msg hidden" id="idOConfirmedMsg">✓ 已確認，等待主持人推進</div>
    </div>
  </div>

  <!-- ════════ ELIMINATED SCREEN ════════ -->
  <div id="eliminatedScreen">
    <div class="elim-icon">💀</div>
    <div class="elim-title">你已被淘汰</div>
    <div class="elim-sub" id="elimSubText">遊戲繼續進行中，你可以繼續觀看。</div>
    <div class="elim-watch-label">觀戰模式</div>
    <div class="vote-results" id="elimVoteResults"></div>
  </div>

  <!-- ════════ VOTE OVERLAY ════════ -->
  <div id="voteOverlay" class="overlay hidden">
    <div class="vote-box">
      <div class="vote-header">
        <div class="vote-title">🗳️ 投票階段</div>
        <div class="vote-subtitle" id="voteSubtitle">請選擇要投票的玩家</div>
      </div>

      <div class="vote-options" id="voteOptions">
        <!-- 動態生成投票選項 -->
      </div>

      <div class="vote-status" id="voteStatus">等待投票…</div>
      <div class="vote-timer" id="voteTimer"></div>
      <button id="voteSubmitBtn" class="vote-submit-btn" disabled>送出投票</button>
    </div>
  </div>

  <!-- ════════ RESULT SCREEN ════════ -->
  <div id="resultScreen">
    <div class="trophy">🏆</div>
    <h2>遊戲結束</h2>
    <div id="resultWinners"></div>
    <div class="lb-card">
      <div class="lb-title">最終排名</div>
      <div id="resultLeaderboard"></div>
    </div>
    <div style="font-size:.82rem;color:#6666aa;margin-bottom:20px;">等待主持人開始下一局…</div>
    <button class="leave-btn" onclick="leaveRoom()">離開房間</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/socket.js"></script>
  <script>
    // ════════════════════════════════════════════════════════════════
    //   STATE
    // ════════════════════════════════════════════════════════════════
    const params     = new URLSearchParams(window.location.search);
    const roomId     = params.get('room') || '';
    const playerName = params.get('name') || '玩家';
    const playerId   = getOrCreatePlayerId();

    let myHand        = [];
    let myIdentity    = null;
    let selectedCard  = null;       // _instanceId of selected card
    let isReady       = false;
    let phase         = 'lobby';
    let isPlayingCard = false;
    let isRevealed    = false;
    let hasPlayedThisRound = false;
    let identityConfirmed  = false;
    let myIsAlive     = true;
    let lastVoteResults = null; // Store most recent vote results
    let currentPlayers = []; // Store current players list
    const playersById = new Map();

    function showEliminatedScreen(subText) {
      console.log('[Mobile] showEliminatedScreen called with:', subText);
      const screen = document.getElementById('eliminatedScreen');
      console.log('[Mobile] eliminatedScreen element:', screen);
      if (subText) document.getElementById('elimSubText').textContent = subText;
      screen.style.display = 'flex';
      console.log('[Mobile] eliminatedScreen display set to flex. Current display:', screen.style.display);
    }

    function showEliminatedWithVoteResults(eliminationType = 'exile') {
      console.log('[Mobile] showEliminatedWithVoteResults called with type:', eliminationType);
      const screen = document.getElementById('eliminatedScreen');
      console.log('[Mobile] eliminatedScreen element:', screen);

      // Set elimination-specific content
      const eliminationMessages = {
        exile: { icon: '🏳️', title: '你被放逐了', subtext: '村民投票決定將你放逐。遊戲繼續進行中，你可以繼續觀看。' },
        wolf_kill: { icon: '🐺', title: '你被狼人殺害了', subtext: '月黑風高的夜晚，狼人選擇了你作為獵物。遊戲繼續進行中，你可以繼續觀看。' },
        poison: { icon: '☠️', title: '你被毒殺了', subtext: '不知名的毒藥結束了你的生命。遊戲繼續進行中，你可以繼續觀看。' },
        shoot: { icon: '🔫', title: '你被槍殺了', subtext: '槍聲響起，你應聲倒地。遊戲繼續進行中，你可以繼續觀看。' }
      };

      const message = eliminationMessages[eliminationType] || eliminationMessages.exile;

      // Update the eliminated screen content
      const iconEl = screen.querySelector('.elim-icon');
      const titleEl = screen.querySelector('.elim-title');
      const subEl = document.getElementById('elimSubText');

      if (iconEl) iconEl.textContent = message.icon;
      if (titleEl) titleEl.textContent = message.title;
      if (subEl) subEl.textContent = message.subtext;

      screen.style.display = 'flex';
      // Hide vote overlay if it's showing
      const voteOverlay = document.getElementById('voteOverlay');
      if (voteOverlay) {
        voteOverlay.classList.add('hidden');
        console.log('[Mobile] Hidden vote overlay');
      }
      console.log('[Mobile] eliminatedScreen display set to flex with type:', eliminationType);

      // Display vote results if available
      const resultsContainer = document.getElementById('elimVoteResults');
      if (lastVoteResults && lastVoteResults.length > 0) {
        let resultsHtml = '<div class="vote-results-title">📊 投票結果</div>';

        lastVoteResults.forEach(result => {
          const number = result.targetNumber || '?';
          const name = result.targetName || result.targetId;
          resultsHtml += `
            <div class="vote-result-item">
              <div class="vote-result-target">
                <span class="vote-result-number">${number}</span>
                <span class="vote-result-name">${name}</span>
              </div>
              <span class="vote-result-count">${result.count} 票</span>
            </div>
          `;
        });

        resultsContainer.innerHTML = resultsHtml;
        resultsContainer.style.display = 'block';
      } else {
        resultsContainer.style.display = 'none';
      }
    }

    function hideEliminatedScreen() {
      document.getElementById('eliminatedScreen').style.display = 'none';
    }

    // Layout: 'strip' | 'fan' | 'grid' — persisted per-device
    let cardLayout = localStorage.getItem('mobile.cardLayout') || 'strip';

    const TEAM_COLORS = {
      red: '#ff6666', blue: '#6688ff', green: '#44cc88',
      gold:'#ffdd44', purple: '#bb66ff', default: '#aaaaff'
    };

    // ════════════════════════════════════════════════════════════════
    //   CONNECT
    // ════════════════════════════════════════════════════════════════
    const client = new GameClient();
    client.connect();
    client.on('connect', () => client.joinRoom(roomId, playerId, playerName));

    client.on('room_joined', (data) => {
      phase = data.phase;
      document.getElementById('hdrRoom').textContent = `房間 ${data.roomId}`;
      document.getElementById('hdrName').textContent = playerName;
      renderPlayers(data.players);
      if (data.playerState) updateMyState(data.playerState);
      if (data.sharedState) updateStatus(data.sharedState);
      if (data.phase === 'playing') enterGameScreen();
    });

    client.on('player_joined', d => renderPlayers(d.players || []));
    client.on('player_left', d => {
      if (d.playerId === playerId) {
        alert('你已被移出房間');
        window.location.href = '/mobile';
      } else {
        renderPlayers((d.players || []).filter(p => p.id !== d.playerId));
      }
    });
    client.on('player_ready', d => renderPlayers(d.players || []));

    client.on('game_started', (data) => {
      console.log('[Mobile] ========== GAME STARTED ==========');
      console.log('[Mobile] Full data:', JSON.stringify(data, null, 2));
      console.log('[Mobile] playerId:', playerId);
      phase = 'playing';
      myIsAlive = true; // Reset alive status when game restarts
      lastVoteResults = null; // Clear previous vote results
      hideEliminatedScreen();
      updateStatus(data.sharedState || {});

      // Set player number if provided
      if (data.players) {
        console.log('[Mobile] Players array:', JSON.stringify(data.players, null, 2));
        const myPlayerData = data.players.find(p => p.id === playerId);
        console.log('[Mobile] My player data:', myPlayerData);
        if (myPlayerData) {
          const numberEl = document.getElementById('playerNumber');
          console.log('[Mobile] numberEl element:', numberEl);
          console.log('[Mobile] numberEl before textContent:', numberEl.textContent);
          console.log('[Mobile] playerNumber value:', myPlayerData.playerNumber);
          console.log('[Mobile] playerNumber type:', typeof myPlayerData.playerNumber);

          // IMPORTANT: Don't use || '' because it will make number 0 become empty string
          if (myPlayerData.playerNumber !== undefined && myPlayerData.playerNumber !== null) {
            numberEl.textContent = String(myPlayerData.playerNumber);
            console.log('[Mobile] ✅ Set playerNumber to:', numberEl.textContent);
          } else {
            console.warn('[Mobile] ⚠️ playerNumber is', myPlayerData.playerNumber);
            numberEl.textContent = '';
          }

          console.log('[Mobile] numberEl after textContent:', numberEl.textContent);
          console.log('[Mobile] numberEl innerHTML:', numberEl.innerHTML);
          console.log('[Mobile] numberEl classes:', numberEl.className);
          console.log('[Mobile] numberEl computed display:', window.getComputedStyle(numberEl).display);
        } else {
          console.error('[Mobile] ERROR: Could not find my player data in players array!');
          console.error('[Mobile] Available player IDs:', data.players.map(p => p.id));
          console.error('[Mobile] My player ID:', playerId);
        }
      } else {
        console.error('[Mobile] ERROR: No players array in game_started data!');
      }

      document.getElementById('hdrScore').textContent = '0';
      selectedCard = null;
      myIdentity   = null;
      identityConfirmed = false;
      isPlayingCard = false;
      hasPlayedThisRound = false;
      isRevealed = false;
      renderIdentityBadge();
      hideIdentityOverlay();
      hideResultScreen();
      enterGameScreen();
      clearCountdown();
    });

    // Handle player status updates (e.g., elimination, revival)
    client.on('player_status_updated', (data) => {
      if (data.playerId === playerId) {
        const wasAlive = myIsAlive;
        myIsAlive = data.isAlive !== false; // Default to true if not specified

        if (myIsAlive && !wasAlive) {
          // Player was revived
          hideEliminatedScreen();
        } else if (!myIsAlive && wasAlive) {
          // Player was eliminated
          showEliminatedScreen();
        }
      }
    });

    client.on('room_closed', () => {
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                    height:100vh;background:#0a0005;color:#cc8888;font-family:sans-serif;gap:16px;">
          <div style="font-size:2rem;">🚪</div>
          <div style="font-size:1.1rem;font-weight:700;">房間已關閉</div>
          <div style="font-size:.85rem;color:#886688;">Host 已結束這個遊戲房間</div>
        </div>`;
    });

    client.on('game_ended',    (data) => { phase = 'result'; showResultScreen(data); });
    client.on('back_to_lobby', () => {
      phase = 'lobby';
      myIsAlive = true;
      hideEliminatedScreen();
      hideResultScreen();
      hideIdentityOverlay();
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').style.display = 'flex';
      isReady = false;
      const btn = document.getElementById('readyBtn');
      btn.textContent = '我準備好了';
      btn.classList.remove('is-ready');
    });

    client.on('identity_assigned', (data) => {
      myIdentity = data.card;
      renderIdentityBadge();
      enterGameScreen();
      if (data.isReconnect && data.alreadyConfirmed) {
        // Player had already confirmed before disconnecting — restore state silently
        identityConfirmed = true;
      } else {
        identityConfirmed = false;
        openIdentityOverlay({ confirmMode: true });
      }
    });

    client.on('phase_changed', (data) => {
      if (data.message) setStatus(data.message);
    });
    client.on('state_update', (data) => {
      if (data.sharedState) updateStatus(data.sharedState);
    });

    client.on('card_accepted', (data) => {
      isPlayingCard = false;
      hasPlayedThisRound = true;
      if (data.hand) myHand = data.hand;
      else myHand = myHand.filter(c => c._instanceId !== data.instanceId);
      selectedCard = null;
      renderCards();
    });

    client.on('card_rejected', (data) => {
      isPlayingCard = false;
      if (data.reason === 'already_played') {
        hasPlayedThisRound = true;
        renderCards();
      }
      if (data.message) {
        flashStatus(data.message, '#ff5555');
      }
    });

    client.on('cards_drawn', (data) => {
      selectedCard = null;
      isRevealed = false;
      hasPlayedThisRound = false;
      myHand = data.hand || [];
      renderCards();
    });
    client.on('hand_refilled', (data) => {
      selectedCard = null;
      isRevealed = false;
      hasPlayedThisRound = false;
      isPlayingCard = false;
      myHand = data.hand || [];
      renderCards();
    });

    // ════════════════════════════════════════════════════════════════
    //   VOTE SYSTEM
    // ════════════════════════════════════════════════════════════════
    let voteHideTimer = null;

    client.on('vote_started', (data) => {
      console.log('[Mobile] ========== VOTE STARTED ==========');
      console.log('[Mobile] myIsAlive:', myIsAlive);
      console.log('[Mobile] Vote started:', data);
      // Cancel any stale hide-timer from a previous round's result display
      if (voteHideTimer) { clearTimeout(voteHideTimer); voteHideTimer = null; }
      setStatus('投票階段');
      showVoteScreen(data);
    });

    client.on('vote_cast', (data) => {
      if (data.playerId === playerId) {
        console.log('[Mobile] My vote cast', data.isReconnect ? '(reconnect restore)' : '');
        voteSubmitted = true;
        document.getElementById('voteStatus').textContent = '✓ 已投票';
        const submitBtn = document.getElementById('voteSubmitBtn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.classList.add('submitted');
          submitBtn.textContent = '已送出';
        }
      }
    });

    client.on('vote_rejected', () => {
      voteSubmitted = false;
      const submitBtn = document.getElementById('voteSubmitBtn');
      submitBtn.textContent = '送出投票';
      submitBtn.disabled = !selectedVoteOption;
      submitBtn.classList.remove('submitted');
      document.getElementById('voteStatus').textContent = '⚠ 投票未能送出，請重試';
      document.querySelectorAll('.vote-option').forEach(el => {
        el.classList.remove('disabled');
        el.onclick = () => selectVoteOption(el.dataset.optionId, el);
      });
    });

    client.on('vote_countdown', (d) => {
      const el = document.getElementById('countdownText');
      if (d.remaining > 0) {
        el.textContent = `⏱ 剩餘 ${d.remaining} 秒`;
      } else {
        el.textContent = '';
      }
    });

    client.on('vote_ended', (data) => {
      console.log('[Mobile] Vote ended:', data);

      // Store vote results for later display in eliminated screen
      lastVoteResults = data.results || null;

      // Show vote results before hiding screen
      if (data.results && data.results.length > 0) {
        const maxVotes = Math.max(...data.results.map(r => r.count));
        const isTie = data.results.filter(r => r.count === maxVotes).length > 1;

        let resultHtml = '<div style="padding:20px;text-align:center;"><h3 style="color:#fff;margin-bottom:16px;">📊 投票結果</h3>';

        if (isTie) {
          resultHtml += '<div style="color:#ffdd44;margin-bottom:12px;">平票！</div>';
        }

        resultHtml += data.results.map((result, index) => {
          const name = result.targetName || result.targetId;
          const isLeading = result.count === maxVotes && result.count > 0;

          let votersHtml = '';
          if (result.voters && result.voters.length > 0) {
            votersHtml = `<div style="font-size:.75rem;color:#8888aa;margin-top:4px;">🗳️ ${result.voters.join('、')}</div>`;
          }

          return `
            <div style="background:${isLeading ? '#1a1a3a' : '#14143a'};border:2px solid ${isLeading ? '#ffdd44' : '#3a3a7a'};border-radius:12px;padding:12px;margin-bottom:8px;text-align:center;">
              <div style="font-size:1.5rem;color:#ffdd44;font-weight:700;">${result.count} 票</div>
              <div style="font-size:1rem;color:#aaaaff;">${name}</div>
              ${votersHtml}
            </div>
          `;
        }).join('');

        resultHtml += '</div>';

        // Replace vote options with results
        const optionsContainer = document.getElementById('voteOptions');
        if (optionsContainer) {
          optionsContainer.innerHTML = resultHtml;
        }

        // Update status
        document.getElementById('voteStatus').textContent = '投票結束';

        // Hide screen after delay (store ref so next round can cancel it)
        voteHideTimer = setTimeout(() => {
          voteHideTimer = null;
          hideVoteScreen();
          setStatus('投票結束');
        }, 5000);
      } else {
        hideVoteScreen();
        setStatus('投票結束');
      }
    });

    client.on('players_eliminated', (data) => {
      console.log('[Mobile] ========== PLAYERS ELIMINATED ==========');
      console.log('[Mobile] Eliminated data:', data);
      console.log('[Mobile] Elimination type:', data.eliminationType);
      console.log('[Mobile] My playerId:', playerId);
      console.log('[Mobile] data.players:', data.players);
      console.log('[Mobile] data.players type:', typeof data.players);
      console.log('[Mobile] data.players length:', data.players ? data.players.length : 'N/A');
      if (!data.players || !Array.isArray(data.players)) {
        console.error('[Mobile] ❌ data.players is not an array!');
        return;
      }
      data.players.forEach((p, index) => {
        console.log(`[Mobile] [${index}] Player:`, p);
        console.log(`[Mobile] [${index}] Player ID:`, p.id, 'vs my playerId:', playerId);
        if (p.id && p.id === playerId) {
          console.log('[Mobile] ❌ I AM ELIMINATED!');
          myIsAlive = false;
          showEliminatedWithVoteResults(data.eliminationType);
        }
      });
    });

    client.on('player_alive_changed', (data) => {
      if (data.playerId !== playerId) return;
      myIsAlive = data.isAlive;
      if (data.isAlive) {
        hideEliminatedScreen();
      } else {
        showEliminatedScreen('主持人手動設定你為淘汰狀態。');
      }
    });

    client.on('player_renamed', (data) => {
      if (data.playerId !== playerId) return;
      playerName = data.newName;
      renderPlayers(currentPlayers.map(p =>
        p.id === data.playerId ? { ...p, name: data.newName } : p
      ));
      showToast(`✏️ 你的名稱已改為 ${data.newName}`);
    });

    client.on('player_numbers_updated', (data) => {
      console.log('[Mobile] Player numbers updated:', data);
      // Check if currentPlayers exists
      if (!currentPlayers || !Array.isArray(currentPlayers)) {
        console.warn('[Mobile] currentPlayers not initialized yet, skipping number update');
        return;
      }
      // Update player numbers for all players
      currentPlayers = currentPlayers.map(p => ({
        ...p,
        playerNumber: data.players[p.id] !== undefined ? data.players[p.id] : p.playerNumber
      }));
      // Re-render players to show updated numbers
      renderPlayers(currentPlayers);
      // Update my own number badge if I'm in the list
      const myPlayerData = currentPlayers.find(p => p.id === playerId);
      if (myPlayerData && myPlayerData.playerNumber !== undefined && myPlayerData.playerNumber !== null) {
        const numberEl = document.getElementById('playerNumber');
        if (numberEl) {
          numberEl.textContent = String(myPlayerData.playerNumber);
          console.log('[Mobile] Updated my player number to:', myPlayerData.playerNumber);
        }
      }
    });

    // ════════════════════════════════════════════════════════════════
    //   STAGE EVENTS
    // ════════════════════════════════════════════════════════════════
    client.on('stage_started', (data) => {
      console.log('[Mobile] Stage started:', data.stageName, 'type:', data.stageType);

      // Handle different stage types
      if (data.stageType === 'intermission') {
        const statusText = data.stageDescription
          ? `⏸️ ${data.stageName}：${data.stageDescription}`
          : `⏸️ ${data.stageName}`;
        setStatus(statusText);
        hideIdentityOverlay();
        hideControllerZone();
      } else if (data.stageType === 'identity_draw') {
        console.log('[Mobile] Entering identity_draw stage');
        setStatus(`階段：${data.stageName}`);
        hideControllerZone();
        if (!myIdentity) {
          setStatus('等待身份分配...');
        } else if (!identityConfirmed) {
          openIdentityOverlay({ confirmMode: true });
        }
      } else if (data.stageType === 'vote') {
        console.log('[Mobile] Entering vote stage');
        setStatus(`階段：${data.stageName}`);
        hideIdentityOverlay();
        hideControllerZone();
      } else if (data.stageType === 'input') {
        console.log('[Mobile] Entering input/controller stage');
        setStatus(`🎮 ${data.stageName}`);
        hideIdentityOverlay();
        showControllerZone(data.inputConfig || {});
      } else {
        setStatus(`階段：${data.stageName}`);
        hideIdentityOverlay();
        hideControllerZone();
      }
      clearCountdown();
    });
    client.on('round_started', (data) => {
      setStatus(`第 ${data.roundNumber} 回合 (共 ${data.totalRounds} 回合)`);
      selectedCard = null;
      isPlayingCard = false;
      isRevealed = false;
      hasPlayedThisRound = false;
      clearCountdown();
      renderCards();
    });
    client.on('cards_revealed', () => {
      setStatus('翻牌！');
      clearCountdown();
      isRevealed = true;
      renderCards();
    });

    client.on('countdown', (d) => {
      const el = document.getElementById('countdownText');
      const bar = document.getElementById('statusbar');
      if (d.remaining > 0) {
        el.textContent = `⏱ ${d.remaining}s / ${d.total}s`;
        bar.classList.add('has-countdown');
        if (!isRevealed) { isRevealed = true; renderCards(); }
      } else {
        el.textContent = '';
        bar.classList.remove('has-countdown');
      }
    });

    client.on('reconnected', (data) => {
      phase = data.phase;
      if (data.playerState) updateMyState(data.playerState);
      if (data.sharedState) updateStatus(data.sharedState);
      if (phase === 'playing') enterGameScreen();
    });
    client.on('score_update', (data) => {
      if (data.playerId === playerId) {
        document.getElementById('hdrScore').textContent = data.score;
      }
    });

    // Listen for bulk score updates
    client.on('scores_updated', (data) => {
      if (data.players) {
        const myScore = data.players.find(p => p.id === playerId);
        if (myScore) {
          document.getElementById('hdrScore').textContent = myScore.score;
        }
      }
    });

    // ════════════════════════════════════════════════════════════════
    //   IDENTITY (top-left badge + overlay)
    // ════════════════════════════════════════════════════════════════
    function renderIdentityBadge() {
      const slot = document.getElementById('idSlot');
      const icon = document.getElementById('idSlotIcon');
      if (!myIdentity) {
        slot.className = 'empty';
        icon.textContent = '🎭';
        slot.style.borderColor = '';
        slot.style.color = '';
        return;
      }
      const color = TEAM_COLORS[myIdentity.team] || TEAM_COLORS.default;
      slot.className = 'has-id';
      slot.style.borderColor = color;
      slot.style.color = color;
      // First two chars of identity name (e.g. 戰士 → 戰士)
      const short = (myIdentity.name || '?').slice(0, 2);
      icon.textContent = short;
    }

    function onIdSlotClick() {
      if (myIdentity) openIdentityOverlay({ confirmMode: !identityConfirmed });
    }

    function openIdentityOverlay({ confirmMode }) {
      if (!myIdentity) return;
      const ov = document.getElementById('identityOverlay');
      const color = TEAM_COLORS[myIdentity.team] || TEAM_COLORS.default;
      document.getElementById('idCardBox').style.borderColor = color;
      document.getElementById('idOName').textContent = myIdentity.name || '—';
      document.getElementById('idODesc').textContent = myIdentity.description || '';
      const teamEl = document.getElementById('idOTeam');
      if (myIdentity.team) {
        teamEl.style.background = color + '22';
        teamEl.style.color = color;
        teamEl.style.display = 'inline-block';
        teamEl.textContent = myIdentity.team;
      } else { teamEl.style.display = 'none'; }

      const confirmBtn = document.getElementById('idOConfirmBtn');
      const closeBtn   = document.getElementById('idOCloseBtn');
      const msg        = document.getElementById('idOConfirmedMsg');
      if (confirmMode && !identityConfirmed) {
        confirmBtn.style.display = 'inline-block';
        closeBtn.style.display = 'none';
        msg.classList.add('hidden');
      } else {
        confirmBtn.style.display = 'none';
        closeBtn.style.display = 'inline-block';
        if (identityConfirmed) msg.classList.remove('hidden');
      }
      ov.classList.add('show');
    }

    function hideIdentityOverlay() { document.getElementById('identityOverlay').classList.remove('show'); }
    function closeIdentityOverlay() { hideIdentityOverlay(); }
    function onOverlayBgClick(e) {
      if (e.target.id === 'identityOverlay' && identityConfirmed) hideIdentityOverlay();
    }
    function confirmIdentity() {
      client.playerAction('confirm_identity', {});
      identityConfirmed = true;
      document.getElementById('idOConfirmBtn').style.display = 'none';
      document.getElementById('idOCloseBtn').style.display = 'inline-block';
      document.getElementById('idOConfirmedMsg').classList.remove('hidden');
    }

    // ════════════════════════════════════════════════════════════════
    //   STATUS / COUNTDOWN
    // ════════════════════════════════════════════════════════════════
    function setStatus(text) {
      const el = document.getElementById('statusText');
      el.style.color = '';
      el.textContent = text || '';
    }
    function flashStatus(text, color) {
      const el = document.getElementById('statusText');
      el.style.color = color || '';
      el.textContent = text;
      setTimeout(() => { el.style.color = ''; el.textContent = ''; }, 2200);
    }
    function clearCountdown() { document.getElementById('countdownText').textContent = ''; }
    function updateStatus(sharedState) {
      if (typeof sharedState === 'object' && sharedState && sharedState.message) {
        setStatus(sharedState.message);
      }
    }

    // ════════════════════════════════════════════════════════════════
    //   LAYOUT TOGGLE (cards: strip / fan / grid)
    // ════════════════════════════════════════════════════════════════
    function setCardLayout(name) {
      cardLayout = name;
      localStorage.setItem('mobile.cardLayout', name);
      document.querySelectorAll('.lt-btn').forEach(b => b.classList.toggle('active', b.dataset.layout === name));
      const area = document.getElementById('cardArea');
      area.className = 'card-area layout-' + name;
      renderCards();
    }
    document.querySelectorAll('.lt-btn').forEach(b => {
      b.addEventListener('click', () => setCardLayout(b.dataset.layout));
    });

    // ════════════════════════════════════════════════════════════════
    //   CARD RENDERING (image-first; 3 layouts)
    // ════════════════════════════════════════════════════════════════
    function cardImageUrl(card) {
      // Support both `image` (deck JSON shape) and `imagePath` (legacy)
      return card.image || card.imagePath || '';
    }

    function renderCardElement(card, extraStyle = '') {
      const imgUrl  = cardImageUrl(card);
      const isSel   = selectedCard === card._instanceId;
      const eliminated = !myIsAlive; // Add visual state for eliminated players
      const valTag  = (card.value !== undefined && card.value !== null && card.value !== '')
        ? `<div class="card-value-pill">${card.value}</div>` : '';
      const visual  = imgUrl
        ? `<img class="card-img" src="${imgUrl}" alt="${card.name||''}" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex');"><div class="card-img-fallback" style="display:none">${(card.name||'').slice(0,2)}</div>`
        : `<div class="card-img-fallback">${(card.name||'').slice(0,2)}</div>`;
      const noImgCls = imgUrl ? '' : 'no-img';
      return `<div class="card ${noImgCls} ${isSel?'selected':''} ${eliminated?'eliminated':''}"
                   data-instance-id="${card._instanceId}"
                   onclick="selectCard('${card._instanceId}')"
                   style="${extraStyle}">
        ${visual}
        ${valTag}
        <div class="card-body">
          <div class="card-name">${card.name||''}</div>
          <div class="card-sub">${card.description||''}</div>
        </div>
      </div>`;
    }

    function renderCards() {
      const area = document.getElementById('cardArea');
      const empty = document.getElementById('emptyMsg');
      area.className = 'card-area layout-' + cardLayout;
      // Sync active toggle
      document.querySelectorAll('.lt-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.layout === cardLayout));

      if (!myHand.length) {
        area.innerHTML = '';
        empty.style.display = 'flex';
      } else {
        empty.style.display = 'none';
        if (cardLayout === 'fan') area.innerHTML = renderFan();
        else                       area.innerHTML = myHand.map(c => renderCardElement(c)).join('');
      }
      updateActionButton();
    }

    function renderFan() {
      // Cards overlap. Compute per-card transform.
      const n = myHand.length;
      const stepX = Math.max(28, Math.min(60, (window.innerWidth - 140) / Math.max(1, n - 1)));
      const stepDeg = n > 1 ? Math.min(8, 22 / Math.max(1, n - 1)) : 0;
      const startDeg = -((n - 1) * stepDeg) / 2;
      const totalW = (n - 1) * stepX + 110; // card width 110
      const startX = -totalW / 2 + 55;
      let html = '<div class="fan-track" style="width:'+ totalW +'px;height:200px;">';
      for (let i = 0; i < n; i++) {
        const card = myHand[i];
        const x   = startX + i * stepX - 55;          // anchor by card center
        const deg = startDeg + i * stepDeg;
        const isSel = selectedCard === card._instanceId;
        const lift  = isSel ? -36 : 0;
        const style = `position:absolute;left:50%;top:50%;
          transform: translate(${x}px, calc(-50% + ${lift}px)) rotate(${deg}deg);
          z-index:${isSel ? 100 : i + 1};`;
        html += renderCardElement(card, style);
      }
      html += '</div>';
      return html;
    }

    function selectCard(instanceId) {
      if (!myIsAlive) return; // Cannot select cards if eliminated
      selectedCard = (selectedCard === instanceId) ? null : instanceId;
      renderCards();
    }

    function updateActionButton() {
      const btn = document.getElementById('playBtn');
      // Hide button entirely when not in a play context (no hand)
      if (!myIsAlive) {
        btn.disabled = true; btn.textContent = '已淘汰'; return;
      }
      if (!myHand.length) {
        btn.disabled = true; btn.textContent = '尚未拿到牌'; return;
      }
      if (isPlayingCard)        { btn.disabled = true;  btn.textContent = '出牌中…';        return; }
      if (isRevealed)           { btn.disabled = true;  btn.textContent = '等待下一回合';   return; }
      if (hasPlayedThisRound)   { btn.disabled = true;  btn.textContent = '已出牌';         return; }
      if (!selectedCard)        { btn.disabled = true;  btn.textContent = '請選擇一張牌';   return; }
      btn.disabled = false; btn.textContent = '出牌';
    }

    function playSelected() {
      if (!selectedCard || isPlayingCard || !myIsAlive) return;
      isPlayingCard = true;
      client.playCard(selectedCard, null);
      updateActionButton();
      // Safety reset (in case server doesn't reply)
      setTimeout(() => {
        if (isPlayingCard) {
          isPlayingCard = false;
          renderCards();
        }
      }, 4000);
    }

    // ════════════════════════════════════════════════════════════════
    //   LOBBY
    // ════════════════════════════════════════════════════════════════
    function enterGameScreen() {
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('gameScreen').style.display = 'flex';
      // Apply persisted layout selection
      setCardLayout(cardLayout);
    }
    function renderPlayers(plist) {
      currentPlayers = plist || []; // Update currentPlayers
      plist.forEach(p => playersById.set(p.id, p));
      const el = document.getElementById('playerList');
      el.innerHTML = plist.map(p => `
        <div class="player-entry">
          <span>${p.name}</span>
          <span class="${p.isReady ? 'ready' : 'waiting'}">${p.isReady ? '✓ 準備' : '等待中'}</span>
        </div>`).join('');
    }
    function toggleReady() {
      isReady = !isReady;
      client.setReady(isReady);
      const btn = document.getElementById('readyBtn');
      btn.textContent = isReady ? '✓ 已準備' : '我準備好了';
      btn.classList.toggle('is-ready', isReady);
    }
    function updateMyState(state) {
      if (state.hand) { myHand = state.hand; renderCards(); }
      if (state.score !== undefined) document.getElementById('hdrScore').textContent = state.score;
      if (state.moduleData?.identity) {
        myIdentity = state.moduleData.identity;
        renderIdentityBadge();
      }
    }

    // ════════════════════════════════════════════════════════════════
    //   RESULT
    // ════════════════════════════════════════════════════════════════
    function showResultScreen(data) {
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'flex';

      const champions = data.champions || [];
      document.getElementById('resultWinners').textContent =
        champions.length ? `🏆 ${champions.join(', ')}` : '';

      const ranked = data.ranked || [];
      document.getElementById('resultLeaderboard').innerHTML = ranked.map((p, i) => {
        const isMe  = p.id === playerId;
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
        return `<div class="row ${isMe?'me':''}">
          <span>${medal} ${p.name}${isMe ? ' (我)' : ''}</span>
          <span class="score">${p.score} 分</span>
        </div>`;
      }).join('');
    }
    function hideResultScreen() {
      document.getElementById('resultScreen').style.display = 'none';
    }
    function leaveRoom() {
      client.socket.disconnect();
      const qs = new URLSearchParams({ room: roomId, name: playerName }).toString();
      window.location.href = `/mobile?${qs}`;
    }

    // ── VOTE SYSTEM ───────────────────────────────────────────────
    let currentVoteData = null;
    let selectedVoteOption = null;
    let voteSubmitted = false;

    function showVoteScreen(data) {
      console.log('[Mobile] showVoteScreen called, myIsAlive =', myIsAlive);
      // Don't show vote screen if player is eliminated
      if (!myIsAlive) {
        console.log('[Mobile] ❌ Player is eliminated, skipping vote screen');
        return;
      }

      // Check if player is eligible to vote
      if (data.eligibleVoters && !data.eligibleVoters.includes(playerId)) {
        console.log('[Mobile] ❌ Player is not in eligibleVoters list, skipping vote screen');
        console.log('[Mobile] eligibleVoters:', data.eligibleVoters);
        console.log('[Mobile] my playerId:', playerId);
        setStatus('非投票階段');
        return;
      }
      console.log('[Mobile] ✓ Player is alive and eligible to vote, showing vote screen');

      currentVoteData = data;
      selectedVoteOption = null; // Reset selection
      voteSubmitted = false; // Reset submitted state

      const overlay = document.getElementById('voteOverlay');
      const optionsContainer = document.getElementById('voteOptions');
      const submitBtn = document.getElementById('voteSubmitBtn');
      const titleEl = overlay.querySelector('.vote-title');
      const subtitleEl = document.getElementById('voteSubtitle');

      // Update title and subtitle
      if (titleEl && data.voteTitle) {
        titleEl.textContent = data.voteTitle;
      } else {
        titleEl.textContent = '🗳️ 投票階段';
      }

      if (subtitleEl) {
        subtitleEl.textContent = data.voteDescription || '請選擇要投票的對象';
      }

      // Clear previous options
      optionsContainer.innerHTML = '';

      // Generate vote options
      data.options.forEach(option => {
        const div = document.createElement('div');
        div.className = 'vote-option';
        div.dataset.optionId = option.id;
        div.onclick = () => selectVoteOption(option.id, div);
        div.dataset.selected = 'false';

        if (option.type === 'player') {
          div.innerHTML = `
            <div class="vote-option-icon">👤</div>
            <div class="vote-option-name">${option.name}</div>
          `;
        } else {
          div.innerHTML = `
            ${option.icon ? `<div class="vote-option-icon">${option.icon}</div>` : ''}
            <div class="vote-option-name">${option.name}</div>
            ${option.type ? `<div class="vote-option-type">${option.type}</div>` : ''}
          `;
        }

        optionsContainer.appendChild(div);
      });

      // Show overlay
      overlay.classList.remove('hidden');

      // Reset status and disable submit button until an option is selected
      document.getElementById('voteStatus').textContent = '請選擇一個選項';
      document.getElementById('voteTimer').textContent = '';
      submitBtn.disabled = true;
      submitBtn.classList.remove('submitted');
      submitBtn.disabled = true;
      submitBtn.classList.remove('submitted');
      submitBtn.textContent = '送出投票';
    }

    function hideVoteScreen() {
      document.getElementById('voteOverlay').classList.add('hidden');
      currentVoteData = null;
      selectedVoteOption = null;
      voteSubmitted = false;
    }

    function selectVoteOption(optionId, element) {
      if (voteSubmitted) return; // Already submitted, can't change

      // Update UI - mark selected option
      document.querySelectorAll('.vote-option').forEach(el => {
        el.classList.remove('selected');
        el.dataset.selected = 'false';
      });

      element.classList.add('selected');
      element.dataset.selected = 'true';
      selectedVoteOption = optionId;

      const submitBtn = document.getElementById('voteSubmitBtn');
      submitBtn.disabled = false;
      submitBtn.classList.remove('submitted');

      // Update status
      document.getElementById('voteStatus').textContent = `已選擇，請點擊送出`;
    }

    function castVote() {
      if (!currentVoteData || !selectedVoteOption || voteSubmitted) return;

      console.log('[Mobile] Casting vote for:', selectedVoteOption);

      // Send vote
      client.playerAction('cast_vote', {
        targetId: selectedVoteOption,
        voteId: currentVoteData.voteId
      });

      console.log('[Mobile] Vote sent successfully');

      // Mark as submitted
      voteSubmitted = true;

      // Update UI
      const submitBtn = document.getElementById('voteSubmitBtn');
      submitBtn.textContent = '✓ 已送出';
      submitBtn.disabled = true;
      submitBtn.classList.add('submitted');

      document.getElementById('voteStatus').textContent = '✓ 投票已送出（不可更改）';

      // Disable all options
      document.querySelectorAll('.vote-option').forEach(el => {
        el.classList.add('disabled');
        el.onclick = null;
      });
    }

    // ════════════════════════════════════════════════════════════════
    //   INIT — apply layout class on first paint
    // ════════════════════════════════════════════════════════════════
    document.querySelectorAll('.lt-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.layout === cardLayout));

    // Setup vote submit button
    document.getElementById('voteSubmitBtn').addEventListener('click', castVote);

    // ════════════════════════════════════════════════════════════════
    //   CONTROLLER (input stage)
    // ════════════════════════════════════════════════════════════════
    const pressedKeys = new Set();

    function showControllerZone(inputConfig) {
      document.getElementById('cardZone').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';
      const cz = document.getElementById('controllerZone');
      cz.classList.add('active');
      renderController(inputConfig || {});
    }

    function hideControllerZone() {
      const cz = document.getElementById('controllerZone');
      cz.classList.remove('active');
      document.getElementById('cardZone').style.display = '';
      document.getElementById('actionbar').style.display = '';
      pressedKeys.forEach(key => sendControllerInput(key, 'up'));
      pressedKeys.clear();
      document.getElementById('controllerLayout').innerHTML = '';
    }

    function renderController(cfg) {
      const layout = cfg.layout || 'pad-4';
      const labels = cfg.buttonLabels || {};
      const container = document.getElementById('controllerLayout');
      container.innerHTML = '';
      container.className = 'ctrl-layout';

      if (layout === 'pad-8') {
        container.appendChild(buildPadGrid(
          ['btn1','btn2','btn3','btn4','btn5','btn6','btn7','btn8'], labels, 4));
      } else if (layout === 'pad-4') {
        container.appendChild(buildPadGrid(['btn1','btn2','btn3','btn4'], labels, 2));
      } else if (layout === 'pad-2') {
        container.classList.add('layout-pad-2');
        container.appendChild(buildPadGrid(['btn1','btn2'], labels, 2));
      } else if (layout === 'dpad-2btn') {
        container.appendChild(buildDpad(''));
        const col = document.createElement('div');
        col.className = 'ctrl-action-col';
        col.appendChild(buildCtrlBtn('btn1', labels['btn1'] || 'A'));
        col.appendChild(buildCtrlBtn('btn2', labels['btn2'] || 'B'));
        container.appendChild(col);
      } else if (layout === 'dpad-dpad') {
        container.appendChild(buildDpad(''));
        container.appendChild(buildDpad('2'));
      }
    }

    function buildPadGrid(keys, labels, cols) {
      const grid = document.createElement('div');
      grid.className = `pad-grid cols-${cols}`;
      keys.forEach(k => grid.appendChild(buildCtrlBtn(k, labels[k] || k.replace('btn',''))));
      return grid;
    }

    function buildCtrlBtn(key, label) {
      const btn = document.createElement('div');
      btn.className = 'ctrl-btn';
      btn.textContent = label;
      attachCtrlEvents(btn, key);
      return btn;
    }

    function buildDpad(suffix) {
      const wrap = document.createElement('div');
      wrap.className = 'dpad-wrap';
      [['up','▲'],['down','▼'],['left','◀'],['right','▶']].forEach(([dir, sym]) => {
        const seg = document.createElement('div');
        seg.className = `dpad-segment dpad-${dir}`;
        seg.textContent = sym;
        attachCtrlEvents(seg, dir + suffix);
        wrap.appendChild(seg);
      });
      const center = document.createElement('div');
      center.className = 'dpad-center';
      wrap.appendChild(center);
      return wrap;
    }

    function attachCtrlEvents(el, key) {
      const press = e => {
        e.preventDefault();
        if (pressedKeys.has(key)) return;
        pressedKeys.add(key);
        el.classList.add('pressed');
        sendControllerInput(key, 'down');
      };
      const release = e => {
        e.preventDefault();
        if (!pressedKeys.has(key)) return;
        pressedKeys.delete(key);
        el.classList.remove('pressed');
        sendControllerInput(key, 'up');
      };
      el.addEventListener('touchstart', press, { passive: false });
      el.addEventListener('touchend',   release, { passive: false });
      el.addEventListener('touchcancel',release, { passive: false });
      el.addEventListener('mousedown', press);
      el.addEventListener('mouseup',   release);
      el.addEventListener('mouseleave',release);
    }

    function sendControllerInput(key, state) {
      client.playerAction('input', { key, state });
    }
  </script>
