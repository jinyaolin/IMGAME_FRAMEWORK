<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>遊戲中</title>
  <style>
    /* ═══════════════════════════════════════════════
       LAYOUT: 5 fixed zones — never reflow
         ┌─────────────────────┐
         │ TOPBAR (54px fixed) │  identity • room/name/score • layout toggle
         ├─────────────────────┤
         │ STATUSBAR (32px)    │  shared message + countdown
         ├─────────────────────┤
         │                     │
         │ CARD ZONE (flex:1)  │  the only area that changes layout
         │                     │
         ├─────────────────────┤
         │ ACTION (60px fixed) │  play button (always visible, even when disabled)
         └─────────────────────┘
       ═══════════════════════════════════════════════ */
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; /* 鎖死選取：遊戲中誤觸不會把畫面/文字選起來 */
      -webkit-touch-callout: none;               /* 關掉 iOS 長按的選字/存圖選單 */
      -webkit-tap-highlight-color: transparent;  /* 點擊不閃灰底 */
    }
    /* 例外：若日後加入文字輸入框，仍要能在其中選字/輸入 */
    input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
    :root {
      --bg:        #0a0a1a;
      --surface:   #14142a;
      --surface-2: #1a1a3a;
      --border:    #2a2a5a;
      --text:      #e0e0ff;
      --text-dim:  #8888bb;
      --text-faint:#6666aa;
      --accent:    #6688ff;
      --accent-2:  #5555ff;
      --gold:      #ffdd44;
      --green:     #44cc88;
      --red:       #ff6666;
      --topbar-h:  54px;
      --status-h:  32px;
      --action-h:  64px;
    }
    html, body { height: 100dvh; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
      overscroll-behavior: contain;
    }

    /* ───── TOPBAR ──────────────────────────────────────── */
    #topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
    }
    /* Left section: player number + identity slot */
    #topbarLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    /* Player number badge (rounded square) */
    #playerNumber {
      display: none; /* Hidden until player number is assigned */
      justify-content: center; align-items: center;
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #e67e22;
      color: white;
      font-size: .75rem;
      font-weight: bold;
      flex-shrink: 0;
      line-height: 1;
    }
    #playerNumber:not(:empty) {
      display: flex;
    }
    /* Identity slot — fixed top-left, small */
    #idSlot {
      display: flex; justify-content: center; align-items: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #0a0a18; border: 2px solid var(--border);
      cursor: pointer; user-select: none;
      transition: border-color .15s, transform .1s;
      flex-shrink: 0;
    }
    #idSlot:active { transform: scale(.94); }
    #idSlot.empty   { color: var(--text-faint); font-size: 1.1rem; }
    #idSlot.has-id  { font-size: .82rem; font-weight: 700; line-height: 1; padding: 4px; text-align: center; }
    #idSlot .id-label {
      position: absolute; transform: translateY(36px);
      font-size: .58rem; color: var(--text-faint); letter-spacing: .05em;
      pointer-events: none; white-space: nowrap;
    }
    /* Center: room + name + score (compact) */
    #topbarCenter {
      flex: 1;
      display: flex; flex-direction: column; min-width: 0; padding: 0 10px;
    }
    #topbarCenter .name { font-size: .92rem; font-weight: 700; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #topbarCenter .meta { font-size: .65rem; color: var(--text-dim); display: flex; gap: 8px; margin-top: 1px; }
    #topbarCenter .meta .score { color: var(--gold); font-weight: 700; }
    /* Layout toggle */
    #layoutToggle {
      display: flex; gap: 0; background: #0a0a18; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .lt-btn {
      width: 32px; height: 32px;
      background: transparent; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); transition: background .15s, color .15s;
    }
    .lt-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .lt-btn:active { background: rgba(85, 85, 255, .15); }
    .lt-btn.active { color: var(--accent); background: rgba(85, 85, 255, .2); }
    .lt-btn svg { width: 18px; height: 18px; display: block; }

    /* ───── STATUSBAR ───────────────────────────────────── */
    #statusbar {
      height: var(--status-h);
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 0 14px;
      font-size: .76rem; color: var(--text-dim);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      transition: background .25s, color .25s;
    }
    #statusbar.has-countdown {
      background: linear-gradient(90deg, rgba(255,221,68,.08), rgba(255,221,68,.18), rgba(255,221,68,.08));
      border-bottom-color: rgba(255,221,68,.4);
    }
    #statusbar .status-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #statusbar .countdown {
      color: var(--gold); font-family: monospace; flex-shrink: 0;
      font-size: .98rem; font-weight: 700; letter-spacing: .04em;
    }

    /* ───── CARD ZONE (the changeable region) ──────────── */
    #cardZone {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0a0a1a 0%, #050511 100%);
    }
    #cardZone .empty-msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: .85rem;
    }

    /* The card containers — exactly one is .active per layout mode */
    .card-area { position: absolute; inset: 0; padding: 12px; }
    .card-area.layout-strip {
      display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
      padding: 16px 12px;
      align-items: center;
    }
    .card-area.layout-fan {
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
      padding-top: 28px;          /* room for selected card to lift */
    }
    .card-area.layout-fan .fan-track {
      position: relative;
      height: 100%;
      display: flex; align-items: center;
    }
    .card-area.layout-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      overflow-y: auto;
      padding: 12px;
      align-content: start;
    }

    /* ───── CARD STYLES ─────────────────────────────────── */
    .card {
      position: relative;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer; user-select: none;
      overflow: hidden;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .card:active { transform: scale(.96); }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(102, 136, 255, .35), 0 6px 20px rgba(85, 85, 255, .4);
    }
    .card.eliminated {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(100%);
    }
    .card .card-img {
      width: 100%; height: 70%;
      object-fit: cover;
      display: block;
      background: #0a0a18;
    }
    .card.no-img .card-img-fallback {
      width: 100%; height: 70%;
      background: linear-gradient(135deg, #1a1a3a 0%, #2a2a5a 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 1.5rem; font-weight: 700;
      letter-spacing: .05em;
    }
    .card .card-body {
      padding: 6px 8px;
      height: 30%;
      display: flex; flex-direction: column; justify-content: center;
      background: var(--surface);
    }
    .card .card-name { font-size: .78rem; font-weight: 700; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .card-sub  { font-size: .62rem; color: var(--text-dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .card-value-pill {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,.6); color: var(--gold);
      font-size: .68rem; font-weight: 700;
      border-radius: 10px; padding: 2px 7px;
      backdrop-filter: blur(4px);
    }

    /* Strip-specific sizing */
    .layout-strip .card { width: 110px; height: 158px; }
    /* Fan-specific positioning is set inline (transform) */
    .layout-fan .card { width: 110px; height: 158px; transition: transform .25s, border-color .15s, box-shadow .15s; }
    .layout-fan .card.selected { z-index: 100; }
    /* Grid */
    .layout-grid .card { aspect-ratio: 5 / 7; height: auto; width: 100%; }

    /* ───── ACTION BAR ──────────────────────────────────── */
    #actionbar {
      height: var(--action-h);
      flex-shrink: 0;
      padding: 10px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
    }
    #playBtn {
      flex: 1; height: 44px;
      background: var(--accent-2); color: #fff;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    #playBtn:active:not(:disabled) { background: #3333cc; }
    #playBtn:disabled { background: #2a2a4a; color: var(--text-faint); cursor: not-allowed; }

    /* ───── OVERLAY: identity full view ─────────────────── */
    #identityOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10, 10, 26, .92);
      display: none; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(6px);
    }
    #identityOverlay.show { display: flex; }
    .id-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 28px 30px;
      width: 100%; max-width: 320px;
      text-align: center;
    }
    .id-card .id-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .id-card .id-label { font-size: .72rem; color: var(--text-faint); letter-spacing: .12em; margin-bottom: 14px; }
    .id-card .id-name { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }
    .id-card .id-team { font-size: .8rem; padding: 3px 12px; border-radius: 12px; display: inline-block; margin-bottom: 14px; }
    .id-card .id-desc { font-size: .9rem; color: var(--text-dim); line-height: 1.5; }
    .id-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
    .id-actions button {
      padding: 11px 24px; border: none; border-radius: 10px;
      font-size: .92rem; font-weight: 700; cursor: pointer;
    }
    .id-actions .id-confirm { background: var(--accent-2); color: #fff; }
    .id-actions .id-close   { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .id-confirmed-msg { margin-top: 12px; font-size: .82rem; color: var(--green); }

    /* ───── VOTE OVERLAY ───────────────────────────────────────── */
    #voteOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #voteOverlay.hidden { display: none; }

    /* ───── ELIMINATED SCREEN ─────────────────────────────────── */
    #eliminatedScreen {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0005;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    #eliminatedScreen .elim-icon { font-size: 4rem; margin-bottom: 16px; }
    #eliminatedScreen .elim-title {
      font-size: 1.6rem; font-weight: 800; color: #ff4444;
      margin-bottom: 8px; letter-spacing: .04em;
    }
    #eliminatedScreen .elim-sub {
      font-size: .95rem; color: #888899; margin-bottom: 32px; line-height: 1.5;
    }
    #eliminatedScreen .elim-watch-label {
      font-size: .72rem; color: #555566; letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 24px;
    }
    #eliminatedScreen .vote-results {
      background: #12121f;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px;
      max-width: 320px;
      width: 100%;
    }
    #eliminatedScreen .vote-results-title {
      font-size: .85rem;
      color: #8888bb;
      margin-bottom: 12px;
      text-align: left;
    }
    #eliminatedScreen .vote-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4a;
    }
    #eliminatedScreen .vote-result-item:last-child {
      border-bottom: none;
    }
    #eliminatedScreen .vote-result-target {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #eliminatedScreen .vote-result-number {
      background: #e67e22;
      color: white;
      font-size: .7rem;
      font-weight: bold;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #eliminatedScreen .vote-result-name {
      font-size: .85rem;
      color: #ccccee;
    }
    #eliminatedScreen .vote-result-count {
      font-size: 1rem;
      color: #ffdd44;
      font-weight: bold;
    }
    .vote-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; width: 100%; max-width: 340px;
    }
    .vote-header { margin-bottom: 20px; text-align: center; }
    .vote-title { font-size: 1.3rem; color: #fff; margin-bottom: 6px; }
    .vote-subtitle { font-size: .85rem; color: var(--text-dim); }
    .vote-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 20px;
    }
    .vote-option {
      background: #1a1a2e; border: 2px solid #3a3a5a;
      border-radius: 12px; padding: 16px;
      cursor: pointer; transition: all .2s;
      text-align: center;
    }
    .vote-option:hover:not(.disabled) { border-color: var(--accent); background: #2a2a4a; }
    .vote-option.selected { border-color: var(--accent); background: #1a1a3a; }
    .vote-option.disabled { opacity: .4; cursor: not-allowed; }
    .vote-option-name { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .vote-option-icon { font-size: 2rem; }
    .vote-option-type { font-size: .7rem; color: var(--text-dim); }
    .vote-status { font-size: .9rem; color: var(--green); text-align: center; margin-bottom: 12px; }
    .vote-timer { font-size: .8rem; color: var(--text-dim); text-align: center; margin-bottom: 16px; }
    .vote-submit-btn {
      width: calc(100% - 32px);
      margin: 0 16px 16px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4a9eff 0%, #357abd 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .vote-submit-btn:hover { background: linear-gradient(135deg, #5aadff 0%, #4289d0 100%); }
    .vote-submit-btn:disabled {
      background: #3a3a5a;
      color: #8888aa;
      cursor: not-allowed;
    }
    .vote-submit-btn.submitted {
      background: linear-gradient(135deg, #44cc77 0%, #339955 100%);
      cursor: default;
    }

    /* ───── LOBBY ────────────────────────────────────────── */
    #lobbyScreen {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    #lobbyScreen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lobbyScreen p { color: var(--text-dim); font-size: .9rem; margin-bottom: 24px; }
    #playerList { width: 100%; max-width: 320px; margin-bottom: 16px; }
    .player-entry {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .9rem;
    }
    .player-entry .ready { color: var(--green); font-size: .75rem; }
    .player-entry .waiting { color: var(--text-faint); font-size: .75rem; }
    #readyBtn {
      width: 100%; max-width: 320px;
      background: var(--green); color: #fff; border: none;
      border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer;
    }
    #readyBtn.is-ready { background: #1a6633; }

    /* ───── RESULT SCREEN ─────────────────────────────────── */
    #resultScreen {
      flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px; text-align: center;
    }

    /* ───── WAITING SCREEN ─────────────────────────────────── */
    #waitingScreen {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0a1a;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    #waitingScreen .wait-icon { font-size: 4rem; margin-bottom: 16px; }
    #waitingScreen .wait-title {
      font-size: 1.6rem; font-weight: 800; color: #ffaa44;
      margin-bottom: 8px; letter-spacing: .04em;
    }
    #waitingScreen .wait-sub {
      font-size: .95rem; color: #8888bb; margin-bottom: 32px; line-height: 1.5;
    }
    #waitingScreen .wait-info {
      background: #12121f;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      font-size: .85rem;
      color: #aaaacc;
      line-height: 1.6;
    }
    #waitingScreen .wait-info-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    /* ───── INTERMISSION SCREEN ─────────────────────────────── */
    #intermissionScreen {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0a1a;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    #intermissionScreen .intermission-title {
      font-size: 1.6rem; font-weight: 800; color: #ffaa44;
      margin-bottom: 8px; letter-spacing: .04em;
    }
    #intermissionScreen .intermission-sub {
      font-size: .95rem; color: #8888bb; margin-bottom: 32px; line-height: 1.5;
    }
    #intermissionScreen .intermission-info {
      background: #12121f;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      font-size: .85rem;
      color: #aaaacc;
      line-height: 1.6;
    }
    #intermissionScreen .intermission-info-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    #resultScreen .trophy { font-size: 3rem; margin-bottom: 8px; }
    #resultScreen h2 { font-size: 1.3rem; color: var(--gold); margin-bottom: 6px; }
    #resultWinners { font-size: .85rem; color: var(--text-dim); margin-bottom: 28px; }
    .lb-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 24px; width: 100%; max-width: 320px; margin-bottom: 24px;
    }
    .lb-title { font-size: .72rem; color: var(--text-faint); margin-bottom: 12px; letter-spacing: .08em; }
    #resultLeaderboard .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    #resultLeaderboard .row.me { color: #ffffaa; font-weight: 700; }
    #resultLeaderboard .row .score { color: var(--gold); }
    .leave-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text-faint); font-size: .85rem; padding: 10px 28px; cursor: pointer;
    }

    .hidden { display: none !important; }

    /* ───── CONTROLLER ZONE ───────────────────────────────── */
    #controllerZone {
      flex: 1; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px; overflow: hidden;
      background: var(--bg); touch-action: none;
    }
    #controllerZone.active { display: flex; }
    .ctrl-layout {
      display: flex; justify-content: center; align-items: center;
      width: 100%; max-width: 420px; gap: 20px;
    }
    .pad-grid { display: grid; gap: 10px; width: 100%; }
    .pad-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .pad-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .ctrl-btn {
      aspect-ratio: 1; background: #1a1a40;
      border: 2px solid #3a3a7a; border-radius: 14px;
      color: #aaaaff; font-size: 1.1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      touch-action: none; transition: background .06s, transform .06s;
    }
    .ctrl-btn.pressed {
      background: #3a3a9a; border-color: #8888ff;
      transform: scale(0.91); box-shadow: 0 0 14px rgba(120,120,255,.5);
    }
    .layout-pad-2 .ctrl-btn { aspect-ratio: auto; min-height: 110px; font-size: 2rem; }
    .ctrl-action-col { display: flex; flex-direction: column; gap: 12px; }
    .ctrl-action-col .ctrl-btn { width: 82px; height: 82px; aspect-ratio: auto; }
    .dpad-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
    .dpad-segment {
      position: absolute; background: #1a1a40; border: 2px solid #3a3a7a;
      display: flex; align-items: center; justify-content: center;
      color: #aaaaff; font-size: 1.2rem;
      cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .dpad-segment.pressed { background: #3a3a9a; border-color: #8888ff; }
    .dpad-up    { top:0;     left:33.3%; width:33.4%; height:33.4%; border-radius:8px 8px 0 0; }
    .dpad-down  { bottom:0;  left:33.3%; width:33.4%; height:33.4%; border-radius:0 0 8px 8px; }
    .dpad-left  { top:33.3%; left:0;     width:33.4%; height:33.4%; border-radius:8px 0 0 8px; }
    .dpad-right { top:33.3%; right:0;    width:33.4%; height:33.4%; border-radius:0 8px 8px 0; }
    .dpad-center { top:33.3%; left:33.3%; width:33.4%; height:33.4%;
      background:#0d0d22; border:2px solid #2a2a50; pointer-events:none; }

    /* ───── VIRTUAL JOYSTICK (for dpad-2btn layout) ───────────────── */
    .joystick-container {
      position: relative;
      width: 180px;
      height: 180px;
      flex-shrink: 0;
    }

    .joystick-base {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 10px;
      left: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1a1a3a 0%, #0d0d22 100%);
      border: 3px solid #3a3a6a;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      touch-action: none;
    }

    .joystick-stick {
      position: absolute;
      width: 70px;
      height: 70px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #6688ff 0%, #4444aa 100%);
      border: 2px solid #8888ff;
      box-shadow: 0 4px 12px rgba(102, 136, 255, 0.4), inset 0 2px 8px rgba(255, 255, 255, 0.2);
      touch-action: none;
      transition: transform 0.1s ease-out;
      pointer-events: none;
    }

    .joystick-stick.active {
      background: radial-gradient(circle at 30% 30%, #8888ff 0%, #5555aa 100%);
      box-shadow: 0 6px 16px rgba(136, 136, 255, 0.6), inset 0 2px 8px rgba(255, 255, 255, 0.3);
    }

    .joystick-base::after {
      /* Direction indicators */
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background-image:
        linear-gradient(to right, transparent 45%, rgba(102, 136, 255, 0.15) 45%, rgba(102, 136, 255, 0.15) 55%, transparent 55%),
        linear-gradient(to bottom, transparent 45%, rgba(102, 136, 255, 0.15) 45%, rgba(102, 136, 255, 0.15) 55%, transparent 55%);
      border-radius: 50%;
      pointer-events: none;
    }

    .joystick-indicator {
      /* Active direction indicator */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(102, 136, 255, 0.3);
      border: 2px solid rgba(136, 136, 255, 0.5);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .joystick-base.active .joystick-indicator {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ════════ RESULT SCREEN ════════ -->
  <div id="resultScreen">

      <div class="lb-title">最終排名</div>

  </div>

  <script>
    window.IMGAME_BASE = location.pathname.indexOf('/labs/game') === 0 ? '/labs/game' : '';
    document.write('<script src="' + IMGAME_BASE + '/socket.io/socket.io.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/socket.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/config.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/netcore.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/netclient.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/p2p.js"><\/script>');
    document.write('<script src="' + IMGAME_BASE + '/shared/vendor/NoSleep.min.js"><\/script>');
  </script>
  <script>
    // ════════════════════════════════════════════════════════════════
    //   STATE
    // ════════════════════════════════════════════════════════════════
    const params     = new URLSearchParams(window.location.search);
    const roomId     = params.get('room') || '';
    const playerName = params.get('name') || '玩家';
    const playerId   = getOrCreatePlayerId(roomId, playerName);   // 同房+同名 → 同身份(可 resume)

    let myHand        = [];
    let myIdentity    = null;
    let selectedCard  = null;       // _instanceId of selected card
    let isReady       = false;
    let phase         = 'lobby';
    let isPlayingCard = false;
    let isRevealed    = false;
    let hasPlayedThisRound = false;
    let identityConfirmed  = false;
    let myIsAlive     = true;
    let lastVoteResults = null; // Store most recent vote results
    let currentPlayers = []; // Store current players list
    const playersById = new Map();

    function showEliminatedScreen(subText) {
      console.log('[Mobile] showEliminatedScreen called with:', subText);
      // Hide intermission screen (eliminated has higher priority than paused)
      hideIntermissionScreen();

      const screen = document.getElementById('eliminatedScreen');
      console.log('[Mobile] eliminatedScreen element:', screen);
      if (subText) document.getElementById('elimSubText').textContent = subText;
      screen.style.display = 'flex';
      console.log('[Mobile] eliminatedScreen display set to flex. Current display:', screen.style.display);
    }

    function showEliminatedWithVoteResults(eliminationType = 'exile') {
      console.log('[Mobile] showEliminatedWithVoteResults called with type:', eliminationType);
      // Hide intermission screen (eliminated has higher priority than paused)
      hideIntermissionScreen();

      const screen = document.getElementById('eliminatedScreen');
      console.log('[Mobile] eliminatedScreen element:', screen);

      // Set elimination-specific content
      const eliminationMessages = {
        exile: { icon: '🏳️', title: '你被放逐了', subtext: '村民投票決定將你放逐。遊戲繼續進行中，你可以繼續觀看。' },
        wolf_kill: { icon: '🐺', title: '你被狼人殺害了', subtext: '月黑風高的夜晚，狼人選擇了你作為獵物。遊戲繼續進行中，你可以繼續觀看。' },
        poison: { icon: '☠️', title: '你被毒殺了', subtext: '不知名的毒藥結束了你的生命。遊戲繼續進行中，你可以繼續觀看。' },
        shoot: { icon: '🔫', title: '你被槍殺了', subtext: '槍聲響起，你應聲倒地。遊戲繼續進行中，你可以繼續觀看。' }
      };

      const message = eliminationMessages[eliminationType] || eliminationMessages.exile;

      // Update the eliminated screen content
      const iconEl = screen.querySelector('.elim-icon');
      const titleEl = screen.querySelector('.elim-title');
      const subEl = document.getElementById('elimSubText');

      if (iconEl) iconEl.textContent = message.icon;
      if (titleEl) titleEl.textContent = message.title;
      if (subEl) subEl.textContent = message.subtext;

      screen.style.display = 'flex';
      // Hide vote overlay if it's showing
      const voteOverlay = document.getElementById('voteOverlay');
      if (voteOverlay) {
        voteOverlay.classList.add('hidden');
        console.log('[Mobile] Hidden vote overlay');
      }
      console.log('[Mobile] eliminatedScreen display set to flex with type:', eliminationType);

      // Display vote results if available
      const resultsContainer = document.getElementById('elimVoteResults');
      if (lastVoteResults && lastVoteResults.length > 0) {
        let resultsHtml = '<div class="vote-results-title">📊 投票結果</div>';

        lastVoteResults.forEach(result => {
          const number = result.targetNumber || '?';
          const name = result.targetName || result.targetId;
          resultsHtml += `
            <div class="vote-result-item">
              <div class="vote-result-target">
                <span class="vote-result-number">${number}</span>
                <span class="vote-result-name">${name}</span>
              </div>
              <span class="vote-result-count">${result.count} 票</span>
            </div>
          `;
        });

        resultsContainer.innerHTML = resultsHtml;
        resultsContainer.style.display = 'block';
      } else {
        resultsContainer.style.display = 'none';
      }
    }

    function hideEliminatedScreen() {
      document.getElementById('eliminatedScreen').style.display = 'none';
    }

    function showWaitingScreen() {
      console.log('[Mobile] showWaitingScreen called');
      // Hide all other overlay screens (waiting has highest priority)
      hideEliminatedScreen();
      hideIntermissionScreen();

      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('waitingScreen').style.display = 'flex';
    }

    function hideWaitingScreen() {
      console.log('[Mobile] hideWaitingScreen called');
      document.getElementById('waitingScreen').style.display = 'none';
    }

    function showIntermissionScreen(subText) {
      console.log('[Mobile] showIntermissionScreen called with:', subText);

      // Priority check: waiting screen has highest priority
      if (phase === 'waiting') {
        console.log('[Mobile] In waiting phase, not showing intermission screen');
        return;
      }

      // Priority check: eliminated screen has higher priority
      if (!myIsAlive) {
        console.log('[Mobile] Player is eliminated, not showing intermission screen');
        return;
      }

      // Only show if player is in game and alive
      if (subText) document.getElementById('intermissionSubText').textContent = subText;
      document.getElementById('intermissionScreen').style.display = 'flex';
    }

    function hideIntermissionScreen() {
      console.log('[Mobile] hideIntermissionScreen called');
      document.getElementById('intermissionScreen').style.display = 'none';
    }

    // Layout: 'strip' | 'fan' | 'grid' — persisted per-device
    let cardLayout = localStorage.getItem('mobile.cardLayout') || 'strip';

    const TEAM_COLORS = {
      red: '#ff6666', blue: '#6688ff', green: '#44cc88',
      gold:'#ffdd44', purple: '#bb66ff', default: '#aaaaff'
    };

    // ════════════════════════════════════════════════════════════════
    //   CONNECT
    // ════════════════════════════════════════════════════════════════
    const client = new GameClient();
    try { window.__mgClient = client; } catch (e) {}   // 測試掛鉤(選角 e2e 用)
    let myAttrs = {};   // 自己的 playerAttributes(選角記住上次選擇用),由 game_started + player_param_updated 維護
    client.on('player_param_updated', (d) => { if (d && d.playerId === playerId) myAttrs = d.attributes || myAttrs; });
    // P2P 模式(?p2p=1):直連 host 瀏覽器(GameSession 跑在那,Node 只做信令)→ 區網零跨網延遲。
    // 一般模式:socket.io 連 Node。兩者之後所有 semantic 呼叫(joinRoom/playerAction/on)完全相同。
    const useP2P = params.get('p2p') === '1';
    client.on('connect', () => client.joinRoom(roomId, playerId, playerName));
    if (useP2P) {
      client.connectP2P(roomId).catch(e => { console.error('[Mobile] P2P 連線失敗', e); setStatus('P2P 連線失敗:' + (e && e.message)); });
      // P2P 斷線自動重連:背景分頁解凍/host 短暫失聯後自動歸隊(join 走 resume 機制,同身份接回)。
      // 背景時不重試(反正被節流),回前景 4 秒內接回。
      let p2pRetryTimer = null, p2pRetryBusy = false;
      client.on('disconnect', () => {
        setStatus('連線中斷,自動重連中…');
        if (p2pRetryTimer) return;
        p2pRetryTimer = setInterval(() => {
          if (document.hidden || p2pRetryBusy) return;
          if (client.p2p && client.p2p.openPeers() >= 1) { clearInterval(p2pRetryTimer); p2pRetryTimer = null; return; }
          p2pRetryBusy = true;
          try { client.p2p && client.p2p.close(); } catch (e) {}
          try { client._signalSocket && client._signalSocket.disconnect(); } catch (e) {}
          client.connectP2P(roomId)
            .then(() => { clearInterval(p2pRetryTimer); p2pRetryTimer = null; })
            .catch(() => {})
            .finally(() => { p2pRetryBusy = false; });
        }, 4000);
      });
    } else {
      client.connect();
    }

    client.on('room_joined', (data) => {
      phase = data.phase;
      document.getElementById('hdrRoom').textContent = `房間 ${data.roomId}`;
      // 以伺服器定案的名字為準(同名自動編號:小明 → 小明②)
      document.getElementById('hdrName').textContent = (data.playerState && data.playerState.name) || playerName;
      renderPlayers(data.players);
      if (data.playerState) updateMyState(data.playerState);
      if (data.sharedState) updateStatus(data.sharedState);
      if (data.phase === 'playing') {
        enterGameScreen();
        // 只有「不在本局名單」的中途新加入者才觀戰;回歸玩家(inCurrentGame)的遊戲畫面
        // 由稍早的 stage_started(isReconnect,帶 gameConfig)重建,這裡不能蓋掉。
        if (data.currentStage?.stageType === 'game' && !data.inCurrentGame) {
          hideControllerZone();
          setStatus(t('mobile.waiting_game'));
        }
      }
    });

    client.on('player_joined', d => renderPlayers(d.players || []));
    client.on('player_left', d => {
      if (d.playerId === playerId) {
        alert('你已被移出房間');
        window.location.href = './';
      } else {
        renderPlayers((d.players || []).filter(p => p.id !== d.playerId));
      }
    });
    client.on('player_ready', d => renderPlayers(d.players || []));

    client.on('game_started_wait', (data) => {
      console.log('[Mobile] ========== GAME STARTED (WAITING) ==========');
      console.log('[Mobile] You did not ready in time, showing waiting screen');
      phase = 'waiting';
      showWaitingScreen();
    });

    client.on('game_started', (data) => {
      console.log('[Mobile] ========== GAME STARTED ==========');
      console.log('[Mobile] Full data:', JSON.stringify(data, null, 2));
      console.log('[Mobile] playerId:', playerId);
      phase = 'playing';
      myIsAlive = true; // Reset alive status when game restarts

      document.getElementById('hdrScore').textContent = '0';

      if (data.results && data.results.length > 0) {
        const maxVotes = Math.max(...data.results.map(r => r.count));
        const isTie = data.results.filter(r => r.count === maxVotes).length > 1;

        let resultHtml = '<div style="padding:20px;text-align:center;"><h3 style="color:#fff;margin-bottom:16px;">📊 投票結果</h3>';

        if (isTie) {
          resultHtml += '<div style="color:#ffdd44;margin-bottom:12px;">平票！</div>';
        }

        resultHtml += data.results.map((result, index) => {
          const name = result.targetName || result.targetId;
          const isLeading = result.count === maxVotes && result.count > 0;

          let votersHtml = '';

    function renderIdentityBadge() {

      if (!myIdentity) {
        slot.className = 'empty';
        icon.textContent = '🎭';

      const color = TEAM_COLORS[myIdentity.team] || TEAM_COLORS.default;

      slot.style.color = color;
      // First two chars of identity name (e.g. 戰士 → 戰士)

      icon.textContent = short;
    }

    function onIdSlotClick() {
      if (myIdentity) openIdentityOverlay({ confirmMode: !identityConfirmed });
    }

    function openIdentityOverlay({ confirmMode }) {
      if (!myIdentity) return;
      const ov = document.getElementById('identityOverlay');
      const color = TEAM_COLORS[myIdentity.team] || TEAM_COLORS.default;
      document.getElementById('idCardBox').style.borderColor = color;
      document.getElementById('idOName').textContent = myIdentity.name || '—';
      document.getElementById('idODesc').textContent = myIdentity.description || '';
      const teamEl = document.getElementById('idOTeam');
      if (myIdentity.team) {
        teamEl.style.background = color + '22';
        teamEl.style.color = color;
        teamEl.style.display = 'inline-block';
        teamEl.textContent = myIdentity.team;
      } else { teamEl.style.display = 'none'; }

      const confirmBtn = document.getElementById('idOConfirmBtn');
      const closeBtn   = document.getElementById('idOCloseBtn');
      const msg        = document.getElementById('idOConfirmedMsg');
      if (confirmMode && !identityConfirmed) {
        confirmBtn.style.display = 'inline-block';
        closeBtn.style.display = 'none';
        msg.classList.add('hidden');
      } else {
        confirmBtn.style.display = 'none';
        closeBtn.style.display = 'inline-block';
        if (identityConfirmed) msg.classList.remove('hidden');
      }
      ov.classList.add('show');
    }

    function hideIdentityOverlay() { document.getElementById('identityOverlay').classList.remove('show'); }
    function closeIdentityOverlay() { hideIdentityOverlay(); }
    function onOverlayBgClick(e) {
      if (e.target.id === 'identityOverlay' && identityConfirmed) hideIdentityOverlay();

    function setStatus(text) {
      const el = document.getElementById('statusText');
      el.style.color = '';
      el.textContent = text || '';
    }
    function flashStatus(text, color) {
      const el = document.getElementById('statusText');
      el.style.color = color || '';
      el.textContent = text;
      setTimeout(() => { el.style.color = ''; el.textContent = ''; }, 2200);
    }
    function clearCountdown() { document.getElementById('countdownText').textContent = ''; }
    function updateStatus(sharedState) {
      if (typeof sharedState === 'object' && sharedState && sharedState.message) {
        setStatus(sharedState.message);

    }

    function setCardLayout(name) {
      cardLayout = name;
      localStorage.setItem('mobile.cardLayout', name);
      document.querySelectorAll('.lt-btn').forEach(b => b.classList.toggle('active', b.dataset.layout === name));
      const area = document.getElementById('cardArea');
      area.className = 'card-area layout-' + name;
      renderCards();

    document.querySelectorAll('.lt-btn').forEach(b => {
      b.addEventListener('click', () => setCardLayout(b.dataset.layout));

    //   CARD RENDERING (image-first; 3 layouts)
    // ════════════════════════════════════════════════════════════════
    function cardImageUrl(card) {
      // Support both `image` (deck JSON shape) and `imagePath` (legacy)
      return card.image || card.imagePath || '';
    }

    function renderCardElement(card, extraStyle = '') {
      const imgUrl  = cardImageUrl(card);
      const isSel   = selectedCard === card._instanceId;
      const eliminated = !myIsAlive; // Add visual state for eliminated players
      const valTag  = (card.value !== undefined && card.value !== null && card.value !== '')
        ? `<div class="card-value-pill">${card.value}</div>` : '';
      const visual  = imgUrl
        ? `<img class="card-img" src="${imgUrl}" alt="${card.name||''}" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex');"><div class="card-img-fallback" style="display:none">${(card.name||'').slice(0,2)}</div>`
        : `<div class="card-img-fallback">${(card.name||'').slice(0,2)}</div>`;
      const noImgCls = imgUrl ? '' : 'no-img';
      return `<div class="card ${noImgCls} ${isSel?'selected':''} ${eliminated?'eliminated':''}"
                   data-instance-id="${card._instanceId}"
                   onclick="selectCard('${card._instanceId}')"
                   style="${extraStyle}">
        ${visual}
        ${valTag}
        <div class="card-body">
          <div class="card-name">${card.name||''}</div>
          <div class="card-sub">${card.description||''}</div>
        </div>
      </div>`;
    }

    function renderCards() {
      const area = document.getElementById('cardArea');
      const empty = document.getElementById('emptyMsg');
      area.className = 'card-area layout-' + cardLayout;
      // Sync active toggle
      document.querySelectorAll('.lt-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.layout === cardLayout));

      if (!myHand.length) {
        area.innerHTML = '';
        empty.style.display = 'flex';
      } else {
        empty.style.display = 'none';
        if (cardLayout === 'fan') area.innerHTML = renderFan();
        else                       area.innerHTML = myHand.map(c => renderCardElement(c)).join('');
      }
      updateActionButton();
    }

    function renderFan() {
      // Cards overlap. Compute per-card transform.
      const n = myHand.length;
      const stepX = Math.max(28, Math.min(60, (window.innerWidth - 140) / Math.max(1, n - 1)));
      const stepDeg = n > 1 ? Math.min(8, 22 / Math.max(1, n - 1)) : 0;
      const startDeg = -((n - 1) * stepDeg) / 2;
      const totalW = (n - 1) * stepX + 110; // card width 110
      const startX = -totalW / 2 + 55;
      let html = '<div class="fan-track" style="width:'+ totalW +'px;height:200px;">';
      for (let i = 0; i < n; i++) {
        const card = myHand[i];
        const x   = startX + i * stepX - 55;          // anchor by card center
        const deg = startDeg + i * stepDeg;
        const isSel = selectedCard === card._instanceId;
        const lift  = isSel ? -36 : 0;
        const style = `position:absolute;left:50%;top:50%;
          transform: translate(${x}px, calc(-50% + ${lift}px)) rotate(${deg}deg);
          z-index:${isSel ? 100 : i + 1};`;
        html += renderCardElement(card, style);
      }
      html += '</div>';
      return html;
    }

    // ── 自訂互動遊戲（gameConfig.layout === 'custom'）──────────────
    // 手機本身變成遊戲畫面：跑 mobileCode，固定直式座標 720×1280（letterbox）
    // 手機 → display：GameAPI.sendState（20Hz 節流）；display → 手機：game_broadcast → onMessage
    const MG_LIB_URLS = { three: Config.url('/shared/vendor/three.min.js'), babylon: Config.url('/shared/vendor/babylon.js'), p5: Config.url('/shared/vendor/p5.min.js') };
    const MG_PALETTE = ['#ff6644','#44aaff','#44ff88','#ffdd44','#ff44aa','#88aaff','#ffaa44','#44ffdd'];  // 與 display 同步
    const mgLoadedLibs = {};

    // 遊戲 log 回報（GameAPI.log + 自動錯誤 → server，給 AI debug）
    let mgLogBuf = [], mgLogTimer = null;
    function mgPushLog(level, msg) {
      if (mgLogBuf.length >= 60) return;
      mgLogBuf.push({ ts: Date.now(), src: 'mobile:' + playerName, level, msg: String(msg).slice(0, 500) });
      if (!mgLogTimer) mgLogTimer = setTimeout(mgFlushLogs, 2000);
    }
    function mgFlushLogs() {
      mgLogTimer = null;
      if (!mgLogBuf.length) return;
      client.socket.emit('game_log', { roomId, entries: mgLogBuf.splice(0) });
    }
    const mgFmtErr = (e) => e.message + (e.stack ? ' @' + (e.stack.split('\n')[1] || '').trim().slice(0, 120) : '');
    let mg = null;   // { overlay, box, canvas, ctx, raf, updateFn, cleanups, msgHandlers, pendingState, flushTimer, resizeFn, errored }
    let lastGameStageId = null;   // 目前掛載的 game 階段 id(重連時判斷畫面是否已在跑)

    function mgLoadScript(url, key) {
      if (mgLoadedLibs[key]) return Promise.resolve();
      return new Promise(resolve => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => { mgLoadedLibs[key] = true; resolve(); };
        s.onerror = () => { console.error('[Mobile] script load failed:', url); resolve(); };
        document.head.appendChild(s);
      });
    }
    function mgLoadLib(lib) {
      if (!lib || lib === 'none' || !MG_LIB_URLS[lib]) return Promise.resolve();
      return mgLoadScript(MG_LIB_URLS[lib], lib).then(() =>
        // three 一律附掛 LowPoly（角色）+ FX（特效）+ LowWorld（場景/物件生成庫）
        lib === 'three'
          ? mgLoadScript(Config.url('/shared/vendor/lowpoly.js'), '_lowpoly')
              .then(() => mgLoadScript(Config.url('/shared/vendor/fx.js'), '_fx'))
              .then(() => mgLoadScript(Config.url('/shared/vendor/lowworld.js'), '_lowworld'))
          : null);
    }

    // ════════ 選角介面(select stage):LowPoly 預覽 + 換角色 + 骰造型 + 確定 → 寫 playerAttribute ════════
    let sel = null;
    function openSelectOverlay() {
      document.getElementById('selectOverlay').style.display = 'flex';
      hideControllerZone();
      // 每次進選角重置確定按鈕/提示(重開一輪時 ready 已清,按鈕不能還停在「已確定」)
      const cb = document.getElementById('selConfirm'); cb.textContent = '確定'; cb.style.background = '#52c76a';
      document.getElementById('selHint').textContent = '左右換角色 · 🎲 換造型';
      if (sel) { sel.confirmed = false; return; }
      sel = { roleIdx: 0, seed: 1, confirmed: false, faceY: 0 };
      mgLoadLib('three').then(() => {
        if (!sel) return;
        const THREE = window.THREE, cv = document.getElementById('selCanvas');
        sel.renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
        sel.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        sel.scene = new THREE.Scene();
        sel.cam = new THREE.PerspectiveCamera(42, 1, 0.1, 100); sel.cam.position.set(0, 1.5, 5.2);
        if (LowPoly.addLights) LowPoly.addLights(sel.scene);
        else { sel.scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2)); const d = new THREE.DirectionalLight(0xffffff, .7); d.position.set(3, 6, 4); sel.scene.add(d); }
        sel.roles = LowPoly.roles;
        // 記住上次選的角色/外觀:初始化到之前的 role/seed(若有)
        if (myAttrs.role) { const i = sel.roles.indexOf(myAttrs.role); if (i >= 0) sel.roleIdx = i; }
        if (myAttrs.seed) sel.seed = myAttrs.seed | 0 || 1;
        sel.build = function () {
          if (sel.charRoot) sel.scene.remove(sel.charRoot);
          const role = sel.roles[sel.roleIdx];
          const ac = LowPoly.animatedCharacter({ role, seed: sel.seed });
          sel.charRoot = ac.root; sel.animator = ac.animator; sel.scene.add(ac.root);
          document.getElementById('selRoleName').textContent = (LowPoly.ROLES[role] && LowPoly.ROLES[role].name) || role;
          client.playerAction('set_player_attr', { attrId: 'role', value: role });
          client.playerAction('set_player_attr', { attrId: 'seed', value: sel.seed });
        };
        let last = performance.now();
        sel.loop = function (now) {
          if (!sel || !sel.renderer) return;
          const dt = Math.min(.05, (now - last) / 1000); last = now;
          if (sel.charRoot) sel.charRoot.rotation.y = sel.faceY;
          if (sel.animator) sel.animator.update(dt);
          const w = cv.clientWidth || 300, h = cv.clientHeight || 300;
          sel.renderer.setSize(w, h, false); sel.cam.aspect = w / h; sel.cam.updateProjectionMatrix();
          sel.renderer.render(sel.scene, sel.cam); sel.raf = requestAnimationFrame(sel.loop);
        };
        sel.build(); sel.raf = requestAnimationFrame(sel.loop);
      });
    }
    function closeSelectOverlay() {
      document.getElementById('selectOverlay').style.display = 'none';
      if (sel) { if (sel.raf) cancelAnimationFrame(sel.raf); if (sel.renderer) { try { sel.renderer.dispose(); } catch (e) {} } sel = null; }
    }
    (function wireSelect() {
      const chg = d => { if (!sel || !sel.build || sel.confirmed) return; sel.roleIdx = (sel.roleIdx + d + sel.roles.length) % sel.roles.length; sel.seed = 1; sel.build(); };
      document.getElementById('selPrev').onclick = () => chg(-1);
      document.getElementById('selNext').onclick = () => chg(1);
      document.getElementById('selDice').onclick = () => { if (!sel || !sel.build || sel.confirmed) return; sel.seed = (Math.random() * 1e9 | 0) || 1; sel.build(); };
      document.getElementById('selConfirm').onclick = () => {
        if (!sel || sel.confirmed) return; sel.confirmed = true;
        client.playerAction('set_player_attr', { attrId: 'ready', value: true });
        const b = document.getElementById('selConfirm'); b.textContent = '已確定 ✓ 等待其他玩家'; b.style.background = '#777';
        document.getElementById('selHint').textContent = '已鎖定,等待主持人開始';
      };
      const cv = document.getElementById('selCanvas'); let drag = false, lx = 0;
      cv.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; });
      addEventListener('pointerup', () => { drag = false; });
      addEventListener('pointermove', e => { if (drag && sel) { sel.faceY += (e.clientX - lx) * 0.01; lx = e.clientX; } });
    })();

    function startCustomGame(cfg) {
      stopCustomGame();
      document.getElementById('cardZone').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';

      const W = 720, H = 1280;
      const overlay = document.createElement('div');
      overlay.id = 'customGameOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:150;background:#000;display:flex;align-items:center;justify-content:center;';
      document.body.appendChild(overlay);
      const box = document.createElement('div');
      box.style.cssText = 'position:relative;overflow:hidden;background:#000010;';
      overlay.appendChild(box);
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;';
      box.appendChild(canvas);
      // 讓 p5 等函式庫自建的 canvas 也自動縮放
      const styleEl = document.createElement('style');
      styleEl.textContent = '#customGameOverlay canvas{position:absolute;inset:0;width:100% !important;height:100% !important;display:block;touch-action:none;}';
      overlay.appendChild(styleEl);

      const fit = () => {
        const s = Math.min(window.innerWidth / W, window.innerHeight / H);
        box.style.width  = Math.floor(W * s) + 'px';
        box.style.height = Math.floor(H * s) + 'px';
      };
      fit();
      window.addEventListener('resize', fit);

      mg = { overlay, box, canvas, ctx: null, raf: null, updateFn: null, cleanups: [], msgHandlers: [],
             playersHandlers: [], pendingState: null, flushTimer: null, resizeFn: fit, errored: false };

      // NetKit(host-authoritative):有 target:'sim' 檔 → 手機只跑 render + 送 input,權威在伺服器。
      const isNK = Array.isArray(cfg.files) && cfg.files.some(f => f && f.target === 'sim');
      const mobileCode = isNK ? composeGameCode(cfg, 'render') : composeGameCode(cfg, 'mobile');
      const lib = (cfg.library && mobileCode) ? cfg.library : 'none';
      if (lib === 'none') {
        mg.ctx = canvas.getContext('2d');
        mg.ctx.fillStyle = '#000010';
        mg.ctx.fillRect(0, 0, W, H);
      }

      if (isNK && window.NetClientKit) {
        // 客戶端預測:在本地建同一份 sim 推進「自己」→ 輸入零延遲(收 snapshot 後 replay 對帳)
        let localSim = null;
        try {
          const simCode = composeGameCode(cfg, 'sim');
          if (simCode) { const S = {}; (new Function('Sim', simCode))(S); if (typeof S.step === 'function') { S.emit = function () {}; localSim = S; } }
        } catch (e) { console.warn('[Mobile] predict sim build failed:', e && e.message); }
        const useRP = params.get('rp') === '1';   // A/B:遠端實體預測(別人也預測到 now,不內插在過去)
        mg.net = new NetClientKit.NetSurface({
          surface: 'mobile', selfId: playerId, sim: localSim,
          remotePredict: useRP, predictStep: (localSim && localSim.predictStep) || null,
          sendInput: obj => client.playerAction('net_input', obj),
        });
      } else {
        // 舊路徑 sendState 節流：最新狀態 20Hz 送出（丟舊保新）
        mg.flushTimer = setInterval(() => {
          if (mg && mg.pendingState != null) {
            client.playerAction('game_state', mg.pendingState);
            mg.pendingState = null;
          }
        }, 50);
      }

      if (mobileCode) {
        mgLoadLib(lib).then(() => {
          if (!mg || mg.canvas !== canvas) return;   // 階段已切走
          try {
            const self = mg;
            const GameAPI = {
              canvas, width: W, height: H,
              get ctx() { if (!self.ctx) self.ctx = canvas.getContext('2d'); return self.ctx; },
              container: box, library: lib,
              playerId, playerName,
              sendState: obj => { self.pendingState = obj; },                       // 節流（≤20Hz，最新為準）
              sendEvent: obj => client.playerAction('game_event', obj),             // 立即送（離散事件用；獨立通道，不進位置聚合快照）
              onMessage: cb => self.msgHandlers.push(cb),                           // display broadcast → 手機
              onPlayers: cb => self.playersHandlers.push(cb),                       // 全體玩家狀態快照（~10Hz，含自己）
              palette: MG_PALETTE,                                                  // 玩家配色：palette[idx % length]
              log: (...a) => { const s = a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '); console.log('[Game]', s); mgPushLog('log', s); },
              update: cb => { self.updateFn = cb; },
              onEnd: cb => self.cleanups.push(cb),
            };
            (new Function('GameAPI', 'Net', mobileCode))(GameAPI, self.net || null);
          } catch (e) {
            console.error('[Mobile] mobileCode error:', e);
            mgPushLog('error', 'mobileCode 執行錯誤: ' + mgFmtErr(e));
          }
        });
      } else {
        box.innerHTML = '<div style="color:#8888bb;font-size:.9rem;text-align:center;padding-top:40vh;">此關卡沒有手機端程式（mobileCode）</div>';
      }

      const loop = ts => {
        if (!mg || mg.canvas !== canvas) return;
        if (mg.net) { try { mg.net.frame(); } catch (e) {} }   // NetKit:每幀先內插取樣 → Net.entities 更新
        if (mg.updateFn) {
          try { mg.updateFn(ts); }
          catch (e) { if (!mg.errored) { mg.errored = true; console.error('[Mobile] update error:', e); mgPushLog('error', 'update 錯誤: ' + mgFmtErr(e)); } }
        }
        mg.raf = requestAnimationFrame(loop);
      };
      mg.raf = requestAnimationFrame(loop);
    }

    function stopCustomGame() {
      if (!mg) return;
      mgFlushLogs();
      if (mg.raf) cancelAnimationFrame(mg.raf);
      if (mg.flushTimer) clearInterval(mg.flushTimer);
      if (mg.resizeFn) window.removeEventListener('resize', mg.resizeFn);
      for (const fn of mg.cleanups) { try { fn(); } catch (e) {} }
      if (mg.overlay) mg.overlay.remove();
      mg = null;
      document.getElementById('cardZone').style.display = '';
      document.getElementById('actionbar').style.display = '';
    }

    function renderController(cfg) {
      const layout = cfg.layout || 'pad-4';
      const labels = cfg.buttonLabels || {};
      const container = document.getElementById('controllerLayout');
      container.innerHTML = '';
      container.className = 'ctrl-layout';

      if (layout === 'pad-8') {
        container.appendChild(buildPadGrid(
          ['btn1','btn2','btn3','btn4','btn5','btn6','btn7','btn8'], labels, 4));
      } else if (layout === 'pad-4') {
        container.appendChild(buildPadGrid(['btn1','btn2','btn3','btn4'], labels, 2));
      } else if (layout === 'pad-2') {
        container.classList.add('layout-pad-2');
        container.appendChild(buildPadGrid(['btn1','btn2'], labels, 2));
      } else if (layout === 'dpad-2btn') {
        // 🆕 Use virtual joystick instead of D-pad
        container.appendChild(buildJoystick());
        const col = document.createElement('div');
        col.className = 'ctrl-action-col';
        col.appendChild(buildCtrlBtn('btn1', labels['btn1'] || 'A'));
        col.appendChild(buildCtrlBtn('btn2', labels['btn2'] || 'B'));
        container.appendChild(col);
      } else if (layout === 'dpad-dpad') {
        container.appendChild(buildDpad(''));
        container.appendChild(buildDpad('2'));
      }
    }

    function buildPadGrid(keys, labels, cols) {
      const grid = document.createElement('div');
      grid.className = `pad-grid cols-${cols}`;
      keys.forEach(k => grid.appendChild(buildCtrlBtn(k, labels[k] || k.replace('btn',''))));
      return grid;
    }

    function buildCtrlBtn(key, label) {
      const btn = document.createElement('div');
      btn.className = 'ctrl-btn';
      btn.textContent = label;
      attachCtrlEvents(btn, key);
      return btn;
    }

    // ════════════════════════════════════════════════════════════════
    //   VIRTUAL JOYSTICK (replaces D-pad for better mobile UX)
    // ════════════════════════════════════════════════════════════════
    function buildJoystick() {
      const container = document.createElement('div');
      container.className = 'joystick-container';

      const base = document.createElement('div');
      base.className = 'joystick-base';

      const stick = document.createElement('div');
      stick.className = 'joystick-stick';

      const indicator = document.createElement('div');
      indicator.className = 'joystick-indicator';

      base.appendChild(stick);
      base.appendChild(indicator);
      container.appendChild(base);

      // Joystick touch/mouse event handling
      let isDragging = false;
      let currentKey = null;
      const maxDistance = 65; // Maximum stick movement from center
      const deadZone = 15;    // Minimum distance to register input

      const handleStart = (clientX, clientY) => {
        isDragging = true;
        base.classList.add('active');
        stick.classList.add('active');
        handleMove(clientX, clientY);
      };

      const handleMove = (clientX, clientY) => {
        if (!isDragging) return;

        const rect = base.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;

        // Calculate distance and angle
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const angle = Math.atan2(deltaY, deltaX);

        // Clamp to max distance
        const clampedDistance = Math.min(distance, maxDistance);

        // Calculate new stick position
        const stickX = Math.cos(angle) * clampedDistance;
        const stickY = Math.sin(angle) * clampedDistance;

        stick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;

        // Determine direction if outside dead zone
        if (clampedDistance > deadZone) {
          const key = angleToKey(angle);
          if (key !== currentKey) {
            // Release previous key
            if (currentKey) {
              sendControllerInput(currentKey, 'up');
              pressedKeys.delete(currentKey);
            }
            // Press new key
            currentKey = key;
            sendControllerInput(currentKey, 'down');
            pressedKeys.add(currentKey);
          }

          // Show indicator in direction of movement
          const indicatorDistance = 30;
          const indicatorX = Math.cos(angle) * indicatorDistance;
          const indicatorY = Math.sin(angle) * indicatorDistance;
          indicator.style.transform = `translate(calc(-50% + ${indicatorX}px), calc(-50% + ${indicatorY}px))`;
        } else {
          // Inside dead zone - release key
          if (currentKey) {
            sendControllerInput(currentKey, 'up');
            pressedKeys.delete(currentKey);
            currentKey = null;
          }
          indicator.style.transform = 'translate(-50%, -50%)';
        }
      };

      const handleEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        base.classList.remove('active');
        stick.classList.remove('active');

        // Reset stick position
        stick.style.transform = 'translate(-50%, -50%)';
        indicator.style.transform = 'translate(-50%, -50%)';

        // Release current key
        if (currentKey) {
          sendControllerInput(currentKey, 'up');
          pressedKeys.delete(currentKey);
          currentKey = null;
        }
      };

      // Touch events
      base.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY);
      }, { passive: false });

      base.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }, { passive: false });

      base.addEventListener('touchend', handleEnd);
      base.addEventListener('touchcancel', handleEnd);

      // Mouse events (for desktop testing)
      const onMouseMove = (e) => { handleMove(e.clientX, e.clientY); };
      const onMouseUp = () => { handleEnd(); };

      base.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handleStart(e.clientX, e.clientY);
      });

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);

      // Cleanup document listeners when joystick is removed from DOM
      const observer = new MutationObserver(() => {
        if (!document.contains(base)) {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      return container;
    }

    // Convert angle to direction key (8 directions)
    function angleToKey(angle) {
      // Normalize angle to 0-2π
      let normalizedAngle = angle;
      if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

      // Convert to degrees for easier mapping
      const degrees = normalizedAngle * (180 / Math.PI);

      // 8-way D-pad mapping
      // Up: 337.5° - 22.5° (and 0° - 22.5°)
      // Right: 22.5° - 67.5°
      // Down: 67.5° - 112.5°
      // Left: 112.5° - 157.5°
      // (and so on for the diagonals)

      const slice = 360 / 8; // 45 degrees per direction
      const offset = slice / 2; // 22.5 degrees

      // Adjust so 0° is right, 90° is down, etc.
      // We want: 0°=right, 90°=down, 180°=left, 270°=up
      const adjustedAngle = (degrees + offset) % 360;

      const direction = Math.floor(adjustedAngle / slice) % 8;

      const directionKeys = ['right', 'down-right', 'down', 'down-left', 'left', 'up-left', 'up', 'up-right'];
      return directionKeys[direction];
    }

    function buildDpad(suffix) {
      const wrap = document.createElement('div');
      wrap.className = 'dpad-wrap';
      [['up','▲'],['down','▼'],['left','◀'],['right','▶']].forEach(([dir, sym]) => {
        const seg = document.createElement('div');
        seg.className = `dpad-segment dpad-${dir}`;
        seg.textContent = sym;
        attachCtrlEvents(seg, dir + suffix);
        wrap.appendChild(seg);
      });
      const center = document.createElement('div');
      center.className = 'dpad-center';
      wrap.appendChild(center);
      return wrap;
    }

    // Add sequence counter to ensure event ordering
    let inputSeq = 0;

    function attachCtrlEvents(el, key) {
      const press = e => {
        e.preventDefault();
        if (pressedKeys.has(key)) return;
        pressedKeys.add(key);
        el.classList.add('pressed');
        sendControllerInput(key, 'down');
      };
      const release = e => {
        e.preventDefault();
        if (!pressedKeys.has(key)) return;
        pressedKeys.delete(key);
        el.classList.remove('pressed');
        sendControllerInput(key, 'up');
      };
      el.addEventListener('touchstart', press, { passive: false });
      el.addEventListener('touchend',   release, { passive: false });
      el.addEventListener('touchcancel',release, { passive: false });
      el.addEventListener('mousedown', press);
      el.addEventListener('mouseup',   release);
      el.addEventListener('mouseleave',release);
    }

    function sendControllerInput(key, state) {
      const seq = ++inputSeq;
      client.playerAction('game', { key, state, seq });
    }

    // ── 防休眠：遊戲進行中保持螢幕常亮 ─────────────────────────────
    // 優先用 Screen Wake Lock API（需要 HTTPS/localhost）；
    // HTTP 環境退回 NoSleep.js（隱藏影片保持喚醒，需使用者手勢啟動）
    let _wakeLock = null, _noSleep = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          if (_wakeLock && !_wakeLock.released) return;
          _wakeLock = await navigator.wakeLock.request('screen');
          console.log('[Mobile] wake lock acquired');
          return;
        } catch (e) { console.warn('[Mobile] wake lock failed:', e.message); }
      }
      // 後備：NoSleep.js（enable 必須在使用者手勢的事件處理器內同步呼叫）
      if (typeof NoSleep !== 'undefined') {
        try {
          if (!_noSleep) _noSleep = new NoSleep();
          _noSleep.enable();
          console.log('[Mobile] NoSleep enabled');
        } catch (e) { console.warn('[Mobile] NoSleep failed:', e.message); }
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && 'wakeLock' in navigator) requestWakeLock();
    });
    // Wake Lock 與 NoSleep 都需要（或建議在）使用者手勢後啟動；玩家一定會碰螢幕
    ['touchstart', 'click'].forEach(ev =>
      document.addEventListener(ev, requestWakeLock, { once: true, passive: true }));
    if ('wakeLock' in navigator) requestWakeLock();
  </script>
</body>
</html>
