<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>加入遊戲</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a1a;
      color: #e0e0ff;
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 1.6rem; letter-spacing: .1em; margin-bottom: 8px; }
    .subtitle { font-size: .85rem; color: #8888bb; margin-bottom: 40px; }

    .card {
      background: #14142a;
      border: 1px solid #2a2a5a;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
    }
    label { display: block; font-size: .8rem; color: #8888bb; margin-bottom: 6px; letter-spacing: .05em; }
    input {
      width: 100%;
      background: #0a0a1a;
      border: 1px solid #3a3a6a;
      border-radius: 10px;
      color: #e0e0ff;
      font-size: 1.1rem;
      padding: 12px 14px;
      margin-bottom: 20px;
      outline: none;
      text-transform: uppercase;
      letter-spacing: .15em;
    }
    input:focus { border-color: #6666ff; }
    #nameInput { text-transform: none; letter-spacing: normal; }

    button {
      width: 100%;
      background: #5555ff;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: background .15s;
    }
    button:active { background: #3333cc; }
    button:disabled { background: #333355; color: #666688; cursor: not-allowed; }

    .error { color: #ff6666; font-size: .85rem; margin-top: 12px; text-align: center; display: none; }
  </style>
</head>
<body>
  <h1>🎮 進入遊戲</h1>
  <p class="subtitle">輸入房間代碼和你的名稱</p>

  <div class="card">
    <label for="roomInput">房間代碼</label>
    <input id="roomInput" type="text" maxlength="6" placeholder="XXXXXX" autocomplete="off">

    <label for="nameInput">玩家名稱</label>
    <input id="nameInput" type="text" maxlength="12" placeholder="你的名字" autocomplete="off">

    <button id="joinBtn" onclick="join()">加入遊戲</button>
    <p class="error" id="errMsg"></p>
  </div>

  <script>
    // Pre-fill room and name from URL (e.g. when returning from game screen)
    const _params  = new URLSearchParams(window.location.search);
    const urlRoom  = _params.get('room') || '';
    const urlName  = _params.get('name') || '';
    if (urlRoom) document.getElementById('roomInput').value = urlRoom;

    // URL name takes priority; fall back to localStorage
    const savedName = urlName || localStorage.getItem('playerName') || '';
    if (savedName) document.getElementById('nameInput').value = savedName;

    function join() {
      const room = document.getElementById('roomInput').value.trim().toUpperCase();
      const name = document.getElementById('nameInput').value.trim();
      const err  = document.getElementById('errMsg');

      if (room.length < 4) { showErr('請輸入正確的房間代碼'); return; }
      if (name.length < 1) { showErr('請輸入名稱'); return; }

      localStorage.setItem('playerName', name);
      window.location.href = `/mobile/game.html?room=${room}&name=${encodeURIComponent(name)}`;
    }

    function showErr(msg) {
      const el = document.getElementById('errMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  </script>
</body>
</html>
